es **signaux sociaux** (indirects, Bing en tient plus compte). Sur les réseaux : interactions, **temps de visionnage**, test de viralité, poids du **visuel** ; même méthode SEO (mot-clé dans le titre, la description, catégorie, hashtags). **YouTube** : une des méthodes **les plus efficaces** actuellement (vidéos en 1re page sur les requêtes informationnelles, moins concurrencées par les IA) ; mot-clé dans le titre et la description, **appel à l'action en début de description**, table des matières, tags, **sous-titres**. **TikTok** : optimisation proche de YouTube. **LinkedIn** : fiches de poste, mots-clés, compétences, recommandations."}, {"title": "5. Optimiser pour les IA (GEO)", "body": "- Les IA déclenchent une recherche via **Google, Bing ou Brave** → d'abord un travail d'**indexation classique**.\n- Contenu structuré différemment : **points clés en début**, **plus de sources**, enchaînement logique, **tableaux**, **infographies**.\n- **Citations** sur les réseaux et les sites utilisés par les IA : **YouTube, Reddit, Wikipédia**, médias de référence ou de niche ; les **médias** pèsent lourd comme sources vérifiées.\n- Les **données structurées** comptent (exploitées notamment par ChatGPT).\n- Technique : autoriser les robots des IA et vérifier qu'ils peuvent parcourir le site.\n\n**Query fan out** : l'IA **découpe la question en sous-requêtes**, cherche des sources pour chacune, puis **synthétise**. Enjeu : avoir des contenus qui répondent bien à ces sous-requêtes et figurer dans la **base d'entraînement**.\n\n**Sources des IA** : d'abord la **base de connaissance** (Wikipédia, Common Crawl, livres libres, Reddit, YouTube, médias) ; si elle ne suffit pas, **recherche web**. Fournisseurs : **Google** (Gemini, ChatGPT indirectement, en partie Perplexity), **Bing** (en partie ChatGPT, Perplexity, Meta, Grok), **Brave** (Claude, en partie Mistral et Perplexity)."}, {"title": "6. Optimiser un site : nouveau, refonte, existant", "body": "**Faut-il un site ?** Pour débuter, pas obligatoire (les réseaux donnent une visibilité rapide), mais le site apporte **crédibilité**, **connaissance de l'audience**, **maîtrise** de son espace et meilleur positionnement sur moteurs et IA.\n\n**Nouveau site** : cibles et objectifs → mots-clés (personas) → structure selon les intentions → images et contenus optimisés → balises title, description, h1, h2 → **Google Analytics + Search Console** → amélioration continue → liens → Google My Business / Shopping si pertinent.\n\n**Nom de domaine** : les mots-clés dedans n'ont **presque plus d'impact** → préférer la **marque** ; extension libre ; facile à dire et court ; un domaine récent n'est pas traité comme un ancien ; en cas de reprise, analyser et **désavouer** les mauvais liens.\n\n**Refonte** : l'opération **la plus délicate** (fortes chutes de trafic fréquentes) → **audit préalable**, changer **le moins possible les URL**, **redirections** pour éviter les 404.\n\n**Audit SEO** (site existant) : audit des **mots-clés** (volumes, concurrence), des **liens**, du **contenu** (positions, pages sans trafic, balises, descriptions, maillage, pages orphelines) et **technique** (Core Web Vitals, duplicate, canonical, 404). Puis **hiérarchiser** par difficulté et urgence, en pensant **ROI**. Mieux vaut **peu de pages bien optimisées** que beaucoup de pages faibles ; on peut **supprimer ou désindexer** les pages inutiles.\n\n**Mauvaises pratiques** : liens factices en masse, contenu caché visible seulement des moteurs, bourrage de mots-clés. Les pénalités manuelles sont **rares** ; une chute vient souvent d'un **changement d'algorithme**."}, {"title": "7. Suivre ses performances", "body": "**Google Analytics** : visiteurs, pages les plus vues, **origine** des visites (y compris ChatGPT, Mistral, Perplexity) ; suivi des **conversions** (plus poussé avec **Google Tag Manager**) ; installation via le code, **Site Kit** sur WordPress ou la rubrique dédiée des CMS. Google ne communique **presque plus les mots-clés** tapés.\n\n**Google Search Console** (en complément) : positions sur les mots-clés, **CTR**, pages exploitées par les IA, **soumission du sitemap**, pages indexées ou non, Core Web Vitals. Installation la plus simple : **préfixe** + validation via le compte Analytics (ou fichier HTML à la racine). Complément : **Bing Webmaster Tool**.\n\n**Suivi des positions** : outils payants (**ranks.fr**, Semrush).\n\n**Amélioration** : assigner un **objectif à chaque page** (ex. 10 contacts / mois) ; s'il n'est pas atteint après un mois → optimisation SEO, amélioration de la conversion (boutons d'appel à l'action), plus de liens, vérification de l'**intention** du mot-clé. **Planifier** ses actions et son contenu.\n\n**Conclusion du cours** : le SEO est un travail de **long terme**, à la croisée de la technique, de la rédaction, des relations presse et du design, et il est devenu **multicanal** (site, réseaux, Google, TikTok, ChatGPT)."}], "key_points": ["Backlinks = liens entrants ; liens externes = sortants ; liens internes = entre ses pages.", "Le classement se fait par page, pas par domaine ; les liens sociaux et Wikipédia n'aident pas directement.", "Maillage interne : relier les contenus d'une thématique vers les pages stratégiques, avec des ancres variées.", "Contenu dupliqué : rel=canonical pour indiquer la page de référence ; varier les fiches produits.", "robots.txt : bloquer l'exploration n'empêche pas l'indexation ; il peut indiquer le sitemap.", "Multilingue : hreflang sur toutes les pages, un seul domaine plutôt qu'un domaine par langue.", "Cocon sémantique : thématiques → sous-thématiques liées, autorité drainée vers les pages stratégiques, pas de pages orphelines.", "YouTube est l'une des méthodes SEO les plus efficaces actuellement.", "Query fan out : l'IA découpe la question en sous-requêtes puis synthétise.", "Refonte = opération la plus délicate : audit, URL conservées, redirections.", "Suivi : Google Analytics (audience, conversions) + Search Console (positions, CTR, indexation, sitemap)."], "traps": ["Les liens depuis les réseaux sociaux n'ont pas d'impact direct sur le référencement.", "Bloquer une page dans robots.txt n'empêche pas forcément son indexation.", "Avoir monsite.fr et monsite.com pour deux langues divise l'autorité (erreur d'Air France citée en cours).", "Un canonical qui pointe vers la version anglaise peut faire désindexer la page française.", "Les mots-clés dans le nom de domaine n'ont presque plus d'impact : privilégier la marque.", "Une chute brutale de position n'est pas forcément une pénalité : souvent un changement d'algorithme.", "Google Analytics ne donne presque plus les mots-clés tapés : c'est la Search Console qui donne positions et CTR."], "glossary": [{"term": "Backlink", "definition": "Lien d'un autre site pointant vers le sien."}, {"term": "Ancre", "definition": "Texte cliquable d'un lien, qui renseigne le moteur sur la page liée."}, {"term": "Nofollow / sponsored", "definition": "Attributs de lien indiquant au moteur de ne pas suivre le lien ou qu'il est payant."}, {"term": "PageRank", "definition": "Mesure de l'autorité transmise par les liens (« jus »)."}, {"term": "Maillage interne", "definition": "Stratégie de liens entre les pages d'un même site."}, {"term": "Cornerstone content", "definition": "Contenus stratégiques que le maillage cherche à renforcer."}, {"term": "Entité nommée", "definition": "Élément identifié de manière unique (personne, lieu, marque, organisation)."}, {"term": "Core Web Vitals", "definition": "Indicateurs Google d'expérience : chargement, affichage mobile, sécurité."}, {"term": "Contenu dupliqué", "definition": "Contenu identique sur plusieurs pages ou sites, dont le moteur n'affiche qu'une version."}, {"term": "rel=canonical", "definition": "Attribut indiquant la page de référence parmi des pages dupliquées."}, {"term": "robots.txt", "definition": "Fichier qui indique aux robots ce qu'ils peuvent explorer."}, {"term": "hreflang", "definition": "Balise indiquant les versions linguistiques d'une page."}, {"term": "Sitemap", "definition": "Fichier listant les pages du site pour faciliter leur exploration."}, {"term": "Query fan out", "definition": "Découpage d'une question en sous-requêtes par une IA avant synthèse."}, {"term": "Google AI Overview", "definition": "Réponse générée par Gemini en haut des résultats Google."}, {"term": "Search Console", "definition": "Outil Google de suivi des positions, du CTR, de l'indexation et des erreurs techniques."}, {"term": "Google Tag Manager", "definition": "Outil de gestion des balises pour un suivi avancé des conversions."}], "qcb": [{"q": "Un backlink est un lien de mon site vers un autre site.", "answer": false, "explanation": "C'est un lien entrant, d'un autre site vers le mien."}, {"q": "Le classement des moteurs se fait par page et non par domaine.", "answer": true, "explanation": "Chaque page est évaluée individuellement."}, {"q": "Les liens depuis les réseaux sociaux améliorent directement le positionnement.", "answer": false, "explanation": "Ils ne contribuent pas directement, tout comme Wikipédia."}, {"q": "Les annuaires restent utiles pour un site qui débute.", "answer": true, "explanation": "Notamment les annuaires locaux et thématiques."}, {"q": "Il faut utiliser la même ancre pour tous les liens vers une page.", "answer": false, "explanation": "On varie les ancres pour diversifier les mots-clés et éviter la sur-optimisation."}, {"q": "L'attribut rel=canonical indique la page de référence parmi des pages dupliquées.", "answer": true, "explanation": "Indispensable en e-commerce avec les filtres."}, {"q": "Empêcher l'exploration dans robots.txt revient à empêcher l'indexation.", "answer": false, "explanation": "Ce sont deux choses différentes."}, {"q": "Avoir un domaine différent par langue renforce l'autorité.", "answer": false, "explanation": "Cela divise l'autorité : les sites se concurrencent."}, {"q": "WordPress gère nativement le multilingue.", "answer": fal ue, "explanation": "Le cours déconseille un domaine par langue (exemple d'Air France) : mieux vaut un seul domaine avec hreflang.", "level": "difficile"}, {"q": "Une chute brutale des positions prouve que le site a reçu une pénalité manuelle de Google.", "answer": false, "explanation": "Les pénalités manuelles sont rares ; une chute vient souvent d'un changement d'algorithme.", "level": "difficile"}], "qcm": [{"q": "Quels sont les trois types de liens ?", "options": ["Backlinks", "Liens externes", "Liens internes", "Liens fantômes"], "answer": [0, 1, 2], "explanation": "Entrants, sortants, internes."}, {"q": "Quels attributs de lien sont cités ?", "options": ["follow", "nofollow", "sponsored", "boost"], "answer": [0, 1, 2], "explanation": "rel=\"nofollow\" et rel=\"sponsored\"."}, {"q": "Quelles pistes permettent d'obtenir des liens ?", "options": ["Mentions de la marque sans lien", "Partenaires et fournisseurs de la thématique", "Campagnes presse et salons", "Acheter des milliers de liens factices"], "answer": [0, 1, 2], "explanation": "Les liens factices en masse sont pénalisés."}, {"q": "Que comprennent les Core Web Vitals selon le cours ?", "options": ["Temps de chargement", "Adaptation mobile", "Site sécurisé", "Nombre de backlinks"], "answer": [0, 1, 2], "explanation": "Les backlinks relèvent du pilier autorité."}, {"q": "Quelles actions permet le fichier robots.txt ?", "options": ["Bloquer certains robots", "Indiquer le sitemap", "Limiter la vitesse d'exploration", "Rédiger la meta description"], "answer": [0, 1, 2], "explanation": "Via Disallow, Sitemap et crawl-delay."}, {"q": "Quel est l'objectif d'un cocon sémantique ?", "options": ["Structurer par thématiques et sous-thématiques", "Drainer l'autorité vers les pages stratégiques", "Éviter les pages orphelines", "Multiplier les pages dupliquées"], "answer": [0, 1, 2], "explanation": "C'est la structure idéale issue des 3 piliers."}, {"q": "Que faut-il pour apparaître sur Google Maps ?", "options": ["Google My Business", "Google Merchant Center", "Publisher Center", "Bing Webmaster Tool"], "answer": [0], "explanation": "Merchant Center sert à Google Shopping."}, {"q": "Qu'est-ce que le query fan out ?", "options": ["Le découpage d'une question en sous-requêtes par l'IA", "Une pénalité Google", "Un type de backlink", "Une balise HTML"], "answer": [0], "explanation": "L'IA cherche des sources pour chaque sous-requête puis synthétise."}, {"q": "Sur quel moteur s'appuie Claude selon le cours ?", "options": ["Brave", "Yandex", "Baidu", "Naver"], "answer": [0], "explanation": "Brave fournit aussi en partie Mistral et Perplexity."}, {"q": "Quels sites comptent pour être cité par les IA ?", "options": ["YouTube", "Reddit", "Wikipédia", "Médias de référence"], "answer": [0, 1, 2, 3], "explanation": "Les médias pèsent lourd comme sources vérifiées."}, {"q": "Lors d'une refonte, que faut-il faire ?", "options": ["Un audit SEO préalable", "Changer le moins possible les URL", "Mettre des redirections", "Supprimer toutes les anciennes pages sans redirection"], "answer": [0, 1, 2], "explanation": "Sinon on perd l'autorité des liens existants."}, {"q": "Quelles sont les composantes d'un audit SEO ?", "options": ["Audit des mots-clés", "Audit des liens", "Audit du contenu", "Audit technique"], "answer": [0, 1, 2, 3], "explanation": "On commence par l'audit des mots-clés."}, {"q": "Quel outil indique les positions sur les mots-clés et le CTR ?", "options": ["Google Search Console", "Google Analytics", "Google My Business", "robots.txt"], "answer": [0], "explanation": "Analytics ne donne presque plus les mots-clés tapés."}, {"q": "Quelles sont des mauvaises pratiques SEO ?", "options": ["Liens factices en grande quantité", "Contenu caché visible seulement des moteurs", "Bourrage de mots-clés", "Varier les ancres"], "answer": [0, 1, 2], "explanation": "Varier les ancres est une bonne pratique."}, {"q": "Quelle balise ou quel attribut indique la page de référence parmi des contenus similaires ?", "options": ["hreflang", "rel=canonical", "nofollow", "alt"], "answer": [1], "explanation": "hreflang = langues ; nofollow = attribut de lien ; alt = images.", "level": "moyen"}, {"q": "Quels liens ne contribuent PAS directement au positionnement selon le cours ? (plusieurs réponses)", "options": ["Backlinks de qualité depuis un site de la même thématique", "Liens depuis Wikipédia", "Maillage interne vers les pages stratégiques", "Liens depuis les réseaux sociaux"], "answer": [1, 3], "explanation": "Les backlinks de qualité et le maillage interne comptent ; les liens sociaux et Wikipédia pas directement.", "level": "moyen"}, {"q": "Dans la Search Console, que peut-on faire ? (plusieurs réponses)", "options": ["Voir les pages indexées ou non", "Soumettre le sitemap", "Voir les positions et le CTR", "Créer des annonces Google Ads"], "answer": [0, 1, 2], "explanation": "Les annonces se créent dans Google Ads, pas dans la Search Console.", "level": "moyen"}, {"q": "Pour apparaître dans Google Shopping, quel outil utilise-t-on ?", "options": ["Publisher Center", "Bing Webmaster Tool", "Google Merchant Center", "Google My Business"], "answer": [2], "explanation": "My Business = Maps ; Publisher Center = Actualités.", "level": "moyen"}, {"q": "Mise en situation : un e-commerçant a 50 URL générées par les filtres (couleur, taille, prix) qui affichent la même liste de produits. Quelle est la meilleure réponse ?", "options": ["Utiliser rel=canonical vers la page de référence", "Bloquer tout le site dans robots.txt", "Créer encore plus de pages filtrées pour occuper Google", "Ajouter hreflang sur chaque filtre"], "answer": [0], "explanation": "Le canonical est indispensable en e-commerce avec les filtres : il indique la page de référence.", "level": "difficile"}, {"q": "Mise en situation : une entreprise refond son site et veut changer toutes ses URL pour « faire plus moderne ». Quels conseils lui donner ? (plusieurs réponses)", "options": ["Mettre en place des redirections pour éviter les 404", "Supprimer l'ancien site sans redirection pour repartir de zéro", "Changer le moins possible les URL", "Faire un audit avant la refonte"], "answer": [0, 2, 3], "explanation": "La refonte est l'opération la plus délicate : les chutes de trafic sont fréquentes sans ces précautions.", "level": "difficile"}, {"q": "Mise en situation : le site français d'une marque est désindexé. Les pages françaises ont un canonical qui pointe vers les pages anglaises. Quel est le diagnostic ?", "options": ["Le site manque de backlinks", "Erreur multilingue : le canonical vers une autre langue fait désindexer la page", "Le robots.txt est trop permissif", "Les meta descriptions sont trop longues"], "answer": [1], "explanation": "C'est une erreur fréquente citée par le cours. Il faut un canonical vers la page elle-même et des hreflang corrects.", "level": "difficile"}, {"q": "Mise en situation : une marque veut être citée par les IA. Quelles actions sont pertinentes ? (plusieurs réponses)", "options": ["Mettre les points clés en début de contenu et citer des sources", "Obtenir des mentions sur YouTube, Reddit, Wikipédia ou dans les médias", "Bloquer les robots des IA dans le robots.txt", "Être bien indexée sur Google, Bing et Brave"], "answer": [0, 1, 3], "explanation": "Il faut au contraire autoriser les robots des IA et vérifier qu'ils peuvent parcourir le site.", "level": "difficile"}, {"q": "Mise en situation : un audit révèle 400 pages de blog sans trafic, mal optimisées, et 10 pages stratégiques peu liées entre elles. Quelle stratégie est la plus cohérente avec le cours ?", "options": ["Publier 400 nouvelles pages", "Ne rien changer : plus il y a de pages, mieux c'est", "Acheter 1 000 liens factices", "Supprimer ou désindexer les pages inutiles, optimiser les pages stratégiques et renforcer le maillage vers elles"], "answer": [3], "explanation": "Mieux vaut peu de pages bien optimisées que beaucoup de pages faibles ; le cocon sémantique draine l'autorité vers les pages stratégiques.", "level": "difficile"}], "open_questions": [{"question": "Expliquez le rôle du maillage interne et du cocon sémantique.", "answer": "**Maillage interne** : liens entre les pages du site, selon une **stratégie** : les contenus d'une même thématique se lient entre eux, en particulier vers les **contenus stratégiques** ; les **ancres variées** élargissent les mots-clés ; les liens transmettent du **jus** (PageRank).\n\n**Cocon sémantique** : la structure idéale qui en découle : contenus classés par **thématiques et sous-thématiques** issues de la recherche de mots-clés, parents liés entre eux, chaque page optimisée.\n\n**Bénéfices** : autorité concentrée sur les pages stratégiques, positionnement sur la longue traîne, **pas de pages orphelines** ou trop profondes."}, {"question": "Comment optimiser sa visibilité sur les IA (GEO) ?", "answer": "**1. Indexation** : les IA interrogent Google, Bing ou Brave → être bien indexé partout (Search Console, Bing Webmaster Tool, sitemap).\n\n**2. Contenu** : points clés en début, contenu **sourcé**, logique, avec tableaux et infographies, qui répond aux **sous-requêtes** du query fan out.\n\n**3. Citations** : être présent sur YouTube, Reddit, Wikipédia, les médias.\n\n**4. Technique** : données structurées, robots des IA autorisés, site rapide à explorer.\n\n**5. Suivi** : visites venant de ChatGPT, Perplexity… dans Google Analytics."}, {"question": "Quelles actions mener face au contenu dupliqué ?", "answer": "**Problème** : le moteur n'affiche qu'une version et ne choisit pas forcément la bonne ; l'exploration est compliquée.\n\n**Actions** : 1) **rel=canonical** pour désigner la page de référence (filtres e-commerce, plagiat) ; 2) **varier les textes** des fiches produits proches et des pages par ville ; 3) publier **d'abord sur son site** avant de diffuser communiqués ou contenus ailleurs ; 4) en multilingue, vérifier que le canonical ne pointe pas vers une autre langue."}], "exercises": [{"title": "Cas pratiques de suivi (questions du cours)", "statement": "Répondez aux situations suivantes.", "questions": ["Toutes mes pages sont indexées sauf ma page d'accueil, sans message d'erreur. Pourquoi ?", "J'ai des dizaines de pages sans visites depuis des semaines. Que faire ?", "J'étais 1er sur un mot-clé, je suis 10e du jour au lendemain, sans changement sur les autres. Est-ce normal ?", "Je convertis très peu sur ma page contact malgré les visites. Quelles actions ?"], "answer": "**1.** Pistes : un **canonical** de l'accueil pointant vers une autre URL, une balise **noindex**, un contenu **dupliqué** (http/https, www/sans www) faisant choisir une autre version, ou une règle mal écrite. Vérifier l'URL dans la **Search Console** (inspection).\n\n**2.** Les auditer : si aucun potentiel d'optimisation, les **supprimer ou désindexer** (avec redirection si elles ont des liens) ; sinon les **optimiser** et les **mailler**. Mieux vaut peu de pages bien optimisées.\n\n**3.** Pas forcément une pénalité : souvent un **changement d'algorithme** ou un concurrent mieux adapté à l'**intention**. Vérifier l'intention du mot-clé, enrichir la page, renforcer liens et maillage, et suivre l'évolution.\n\n**4.** Vérifier l'**intention** des requêtes qui amènent les visiteurs, améliorer la **conversion** (appels à l'action visibles, formulaire simple, réassurance / E-E-A-T), renforcer les liens internes vers la page, et fixer un objectif chiffré mensuel."}], "resources": [{"label": "Google — versions localisées (hreflang)", "url": "https://developers.google.com/search/docs/specialty/international/localized-versions?hl=fr"}, {"label": "Google Search Console", "url": "https://search.google.com/search-console"}, {"label": "Google Analytics", "url": "https://analytics.google.com"}, {"label": "Google My Business", "url": "https://www.google.com/intl/fr_fr/business/"}]}]}]</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
const SUBJECTS = JSON.parse(document.getElementById("data").textContent).sort((a, b) => a.order - b.order);
const COURSES = {};
SUBJECTS.forEach(s => s.courses.forEach(c => { COURSES[c.id] = { ...c, subject: s }; }));
const TABS = [
  ["resume", "Résumé"], ["retenir", "À retenir"], ["flash", "Flashcards"],
  ["qcb", "QCB"], ["qcm", "QCM"], ["ouvertes", "Questions ouvertes"], ["cas", "Cas pratiques"]
];
const LEVELS = [["facile", "Facile"], ["moyen", "Moyen"], ["difficile", "Difficile"], ["tous", "Tous niveaux"]];
const LEVEL_LABEL = { facile: "Facile", moyen: "Moyen", difficile: "Difficile" };
const LEVEL_HELP = {
  facile: "Questions de cours directes : définitions et notions clés.",
  moyen: "Notions proches à distinguer, calculs, chronologies : il faut avoir compris, pas seulement reconnu.",
  difficile: "Mises en situation et pièges : appliquer le cours à un cas concret, avec des réponses très proches.",
  tous: "Tous les niveaux mélangés."
};
const lvlOf = q => q.level || "facile";
const state = { view: "home", courseId: null, tab: "resume", level: "facile" };
const quiz = {};   // état des quiz en cours, par clé
let exam = null;

// ---------- stockage local (meilleurs scores) ----------
function loadBest() { try { return JSON.parse(localStorage.getItem("esg-best") || "{}"); } catch (e) { return {}; } }
function quizKey(tab, level, id) { return level === "facile" ? tab + ":" + id : tab + ":" + level + ":" + id; }
function bestFor(best, id) { let b = -1; for (const k in best) if (/^qc[bm]:/.test(k) && k.endsWith(":" + id)) b = Math.max(b, best[k]); return b; }
function saveBest(key, pct) {
  const best = loadBest();
  if (!(key in best) || pct > best[key]) { best[key] = pct; try { localStorage.setItem("esg-best", JSON.stringify(best)); } catch (e) {} }
}

// ---------- utilitaires ----------
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
function md(text) {
  let html = window.marked ? marked.parse(text) : "<p>" + esc(text).replace(/\n/g, "<br>") + "</p>";
  return html.replace(/<table>/g, '<div class="tablewrap"><table>').replace(/<\/table>/g, "</table></div>");
}
const mdInline = text => window.marked ? marked.parseInline(text) : esc(text);
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function count(s, k) { return s.courses.reduce((n, c) => n + (c[k] || []).length, 0); }
const $ = sel => document.querySelector(sel);

// ---------- navigation ----------
function go(view, courseId, tab) {
  state.view = view; state.courseId = courseId || null; state.tab = tab || "resume";
  render(); window.scrollTo(0, 0);
}
function renderSide() {
  const best = loadBest();
  let h = `<div class="brand"><b>Révisions ESG</b><span>M1 Marketing &amp; Commerce · 2026–2027</span></div><nav class="nav">`;
  h += `<button class="nav-item nav-subject" data-go="home" aria-current="${state.view === "home"}">Accueil</button>`;
  SUBJECTS.forEach(s => {
    h += `<div class="nav-item nav-subject" style="cursor:default">${esc(s.title)}</div>`;
    if (!s.courses.length) h += `<div class="nav-item nav-course"><em>En attente des cours</em></div>`;
    s.courses.forEach(c => {
      const b = bestFor(best, c.id);
      h += `<button class="nav-item nav-course" data-course="${c.id}" aria-current="${state.courseId === c.id}"><span>${esc(c.title.split(" — ")[0])}</span><span class="nav-num">${b >= 0 ? b + " %" : ""}</span></button>`;
    });
  });
  h += `<div class="nav-sep"></div><button class="nav-item nav-subject" data-go="exam" aria-current="${state.view === "exam"}">Examen blanc</button></nav>`;
  $("#side").innerHTML = h;
}
function mobileNav() {
  let o = `<option value="home"${state.view === "home" ? " selected" : ""}>Accueil</option>`;
  SUBJECTS.forEach(s => {
    if (!s.courses.length) return;
    o += `<optgroup label="${esc(s.title)}">` + s.courses.map(c => `<option value="${c.id}"${state.courseId === c.id ? " selected" : ""}>${esc(c.title)}</option>`).join("") + `</optgroup>`;
  });
  o += `<option value="exam"${state.view === "exam" ? " selected" : ""}>Examen blanc</option>`;
  return `<div class="mobile-nav"><label class="eyebrow" for="mnav">Aller à</label><select id="mnav">${o}</select></div>`;
}

// ---------- pages ----------
function renderHome() {
  const nQ = SUBJECTS.reduce((n, s) => n + count(s, "qcb") + count(s, "qcm"), 0);
  const nC = SUBJECTS.reduce((n, s) => n + s.courses.length, 0);
  const nO = SUBJECTS.reduce((n, s) => n + count(s, "open_questions") + count(s, "exercises"), 0);
  const nG = SUBJECTS.reduce((n, s) => n + count(s, "glossary"), 0);
  const nD = SUBJECTS.reduce((n, s) => n + s.courses.reduce((m, c) => m + c.qcb.concat(c.qcm).filter(q => lvlOf(q) === "difficile").length, 0), 0);
  const best = loadBest();
  let h = mobileNav() + `<div><div class="eyebrow">ESG · M1 Marketing &amp; Commerce · 2026–2027</div>
    <h1 class="title-xl">Tous vos cours, prêts pour l'examen</h1></div>
    <p class="lead">Choisissez un cours pour lire son résumé, mémoriser ses définitions, puis vous entraîner avec les QCB (vrai/faux) et les QCM en trois niveaux (facile, moyen, difficile), les questions ouvertes et les cas pratiques corrigés.</p>
    <div class="stats"><div class="stat"><b>${nC}</b><span>cours</span></div><div class="stat"><b>${nQ}</b><span>QCB et QCM</span></div><div class="stat"><b>${nD}</b><span>dont mises en situation difficiles</span></div><div class="stat"><b>${nO}</b><span>questions ouvertes et cas</span></div><div class="stat"><b>${nG}</b><span>définitions</span></div></div>
    <h2 class="title-l">Matières</h2><div class="subjects">`;
  SUBJECTS.forEach(s => {
    const first = s.courses[0];
    const done = s.courses.filter(c => bestFor(best, c.id) >= 70).length;
    const pct = s.courses.length ? Math.round(100 * done / s.courses.length) : 0;
    h += `<button class="subject-card" ${first ? `data-course="${first.id}"` : "disabled"}>
      <h3>${esc(s.title)}</h3><p>${esc(s.description)}</p>
      ${s.courses.length ? `<div class="bar" title="Cours réussis à 70 % ou plus"><i style="width:${pct}%"></i></div>
      <div class="meta">${s.courses.length} cours · ${count(s, "qcb")} QCB · ${count(s, "qcm")} QCM · ${done}/${s.courses.length} réussis</div>` : `<div class="meta">En attente des supports de cours</div>`}
    </button>`;
  });
  h += `</div>`;
  const dates = SUBJECTS.flatMap(s => (s.key_dates || []).map(d => ({ m: s.short, ...d })));
  if (dates.length) {
    h += `<h2 class="title-l">Dates clés</h2><div class="dates">` + dates.map(d => `<div class="date-row"><span>${esc(d.m)}</span><b>${esc(d.date)}</b><span>${esc(d.label)}</span></div>`).join("") + `</div>`;
  }
  h += `<h2 class="title-l">Méthode de révision</h2><ol class="list-plain keypoints">
    <li><span>Lire le <b>résumé</b>, puis la fiche <b>À retenir</b> et les <b>pièges</b>.</span></li>
    <li><span><b>Flashcards</b> : réciter la définition avant de retourner la carte.</span></li>
    <li><span><b>QCB puis QCM</b> sans le cours sous les yeux, en commençant par le niveau <b>Facile</b>. Passez au <b>Moyen</b> puis au <b>Difficile</b> dès que vous dépassez 80 %.</span></li>
    <li><span><b>Questions ouvertes</b> : rédiger (définition → explication → exemple → conclusion) puis comparer au corrigé.</span></li>
    <li><span><b>Cas pratiques</b>, puis un <b>examen blanc</b> multi-matières.</span></li>
    <li><span>Un peu chaque jour : 45 minutes, 3 fois par semaine, valent mieux que 3 heures la veille.</span></li></ol>`;
  return h;
}

function renderCourse() {
  const c = COURSES[state.courseId]; const s = c.subject;
  const counts = { qcb: c.qcb.length, qcm: c.qcm.length, flash: (c.glossary || []).length, ouvertes: (c.open_questions || []).length, cas: (c.exercises || []).length };
  let h = mobileNav() + `<div><div class="eyebrow">${esc(s.title)}${s.teacher ? " · " + esc(s.teacher) : ""}</div>
    <h1 class="title-xl">${esc(c.title)}</h1></div>
    <div class="toolbar" style="justify-content:flex-start"><span class="tag ${c.status === "a_venir" ? "later" : ""}">${c.status === "a_venir" ? "À venir · préparation anticipée" : "Vu en cours"}</span>${c.date ? `<span class="q-src">${esc(c.date)}</span>` : ""}</div>
    ${c.subtitle ? `<p class="lead">${esc(c.subtitle)}</p>` : ""}
    <div class="tabs" role="tablist">` + TABS.map(([k, l]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${state.tab === k}">${l}${counts[k] != null ? ` <small>${counts[k]}</small>` : ""}</button>`).join("") + `</div><div id="tabbody" style="display:flex;flex-direction:column;gap:14px"></div>`;
  return h;
}

function renderTab() {
  const c = COURSES[state.courseId]; const s = c.subject; const box = $("#tabbody");
  if (state.tab === "resume") {
    let h = "";
    if (c.objectives?.length) h += `<div><div class="eyebrow">Objectifs du cours</div><ul class="list-plain objectives" style="margin-top:8px">${c.objectives.map(o => `<li>${esc(o)}</li>`).join("")}</ul></div>`;
    if (s.exam_info) h += `<details class="section"><summary>Modalités d'évaluation</summary><div class="md">${md(s.exam_info)}</div></details>`;
    h += c.summary.map(sec => `<details class="section" open><summary>${esc(sec.title)}</summary><div class="md">${md(sec.body)}</div></details>`).join("");
    if (c.resources?.length) h += `<div class="res-list"><div class="eyebrow">Ressources</div><ul>${c.resources.map(r => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.label)}</a></li>`).join("")}</ul></div>`;
    if (c.sources?.length) h += `<p class="q-src">Sources : ${c.sources.map(esc).join(" · ")}</p>`;
    box.innerHTML = h;
  } else if (state.tab === "retenir") {
    box.innerHTML = `<h2 class="title-l">La fiche de la veille d'examen</h2><ol class="list-plain keypoints">${(c.key_points || []).map(k => `<li><span>${mdInline(k)}</span></li>`).join("")}</ol>` +
      ((c.traps || []).length ? `<h2 class="title-l">Pièges classiques</h2><div class="list-plain" style="display:flex;flex-direction:column;gap:8px">${c.traps.map(t => `<div class="trap">${mdInline(t)}</div>`).join("")}</div>` : "");
  } else if (state.tab === "flash") {
    renderFlash(box, c);
  } else if (state.tab === "qcb" || state.tab === "qcm") {
    const all = c[state.tab]; const best = loadBest();
    box.innerHTML = `<div class="levels" role="group" aria-label="Niveau">` + LEVELS.map(([k, l]) => {
      const n = k === "tous" ? all.length : all.filter(q => lvlOf(q) === k).length;
      const b = best[quizKey(state.tab, k, c.id)];
      return `<button class="lvl" data-level="${k}" aria-pressed="${state.level === k}" ${n ? "" : "disabled"}>${l} <small>${n}${b != null ? " · " + b + " %" : ""}</small></button>`;
    }).join("") + `</div><p class="q-src" style="margin:0">${LEVEL_HELP[state.level]}</p><div id="quizbody" style="display:flex;flex-direction:column;gap:14px"></div>`;
    const qs = all.filter(q => state.level === "tous" || lvlOf(q) === state.level);
    if (!qs.length) { $("#quizbody").innerHTML = `<div class="empty">Pas encore de questions de ce niveau pour ce cours.</div>`; return; }
    const key = quizKey(state.tab, state.level, c.id);
    if (!quiz[key]) quiz[key] = newQuiz(state.tab, qs.map(q => ({ ...q, type: state.tab })), false, state.level === "tous");
    renderQuiz($("#quizbody"), key);
  } else if (state.tab === "ouvertes") {
    box.innerHTML = `<p class="lead">Rédigez votre réponse, puis ouvrez le corrigé pour comparer.</p>` + (c.open_questions || []).map((q, i) => `
      <div class="q"><div class="q-head"><span class="n">${i + 1}.</span><span>${esc(q.question)}</span></div>
      <label class="q-src" for="oq-${c.id}-${i}">Ma réponse</label><textarea id="oq-${c.id}-${i}" placeholder="Votre réponse…"></textarea>
      <details class="answer"><summary>Voir le corrigé</summary><div class="md">${md(q.answer)}</div></details></div>`).join("");
  } else if (state.tab === "cas") {
    box.innerHTML = (c.exercises || []).map(ex => `
      <div class="q"><h3 style="font-size:1.15rem">${esc(ex.title)}</h3><div class="md" style="padding:0">${md(ex.statement)}</div>
      ${ex.questions?.length ? `<ul style="margin:0">${ex.questions.map(q => `<li>${esc(q)}</li>`).join("")}</ul>` : ""}
      <details class="answer"><summary>Voir le corrigé</summary><div class="md">${md(ex.answer)}</div></details></div>`).join("") || `<div class="empty">Pas de cas pratique pour ce cours.</div>`;
  }
}

// ---------- flashcards ----------
const flash = {};
function renderFlash(box, c) {
  const g = c.glossary || [];
  if (!g.length) { box.innerHTML = `<div class="empty">Pas de définitions pour ce cours.</div>`; return; }
  const f = flash[c.id] || (flash[c.id] = { order: g.map((_, i) => i), i: 0, shown: false });
  const card = g[f.order[f.i]];
  box.innerHTML = `<div class="card-stage">
    <div class="toolbar"><span class="score">Carte ${f.i + 1} / ${g.length}</span><button class="btn" data-flash="shuffle">Mélanger</button></div>
    <button class="flash" data-flash="flip" aria-live="polite"><h3>${esc(card.term)}</h3>
      ${f.shown ? `<p>${esc(card.definition)}</p>` : `<p class="hint">Donnez la définition à voix haute, puis touchez la carte pour la retourner.</p>`}</button>
    <div class="flash-ctrl"><button class="btn" data-flash="prev">Précédente</button><button class="btn primary" data-flash="flip">${f.shown ? "Masquer" : "Retourner"}</button><button class="btn" data-flash="next">Suivante</button></div>
  </div>
  <details class="section"><summary>Tout le glossaire (${g.length})</summary><div class="md"><dl class="gloss">${g.map(x => `<dt>${esc(x.term)}</dt><dd>${esc(x.definition)}</dd>`).join("")}</dl></div></details>`;
}
function flashAction(a) {
  const c = COURSES[state.courseId]; const g = c.glossary; const f = flash[c.id];
  if (a === "flip") f.shown = !f.shown;
  if (a === "next") { f.i = (f.i + 1) % g.length; f.shown = false; }
  if (a === "prev") { f.i = (f.i - 1 + g.length) % g.length; f.shown = false; }
  if (a === "shuffle") { f.order = shuffle(f.order); f.i = 0; f.shown = false; }
  renderFlash($("#tabbody"), c);
}

// ---------- quiz ----------
// mode instantané (cours) : correction question par question ; mode examen : correction à la fin.
function newQuiz(kind, questions, examMode, showLevel) {
  return { kind, examMode, showLevel: !!showLevel, questions, answers: questions.map(() => null), checked: questions.map(() => false), finished: false };
}
function isRight(q, a) {
  if (a == null) return false;
  if (q.type === "qcb") return a === q.answer;
  const exp = [...q.answer].sort().join(","); return [...a].sort().join(",") === exp;
}
function renderQuiz(box, key) {
  const z = quiz[key];
  const answered = z.checked.filter(Boolean).length;
  const right = z.questions.filter((q, i) => z.checked[i] && isRight(q, z.answers[i])).length;
  let h = `<div class="toolbar"><span class="score">${z.examMode ? `${z.answers.filter(a => a != null && (a.length ?? 1)).length} / ${z.questions.length} répondues` : `Score : ${right} / ${answered} · ${z.questions.length} questions`}</span>
    <span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-quiz="${key}" data-act="shuffle">Mélanger</button><button class="btn" data-quiz="${key}" data-act="reset">Recommencer</button></span></div>`;
  if (z.questions.some(q => q.type === "qcm")) h += `<p class="q-src">QCM : une ou plusieurs bonnes réponses. Une question n'est juste que si toutes les cases sont correctes.</p>`;
  if (z.finished || (!z.examMode && answered === z.questions.length)) h += resultBox(key, right, z.questions.length);
  z.questions.forEach((q, i) => {
    const done = z.checked[i]; const ok = done && isRight(q, z.answers[i]);
    h += `<div class="q ${done ? (ok ? "right" : "wrong") : ""}"><div class="q-head"><span class="n">${i + 1}.</span><span>${esc(q.q)}${(q.src || z.showLevel) ? `<span class="q-src">${esc([q.src, z.showLevel ? LEVEL_LABEL[lvlOf(q)] : ""].filter(Boolean).join(" · "))}</span>` : ""}</span></div>`;
    if (q.type === "qcb") {
      h += `<div class="tf">` + [[true, "Vrai"], [false, "Faux"]].map(([v, l]) => {
        let cls = "";
        if (done) cls = z.answers[i] === v ? (v === q.answer ? "picked-right" : "picked-wrong") : (v === q.answer ? "was-right" : "");
        else if (z.answers[i] === v) cls = "primary";
        return `<button class="btn ${cls}" data-quiz="${key}" data-act="tf" data-i="${i}" data-v="${v}" ${done ? "disabled" : ""}>${l}</button>`;
      }).join("") + `</div>`;
    } else {
      const sel = z.answers[i] || [];
      h += `<div class="opts">` + q.options.map((o, j) => {
        let cls = "";
        if (done) { const exp = q.answer.includes(j), got = sel.includes(j); cls = exp && got ? "is-right" : exp ? "is-missed" : got ? "is-wrong" : ""; }
        const id = `${key}-${i}-${j}`.replace(/[^\w-]/g, "_");
        return `<label class="opt ${cls}" for="${id}"><input type="checkbox" id="${id}" data-quiz="${key}" data-act="pick" data-i="${i}" data-j="${j}" ${sel.includes(j) ? "checked" : ""} ${done ? "disabled" : ""}><span class="l">${String.fromCharCode(65 + j)}</span><span>${esc(o)}</span></label>`;
      }).join("") + `</div>`;
      if (!done && !z.examMode) h += `<div><button class="btn primary" data-quiz="${key}" data-act="check" data-i="${i}" ${sel.length ? "" : "disabled"}>Valider</button></div>`;
    }
    if (done) {
      const expected = q.type === "qcb" ? (q.answer ? "Vrai" : "Faux") : q.answer.map(a => String.fromCharCode(65 + a)).join(", ");
      h += `<div class="feedback ${ok ? "ok" : "ko"}"><b>${ok ? "Juste." : "Faux. Réponse : " + expected + "."}</b> ${mdInline(q.explanation)}</div>`;
    }
    h += `</div>`;
  });
  if (z.examMode && !z.finished) h += `<div><button class="btn primary" data-quiz="${key}" data-act="finish">Corriger l'examen</button></div>`;
  box.innerHTML = h;
}
function resultBox(key, right, total) {
  const pct = Math.round(100 * right / total), note = (20 * right / total).toFixed(1).replace(".", ",");
  const msg = pct >= 80 ? "Excellent, ce cours est maîtrisé." : pct >= 60 ? "Bon niveau. Relisez les explications des erreurs." : "Relisez le résumé et les pièges, puis recommencez.";
  return `<div class="result" role="status"><div><div class="eyebrow">Résultat</div><div class="big">${note} / 20</div></div><div>${right} bonnes réponses sur ${total} (${pct} %)<br><span class="q-src">${msg}</span></div></div>`;
}
function quizAction(el) {
  const key = el.dataset.quiz, z = quiz[key], act = el.dataset.act, i = +el.dataset.i;
  if (act === "tf") { z.answers[i] = el.dataset.v === "true"; if (!z.examMode) z.checked[i] = true; }
  if (act === "pick") { const j = +el.dataset.j, s = new Set(z.answers[i] || []); el.checked ? s.add(j) : s.delete(j); z.answers[i] = [...s]; }
  if (act === "check") z.checked[i] = true;
  if (act === "finish") { z.checked = z.checked.map(() => true); z.finished = true; }
  if (act === "reset" || act === "shuffle") {
    const qs = act === "shuffle" ? shuffle(z.questions) : z.questions;
    quiz[key] = newQuiz(z.kind, qs, z.examMode, z.showLevel);
  }
  const fresh = quiz[key];
  const answered = fresh.checked.filter(Boolean).length;
  if (answered === fresh.questions.length && fresh.questions.length && !key.startsWith("exam")) {
    saveBest(key, Math.round(100 * fresh.questions.filter((q, k) => isRight(q, fresh.answers[k])).length / fresh.questions.length));
    renderSide();
  }
  const y = window.scrollY;
  if (key.startsWith("exam")) renderQuiz($("#exambody"), key); else renderQuiz($("#quizbody"), key);
  if (act === "pick") { const again = document.getElementById(el.id); if (again) again.focus({ preventScroll: true }); }
  if (act !== "finish" && act !== "reset" && act !== "shuffle") window.scrollTo(0, y);
  else if (act === "finish") $("#exambody").scrollIntoView({ behavior: "smooth" });
}

// ---------- examen blanc ----------
function renderExam() {
  const avail = SUBJECTS.filter(s => s.courses.length);
  return mobileNav() + `<div><div class="eyebrow">Toutes matières</div><h1 class="title-xl">Examen blanc</h1></div>
    <p class="lead">Un tirage aléatoire de QCB et de QCM dans les matières et niveaux choisis. Répondez à tout, puis corrigez : la note est donnée sur 20.</p>
    <form class="exam-form" id="examform">
      <div><div class="eyebrow">Matières</div><div class="checks" style="margin-top:6px">${avail.map(s => `<label for="ex-${s.id}"><input type="checkbox" id="ex-${s.id}" value="${s.id}" checked> ${esc(s.title)}</label>`).join("")}</div></div>
      <div><div class="eyebrow">Niveaux</div><div class="checks" style="margin-top:6px">${LEVELS.slice(0, 3).map(([k, l]) => `<label for="lv-${k}"><input type="checkbox" id="lv-${k}" data-lv="${k}" checked> ${l}</label>`).join("")}</div></div>
      <label class="checks" for="ex-later"><input type="checkbox" id="ex-later"> Inclure les cours « à venir »</label>
      <div class="ranges">
        <label for="ex-nqcb">QCB (vrai/faux) : <output id="o-nqcb">10</output><input type="range" id="ex-nqcb" min="0" max="30" value="10"></label>
        <label for="ex-nqcm">QCM : <output id="o-nqcm">10</output><input type="range" id="ex-nqcm" min="0" max="30" value="10"></label>
      </div>
      <div><button class="btn primary" type="submit">Générer un examen</button></div>
    </form><div id="exambody" style="display:flex;flex-direction:column;gap:14px"></div>`;
}
function buildExam(form) {
  const ids = [...form.querySelectorAll(".checks input[value]:checked")].map(x => x.value);
  const later = $("#ex-later").checked;
  const lvls = [...form.querySelectorAll("input[data-lv]:checked")].map(x => x.dataset.lv);
  const pool = { qcb: [], qcm: [] };
  SUBJECTS.filter(s => ids.includes(s.id)).forEach(s => s.courses.forEach(c => {
    if (c.status === "a_venir" && !later) return;
    ["qcb", "qcm"].forEach(t => c[t].forEach(q => { if (lvls.includes(lvlOf(q))) pool[t].push({ ...q, type: t, src: s.short + " · " + c.title.split(" — ")[0] }); }));
  }));
  const qs = shuffle(pool.qcb).slice(0, +$("#ex-nqcb").value).concat(shuffle(pool.qcm).slice(0, +$("#ex-nqcm").value));
  if (!qs.length) { $("#exambody").innerHTML = `<div class="empty">Sélectionnez au moins une matière et une question.</div>`; return; }
  const key = "exam:" + Date.now();
  quiz[key] = newQuiz("exam", qs, true, true);
  renderQuiz($("#exambody"), key);
}

// ---------- rendu global & événements ----------
function render() {
  renderSide();
  const v = $("#view");
  if (state.view === "home") v.innerHTML = renderHome();
  else if (state.view === "exam") v.innerHTML = renderExam();
  else { v.innerHTML = renderCourse(); renderTab(); }
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-course],[data-tab],[data-flash],[data-quiz],[data-level]");
  if (!t) return;
  if (t.dataset.go) go(t.dataset.go);
  else if (t.dataset.course) go("course", t.dataset.course, "resume");
  else if (t.dataset.tab) { state.tab = t.dataset.tab; document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === state.tab)); renderTab(); }
  else if (t.dataset.flash) flashAction(t.dataset.flash);
  else if (t.dataset.level) { state.level = t.dataset.level; renderTab(); }
  else if (t.dataset.quiz && t.dataset.act !== "pick") quizAction(t);
});
document.addEventListener("change", e => {
  if (e.target.id === "mnav") { const v = e.target.value; v === "home" || v === "exam" ? go(v) : go("course", v, "resume"); }
  else if (e.target.dataset.act === "pick") quizAction(e.target);
});
document.addEventListener("input", e => {
  if (e.target.id === "ex-nqcb" || e.target.id === "ex-nqcm") $("#o-" + e.target.id.slice(3)).textContent = e.target.value;
});
document.addEventListener("submit", e => { if (e.target.id === "examform") { e.preventDefault(); buildExam(e.target); } });
render();
</script>
