<style>
/* Layout: cahier de révision. Sommaire des matières à gauche (en haut sur mobile), page de cours à droite avec onglets. */
:root {
  --paper: #f5f7fb;
  --sheet: #ffffff;
  --ink: #1b2233;
  --muted: #5b6478;
  --line: #dde2ec;
  --accent: #2346a8;      /* encre bleue */
  --accent-soft: #e6ecfb;
  --pen: #c23a2b;         /* stylo rouge de correction */
  --pen-soft: #fbe9e6;
  --ok: #23774a;
  --ok-soft: #e3f3ea;
  --warn: #9a6400;
  --warn-soft: #fbf1dc;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11141b; --sheet: #181c25; --ink: #e5e8ef; --muted: #9aa3b5; --line: #2a303d;
    --accent: #93acff; --accent-soft: #1f2843; --pen: #ff8a7a; --pen-soft: #3a1f1c;
    --ok: #6fd39a; --ok-soft: #173126; --warn: #f0bf5a; --warn-soft: #33290f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11141b; --sheet: #181c25; --ink: #e5e8ef; --muted: #9aa3b5; --line: #2a303d;
  --accent: #93acff; --accent-soft: #1f2843; --pen: #ff8a7a; --pen-soft: #3a1f1c;
  --ok: #6fd39a; --ok-soft: #173126; --warn: #f0bf5a; --warn-soft: #33290f; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100vh; }
.side { border-right: 1px solid var(--line); background: var(--sheet); padding: 20px 14px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; }
.brand { display: flex; flex-direction: column; gap: 2px; padding: 0 8px 16px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.brand b { font-family: var(--font-display); font-size: 1.35rem; font-weight: 800; letter-spacing: -0.01em; }
.brand span { color: var(--muted); font-size: .82rem; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { text-align: left; background: none; border: 0; border-radius: 8px; padding: 8px 10px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.nav-item:hover { background: var(--accent-soft); }
.nav-item[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.nav-subject { font-family: var(--font-display); font-weight: 700; font-size: .98rem; margin-top: 10px; }
.nav-course { font-size: .88rem; padding-left: 20px; color: var(--muted); }
.nav-course[aria-current="true"] { color: var(--accent); }
.nav-num { font-variant-numeric: tabular-nums; font-size: .75rem; color: var(--muted); }
.nav-sep { border-top: 1px solid var(--line); margin: 12px 0 6px; }
.tag { display: inline-block; font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.tag.later { background: var(--warn-soft); color: var(--warn); }

.main { padding-block: 28px 64px; padding-inline: clamp(16px, 4vw, 48px); min-width: 0; }
.wrap { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.mobile-nav { display: none; }

.eyebrow { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.title-xl { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 800; letter-spacing: -0.02em; }
.title-l { font-size: clamp(1.4rem, 3vw, 1.9rem); font-weight: 700; }
.lead { color: var(--muted); max-width: 65ch; margin: 0; }

.stats { display: flex; flex-wrap: wrap; gap: 28px; padding: 16px 0; border-block: 1px solid var(--line); }
.stat b { display: block; font-family: var(--font-display); font-size: 1.9rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--accent); }
.stat span { color: var(--muted); font-size: .85rem; }

.subjects { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.subject-card { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 10px; text-align: left; }
.subject-card:hover { border-color: var(--accent); }
.subject-card h3 { font-size: 1.15rem; }
.subject-card p { margin: 0; color: var(--muted); font-size: .92rem; }
.subject-card .meta { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: auto; }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); }

.dates { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.date-row { display: grid; grid-template-columns: 110px 150px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: .92rem; }
.date-row b { font-variant-numeric: tabular-nums; }
.date-row span:first-child { color: var(--muted); }

.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: thin; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--paper); z-index: 2; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 12px; white-space: nowrap; color: var(--muted); font-weight: 700; font-size: .92rem; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tab small { font-weight: 400; font-variant-numeric: tabular-nums; }

.section { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); }
.section > summary { cursor: pointer; padding: 14px 18px; font-family: var(--font-display); font-weight: 700; font-size: 1.08rem; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
.section > summary::after { content: "+"; color: var(--muted); }
.section[open] > summary::after { content: "−"; }
.md { padding: 0 18px 16px; min-width: 0; }
.md p { margin: .5em 0; max-width: 72ch; }
.md ul, .md ol { padding-left: 1.3em; margin: .4em 0; }
.md li { margin: .2em 0; }
.md blockquote { margin: .8em 0; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; }
.md blockquote p { margin: 0; }
.md em { color: var(--muted); }
.md strong { color: var(--ink); }
.tablewrap { overflow-x: auto; margin: .6em 0; border: 1px solid var(--line); border-radius: 8px; }
.md table { border-collapse: collapse; width: 100%; font-size: .9rem; }
.md th, .md td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.md th { background: var(--accent-soft); font-weight: 700; }
.md tr:last-child td { border-bottom: 0; }

.list-plain { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.objectives li { padding-left: 22px; position: relative; }
.objectives li::before { content: "→"; position: absolute; left: 0; color: var(--accent); }
.keypoints { counter-reset: kp; }
.keypoints li { counter-increment: kp; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.keypoints li::before { content: counter(kp); font-family: var(--font-display); font-weight: 800; color: var(--accent); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.trap { background: var(--warn-soft); border-radius: 8px; padding: 10px 14px; color: var(--ink); }
.trap::before { content: "Piège · "; font-weight: 700; color: var(--warn); }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.score { font-variant-numeric: tabular-nums; font-weight: 700; }
.btn { border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 8px 14px; font-weight: 700; font-size: .9rem; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
.btn:disabled { opacity: .5; cursor: default; }

.q { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.q.right { border-color: var(--ok); }
.q.wrong { border-color: var(--pen); }
.q-head { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 8px; font-weight: 700; }
.q-head .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.q-src { font-size: .78rem; color: var(--muted); font-weight: 400; display: block; }
.tf { display: flex; gap: 10px; flex-wrap: wrap; }
.tf .btn { min-width: 96px; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { display: grid; grid-template-columns: 22px 22px minmax(0, 1fr); gap: 8px; align-items: start; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; }
.opt input { margin: 3px 0 0; accent-color: var(--accent); }
.opt .l { font-weight: 700; color: var(--muted); }
.opt.is-right { background: var(--ok-soft); border-color: var(--ok); }
.opt.is-missed { border-color: var(--ok); border-style: dashed; }
.opt.is-wrong { background: var(--pen-soft); border-color: var(--pen); }
.btn.picked-right { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.btn.picked-wrong { background: var(--pen-soft); border-color: var(--pen); color: var(--pen); }
.btn.was-right { border-color: var(--ok); color: var(--ok); }
.feedback { border-radius: 8px; padding: 10px 14px; font-size: .94rem; }
.feedback.ok { background: var(--ok-soft); }
.feedback.ok b { color: var(--ok); }
.feedback.ko { background: var(--pen-soft); }
.feedback.ko b { color: var(--pen); }
.result { background: var(--sheet); border: 2px solid var(--accent); border-radius: var(--r); padding: 18px; display: flex; flex-wrap: wrap; gap: 18px; align-items: center; justify-content: space-between; }
.result .big { font-family: var(--font-display); font-size: 2.2rem; font-weight: 800; font-variant-numeric: tabular-nums; }

.card-stage { display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
.flash { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; min-height: 220px; padding: 28px; display: flex; flex-direction: column; gap: 14px; justify-content: center; text-align: center; cursor: pointer; width: 100%; }
.flash h3 { font-size: clamp(1.3rem, 3vw, 1.8rem); }
.flash p { margin: 0 auto; max-width: 55ch; }
.flash .hint { color: var(--muted); font-size: .88rem; }
.flash-ctrl { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.gloss { display: grid; grid-template-columns: minmax(140px, 220px) minmax(0, 1fr); border-top: 1px solid var(--line); }
.gloss dt, .gloss dd { margin: 0; padding: 10px 0; border-bottom: 1px solid var(--line); }
.gloss dt { font-weight: 700; padding-right: 12px; }

textarea { width: 100%; min-height: 110px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); font: inherit; resize: vertical; }
details.answer { border-top: 1px dashed var(--line); padding-top: 8px; }
details.answer > summary { cursor: pointer; color: var(--accent); font-weight: 700; }
details.answer .md { padding: 8px 0 0; }

.exam-form { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.checks label { display: flex; gap: 6px; align-items: center; }
.ranges { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.ranges label { display: flex; flex-direction: column; gap: 4px; font-weight: 700; font-size: .9rem; }
.ranges output { font-variant-numeric: tabular-nums; color: var(--accent); }
input[type=range] { accent-color: var(--accent); width: 100%; }
.empty { background: var(--sheet); border: 1px dashed var(--line); border-radius: var(--r); padding: 24px; color: var(--muted); }
.res-list a { word-break: break-word; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .mobile-nav { display: flex; flex-direction: column; gap: 8px; }
  .mobile-nav select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); font: inherit; }
  .date-row { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .gloss { grid-template-columns: minmax(0, 1fr); }
  .gloss dt { border-bottom: 0; padding-bottom: 0; }
}
@media (prefers-reduced-motion: no-preference) {
  .q, .flash { transition: border-color .2s; }
}
</style>

<script id="data" type="application/json">[{"id": "argument", "order": 1, "folder": "01. ARGUMENT", "title": "Argumentation", "short": "Argument", "teacher": "", "description": "Aucun support de cours n'a encore été déposé dans le dossier « 01. ARGUMENT ». Les fiches et questions apparaîtront ici dès l'ajout des cours.", "key_dates": [], "exam_info": "", "courses": []}, {"id": "sociologie", "order": 2, "folder": "02. SOCIOLOGIE", "title": "Sociologie de la consommation", "short": "Sociologie", "teacher": "", "description": "Comprendre le consommateur comme une construction sociale : histoire, grands sociologues, typologies et paradoxes contemporains.", "key_dates": [], "exam_info": "Format d'examen non précisé dans les documents. Méthode conseillée pour les questions ouvertes : définition → explication → exemple concret → conclusion.", "courses": [{"id": "soc-01", "title": "Cours 1 — Le consommateur, une construction sociale", "subtitle": "Naissance, histoire et transformation du concept de consommation", "date": "", "status": "vu", "sources": ["Cours 1 - Le consommateur, une construction sociale.pdf", "Résumé et QCM du cours.pdf"], "objectives": ["Comprendre la genèse historique du consommateur : de l'acheteur utilitaire au consommateur moderne.", "Identifier les ruptures majeures : industrialisation, marketing, crises sociales.", "Situer la consommation dans une perspective sociologique (Baudrillard, Bourdieu, Veblen).", "Analyser les enjeux contemporains : consommation de masse vs pratiques responsables, plaisir individuel vs sobriété collective."], "summary": [{"title": "1. L'idée centrale du cours", "body": "Le consommateur **n'est pas une donnée naturelle** : c'est une **construction sociale évolutive**. Ses comportements sont façonnés par l'économie, la technologie, la culture, le marketing et les valeurs de son époque.\n\n> Il n'existe pas de « nature » consumériste universelle. Comprendre le consommateur, c'est comprendre les valeurs, les contradictions et les aspirations d'une société tout entière."}, {"title": "2. Avant le consommateur : l'acheteur utilitaire (jusqu'au XIXe siècle)", "body": "L'acte d'achat est **fonctionnel, utilitaire et local**. Il répond à un besoin concret, sans dimension expérientielle ni émotionnelle, et **sans mise en scène commerciale**.\n\n- Choix restreint de produits\n- Aucune publicité, aucun marketing\n- Relations directes artisan-producteur ↔ acheteur\n- Achat fondé sur la **nécessité**, pas sur le désir\n- Commerce local et saisonnier"}, {"title": "3. Naissance de la consommation de masse (fin XIXe – début XXe)", "body": "Trois moteurs à retenir :\n\n1. **Industrialisation et standardisation** : la mécanisation permet la production de masse et démocratise les produits manufacturés.\n2. **Grands magasins** (ex. **Le Bon Marché** à Paris) : le client devient un « **visiteur** » séduit par la mise en scène des vitrines (théâtralisation).\n3. **Publicité et marques** : on passe de la réponse au besoin à la **création du désir**, de l'aspiration et du rêve.\n\n*Complément culture générale : Le Bon Marché est fondé par Aristide Boucicaut (1852) ; Émile Zola s'en inspire dans « Au Bonheur des Dames » (1883).*"}, {"title": "4. Le marketing naît avec la société de consommation (1920–1960)", "body": "Facteurs de transformation :\n\n- Croissance économique soutenue après-guerre\n- Urbanisation accélérée\n- Production de masse de biens standardisés\n- Médias de masse (radio, télévision)\n- Élévation du niveau de vie des classes moyennes\n\nLe marketing devient une **discipline scientifique** avec trois concepts fondamentaux : **segmentation, ciblage, positionnement**. Le consommateur devient **l'acteur central** du système économique capitaliste.\n\n| Notion | Définition |\n|---|---|\n| Segmentation | Diviser le marché en groupes homogènes (critères démographiques, sociologiques, comportementaux) |\n| Ciblage | Choisir le ou les segments à atteindre |\n| Positionnement | Définir la place / l'image que la marque veut occuper dans l'esprit du consommateur |\n\n*Attention piège : le cours associe cette période aux « Trente Glorieuses ». Historiquement, l'expression (Jean Fourastié) désigne plutôt 1945–1975. Si on vous demande la date des Trente Glorieuses : 1945–1975.*"}, {"title": "5. Ruptures contemporaines (1968–2000)", "body": "| Période | Ce qui se passe | À retenir |\n|---|---|---|\n| **Mai 68** | Remise en cause de la société marchande | Dénonciation de l'**aliénation** par la consommation, idéal moins matérialiste |\n| **Années 1980** | Apogée individualiste | Le « **yuppie** », réussite sociale par la consommation ostentatoire et le luxe |\n| **Crise écologique** | Premiers doutes | Discours sur la **sobriété** et la consommation responsable face aux limites planétaires |\n| **Alternatives** | Pratiques émergentes | **Bio, commerce équitable, seconde main** : marginales, elles annoncent le XXIe siècle |"}, {"title": "6. Les trois sociologues à connaître par cœur", "body": "| Auteur | Idée clé | Mot-clé | Exemple |\n|---|---|---|---|\n| **Jean Baudrillard** | « On ne consomme pas des objets, mais des **signes** » : la consommation est un **langage social** | Consommation **symbolique** | Acheter un iPhone pour ce qu'il dit de soi |\n| **Pierre Bourdieu** | La consommation révèle et **reproduit les habitus** et les inégalités de classe ; les goûts ne sont jamais neutres | **Habitus** / distinction | Goûts musicaux ou alimentaires liés au milieu social |\n| **Thorstein Veblen** | La consommation **ostentatoire** sert à démontrer publiquement son statut ; le luxe devient performance sociale | Consommation **ostentatoire** | Montre de luxe, voiture de prestige exhibée |\n\n**Astuce mémo** : Baudrillard = **SIGNES** · Bourdieu = **MILIEU SOCIAL** · Veblen = **STATUT / FRIME**.\n\n*Complément (œuvres utiles en copie) : Veblen, « Théorie de la classe de loisir » (1899) ; Baudrillard, « La Société de consommation » (1970) ; Bourdieu, « La Distinction » (1979).*"}, {"title": "7. Typologies contemporaines du consommateur", "body": "| Profil | Comportement |\n|---|---|\n| **Rationnel** | Compare les prix, lit les avis, planifie, optimise le rapport qualité-prix |\n| **Émotionnel** | Instinct, coups de cœur, expérience sensorielle, plaisir immédiat, esthétique |\n| **Zappeur** | Attention fragmentée, boulimie d'informations commerciales, change souvent de marque (culture numérique) |\n| **Responsable** | Intègre l'écologie, le social et l'éthique, parfois au détriment du prix ou de la praticité |\n\n⚠️ Ces typologies **ne sont pas exclusives** : un même individu combine plusieurs profils selon le **contexte** et la **catégorie de produits**."}, {"title": "8. Le consommateur du XXIe siècle", "body": "- **Hyperconnexion** et parcours client **fragmenté**\n- Recherche d'**expériences authentiques** et de valeurs éthiques\n- Profil **paradoxal** : à la fois responsable et impulsif\n- Tension entre **liberté de choix** et **influence algorithmique**\n- Oscillation entre **plaisir** et aspiration à la **sobriété**\n\nRessource du cours : Benoît Heilbrunn, « Le consommateur n'existe pas et le marketing ne prédit pas les achats »."}, {"title": "9. Les quatre paradoxes du consommateur moderne", "body": "| Paradoxe | Explication | Exemple |\n|---|---|---|\n| **Éthique vs impulsivité** | Aspirations éthiques sincères mais achats impulsifs dictés par l'immédiateté digitale | Défendre l'écologie et acheter sur Shein |\n| **Global vs local** | Attrait des marques mondiales vs circuits courts et artisanat local | Commander sur Amazon et faire son marché |\n| **Hyperconnexion vs authenticité** | Chercher l'authentique tout en étant guidé par les algorithmes | Choisir une destination « nature » vue chez un influenceur |\n| **Accumulation vs sobriété** | Héritage du XXe (posséder = réussir) vs minimalisme, décroissance | Vouloir le dernier smartphone et prôner le minimalisme |"}, {"title": "10. Synthèse : le consommateur, miroir de son époque", "body": "| Siècle | Figure du consommateur |\n|---|---|\n| **XIXe** | Acheteur **utilitaire** : besoins fonctionnels, rareté, production artisanale |\n| **XXe** | Consommateur **moderne** : industrialisation, grands magasins, publicité, consommation de masse |\n| **XXIe** | Consommateur **paradoxal**, hyperconnecté, fragmenté : entre hédonisme et responsabilité, individualisme et conscience collective |\n\n**Enjeu contemporain** : concilier les aspirations individuelles (bien-être, plaisir) avec les impératifs collectifs (**durabilité environnementale** et **justice sociale**)."}], "key_points": ["Le consommateur est une construction sociale qui évolue avec son époque.", "Avant le XIXe siècle : acheteur utilitaire, achat de nécessité, local, sans publicité.", "Industrialisation + grands magasins (Le Bon Marché) + publicité/marques = naissance de la consommation de masse.", "1920–1960 : le marketing devient une discipline : segmentation, ciblage, positionnement.", "Mai 68 : critique de la société marchande et de l'aliénation par la consommation.", "Années 1980 : apogée individualiste, yuppies, consommation ostentatoire.", "Baudrillard = signes (consommation symbolique) ; Bourdieu = habitus (milieu social) ; Veblen = consommation ostentatoire (statut).", "Quatre profils non exclusifs : rationnel, émotionnel, zappeur, responsable.", "Quatre paradoxes : éthique/impulsivité, global/local, hyperconnexion/authenticité, accumulation/sobriété.", "Enjeu du XXIe siècle : concilier plaisir individuel, durabilité environnementale et justice sociale."], "traps": ["Ne pas confondre Veblen (montrer sa richesse) et Baudrillard (consommer des signes en général, pas forcément du luxe).", "Bourdieu ne parle pas de « frime » : l'habitus est inconscient et hérité du milieu social.", "Segmentation ≠ ciblage ≠ positionnement : diviser → choisir → se placer dans l'esprit.", "Les typologies ne sont pas exclusives : une même personne peut être rationnelle pour un frigo et émotionnelle pour un parfum.", "Les alternatives (bio, équitable, seconde main) apparaissent dès la fin du XXe siècle, elles ne sont pas nées avec Internet.", "Les grands magasins datent de la fin du XIXe siècle, pas de l'après-guerre."], "glossary": [{"term": "Consommateur", "definition": "Individu qui achète et utilise des biens ou services. Sa conception a évolué de l'acheteur utilitaire du XIXe siècle à un acteur central et complexe du système économique."}, {"term": "Acheteur utilitaire", "definition": "Modèle pré-industriel où l'achat répond exclusivement à un besoin fonctionnel immédiat, sans dimension expérientielle, émotionnelle ou symbolique."}, {"term": "Industrialisation", "definition": "Transformation économique (fin XIXe) : mécanisation, production de masse standardisée, émergence de la consommation à grande échelle."}, {"term": "Grands magasins", "definition": "Espaces commerciaux apparus fin XIXe (Le Bon Marché) qui transforment l'achat en expérience sensorielle et sociale grâce à la théâtralisation des vitrines."}, {"term": "Société de consommation", "definition": "Modèle sociétal du XXe siècle où l'acquisition et l'usage de biens deviennent centraux dans l'identité sociale et l'économie."}, {"term": "Segmentation marketing", "definition": "Diviser le marché en groupes homogènes de consommateurs selon des critères démographiques, sociologiques ou comportementaux."}, {"term": "Ciblage", "definition": "Choix du ou des segments que l'entreprise souhaite atteindre."}, {"term": "Positionnement", "definition": "Place et image que la marque veut occuper dans l'esprit du consommateur, par rapport à ses concurrents."}, {"term": "Habitus (Bourdieu)", "definition": "Système de dispositions durables et transposables, acquises dans un milieu social, qui orientent inconsciemment les goûts, pratiques et choix de consommation."}, {"term": "Consommation ostentatoire (Veblen)", "definition": "Acquisition démonstrative de biens de luxe pour afficher son statut social élevé et se distinguer des classes inférieures."}, {"term": "Consommation symbolique (Baudrillard)", "definition": "Les individus consomment des signes (statut, appartenance, identité) plutôt que la valeur d'usage des objets."}, {"term": "Consommation responsable", "definition": "Pratiques d'achat intégrant des préoccupations éthiques, écologiques et sociales : commerce équitable, bio, circuits courts, économie circulaire."}, {"term": "Mai 68 et critique consumériste", "definition": "Mouvement social et culturel remettant en cause la société marchande, les valeurs matérialistes et l'aliénation par la consommation."}, {"term": "Économie circulaire", "definition": "Modèle privilégiant réutilisation, réparation et recyclage ; incarné par la seconde main (Vinted, Leboncoin)."}, {"term": "Yuppie", "definition": "Figure des années 1980 (young urban professional) : réussite sociale affichée par la consommation ostentatoire et les marques de luxe."}], "qcb": [{"q": "Selon le cours, il existe une « nature » consumériste universelle, identique à toutes les époques.", "answer": false, "explanation": "Le cours affirme l'inverse : le consommateur est une construction sociale évolutive, miroir de son époque."}, {"q": "Avant le XIXe siècle, l'achat est essentiellement fonctionnel, utilitaire et local.", "answer": true, "explanation": "C'est la définition de l'acheteur utilitaire : besoin concret, commerce local et saisonnier."}, {"q": "La publicité joue déjà un rôle central dans le commerce pré-industriel.", "answer": false, "explanation": "La période pré-industrielle se caractérise par l'absence complète de publicité et de marketing."}, {"q": "Les grands magasins transforment le client en « visiteur » séduit par la mise en scène des vitrines.", "answer": true, "explanation": "Exemple du Bon Marché : théâtralisation de l'offre et achat-expérience."}, {"q": "Segmentation, ciblage et positionnement sont les concepts fondamentaux du marketing qui émerge entre 1920 et 1960.", "answer": true, "explanation": "Le marketing devient alors une discipline scientifique structurée autour de ces trois concepts."}, {"q": "Mai 68 marque l'apogée du consumérisme individualiste.", "answer": false, "explanation": "Mai 68 est une remise en cause de la société marchande. L'apogée individualiste correspond aux années 1980."}, {"q": "Pour Baudrillard, on consomme des signes plutôt que des objets.", "answer": true, "explanation": "« On ne consomme pas des objets, mais des signes » : la consommation est un langage social."}, {"q": "Pour Bourdieu, les goûts sont neutres et purement individuels.", "answer": false, "explanation": "Pour Bourdieu, les goûts sont socialement déterminés par l'habitus et reproduisent les inégalités de classe."}, {"q": "Veblen analyse la consommation ostentatoire comme un outil de distinction sociale.", "answer": true, "explanation": "Le luxe devient une performance sociale qui démontre publiquement le statut économique."}, {"q": "L'habitus est un ensemble de dispositions conscientes et choisies librement par l'individu.", "answer": false, "explanation": "L'habitus est acquis dans un milieu social et oriente les goûts de façon largement inconsciente."}, {"q": "Les quatre typologies (rationnel, émotionnel, zappeur, responsable) sont exclusives : chaque individu n'appartient qu'à une seule.", "answer": false, "explanation": "Elles ne sont pas exclusives : un individu combine plusieurs profils selon les contextes et produits."}, {"q": "Le consommateur zappeur se caractérise par une forte fidélité à ses marques.", "answer": false, "explanation": "Le zappeur change fréquemment de marques, avec une attention fragmentée."}, {"q": "Le consommateur responsable peut faire passer l'éthique avant le prix ou la praticité.", "answer": true, "explanation": "Il intègre écologie, social et éthique, parfois au détriment du prix ou de la praticité."}, {"q": "Le commerce équitable et la seconde main émergent comme pratiques alternatives dès la fin du XXe siècle.", "answer": true, "explanation": "Ces pratiques d'abord marginales annoncent les transformations du XXIe siècle."}, {"q": "Le consommateur du XXIe siècle est décrit comme cohérent et prévisible.", "answer": false, "explanation": "Il est paradoxal : responsable et impulsif, en quête d'authenticité mais influencé par les algorithmes."}, {"q": "Acheter local tout en commandant régulièrement sur Amazon illustre le paradoxe global vs local.", "answer": true, "explanation": "Tension entre marques mondiales accessibles et volonté de circuits courts."}, {"q": "L'économie circulaire privilégie l'achat systématique de produits neufs.", "answer": false, "explanation": "Elle privilégie réutilisation, réparation et recyclage (seconde main, Vinted, Leboncoin)."}, {"q": "L'enjeu contemporain est de concilier plaisir individuel, durabilité environnementale et justice sociale.", "answer": true, "explanation": "C'est l'enjeu formulé dans la synthèse du cours."}, {"q": "Un cadre qui publie ses voyages de luxe et collectionne les montres illustre bien la théorie de Veblen.", "answer": true, "explanation": "Consommation visible destinée à afficher un statut : consommation ostentatoire."}, {"q": "La segmentation consiste à choisir l'image que la marque veut occuper dans l'esprit des clients.", "answer": false, "explanation": "Ça, c'est le positionnement. La segmentation consiste à diviser le marché en groupes homogènes."}], "qcm": [{"q": "Quelle est l'idée centrale du cours ?", "options": ["Le consommateur agit toujours rationnellement", "Le consommateur est une construction sociale évolutive", "La publicité n'a aucune influence", "Tous les consommateurs ont les mêmes goûts"], "answer": [1], "explanation": "Le consommateur reflète les transformations économiques, technologiques et culturelles de son époque."}, {"q": "Quelles caractéristiques décrivent l'époque pré-industrielle ? (plusieurs réponses)", "options": ["Choix restreint de produits", "Relations directes artisans-acheteurs", "Publicité massive", "Commerce local et saisonnier"], "answer": [0, 1, 3], "explanation": "Il n'y a pas de publicité avant l'industrialisation."}, {"q": "Quels sont les trois moteurs de la consommation de masse (fin XIXe – début XXe) ?", "options": ["Industrialisation, grands magasins, publicité et marques", "Internet, smartphones, réseaux sociaux", "Mai 68, écologie, seconde main", "Artisanat, troc, marchés locaux"], "answer": [0], "explanation": "La production de masse, la mise en scène des grands magasins et la création du désir par la publicité."}, {"q": "Quel grand magasin parisien est cité dans le cours ?", "options": ["Les Galeries Lafayette", "Le Printemps", "Le Bon Marché", "La Samaritaine"], "answer": [2], "explanation": "Le Bon Marché est l'exemple du cours."}, {"q": "Quels facteurs expliquent l'émergence de la société de consommation (1920–1960) ? (plusieurs réponses)", "options": ["Croissance économique d'après-guerre", "Urbanisation accélérée", "Développement des médias de masse", "Recul du niveau de vie des classes moyennes"], "answer": [0, 1, 2], "explanation": "Le niveau de vie des classes moyennes s'élève, il ne recule pas."}, {"q": "Les trois concepts fondamentaux du marketing sont :", "options": ["Habitus, classe, distinction", "Segmentation, ciblage, positionnement", "Réparation, recyclage, sobriété", "Attention, intérêt, désir"], "answer": [1], "explanation": "Segmentation → ciblage → positionnement."}, {"q": "Quel auteur associer à la phrase « On ne consomme pas des objets, mais des signes » ?", "options": ["Pierre Bourdieu", "Thorstein Veblen", "Jean Baudrillard", "Benoît Heilbrunn"], "answer": [2], "explanation": "Baudrillard : la consommation comme langage social."}, {"q": "L'habitus de Bourdieu désigne :", "options": ["Une technique publicitaire", "Des dispositions durables acquises dans un milieu social qui orientent les goûts", "Une habitude d'achat en promotion", "Un label écologique"], "answer": [1], "explanation": "Dispositions durables et transposables, largement inconscientes."}, {"q": "La consommation ostentatoire selon Veblen vise à :", "options": ["Satisfaire un besoin vital", "Afficher son statut social par des achats visibles", "Réduire son empreinte carbone", "Comparer les prix"], "answer": [1], "explanation": "Le luxe comme performance sociale et outil de distinction."}, {"q": "Que dénonce Mai 68 ?", "options": ["L'insuffisance de la publicité", "L'aliénation par la consommation et la société marchande", "Le manque de grands magasins", "La disparition du commerce local"], "answer": [1], "explanation": "Critique radicale du consumérisme et des valeurs matérialistes."}, {"q": "Quelle figure symbolise les années 1980 dans le cours ?", "options": ["Le hippie", "Le yuppie", "Le zappeur", "L'artisan"], "answer": [1], "explanation": "Le yuppie : réussite sociale affichée par le luxe."}, {"q": "Quelles pratiques alternatives apparaissent avec la crise écologique ? (plusieurs réponses)", "options": ["Agriculture biologique", "Commerce équitable", "Seconde main", "Fast fashion"], "answer": [0, 1, 2], "explanation": "La fast fashion n'est pas une alternative responsable, au contraire."}, {"q": "Quel profil compare les prix et lit les avis avant d'acheter ?", "options": ["Émotionnel", "Zappeur", "Rationnel", "Responsable"], "answer": [2], "explanation": "Le rationnel planifie et optimise le rapport qualité-prix."}, {"q": "Le consommateur zappeur se caractérise par : (plusieurs réponses)", "options": ["Attention fragmentée", "Changement fréquent de marques", "Boulimie d'informations commerciales", "Fidélité absolue"], "answer": [0, 1, 2], "explanation": "Reflet de la culture numérique contemporaine."}, {"q": "Un étudiant commande sur UberEats, achète sur Vinted et Shein et suit des influenceurs TikTok. Quel(s) profil(s) mobilise-t-il ? (plusieurs réponses)", "options": ["Zappeur / hyperconnecté", "Émotionnel (achats compulsifs)", "Responsable sur certains achats (seconde main Vinted)", "Acheteur utilitaire pré-industriel"], "answer": [0, 1, 2], "explanation": "Profil paradoxal : Vinted relève de l'économie circulaire, Shein de l'impulsivité."}, {"q": "Une famille qui achète bio chez Biocoop, au marché local et refuse la fast fashion illustre :", "options": ["La consommation ostentatoire", "La consommation responsable", "Le consommateur zappeur", "L'acheteur utilitaire"], "answer": [1], "explanation": "Elle intègre des critères écologiques et éthiques. Une lecture bourdieusienne est aussi possible (habitus de classe)."}, {"q": "Quel paradoxe illustre une personne qui cherche des expériences « déconnectées » repérées sur Instagram ?", "options": ["Global vs local", "Hyperconnexion vs authenticité", "Accumulation vs sobriété", "Éthique vs impulsivité"], "answer": [1], "explanation": "Rechercher l'authentique tout en étant guidé par les algorithmes."}, {"q": "Quelles sont les caractéristiques du consommateur du XXIe siècle ? (plusieurs réponses)", "options": ["Hyperconnexion et parcours fragmenté", "Profil à la fois responsable et impulsif", "Tension entre liberté de choix et influence algorithmique", "Achat exclusivement local et saisonnier"], "answer": [0, 1, 2], "explanation": "Le local et saisonnier exclusif caractérise l'acheteur pré-industriel."}, {"q": "L'économie circulaire est incarnée dans le cours par :", "options": ["Amazon et Shein", "Vinted et Leboncoin", "Tesla et LinkedIn", "UberEats"], "answer": [1], "explanation": "Plateformes de seconde main : réutilisation des biens."}, {"q": "Quel est le grand enjeu de la consommation au XXIe siècle ?", "options": ["Supprimer les marques", "Revenir au commerce du XIXe siècle", "Concilier plaisir individuel, durabilité et justice sociale", "Maximiser l'accumulation de biens"], "answer": [2], "explanation": "Tension entre aspirations individuelles et impératifs collectifs."}], "open_questions": [{"question": "Pourquoi dit-on que le consommateur est une « construction sociale » ?", "answer": "**Définition** : une construction sociale est une réalité produite par la société et non une donnée naturelle.\n\n**Explication** : la figure du consommateur change selon les époques. Au XIXe siècle, l'acheteur utilitaire répond à des besoins concrets. Au XXe siècle, l'industrialisation, les grands magasins, la publicité et le marketing créent le consommateur moderne. Au XXIe siècle, il devient hyperconnecté et paradoxal.\n\n**Exemple** : on est passé du CD au streaming, du marché local au e-commerce, puis au retour du local et de la seconde main.\n\n**Conclusion** : il n'existe pas de nature consumériste universelle. Le consommateur est le miroir des valeurs et des contradictions de son époque."}, {"question": "Présentez les grandes étapes historiques de l'évolution du consommateur.", "answer": "1. **Jusqu'au XIXe siècle** : acheteur utilitaire. Achat de nécessité, local, sans publicité.\n2. **Fin XIXe – début XXe** : industrialisation, grands magasins (Le Bon Marché), publicité et marques. Naissance de la consommation de masse.\n3. **1920–1960** : société de consommation. Le marketing se structure (segmentation, ciblage, positionnement).\n4. **1968–2000** : critique de Mai 68, apogée individualiste des années 80, premiers doutes écologiques, alternatives (bio, équitable, seconde main).\n5. **XXIe siècle** : consommateur hyperconnecté, fragmenté et paradoxal."}, {"question": "Expliquez les théories de Baudrillard, Bourdieu et Veblen en donnant un exemple pour chacune.", "answer": "- **Baudrillard** : on consomme des **signes**. La consommation est un langage social. *Ex.* : porter une marque streetwear pour signifier son appartenance à une communauté.\n- **Bourdieu** : l'**habitus**, ce sont des dispositions acquises dans un milieu social qui orientent inconsciemment les goûts et reproduisent les inégalités. *Ex.* : fréquenter l'opéra ou les festivals de musique classique selon son origine sociale.\n- **Veblen** : la consommation **ostentatoire** affiche le statut. *Ex.* : exhiber une Rolex ou une Tesla sur les réseaux sociaux.\n\nPoint commun : tous dépassent l'analyse purement économique pour montrer la **fonction sociale** de la consommation."}, {"question": "Distinguez les consommateurs rationnel, émotionnel, zappeur et responsable.", "answer": "- **Rationnel** : compare, lit les avis, planifie, optimise le rapport qualité-prix. *Ex.* : comparer trois smartphones.\n- **Émotionnel** : coup de cœur, instinct, expérience sensorielle. *Ex.* : acheter un parfum dès la première odeur.\n- **Zappeur** : attention fragmentée, change souvent de marque. *Ex.* : passer d'une marque de vêtements à l'autre au gré des pubs.\n- **Responsable** : critères éthiques et écologiques. *Ex.* : acheter bio, local, de seconde main.\n\nCes profils **ne sont pas exclusifs** : ils se combinent selon les contextes."}, {"question": "Expliquez deux paradoxes du consommateur contemporain.", "answer": "**Éthique vs impulsivité** : le consommateur adhère sincèrement aux valeurs écologiques mais cède à l'achat impulsif favorisé par le digital (ex. défendre le climat et commander sur Shein).\n\n**Accumulation vs sobriété** : l'héritage du XXe siècle associe posséder et réussir, tandis que de nouveaux modèles valorisent le minimalisme et la décroissance (ex. suivre des comptes minimalistes tout en achetant des gadgets).\n\nAutres paradoxes possibles : global vs local, hyperconnexion vs authenticité."}, {"question": "Définissez la segmentation, le ciblage et le positionnement.", "answer": "- **Segmentation** : diviser le marché en groupes homogènes de consommateurs (critères démographiques, sociologiques, comportementaux).\n- **Ciblage** : choisir le ou les segments que l'entreprise veut atteindre.\n- **Positionnement** : définir la place et l'image que la marque veut occuper dans l'esprit des consommateurs ciblés, face aux concurrents.\n\n*Ex.* : une marque de cosmétiques segmente par âge et sensibilité écologique, cible les 25-35 ans urbains engagés, se positionne « clean beauty premium »."}, {"question": "Quel est l'enjeu principal de la consommation au XXIe siècle ? Argumentez.", "answer": "Concilier les **aspirations individuelles** (plaisir, bien-être, liberté de choix) avec les **impératifs collectifs** (durabilité environnementale, justice sociale).\n\nArguments : limites planétaires, essor de la consommation responsable et de l'économie circulaire, mais persistance des achats impulsifs et de l'influence algorithmique. Pour les marques : proposer une offre à la fois désirable et responsable (seconde main, réparation, transparence)."}, {"question": "En quoi les grands magasins ont-ils transformé l'acte d'achat ?", "answer": "Ils font passer l'achat du **besoin** à l'**expérience** : le client devient un visiteur séduit par la mise en scène (vitrines, abondance, théâtralisation). L'achat devient sensoriel et social. Ils préfigurent le marketing expérientiel actuel (concept stores, flagships)."}], "exercises": [{"title": "Cas 1 — Analyser un profil fictif (Activité 2 du cours)", "statement": "**Le statut social affiché** : cadre supérieur de 40 ans, propriétaire d'une Tesla, fréquente des restaurants étoilés, collectionne les montres de luxe et publie systématiquement ses voyages haut de gamme sur LinkedIn et Instagram.", "questions": ["Quelle théorie sociologique s'applique le mieux ? Justifiez.", "Quelle typologie moderne peut-on mobiliser ?", "Quelles tensions ou paradoxes ce profil peut-il révéler ?"], "answer": "1. **Veblen (consommation ostentatoire)** : les achats sont visibles et publiés pour démontrer un statut. **Baudrillard** aussi : la Tesla est un signe (modernité, écologie, réussite). **Bourdieu** possible : goûts « distingués » liés à l'habitus de classe supérieure.\n2. Typologie : plutôt **émotionnel** (plaisir, expérience gastronomique), avec une dimension **rationnelle** sur des achats patrimoniaux (montres qui prennent de la valeur).\n3. Paradoxe **éthique vs ostentation** : la Tesla affiche une image écologique, mais les voyages haut de gamme ont une forte empreinte carbone. Paradoxe **hyperconnexion vs authenticité** : vivre des expériences pour les publier."}, {"title": "Cas 2 — Les trois autres profils fictifs", "statement": "Analysez rapidement : (a) **l'hyperconnecté digital** (21 ans, UberEats, Vinted et Shein, influenceurs TikTok, shopping compulsif) ; (b) **la famille écologiquement responsable** (Biocoop, marché local, refus de la fast fashion, covoiturage) ; (c) **le consumériste impulsif** (25 ans, promos, Amazon, sneakers limitées, gadgets).", "questions": ["Associez à chaque profil une théorie et une typologie.", "Identifiez au moins un paradoxe par profil."], "answer": "**(a) Hyperconnecté** : Baudrillard (signes, tendances TikTok). Typologie **zappeur** et **émotionnel**. Paradoxe : Vinted (circulaire) et Shein (fast fashion) en même temps, donc éthique vs impulsivité.\n\n**(b) Famille responsable** : typologie **responsable**. Bourdieu : ce mode de vie peut refléter un habitus de classe moyenne ou supérieure diplômée (capital culturel). Paradoxe possible : vivre en périphérie implique de dépendre de la voiture, d'où le covoiturage.\n\n**(c) Consumériste impulsif** : typologie **émotionnel** et **zappeur**. Veblen ou Baudrillard pour les sneakers limitées (signe d'appartenance, rareté). Paradoxe accumulation vs sobriété, global (Amazon) vs local."}, {"title": "Cas 3 — Quand nos habitudes changent (Activité 3)", "statement": "Choisissez le domaine **musique** et analysez son évolution sur 20 ans.", "questions": ["Quelles sont les causes de cette évolution ?", "Quelles valeurs sociétales reflète-t-elle ?", "Quelles conséquences pour les marques et le marketing ?"], "answer": "**Évolution** : CD → téléchargement → streaming (Spotify, Deezer) → retour du vinyle.\n\n1. **Causes** : numérisation, smartphones, Internet haut débit, modèle de l'abonnement, algorithmes de recommandation.\n2. **Valeurs** : accès plutôt que possession, immédiateté, personnalisation, mais aussi recherche d'authenticité et d'objets symboliques (le vinyle, au sens de Baudrillard).\n3. **Conséquences** : marketing de la playlist et des algorithmes, influenceurs et TikTok comme prescripteurs, fidélisation par l'abonnement, éditions collector et merchandising pour monétiser le symbolique."}, {"title": "Cas 4 — Hier et aujourd'hui (Activité 1)", "statement": "Comparez une pratique historique (avant 1960) et une pratique contemporaine (après 2000).", "questions": ["Proposez un exemple par période avec un mot-clé.", "Expliquez en une phrase la rupture ou la continuité."], "answer": "**Avant 1960** : les vitrines du Bon Marché. Mot-clé : **théâtralisation**.\n**Après 2000** : un influenceur Instagram qui présente un produit. Mot-clé : **prescription digitale**.\n\n**Continuité** : dans les deux cas, on met en scène le produit pour créer le désir. **Rupture** : la mise en scène passe de l'espace physique à l'écran, personnalisée par les algorithmes, et le prescripteur devient un pair (l'influenceur) plutôt que l'enseigne."}], "resources": [{"label": "Vidéo — « Conso – La consommation dans le rétro » (Télé Matin)", "url": "https://youtu.be/7J80FLDvyzI"}, {"label": "Vidéo — Benoît Heilbrunn : « Le consommateur n'existe pas et le marketing ne prédit pas les achats »", "url": "https://www.youtube.com/watch?v=Rug-JHrrzBE"}]}]}, {"id": "english-business", "order": 3, "folder": "03. ENGLISH BUSSINESS", "title": "Business English — Global Launch Project", "short": "English", "teacher": "Evelise Guioto de Souza", "description": "Vocabulaire du business international, construit autour du Global Launch Project : analyse de marché, stratégie d'entrée, marketing, opérations et finance.", "key_dates": [{"date": "23 Nov 2026", "label": "Class 4 — Marketing Strategy + Book test 1"}, {"date": "18 Dec 2026", "label": "Oral Mid-Term (group research progress)"}, {"date": "12 Jan 2027", "label": "Written Quiz"}, {"date": "25 Mar 2027", "label": "Global Launch Board Game + Book test 2"}, {"date": "24 May 2027", "label": "Final Oral Presentation (~15 min)"}, {"date": "28 May 2027", "label": "Written Exam"}], "exam_info": "Written exams: **handwritten notes in a notebook allowed**, no screens, no printed material, no loose sheets. Content: grammar and vocabulary seen in class, **not limited to the words in the program**. Oral presentations are **graded individually** on grammar, vocabulary and pronunciation. Slides: keywords, numbers, charts and images only, **no sentences**. Reading is NOT oral production.", "courses": [{"id": "eng-00", "title": "Module 0 — Course rules, assessment & the Global Launch Project", "subtitle": "How the class works, how you are graded, what the project requires", "date": "01/10/2026", "status": "vu", "sources": ["English_Class_Rules_EN_FR.docx (2).pdf", "Global_Launch_Project_Guidelines_M1_2026-2027.docx (1).pdf", "M1MC_ESG_English Program 2026-2027 (1).pdf", "M1CM_2026-2027_Program.xlsx"], "objectives": ["Know the class rules and how written and oral assessments work.", "Understand the five parts of the Global Launch Project and its deliverables.", "Prepare an oral presentation that respects the rules (no reading, no text on slides)."], "summary": [{"title": "1. Course overview", "body": "- **Content**: grammar, vocabulary, projects (the **final presentation is GRADED**).\n- **Methodology**: explanations and practice, autonomy (projects, role play), **flipped classroom**, and **SPEAK ENGLISH**: ask your questions at the end of class.\n- **Grades**: **written** (in-class evaluations, book tests, quizzes) and **oral presentations**.\n- **Learn to learn**: take notes, build your own vocabulary list, always check the **pronunciation**, be smart with technology."}, {"title": "2. Assessment rules (very important)", "body": "| | Oral presentations | Written exams |\n|---|---|---|\n| Graded | **Individually** (no group grade) | Individually |\n| Criteria | **Grammar, vocabulary, pronunciation** | Grammar and vocabulary **seen in class**, not only the words in the program |\n| Allowed | Slides with **symbols, keywords, dates, figures, statistics** | **Handwritten notes in your notebook** |\n| Forbidden | **Reading a text**, full sentences on slides, phone, notes | **Any screen** (phone, computer, smartwatch), **printed material**, **loose sheets** |\n\n> Reading a text out loud is **NOT** oral production."}, {"title": "3. Flipped class & homework", "body": "- **Before class**: do the reading, get the main ideas, take notes (**quizzes in class**), learn the **target vocabulary**.\n- AI may be used to **simplify** a text that is really too hard, but **NOT to extract the main ideas or to translate**.\n- Assessments are in English: **there's no point in translating everything!** Prefer **definitions over translations**.\n- **Homework rhythm**: **45 minutes, 3 times a week** ✅, rather than 3 hours once a month ❌. Regularity beats intensity, like at the gym.\n- Classroom rules: **no phones, no computers**, unless the teacher asks.\n- *If ChatGPT does your work, the only one learning is AI, not you.*"}, {"title": "4. The Global Launch Project", "body": "Research a **real company** that expanded into a **new international market** and reconstruct **what actually happened**, using evidence. It's a **research project, not an invention**.\n\nExamples (not mandatory): Starbucks in China · IKEA in India · Tesla in Germany · Netflix in South Korea · Carrefour in Brazil. Pick a case with **enough public information in English**: that matters more than a famous name.\n\n| Part | Topic | Key vocabulary |\n|---|---|---|\n| 1 | **Market Analysis** | market size, target segment, market demand, competitor analysis, market share, entry barriers |\n| 2 | **Entry Strategy** | joint venture, acquisition, direct investment, strategic alliance, licensing/franchising, greenfield investment |\n| 3 | **Marketing Strategy** | positioning, product adaptation, pricing strategy, promotion mix, brand awareness, distribution channel, market segmentation |\n| 4 | **Operations & Supply Chain** | logistics, supply chain, local management, outsourcing, quality control, economies of scale |\n| 5 | **Financial Objectives & Conclusion** | break-even point, ROI, revenue forecast, profit margin, strategic objectives, cash flow |\n\n**Sources**: company reports, investor presentations, press releases, financial news (Reuters, FT, Bloomberg), case studies (Harvard, McKinsey, Statista), trade journals. **AI is a tool, NOT a source**: every fact must be traceable to a real document, with its link.\n\n**Deliverables**: list of links (in English) · **~15 min oral presentation** covering the 5 parts **in order** · visual support (PowerPoint, Prezi, Canva) showing your sources."}, {"title": "5. Useful phrases for your presentation", "body": "| Function | Phrases |\n|---|---|\n| Opening | *Good morning everyone. Today we're going to talk about…* / *Our case study is…* |\n| Structuring | *First of all… Then… After that… Finally…* / *Let's move on to part 2.* |\n| Showing data | *As you can see on this chart… / Sales rose by 12% / The market share dropped to…* |\n| Giving evidence | *According to Reuters… / The company's annual report states that…* |\n| Opinion | *In our view… / We believe the expansion was successful because…* |\n| Concluding | *To sum up… / Thank you for your attention. Do you have any questions?* |\n\n**Trend verbs**: rise / increase / grow ↗ · fall / decrease / decline / drop ↘ · remain stable / level off → · peak / reach a peak."}, {"title": "6. False friends French speakers often get wrong", "body": "| ❌ Don't say | ✅ Say | Why |\n|---|---|---|\n| *actually* (= actuellement) | **currently / nowadays** | *actually* = en fait |\n| *eventually* (= éventuellement) | **possibly** | *eventually* = finalement |\n| *informations* | **information** (uncountable) | no plural |\n| *concurrence* | **competition** | *competitor* = concurrent |\n| *benefit* (= bénéfice comptable) | **profit** | *benefit* = avantage |\n| *a formation* | **training** | |\n| *to assist to a meeting* | **to attend a meeting** | *to assist* = aider |\n| *a librairie* | **a bookshop** | *library* = bibliothèque |\n| *sensible* | **sensitive** | *sensible* = raisonnable |\n| *achieve* (= achever) | **finish / complete** | *achieve* = atteindre, réussir |"}], "key_points": ["Oral grade is individual: grammar, vocabulary, pronunciation.", "Slides: keywords, symbols, numbers, charts. No sentences. No reading.", "Written exams: handwritten notebook allowed; no screens, no printed material, no loose sheets.", "Written content: grammar and vocabulary seen in class, not only program words.", "Flipped class: read before class, learn target vocabulary; quizzes in class.", "AI may simplify a hard text, not extract main ideas or translate. AI is a tool, NOT a source.", "Homework: 45 min × 3 per week beats 3 h once a month.", "Project: a real company's real international expansion, 5 parts in order, ~15 min, sources with links."], "traps": ["« The project is a creative business plan » → NO: it's research on what really happened.", "ChatGPT is never a source to cite: every fact needs a traceable link.", "You may bring handwritten notes to the written exam, but only in a notebook (no loose sheets).", "Group project but individual grade."], "glossary": [{"term": "Flipped classroom", "definition": "You study the material (reading, vocabulary) before class; class time is for practice. FR : classe inversée."}, {"term": "Oral production", "definition": "Speaking spontaneously in English; reading a text aloud does not count. FR : production orale."}, {"term": "Deliverable", "definition": "A piece of work you must hand in or present. FR : livrable."}, {"term": "Source", "definition": "A traceable article, report or document supporting a fact. AI tools are not sources."}, {"term": "Case study", "definition": "In-depth analysis of a real company situation. FR : étude de cas."}, {"term": "Signposting", "definition": "Phrases that guide the audience through a presentation (first, then, let's move on to…)."}], "qcb": [{"q": "The oral presentation is graded as a group: everyone gets the same mark.", "answer": false, "explanation": "Presentations are graded individually; there is no group grade."}, {"q": "Your slides may contain keywords, figures and statistics, but not full sentences.", "answer": true, "explanation": "Symbols, keywords, dates, figures and charts are allowed; text is not."}, {"q": "Reading your notes aloud during the presentation counts as oral production.", "answer": false, "explanation": "Reading a text is NOT oral production. No reading during the presentation."}, {"q": "During written exams you may use handwritten notes kept in a notebook.", "answer": true, "explanation": "Only notes in your notebook: no loose sheets, no printed material, no screens."}, {"q": "The written exam only covers the words listed in the program.", "answer": false, "explanation": "It covers grammar and vocabulary seen in class, not limited to the program words."}, {"q": "You may use AI to translate the flipped-class reading into French.", "answer": false, "explanation": "AI may only simplify a text that is really too hard, not translate it or extract its main ideas."}, {"q": "ChatGPT can be cited as a source in the Global Launch Project.", "answer": false, "explanation": "AI tools are not sources: every fact must be traceable to a real article or report."}, {"q": "The project must present the five parts in order.", "answer": true, "explanation": "Market Analysis, Entry Strategy, Marketing Strategy, Operations & Supply Chain, Financial Objectives."}, {"q": "Studying 45 minutes three times a week is better than 3 hours once a month.", "answer": true, "explanation": "Regularity matters more than intensity."}, {"q": "Choosing a famous company is more important than having enough public information.", "answer": false, "explanation": "Enough public information in English matters more than fame."}, {"q": "The final presentation lasts approximately 15 minutes.", "answer": true, "explanation": "About 15 minutes, covering all five parts."}], "qcm": [{"q": "What is the oral grade based on? (several answers)", "options": ["Grammar", "Vocabulary", "Pronunciation", "The design of the slides"], "answer": [0, 1, 2], "explanation": "Oral production: grammar, vocabulary, pronunciation."}, {"q": "Which items are FORBIDDEN in the written exam? (several answers)", "options": ["Smartwatch", "Printed material", "Loose sheets of paper", "Your handwritten notebook"], "answer": [0, 1, 2], "explanation": "Only the handwritten notebook is allowed."}, {"q": "Which of these are acceptable sources for the project? (several answers)", "options": ["Company annual reports", "Reuters or Financial Times articles", "Harvard or McKinsey case studies", "A ChatGPT answer"], "answer": [0, 1, 2], "explanation": "AI is a tool, not a source."}, {"q": "What is the correct order of the five project parts?", "options": ["Marketing → Market Analysis → Finance → Entry → Operations", "Market Analysis → Entry Strategy → Marketing Strategy → Operations & Supply Chain → Financial Objectives", "Entry Strategy → Finance → Marketing → Market Analysis → Operations", "Operations → Marketing → Entry → Finance → Market Analysis"], "answer": [1], "explanation": "That's the required order."}, {"q": "Choose the correct sentence.", "options": ["We found many informations about IKEA.", "We found a lot of information about IKEA.", "We found an information about IKEA.", "We found much informations about IKEA."], "answer": [1], "explanation": "Information is uncountable: no plural, no « an »."}, {"q": "« Actuellement, Tesla produit en Allemagne. » The best translation is:", "options": ["Actually, Tesla produces in Germany.", "Currently, Tesla produces in Germany.", "Eventually, Tesla produces in Germany.", "Actively, Tesla produces in Germany."], "answer": [1], "explanation": "Actually = en fait ; currently = actuellement."}, {"q": "Which word means « concurrence » in a business context?", "options": ["Concurrence", "Competition", "Competence", "Concourse"], "answer": [1], "explanation": "Competition ; a competitor = un concurrent."}, {"q": "What is the deliverable list for the project? (several answers)", "options": ["A list of links to every source used (in English)", "A ~15-minute oral presentation", "Visual support showing your sources", "A 30-page written report"], "answer": [0, 1, 2], "explanation": "No written report is required."}, {"q": "Which phrase is best to move to the next part of your presentation?", "options": ["Let's move on to the entry strategy.", "I read now the next slide.", "Now I am going to read you part 2.", "Next informations are…"], "answer": [0], "explanation": "Signposting phrase; never « read »."}, {"q": "« Sales went from 10 to 15 million. » Which verbs describe this trend? (several answers)", "options": ["Sales rose", "Sales increased", "Sales declined", "Sales grew"], "answer": [0, 1, 3], "explanation": "Rise / increase / grow ↗ ; decline ↘."}], "open_questions": [{"question": "Explain in English the main rules for the final oral presentation.", "answer": "The presentation lasts about **15 minutes** and covers the **five parts in order**. It is **graded individually** on **grammar, vocabulary and pronunciation**. **Reading is not allowed**: reading a text is not oral production. Slides may only contain **keywords, symbols, numbers, charts and images**, never full sentences, and must show the **links to the real sources**."}, {"question": "Present your Global Launch Project case in three sentences (model answer).", "answer": "*Model:* « Our case study is **IKEA's expansion into India**, which opened its first store in **Hyderabad in 2018**. We will analyse the **market**, IKEA's **entry strategy** through a **wholly-owned subsidiary**, its **product and pricing adaptation**, its **local sourcing**, and its **financial objectives**. Finally, we will explain why we believe the expansion has been **partly successful**. »\n\n*(Check every fact in your sources.)*"}], "exercises": [{"title": "Correct the mistakes", "statement": "Correct this student's slide notes: « Actually, the concurrence in China is very strong. We have many informations about the benefits of Starbucks. Eventually they will open 500 stores. »", "questions": ["Rewrite the sentences correctly."], "answer": "« **Currently**, the **competition** in China is very strong. We have **a lot of information** about Starbucks' **profits**. **Possibly** (or: *They may / plan to*) open 500 stores. »\n\nIf *eventually* meant « finalement », it's correct: « Eventually, they opened 500 stores. »"}], "resources": []}, {"id": "eng-01", "title": "Class 2 — Market Analysis", "subtitle": "Market size, target segment, demand, competitors, market share, entry barriers", "date": "14/10/2026", "status": "vu", "sources": ["M1CM_2026-2027_Program.xlsx", "Global_Launch_Project_Guidelines (Part 1)"], "objectives": ["Master the six Market Analysis keywords and use them in sentences.", "Answer project questions 1–6 for your company.", "Know the six popular market entry types from the reading (Shopify)."], "summary": [{"title": "1. Target vocabulary — Market Analysis", "body": "| Term | Definition | FR |\n|---|---|---|\n| **Market size** | Total value (or volume) of sales in a market over a period | taille du marché |\n| **Target segment** | The specific group of customers a company chooses to serve | segment cible |\n| **Market demand** | How much customers want and are able to buy a product | demande du marché |\n| **Competitor analysis** | Study of rivals' strengths, weaknesses, prices and positioning | analyse concurrentielle |\n| **Market share** | A company's sales as a percentage of total market sales | part de marché |\n| **Entry barriers** | Obstacles that make it hard to enter a market (regulation, high costs, strong brands, culture, tariffs) | barrières à l'entrée |"}, {"title": "2. Project questions — Part 1", "body": "1. How big is the target market (**market size**)?\n2. Who is the **target segment**?\n3. What evidence shows **market demand**?\n4. Who are the main competitors (**competitor analysis**)?\n5. What **market share** did the company aim for or achieve?\n6. What **entry barriers** did it face?"}, {"title": "3. Useful formulas & collocations", "body": "- **Market share (%)** = company sales ÷ total market sales × 100\n- *The market is worth $X billion* · *The market is growing at X% a year* · *to gain / lose / increase market share* · *to target young urban professionals* · *to face / overcome / lower entry barriers* · *demand for coffee is rising*.\n\n*Example*: if the Indian furniture market is worth $20 bn and IKEA sells $200 m, IKEA's market share = 200 ÷ 20,000 × 100 = **1%**."}, {"title": "4. Reading — 6 popular types of market entry strategies (Shopify)", "body": "| Type | Meaning | Risk / control |\n|---|---|---|\n| **Exporting** | Selling products made at home to a foreign market (directly or via intermediaries) | Low risk, low control |\n| **Licensing** | Allowing a foreign company to use your intellectual property (brand, patent) in exchange for **royalties** | Low cost, limited control |\n| **Franchising** | Licensing a **whole business model** (brand + processes); franchisee pays fees and royalties (e.g. McDonald's) | Fast growth, moderate control |\n| **Acquisitions** | **Buying an existing local company** | Fast access, high cost |\n| **Joint ventures** | Creating a business **co-owned with a local partner**, sharing risks, costs and local knowledge | Shared control |\n| **New product development** | Creating new products tailored to the new market | Costly, can fit local needs |\n\n*Summary written from the course reading list; read the original article for details.*"}], "key_points": ["Market size = total value of sales in a market.", "Target segment = the group of customers a company chooses to serve.", "Market demand = how much customers want and can buy.", "Competitor analysis = studying rivals.", "Market share = company sales ÷ market sales × 100.", "Entry barriers = regulation, costs, strong local brands, culture, tariffs.", "Entry types: exporting, licensing, franchising, acquisitions, joint ventures, new product development."], "traps": ["Market size ≠ market share: size is the whole pie, share is your slice.", "Target segment ≠ market segmentation: segmentation divides the market, the target is the chosen group.", "Licensing (one asset: brand or patent) ≠ franchising (a whole business model)."], "glossary": [{"term": "Market size", "definition": "Total value or volume of sales in a market over a period. FR : taille du marché."}, {"term": "Target segment", "definition": "The specific group of customers a company chooses to serve. FR : segment cible."}, {"term": "Market demand", "definition": "The quantity of a product customers want and can afford to buy. FR : demande."}, {"term": "Competitor analysis", "definition": "Evaluation of rivals' strengths, weaknesses, prices and strategies. FR : analyse concurrentielle."}, {"term": "Market share", "definition": "Percentage of total market sales held by one company. FR : part de marché."}, {"term": "Entry barriers", "definition": "Obstacles preventing or slowing a company's entry into a market. FR : barrières à l'entrée."}, {"term": "Exporting", "definition": "Selling domestically produced goods to a foreign market."}, {"term": "Royalties", "definition": "Payments made to the owner of a brand or patent for the right to use it. FR : redevances."}, {"term": "Tariff", "definition": "A tax on imported goods. FR : droit de douane."}], "qcb": [{"q": "Market share is the total value of all sales in a market.", "answer": false, "explanation": "That's market size. Market share is one company's percentage of the market."}, {"q": "High import tariffs can be an entry barrier.", "answer": true, "explanation": "Regulations, tariffs, costs and strong local brands are typical entry barriers."}, {"q": "A target segment is the group of customers a company chooses to serve.", "answer": true, "explanation": "Correct definition."}, {"q": "Competitor analysis means studying your own employees.", "answer": false, "explanation": "It means studying your rivals."}, {"q": "If a company sells $50 m in a $1 bn market, its market share is 5%.", "answer": true, "explanation": "50 ÷ 1,000 × 100 = 5%."}, {"q": "Exporting is generally the lowest-risk entry mode.", "answer": true, "explanation": "Low investment abroad, but also low control."}, {"q": "Franchising means buying an existing local company.", "answer": false, "explanation": "That's an acquisition. Franchising licenses a whole business model."}, {"q": "In a joint venture, the company shares ownership with a partner.", "answer": true, "explanation": "Risks, costs and local knowledge are shared."}, {"q": "Licensing usually involves the payment of royalties.", "answer": true, "explanation": "The licensee pays royalties to use the brand or patent."}, {"q": "Market demand only measures what customers want, not what they can afford.", "answer": false, "explanation": "Demand = willingness AND ability to buy."}], "qcm": [{"q": "« The Chinese coffee market is worth $15 billion. » This sentence describes:", "options": ["Market share", "Market size", "Entry barriers", "Target segment"], "answer": [1], "explanation": "The total value of the market."}, {"q": "Which are examples of entry barriers? (several answers)", "options": ["Strict government regulation", "Strong local competitors", "High start-up costs", "A large target segment"], "answer": [0, 1, 2], "explanation": "A large segment is an opportunity, not a barrier."}, {"q": "Choose the correct collocation:", "options": ["to win market share", "to gain market share", "to make market share", "to do market share"], "answer": [1], "explanation": "gain / increase / lose market share."}, {"q": "Starbucks targeted young urban middle-class professionals in China. This is its:", "options": ["Market size", "Target segment", "Market share", "Entry barrier"], "answer": [1], "explanation": "The chosen group of customers."}, {"q": "Which entry mode means allowing a foreign firm to use your patent for royalties?", "options": ["Exporting", "Licensing", "Acquisition", "Joint venture"], "answer": [1], "explanation": "Licensing = use of intellectual property."}, {"q": "McDonald's opening restaurants run by local owners who pay fees is an example of:", "options": ["Franchising", "Exporting", "Greenfield investment", "Market demand"], "answer": [0], "explanation": "The franchisee uses the full business model."}, {"q": "What evidence can show market demand? (several answers)", "options": ["Growing sales in the category", "Surveys of consumer interest", "Rising middle-class income", "The CEO's favourite colour"], "answer": [0, 1, 2], "explanation": "Data on sales, consumers and purchasing power."}, {"q": "Company A: $300 m sales; total market: $6 bn. Market share =", "options": ["0.5%", "5%", "50%", "20%"], "answer": [1], "explanation": "300 ÷ 6,000 × 100 = 5%."}, {"q": "Which entry mode gives FAST access to customers but at HIGH cost?", "options": ["Exporting", "Licensing", "Acquisition", "New product development"], "answer": [2], "explanation": "Buying an existing company is fast but expensive."}, {"q": "Fill in: « Netflix had to ______ strong local competitors in South Korea. »", "options": ["face", "do", "make", "take"], "answer": [0], "explanation": "to face competitors / barriers."}], "open_questions": [{"question": "Define market size and market share and explain the difference with an example.", "answer": "**Market size** is the total value of sales in a market (e.g. the German EV market is worth €X bn). **Market share** is the percentage of that market held by one company (e.g. Tesla holds 15% of the German EV market). Size is the **whole pie**; share is the company's **slice**."}, {"question": "What entry barriers might a Western retailer face in India?", "answer": "**Regulatory barriers** (foreign direct investment rules, local sourcing requirements), **cultural barriers** (different tastes, family-run local shops), **economic barriers** (lower average purchasing power, price sensitivity), **logistics barriers** (infrastructure), and **strong local competitors**. *Example: IKEA had to source a share of its products locally to meet Indian FDI rules (check this in your sources).*"}], "exercises": [{"title": "Apply Part 1 to your company", "statement": "Choose your project company and write one sentence per keyword.", "questions": ["market size", "target segment", "market demand", "competitor analysis", "market share", "entry barriers"], "answer": "*Model (Starbucks in China, check the figures in your sources):*\n- **Market size**: « China's coffee market is worth several billion dollars and is growing fast. »\n- **Target segment**: « Starbucks targeted young, urban, middle-class consumers. »\n- **Market demand**: « Coffee consumption per person is low but rising quickly, especially among young people. »\n- **Competitor analysis**: « Its main competitors include Luckin Coffee and local tea chains. »\n- **Market share**: « Starbucks was the market leader but has lost market share to Luckin. »\n- **Entry barriers**: « The main barriers were a tea-drinking culture and the need for local partners. »"}], "resources": [{"label": "Reading — Market Entry Strategy Guide: 6 Ways to Enter New Markets (Shopify) — section « Popular types of market entry strategies »", "url": "https://www.shopify.com/nz/blog/market-entry-strategy"}]}, {"id": "eng-02", "title": "Class 3 — Market Entry Strategy", "subtitle": "Joint venture, acquisition, direct investment, strategic alliance, licensing/franchising, greenfield", "date": "16/10/2026", "status": "vu", "sources": ["M1CM_2026-2027_Program.xlsx", "Global_Launch_Project_Guidelines (Part 2)"], "objectives": ["Identify your company's market entry strategy and apply the concepts.", "Distinguish greenfield vs brownfield (acquisition) direct investment.", "Understand how businesses adapt the marketing mix for international audiences (reading)."], "summary": [{"title": "1. Target vocabulary — Entry Strategy", "body": "| Term | Definition | FR |\n|---|---|---|\n| **Joint venture (JV)** | A new business **jointly owned** by two or more companies (often a foreign firm and a local partner) | coentreprise |\n| **Acquisition** | **Buying** an existing company (or a controlling stake) | acquisition / rachat |\n| **Direct investment (FDI)** | Investing money directly in operations abroad (factories, stores, subsidiaries) | investissement direct (IDE) |\n| **Strategic alliance** | **Cooperation agreement** between independent companies **without creating a new company** | alliance stratégique |\n| **Licensing / franchising** | Selling the right to use a brand, patent or whole business model for fees and royalties | licence / franchise |\n| **Greenfield investment** | Direct investment that **builds new operations from scratch** | investissement *greenfield* (création ex nihilo) |\n\n**Greenfield vs brownfield**: if it's direct investment, did the company **build from scratch** (greenfield) or **buy an existing business** (acquisition, sometimes called **brownfield**)?"}, {"title": "2. Project questions — Part 2", "body": "7. Which entry strategy did the company use?\n8. If direct investment: **greenfield** or **acquisition (brownfield)**?\n9. Who were the local or international **partners**, and what type of **agreement** did they have?"}, {"title": "3. Comparing entry modes", "body": "| Mode | Control | Investment / risk | Speed | Example |\n|---|---|---|---|---|\n| Licensing / franchising | Low–medium | Low | Fast | McDonald's franchises |\n| Strategic alliance | Shared | Low–medium | Fast | Airline alliances (Star Alliance) |\n| Joint venture | Shared | Medium | Medium | Starbucks' early JVs in China |\n| Acquisition | High | High | Fast | Walmart buying Flipkart in India (2018) |\n| Greenfield | **Full** | **Highest** | **Slow** | Tesla's Gigafactory near Berlin (Grünheide) |\n\n**Rule of thumb**: the more **control** you want, the more **investment and risk** you accept."}, {"title": "4. Reading — Adapting the marketing mix for international audiences (TutorChase)", "body": "Companies decide between **standardisation** (same mix everywhere: economies of scale, consistent brand) and **adaptation** (adjusting to local culture, laws, income). The middle way is called **glocalisation** (« think global, act local »).\n\n| 4P | Typical adaptations |\n|---|---|\n| **Product** | Local tastes, sizes, ingredients, regulations, language on packaging (McDonald's McAloo Tikki in India, no beef) |\n| **Price** | Local purchasing power, currency, taxes, competitors' prices |\n| **Place** | Local distribution channels and partners, retail habits (markets vs malls vs online) |\n| **Promotion** | Language, cultural values, humour, media habits, local celebrities, legal limits on advertising |\n\n*Summary written from the course reading list; read the original article for details.*"}], "key_points": ["JV = new company jointly owned; strategic alliance = cooperation without a new company.", "Acquisition = buying an existing business (brownfield); greenfield = building from scratch.", "Direct investment (FDI) can be greenfield or acquisition.", "Licensing = rights to a brand or patent; franchising = whole business model; both pay royalties.", "More control means more investment and more risk.", "Standardisation vs adaptation of the 4Ps; glocalisation = think global, act local."], "traps": ["Joint venture ≠ strategic alliance: only the JV creates a new jointly-owned entity.", "Greenfield = from scratch; brownfield = existing business or facilities.", "Acquisition is a form of direct investment, not an alternative to it."], "glossary": [{"term": "Joint venture", "definition": "A business entity created and jointly owned by two or more companies. FR : coentreprise."}, {"term": "Acquisition", "definition": "Purchase of an existing company or of a controlling stake in it. FR : rachat."}, {"term": "Direct investment (FDI)", "definition": "Investment by a company in operations it controls in another country. FR : investissement direct à l'étranger."}, {"term": "Strategic alliance", "definition": "Agreement between independent firms to cooperate (share resources, knowledge, distribution) without forming a new company."}, {"term": "Licensing", "definition": "Granting the right to use intellectual property (brand, patent, technology) in exchange for royalties."}, {"term": "Franchising", "definition": "Granting the right to operate a whole business model under a brand, against fees and royalties."}, {"term": "Greenfield investment", "definition": "Building new facilities from scratch in a foreign country."}, {"term": "Brownfield investment", "definition": "Investing by buying or leasing existing facilities or companies."}, {"term": "Subsidiary", "definition": "A company controlled by a parent company. FR : filiale."}, {"term": "Stake", "definition": "A share of ownership in a company. FR : participation."}, {"term": "Glocalisation", "definition": "Combining a global brand strategy with local adaptation."}], "qcb": [{"q": "A greenfield investment means buying an existing local company.", "answer": false, "explanation": "Greenfield = building from scratch. Buying an existing company = acquisition (brownfield)."}, {"q": "A joint venture creates a new business owned by two or more partners.", "answer": true, "explanation": "That's what distinguishes it from a simple alliance."}, {"q": "A strategic alliance always creates a new legal company.", "answer": false, "explanation": "An alliance is a cooperation agreement without a new entity."}, {"q": "Greenfield investment gives the company full control but requires high investment.", "an
