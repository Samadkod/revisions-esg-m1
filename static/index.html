swer": true, "explanation": "Maximum control, maximum cost and risk, slow."}, {"q": "Franchising is a low-investment way to expand quickly.", "answer": true, "explanation": "Franchisees invest their own money."}, {"q": "Acquisition is a type of direct investment.", "answer": true, "explanation": "FDI can be greenfield or by acquisition."}, {"q": "Standardisation means adapting every element of the marketing mix to each country.", "answer": false, "explanation": "That's adaptation. Standardisation = the same mix everywhere."}, {"q": "Selling vegetarian burgers in India is an example of product adaptation.", "answer": true, "explanation": "Adapting the product to local culture and religion."}, {"q": "Glocalisation means « think global, act local ».", "answer": true, "explanation": "A global brand with local adaptation."}, {"q": "Licensing gives the licensor strong control over how the licensee runs its business.", "answer": false, "explanation": "Licensing offers limited control."}], "qcm": [{"q": "Tesla built a brand-new factory near Berlin. This is:", "options": ["A joint venture", "A greenfield investment", "Licensing", "An acquisition"], "answer": [1], "explanation": "New operations built from scratch."}, {"q": "Walmart bought a majority stake in Flipkart (India). This is:", "options": ["An acquisition", "Franchising", "Exporting", "A strategic alliance"], "answer": [0], "explanation": "Buying an existing company."}, {"q": "Two companies share distribution networks without creating a new firm. This is:", "options": ["A joint venture", "A strategic alliance", "Greenfield", "Licensing"], "answer": [1], "explanation": "Cooperation without a new entity."}, {"q": "Which modes involve royalties? (several answers)", "options": ["Licensing", "Franchising", "Greenfield investment", "Acquisition"], "answer": [0, 1], "explanation": "The licensee or franchisee pays royalties."}, {"q": "Which mode offers the MOST control?", "options": ["Licensing", "Strategic alliance", "Joint venture", "Greenfield investment (wholly owned)"], "answer": [3], "explanation": "A wholly owned subsidiary built from scratch."}, {"q": "Why do companies choose a joint venture with a local partner? (several answers)", "options": ["Access to local knowledge and networks", "Sharing risks and costs", "Sometimes required by local law", "To keep 100% of the profits"], "answer": [0, 1, 2], "explanation": "In a JV, profits are shared."}, {"q": "Which of the 4Ps does « using local celebrities in ads » adapt?", "options": ["Product", "Price", "Place", "Promotion"], "answer": [3], "explanation": "Promotion adapts language, culture and media."}, {"q": "Adjusting prices to local purchasing power adapts:", "options": ["Product", "Price", "Place", "Promotion"], "answer": [1], "explanation": "Price."}, {"q": "Which are advantages of standardisation? (several answers)", "options": ["Economies of scale", "Consistent global brand image", "Lower costs", "Perfect fit with every local culture"], "answer": [0, 1, 2], "explanation": "A perfect local fit is the advantage of adaptation."}, {"q": "Fill in: « The company ______ a 51% stake in the local firm. »", "options": ["acquired", "franchised", "allied", "greenfielded"], "answer": [0], "explanation": "to acquire a stake."}], "open_questions": [{"question": "Explain the difference between a joint venture and a strategic alliance, with examples.", "answer": "A **joint venture** creates a **new company jointly owned** by the partners, who share capital, risks and profits (e.g. a foreign carmaker and a Chinese partner creating a jointly owned manufacturing company). A **strategic alliance** is a **cooperation agreement** between independent companies **without a new entity** (e.g. airlines in Star Alliance sharing flights and lounges). The JV is deeper and harder to exit."}, {"question": "Greenfield or acquisition: what are the pros and cons of each?", "answer": "**Greenfield**: + full control, modern facilities designed to your standards, brand consistency; − slow, expensive, high risk, no local network at the start.\n**Acquisition (brownfield)**: + fast market access, existing customers, staff, brand and distribution; − high price, integration problems, cultural clashes, hidden liabilities."}], "exercises": [{"title": "Identify the entry strategy", "statement": "Name the entry mode: (a) IKEA opens its own store built from scratch in Hyderabad; (b) a hotel chain lets local owners run hotels under its brand; (c) a Western bank buys 60% of a local bank; (d) two tech firms agree to share R&D without merging.", "questions": ["Give the mode and justify in one sentence."], "answer": "(a) **Greenfield direct investment**: a new store built from scratch and wholly owned.\n(b) **Franchising** (or management contract): local owners use the brand and model and pay fees.\n(c) **Acquisition** (brownfield): purchase of a controlling stake in an existing company.\n(d) **Strategic alliance**: cooperation without creating a new company."}], "resources": [{"label": "Reading — How do businesses adjust their marketing mix for international audiences? (TutorChase)", "url": "https://www.tutorchase.com/answers/ib/business-management/how-do-businesses-adjust-their-marketing-mix-for-international-audiences"}]}, {"id": "eng-03", "title": "Class 4 — Marketing Strategy (à venir)", "subtitle": "Positioning, product adaptation, pricing, promotion mix, brand awareness, distribution, segmentation", "date": "23/11/2026", "status": "a_venir", "sources": ["M1CM_2026-2027_Program.xlsx", "Global_Launch_Project_Guidelines (Part 3)"], "objectives": ["Prepare in advance: master the seven Marketing Strategy keywords.", "Answer project questions 10–16 for your company.", "Prepare for Book test 1 (same date)."], "summary": [{"title": "1. Target vocabulary — Marketing Strategy", "body": "| Term | Definition | FR |\n|---|---|---|\n| **Positioning** | The place a brand wants to occupy in customers' minds compared with competitors | positionnement |\n| **Product adaptation** | Changing a product to fit local tastes, needs or regulations | adaptation du produit |\n| **Pricing strategy** | The method used to set prices (premium, penetration, skimming, competitive) | stratégie de prix |\n| **Promotion mix** | The combination of advertising, PR, sales promotion, digital, events, personal selling | mix promotionnel / communication |\n| **Brand awareness** | How well customers know and recognise a brand | notoriété |\n| **Distribution channel** | The route a product takes to reach customers (own stores, retailers, online, marketplaces) | canal de distribution |\n| **Market segmentation** | Dividing a market into groups of customers with similar characteristics | segmentation |"}, {"title": "2. Pricing strategies to know", "body": "| Strategy | Idea | Example |\n|---|---|---|\n| **Premium pricing** | High price to signal quality and status | Starbucks, Apple |\n| **Penetration pricing** | Low price at launch to win market share fast | A new streaming service at €1 for the first month |\n| **Price skimming** | High launch price, then lowered over time | New smartphones |\n| **Competitive pricing** | Price aligned with competitors | Supermarkets |"}, {"title": "3. Project questions — Part 3", "body": "10. How did the company **position** itself? 11. What **product adaptation**? 12. What **pricing strategy**? 13. What made up its **promotion mix**? 14. How did it build **brand awareness**? 15. Which **distribution channel(s)**? 16. How did it **segment** the market?"}, {"title": "4. Reading for next class — Global supply chain management tips (Travelers)", "body": "Typical themes of this kind of article, useful for Part 4: **map** your supply chain, **diversify suppliers** to reduce dependency, assess **risks** (geopolitical, natural disasters, transport disruption), know **customs and trade regulations**, use **technology for visibility**, communicate with partners, protect cargo with **insurance**, keep **buffer stock**.\n\n*Read the original article: this is a general preparation summary.*"}], "key_points": ["Positioning = place in the customer's mind versus competitors.", "Product adaptation = local tastes, needs, regulations.", "Pricing: premium, penetration, skimming, competitive.", "Promotion mix = advertising, PR, sales promotion, digital, events, personal selling.", "Brand awareness = recognition of the brand.", "Distribution channel = the route to the customer.", "Segmentation divides; targeting chooses; positioning places."], "traps": ["Brand awareness (notoriété) ≠ brand image (perception, qualité de l'image).", "Penetration pricing (low price at launch) ≠ skimming (high price at launch)."], "glossary": [{"term": "Positioning", "definition": "The place a brand occupies in consumers' minds relative to competitors."}, {"term": "Product adaptation", "definition": "Modifying a product for local tastes, needs or regulations."}, {"term": "Pricing strategy", "definition": "The approach used to set prices (premium, penetration, skimming, competitive)."}, {"term": "Promotion mix", "definition": "The combination of communication tools: advertising, PR, sales promotion, digital, events, personal selling."}, {"term": "Brand awareness", "definition": "The extent to which consumers recognise and remember a brand. FR : notoriété."}, {"term": "Distribution channel", "definition": "The path through which a product reaches the final customer."}, {"term": "Market segmentation", "definition": "Dividing a market into distinct groups of buyers with similar needs or characteristics."}, {"term": "Penetration pricing", "definition": "Setting a low initial price to gain market share quickly."}, {"term": "Price skimming", "definition": "Setting a high initial price, then lowering it over time."}], "qcb": [{"q": "Penetration pricing means launching a product at a high price.", "answer": false, "explanation": "Penetration = low price at launch. High price at launch = skimming."}, {"q": "Brand awareness measures how well customers recognise a brand.", "answer": true, "explanation": "FR : notoriété."}, {"q": "The promotion mix includes advertising, PR and events.", "answer": true, "explanation": "Plus sales promotion, digital and personal selling."}, {"q": "Positioning is the same thing as market segmentation.", "answer": false, "explanation": "Segmentation divides the market; positioning defines the brand's place in customers' minds."}, {"q": "Selling through an online marketplace is a distribution channel.", "answer": true, "explanation": "A route to reach customers."}, {"q": "Starbucks uses a premium pricing strategy.", "answer": true, "explanation": "High prices that signal quality and experience."}, {"q": "Product adaptation can be required by local regulations.", "answer": true, "explanation": "E.g. labelling or ingredient rules."}, {"q": "Sponsoring a local football club is part of the distribution strategy.", "answer": false, "explanation": "It's part of the promotion mix (sponsorship, PR)."}], "qcm": [{"q": "« Netflix produced Korean dramas for the local market. » This illustrates:", "options": ["Product adaptation", "Penetration pricing", "Outsourcing", "Market size"], "answer": [0], "explanation": "Content adapted to local tastes."}, {"q": "Which are part of the promotion mix? (several answers)", "options": ["TV advertising", "Influencer campaigns", "Press releases (PR)", "Warehouse location"], "answer": [0, 1, 2], "explanation": "Warehouse location relates to logistics."}, {"q": "A company launches at a low price to win customers quickly. Its strategy is:", "options": ["Premium pricing", "Price skimming", "Penetration pricing", "Cost-plus pricing"], "answer": [2], "explanation": "Low entry price to gain share."}, {"q": "« IKEA wants to be seen as affordable, Scandinavian and family-friendly. » This is its:", "options": ["Positioning", "Distribution channel", "Market share", "Supply chain"], "answer": [0], "explanation": "The image it wants in customers' minds."}, {"q": "Which criteria can be used for market segmentation? (several answers)", "options": ["Age", "Income", "Lifestyle", "The company's tax rate"], "answer": [0, 1, 2], "explanation": "Demographic, socio-economic, psychographic criteria."}, {"q": "Fill in: « The campaign helped ______ brand awareness among students. »", "options": ["raise", "rise", "arise", "grow up"], "answer": [0], "explanation": "to raise (transitive) awareness; « rise » is intransitive."}, {"q": "Which is a distribution channel?", "options": ["A flagship store", "A TV spot", "A press release", "A logo"], "answer": [0], "explanation": "A physical point of sale."}, {"q": "High launch price for a new smartphone, then lowered months later:", "options": ["Penetration", "Skimming", "Competitive pricing", "Discounting"], "answer": [1], "explanation": "Price skimming."}], "open_questions": [{"question": "Describe the marketing strategy of a company entering a foreign market, using at least five target words.", "answer": "*Model (Starbucks in China)*: Starbucks used **premium positioning** as a « third place » between home and work. It made **product adaptations** (tea-based drinks, mooncakes, local flavours) and kept a **premium pricing strategy**. Its **promotion mix** relied on store design, digital partnerships (Alibaba, WeChat) and social media to build **brand awareness**. Its main **distribution channels** were company-operated stores plus delivery apps. It **segmented** the market by income and lifestyle, targeting young urban professionals."}], "exercises": [{"title": "Apply Part 3 to your company", "statement": "For your project company, answer questions 10–16 in English, one or two sentences each.", "questions": ["positioning", "product adaptation", "pricing strategy", "promotion mix", "brand awareness", "distribution channel", "market segmentation"], "answer": "Use the model in the open question above. Each answer must be backed by a **source with a link**, and remember: keywords only on slides."}], "resources": [{"label": "Reading — Global Supply Chain Management Tips (Travelers)", "url": "https://www.travelers.com/resources/supply-chain-management/global-supply-chain-management-tips"}]}, {"id": "eng-04", "title": "Class 7 — Operations & Supply Chain (à venir, S2)", "subtitle": "Logistics, supply chain, local management, outsourcing, quality control, economies of scale", "date": "03/03/2027", "status": "a_venir", "sources": ["M1CM_2026-2027_Program.xlsx", "Global_Launch_Project_Guidelines (Part 4)"], "objectives": ["Prepare in advance: master the six Operations & Supply Chain keywords.", "Answer project questions 17–22.", "Understand break-even analysis (reading for the next class)."], "summary": [{"title": "1. Target vocabulary — Operations & Supply Chain", "body": "| Term | Definition | FR |\n|---|---|---|\n| **Logistics** | Planning and managing the movement and storage of goods | logistique |\n| **Supply chain** | The whole network from raw materials to the final customer (suppliers, factories, warehouses, transport, retailers) | chaîne d'approvisionnement |\n| **Local management** | Managers hired in the host country rather than sent from headquarters (expatriates) | management local |\n| **Outsourcing** | Contracting another company to perform part of your operations | externalisation / sous-traitance |\n| **Quality control** | Checking that products or services meet standards | contrôle qualité |\n| **Economies of scale** | Lower cost per unit as production volume increases | économies d'échelle |"}, {"title": "2. Project questions — Part 4", "body": "17. How did the company manage **logistics**? 18. Was the **supply chain** local, regional or international? 19. **Local management** or managers from **headquarters**? 20. Did it **outsource** anything? What, and why? 21. How did it ensure **quality control** in a new location? 22. Did the expansion create **economies of scale**? How?"}, {"title": "3. Reading for next class — Break-even analysis (Visa)", "body": "**Break-even point (BEP)**: the level of sales at which **total revenue = total costs**, so profit = 0.\n\n- **BEP (units)** = Fixed costs ÷ (Price per unit − Variable cost per unit)\n- (Price − Variable cost) = **contribution margin** per unit\n\n*Example*: fixed costs €100,000; price €50; variable cost €30 → contribution €20 → **BEP = 5,000 units**."}], "key_points": ["Logistics = movement and storage of goods; supply chain = the whole network.", "Local management vs expatriates from headquarters.", "Outsourcing = contracting out part of operations.", "Quality control = checking standards.", "Economies of scale = lower unit cost with higher volume.", "BEP (units) = fixed costs ÷ (price − variable cost)."], "traps": ["Logistics is only one part of the supply chain.", "Outsourcing ≠ offshoring: offshoring moves activities abroad (it can be in-house)."], "glossary": [{"term": "Logistics", "definition": "Managing the flow and storage of goods from origin to destination."}, {"term": "Supply chain", "definition": "The full network of organisations and activities involved in producing and delivering a product."}, {"term": "Local management", "definition": "Hiring managers from the host country."}, {"term": "Outsourcing", "definition": "Contracting an external company to perform activities. FR : externalisation."}, {"term": "Offshoring", "definition": "Moving activities to another country (in-house or outsourced). FR : délocalisation."}, {"term": "Quality control", "definition": "Processes ensuring products meet defined standards."}, {"term": "Economies of scale", "definition": "Reduction in cost per unit resulting from increased production."}, {"term": "Headquarters (HQ)", "definition": "The main office of a company. FR : siège social."}, {"term": "Contribution margin", "definition": "Price per unit minus variable cost per unit."}], "qcb": [{"q": "Economies of scale mean that the cost per unit falls when production increases.", "answer": true, "explanation": "Fixed costs are spread over more units."}, {"q": "Outsourcing means doing everything in-house.", "answer": false, "explanation": "It means contracting another company."}, {"q": "The supply chain only includes transport.", "answer": false, "explanation": "It includes suppliers, production, warehouses, transport and retailers."}, {"q": "Hiring managers in the host country is called local management.", "answer": true, "explanation": "As opposed to expatriates from headquarters."}, {"q": "At the break-even point, profit equals zero.", "answer": true, "explanation": "Total revenue = total costs."}, {"q": "Fixed costs €60,000, price €40, variable cost €25 → BEP = 4,000 units.", "answer": true, "explanation": "60,000 ÷ (40 − 25) = 60,000 ÷ 15 = 4,000."}], "qcm": [{"q": "IKEA sources part of its products from Indian suppliers. Its supply chain is partly:", "options": ["Local", "Outsourced to France", "Non-existent", "Greenfield"], "answer": [0], "explanation": "Local sourcing."}, {"q": "Which are examples of outsourcing? (several answers)", "options": ["Hiring a logistics company to deliver goods", "Using an external call centre", "Contracting a local factory to produce goods", "Opening your own warehouse"], "answer": [0, 1, 2], "explanation": "Opening your own warehouse is in-house."}, {"q": "Fixed costs €200,000; price €100; variable cost €60. BEP =", "options": ["2,000 units", "5,000 units", "3,333 units", "20,000 units"], "answer": [1], "explanation": "200,000 ÷ 40 = 5,000."}, {"q": "Which help ensure quality control abroad? (several answers)", "options": ["Standard operating procedures", "Regular audits and inspections", "Training local staff", "Ignoring customer complaints"], "answer": [0, 1, 2], "explanation": "Standards, checks and training."}, {"q": "« Opening 100 stores lowered the cost per coffee. » This shows:", "options": ["Economies of scale", "Entry barriers", "Penetration pricing", "Brand awareness"], "answer": [0], "explanation": "Lower unit cost with volume."}, {"q": "Choose the correct word: « The company relies on a complex global ______ chain. »", "options": ["supply", "supplies", "supplier", "supplying"], "answer": [0], "explanation": "Supply chain."}], "open_questions": [{"question": "Explain the difference between logistics and supply chain.", "answer": "**Logistics** is the planning and management of the **movement and storage** of goods (transport, warehousing, delivery). The **supply chain** is the **whole network**, from raw material suppliers to production, distribution and the final customer. Logistics is **one part** of supply chain management."}], "exercises": [{"title": "Break-even calculation", "statement": "A coffee chain opens in a new city. Monthly fixed costs: €45,000. Average price per drink: €5. Variable cost per drink: €2.", "questions": ["Calculate the break-even point in drinks per month.", "How many drinks per day (30 days)?", "Explain the result in English."], "answer": "1. Contribution margin = 5 − 2 = **€3**. BEP = 45,000 ÷ 3 = **15,000 drinks per month**.\n2. 15,000 ÷ 30 = **500 drinks per day**.\n3. « The store needs to sell **500 drinks a day to break even**. Above this level it makes a profit; below it, it makes a loss. »"}], "resources": [{"label": "Reading — Break-Even Analysis (Practical Business Skills, Visa)", "url": "https://pbsorg.siuat.visa.com/en/resources/calculators/breakeven-analysis.html"}]}, {"id": "eng-05", "title": "Classes 8–9 — Financial Objectives & Conclusion (à venir, S2)", "subtitle": "Break-even point, ROI, revenue forecast, profit margin, strategic objectives, cash flow + Starbucks case", "date": "24/03/2027", "status": "a_venir", "sources": ["M1CM_2026-2027_Program.xlsx", "Global_Launch_Project_Guidelines (Part 5)"], "objectives": ["Prepare in advance: master the six financial keywords and their formulas.", "Answer project questions 23–25 and judge whether the expansion succeeded.", "Understand Starbucks' international growth model (reading)."], "summary": [{"title": "1. Target vocabulary — Financial Objectives", "body": "| Term | Definition / formula | FR |\n|---|---|---|\n| **Break-even point** | Sales level where revenue = costs. Units = fixed costs ÷ (price − variable cost) | seuil de rentabilité / point mort |\n| **Return on investment (ROI)** | (Gain − Cost of investment) ÷ Cost of investment × 100 | retour sur investissement |\n| **Revenue forecast** | Prediction of future sales income | prévision de chiffre d'affaires |\n| **Profit margin** | Profit ÷ Revenue × 100 | marge bénéficiaire |\n| **Strategic objectives** | Long-term goals (market share, number of stores, growth targets) | objectifs stratégiques |\n| **Cash flow** | Money coming in and going out of a business over a period | flux de trésorerie |\n\n⚠️ **Revenue** (chiffre d'affaires) ≠ **profit** (bénéfice)."}, {"title": "2. Project questions — Part 5", "body": "23. What **financial objectives** did the company publicly state (growth targets, investment amount, timeline)?\n24. Is there public information about **break-even, ROI, revenue forecast, profit margin, cash flow**? Report what exists, even if partial.\n25. **Was the expansion successful?** Justify with evidence.\n\nExact figures are rarely public: base your judgement on **qualitative evidence** too (market response, press coverage, continued operations, expansion or withdrawal)."}, {"title": "3. Reading — Starbucks' International Growth Blueprint (Think Insights)", "body": "Key ideas to look for while reading:\n\n- **Multi-domestic framework**: strategy adapted country by country rather than one global approach.\n- **Market entry models**: a mix of **company-owned stores**, **licensing** and **joint ventures / co-owned stores** depending on the market.\n- **Cultural adaptation as a competitive advantage**: local menus (e.g. tea-based drinks in Asia), store design, the « third place » concept.\n- **Premium positioning without compromise**: high prices and the experience maintained abroad.\n- **Phased expansion over decades**: test, learn, then scale.\n- **Current challenges**: intense local competition (e.g. Luckin Coffee in China), price pressure.\n\n*Preparation summary: read Parts 1 and 2 of the article as assigned.*"}], "key_points": ["ROI = (gain − cost) ÷ cost × 100.", "Profit margin = profit ÷ revenue × 100.", "Break-even: revenue = costs, profit = 0.", "Cash flow = cash in − cash out over a period.", "Revenue ≠ profit.", "Judge the success of the expansion with evidence, qualitative if numbers are missing.", "Starbucks: multi-domestic strategy, mixed entry models, cultural adaptation, premium positioning, phased expansion."], "traps": ["Revenue (turnover / chiffre d'affaires) is not profit.", "A profitable company can still have cash-flow problems (timing of payments).", "« Benefit » does not mean accounting profit."], "glossary": [{"term": "Break-even point", "definition": "Point where total revenue equals total costs. FR : point mort."}, {"term": "Return on investment (ROI)", "definition": "(Gain − cost) ÷ cost × 100: measures the profitability of an investment."}, {"term": "Revenue forecast", "definition": "Estimate of future sales revenue."}, {"term": "Profit margin", "definition": "Profit as a percentage of revenue."}, {"term": "Strategic objectives", "definition": "Long-term goals that guide a company's decisions."}, {"term": "Cash flow", "definition": "Net amount of cash moving into and out of a business."}, {"term": "Revenue / turnover", "definition": "Total income from sales. FR : chiffre d'affaires."}, {"term": "Multi-domestic strategy", "definition": "International strategy adapting products and marketing to each national market."}], "qcb": [{"q": "Revenue and profit mean the same thing.", "answer": false, "explanation": "Revenue = total sales income; profit = revenue minus costs."}, {"q": "An investment of €100,000 that generates a gain of €130,000 has an ROI of 30%.", "answer": true, "explanation": "(130,000 − 100,000) ÷ 100,000 × 100 = 30%."}, {"q": "Profit margin = profit ÷ revenue × 100.", "answer": true, "explanation": "Correct formula."}, {"q": "A company with positive profit can never have cash-flow problems.", "answer": false, "explanation": "Cash can be short if customers pay late or investment is heavy."}, {"q": "If exact financial figures are not public, you can judge the expansion on qualitative evidence.", "answer": true, "explanation": "Market response, press, continued operations, expansion or withdrawal."}, {"q": "A multi-domestic strategy uses exactly the same approach in every country.", "answer": false, "explanation": "It adapts to each national market."}], "qcm": [{"q": "Revenue €2 m, profit €300,000. Profit margin =", "options": ["6%", "15%", "30%", "66%"], "answer": [1], "explanation": "300,000 ÷ 2,000,000 × 100 = 15%."}, {"q": "Investment €50,000, gain €60,000. ROI =", "options": ["10%", "20%", "120%", "83%"], "answer": [1], "explanation": "(60,000 − 50,000) ÷ 50,000 = 20%."}, {"q": "« We aim to open 1,000 stores in China by 2030. » This is a:", "options": ["Strategic objective", "Cash flow", "Profit margin", "Break-even point"], "answer": [0], "explanation": "A long-term growth target."}, {"q": "Which evidence can show that an expansion was successful? (several answers)", "options": ["Continued operations and new store openings", "Growing market share", "Positive press coverage and sales growth", "Withdrawal from the market"], "answer": [0, 1, 2], "explanation": "Withdrawal suggests failure."}, {"q": "Which entry models are associated with Starbucks' international growth? (several answers)", "options": ["Company-owned stores", "Licensing", "Joint ventures", "Exporting coffee machines only"], "answer": [0, 1, 2], "explanation": "A mix depending on the market."}, {"q": "Fill in: « The company expects to ______ even within three years. »", "options": ["break", "make", "do", "reach"], "answer": [0], "explanation": "to break even = atteindre le point mort."}], "open_questions": [{"question": "Was your company's expansion successful? Structure your answer (model).", "answer": "**Structure**: (1) recall the stated **objectives**; (2) present **quantitative evidence** (revenue growth, number of stores, market share, any ROI or break-even data); (3) add **qualitative evidence** (press, customer response, competition, continued investment or withdrawal); (4) give a **nuanced opinion**: « Overall, we believe the expansion was **largely successful** because…, although… »\n\nUseful phrases: *according to*, *the figures suggest that*, *on the other hand*, *to sum up*."}], "exercises": [{"title": "Financial calculations", "statement": "A retailer invests €400,000 in a new country. Year 1: revenue €1.2 m, total costs €1.05 m.", "questions": ["Profit and profit margin?", "If the investment generates €480,000 in total gains, what is the ROI?", "Write one sentence in English summarising the results."], "answer": "1. Profit = 1,200,000 − 1,050,000 = **€150,000**; margin = 150,000 ÷ 1,200,000 = **12.5%**.\n2. ROI = (480,000 − 400,000) ÷ 400,000 = **20%**.\n3. « In its first year, the company made a profit of €150,000, a 12.5% profit margin, and the investment delivered a 20% return. »"}], "resources": [{"label": "Reading — Starbucks' International Growth Blueprint (Think Insights)", "url": "https://thinkinsights.net/print/pdf/node/30188"}]}]}, {"id": "strategie-omnicanale", "order": 4, "folder": "04. STRASTREGIE OMNICALE", "title": "Stratégie omnicanale", "short": "Omnicanal", "teacher": "Amalia Vogler", "description": "Canaux de communication et de distribution, parcours d'achat, expérience client, mapping, points de contact et moments de vérité.", "key_dates": [{"date": "Séance 2, 3 ou 4", "label": "Quiz théorique : 20 % de la note, sans IA ni Internet ni cours"}, {"date": "Mar. 3 novembre", "label": "Séance 4 (8h30–12h00)"}, {"date": "Jeu. 5 novembre", "label": "Séance 5 : examen individuel, 80 % de la note"}], "exam_info": "Quiz théorique (20 %) sans IA ni Internet ni cours, en séance 2, 3 ou 4. Examen individuel (80 %) en séance 5, de 1h30 à 2h : **QCM, questions ouvertes, étude de cas**. Les slides de classe inversée peuvent être testées en séance.", "courses": [{"id": "omni-01", "title": "Séance 1 — Cadre du module & introduction à l'omnicanalité", "subtitle": "Objectifs, évaluation et première approche de l'omnicanal", "date": "30/09/2026", "status": "vu", "sources": ["01 - 2026.09.30 - Cours Stratégie Omnicanal.pdf"], "objectives": ["Analyser les canaux de distribution et de communication pour optimiser l'expérience client.", "Intégrer des outils numériques et physiques dans une stratégie omnicanale cohérente.", "Évaluer les performances des différents canaux pour ajuster la stratégie."], "summary": [{"title": "1. Organisation du module", "body": "- **17h30** de cours : **5 séances de 3h30**\n- Intervenante : **Amalia Vogler** (contact par mail ou via la messagerie Learn du module)\n\n| Séance | Date | Horaire |\n|---|---|---|\n| 1 | Mer. 30 septembre | 8h30–12h00 |\n| 2 | Mar. 13 octobre | 8h30–12h00 |\n| 3 | Mer. 14 octobre | 13h15–16h45 |\n| 4 | Mar. 3 novembre | 8h30–12h00 |\n| 5 | Jeu. 5 novembre | 8h30–12h00 |"}, {"title": "2. Évaluation : ce qui compte pour la note", "body": "| Épreuve | Contenu | Quand | Poids |\n|---|---|---|---|\n| **Quiz** (théorie) | Sans IA, sans Internet, sans cours | Séance 2, 3 ou 4 | **20 %** |\n| **Examen individuel** (théorie + pratique) | 1h30 à 2h : QCM, questions ouvertes, étude de cas | Séance 5 | **80 %** |\n\nL'intervenante peut modifier le format à tout moment. **Les slides de classe inversée peuvent être testées.**"}, {"title": "3. La philosophie du cours", "body": "**ANTICIPATION** (travailler tout le semestre) · **RESPECT** (ponctualité) · **ASSIDUITÉ** (prendre des notes) · **PARTICIPATION** · **AUTONOMIE** · **TRICHERIE non tolérée**.\n\nAbsent ? C'est à vous de **rattraper le cours en autonomie**. Posez vos questions en séance plutôt que la veille par mail."}, {"title": "4. L'omnicanalité, c'est quoi ? (première approche)", "body": "L'**omnicanal** consiste à **intégrer tous les canaux** (magasin, site, appli, réseaux sociaux, service client…) dans **un seul écosystème** pour que le client puisse **commencer son parcours sur un canal et le poursuivre sur un autre sans rupture**.\n\nOn distingue trois niveaux, détaillés en séance 2 :\n\n- **Multicanal** : plusieurs canaux, pas forcément connectés (silos).\n- **Cross-canal** : les canaux se renforcent entre eux.\n- **Omnicanal** : les canaux sont intégrés et fluides. Le client **n'a plus conscience de changer de canal**.\n\n*Exemples parlants (complément) : click & collect, e-réservation en magasin, retour en boutique d'un achat en ligne, vendeur équipé d'une tablette pour commander un produit absent du rayon.*"}, {"title": "5. L'exposé « Le prof, c'est vous ! »", "body": "- Groupes de **5** : préparer un exposé qui explique l'omnicanalité.\n- Contenus possibles : théorie, définition, exemples concrets, mise en situation, visuels, vidéos, jeu de rôle, infographies.\n- **Règle du jeu : interdit de se répéter.** Le groupe 1 parle environ 6 minutes, les suivants 3 à 5 minutes avec **uniquement du nouveau** (compléter, clarifier, autre exemple ou autre angle).\n- Ordre de passage tiré au sort : il faut préparer large et s'adapter en direct."}], "key_points": ["Module de 17h30 en 5 séances de 3h30.", "Quiz = 20 % (sans IA, Internet ni cours), en séance 2, 3 ou 4.", "Examen = 80 % (séance 5, 1h30–2h) : QCM, questions ouvertes, étude de cas.", "Trois objectifs : analyser les canaux, intégrer digital et physique, évaluer la performance des canaux.", "Omnicanal = tous les canaux intégrés, parcours sans rupture."], "traps": ["Ne pas inverser les poids : quiz 20 %, examen 80 %.", "Le quiz se fait sans aucun support : il faut connaître les définitions par cœur."], "glossary": [{"term": "Omnicanal", "definition": "Stratégie où tous les canaux sont intégrés et fluides : le client commence sur un canal et poursuit sur un autre sans rupture, sans même avoir conscience de changer de canal."}, {"term": "Multicanal", "definition": "L'entreprise utilise plusieurs canaux, pas forcément connectés entre eux."}, {"term": "Cross-canal", "definition": "Les canaux ne sont pas seulement multiples, ils se renforcent entre eux. Le client peut passer de l'un à l'autre de façon fluide."}], "qcb": [{"q": "Le module de stratégie omnicanale dure 17h30, réparties en 5 séances.", "answer": true, "explanation": "5 séances × 3h30 = 17h30."}, {"q": "Le quiz théorique compte pour 80 % de la note finale.", "answer": false, "explanation": "Le quiz compte pour 20 % ; l'examen individuel de la séance 5 compte pour 80 %."}, {"q": "Le quiz peut être fait avec ses notes de cours.", "answer": false, "explanation": "Il se fait sans IA, sans Internet et sans cours."}, {"q": "L'examen final peut comporter une étude de cas.", "answer": true, "explanation": "Il comporte des QCM, des questions ouvertes et une étude de cas."}, {"q": "Un étudiant absent doit rattraper le cours en autonomie.", "answer": true, "explanation": "C'est de sa responsabilité, selon les règles de l'intervenante."}, {"q": "Dans l'exposé « Le prof, c'est vous », chaque groupe peut répéter ce qu'ont dit les groupes précédents.", "answer": false, "explanation": "Règle du jeu : interdit de se répéter. « Déjà dit = on passe »."}, {"q": "L'un des objectifs du module est d'évaluer la performance des différents canaux pour ajuster la stratégie.", "answer": true, "explanation": "C'est le troisième objectif pédagogique."}, {"q": "En omnicanal, le client doit recommencer son parcours à zéro quand il change de canal.", "answer": false, "explanation": "C'est l'inverse : il poursuit son parcours sans rupture."}], "qcm": [{"q": "Quels sont les objectifs pédagogiques du module ? (plusieurs réponses)", "options": ["Analyser les canaux de distribution et de communication", "Intégrer outils numériques et physiques dans une stratégie cohérente", "Évaluer les performances des canaux", "Créer un site e-commerce de A à Z"], "answer": [0, 1, 2], "explanation": "Les trois objectifs officiels du module."}, {"q": "Quel est le format de l'examen individuel ?", "options": ["Uniquement un oral", "QCM, questions ouvertes et étude de cas, entre 1h30 et 2h", "Un dossier à rendre", "Un quiz de 10 minutes"], "answer": [1], "explanation": "Théorie et pratique, en séance 5."}, {"q": "Quelles valeurs fait partie de la « philosophie » du cours ? (plusieurs réponses)", "options": ["Anticipation", "Assiduité", "Participation", "Improvisation la veille"], "answer": [0, 1, 2], "explanation": "Aussi : respect, autonomie, tricherie non tolérée."}, {"q": "Quelle définition correspond le mieux à l'omnicanal ?", "options": ["Avoir le plus de canaux possible", "Des canaux qui fonctionnent chacun de leur côté", "Des canaux intégrés permettant un parcours fluide sans rupture", "Vendre uniquement en ligne"], "answer": [2], "explanation": "Intégration et continuité de l'expérience."}, {"q": "Quand a lieu l'examen individuel ?", "options": ["Séance 1", "Séance 3", "Séance 5", "Hors des séances"], "answer": [2], "explanation": "Séance 5, le jeudi 5 novembre."}, {"q": "Par quels canaux contacter l'intervenante ? (plusieurs réponses)", "options": ["Par mail", "Via la messagerie Learn du module", "Par WhatsApp", "Par LinkedIn"], "answer": [0, 1], "explanation": "Les autres canaux sont considérés comme privés."}], "open_questions": [{"question": "Expliquez avec vos mots ce qu'est l'omnicanalité et donnez un exemple.", "answer": "L'omnicanalité est une stratégie qui **intègre tous les canaux** d'une marque (magasin, site, appli, réseaux sociaux, service client) dans un **écosystème unique et synchronisé** (stocks, paiement, fidélité, SAV). Le client peut commencer son parcours sur un canal et le terminer sur un autre **sans rupture**, sans même avoir conscience de changer de canal.\n\n*Exemple* : je commence ma commande sur l'appli, je vais la chercher en magasin, puis je reçois une promotion personnalisée par email."}], "exercises": [{"title": "Préparer l'exposé « Le prof, c'est vous ! »", "statement": "Vous passez en 4e position. Les groupes précédents ont déjà donné la définition et l'exemple de Decathlon.", "questions": ["Que pouvez-vous apporter de NOUVEAU en 3 à 5 minutes ?"], "answer": "Pistes : (1) la **distinction multi / cross / omni** avec un exemple pour chacun ; (2) un **autre secteur** (banque, automobile, luxe) ; (3) les **conditions techniques** (stocks, CRM, paiement et fidélité unifiés) ; (4) un **contre-exemple** (marque qui fonctionne en silos : impossible de rendre en magasin un achat web) ; (5) un format différent : jeu de rôle client/vendeur, quiz interactif, infographie du parcours."}], "resources": []}, {"id": "omni-02", "title": "Séance 2 — Canaux, parcours d'achat & expérience client", "subtitle": "Communication vs distribution, AIDA, See-Think-Do-Care, multi/cross/omni, CX, ROPO", "date": "13/10/2026", "status": "vu", "sources": ["02 - 2026.10.13 - Cours Stratégie Omnicanale.pdf"], "objectives": ["Distinguer canal de communication, canal de distribution et média.", "Définir le parcours d'achat et connaître les modèles AIDA et See-Think-Do-Care.", "Différencier multicanal, cross-canal et omnicanal.", "Comprendre l'expérience client (CX), les frictions et le phénomène ROPO."], "summary": [{"title": "1. Canal de communication vs canal de distribution", "body": "| | Canal de **communication** | Canal de **distribution** |\n|---|---|---|\n| Définition | La voie par laquelle une marque **transmet un message** à sa cible | La voie par laquelle un produit ou service est **mis à disposition** du client final (mode d'accès au produit) |\n| Rôles | **Informer, séduire, convaincre, créer de la relation** | **Permettre d'acheter et de recevoir** le produit |\n| Exemples | Digital, print, événementiel, face-à-face, audiovisuel | Magasin physique, e-commerce, marketplaces, circuits hybrides |\n| Verbe clé | **Faire connaître** | **Mettre à disposition** |\n\n⚠️ **Canal ≠ média** : le **canal** est le chemin, la « voie » ; le **média** est le support concret utilisé dans ce canal. *Ex.* : canal = digital ; médias = Instagram, site web, newsletter.\n\n> **L'omnicanal = l'art de faire dialoguer ces deux univers pour une expérience client fluide.**"}, {"title": "2. Le parcours d'achat (parcours client / customer journey)", "body": "**Définition** : l'ensemble des étapes suivies par un client, **de la prise de conscience d'un besoin jusqu'à la fidélisation**.\n\n**Modèle AIDA** : **A**ttention → **I**ntérêt → **D**ésir → **A**ction.\n\nLes **deux limites d'AIDA** :\n1. Il **ne prend pas en compte la fidélisation et le rachat**.\n2. Il est **linéaire**, donc pas réaliste."}, {"title": "3. Le modèle See – Think – Do – Care", "body": "| Étape | Phase | Ce qui se passe | Statut du client |\n|---|---|---|---|\n| **See** | Sensibilisation | Phase inconsciente, notoriété, se faire connaître | **Suspect** |\n| **Think** | Considération | Évaluation des options via des recherches | **Prospect** |\n| **Do** | Achat | Acquisition des produits ou services | **Client** |\n| **Care** | Fidélisation | Feedbacks, témoignages, achat renouvelé | **Ambassadeur** |\n\nPar rapport à AIDA, **il intègre la fidélisation** (Care).\n\n*Complément : modèle proposé par Avinash Kaushik (Google).*"}, {"title": "4. Des parcours complexes", "body": "- **Non linéaires** : le client ne suit pas toutes les étapes dans l'ordre (achat impulsif sans recherche) et peut **revenir en arrière** (abandon de panier → nouvelle comparaison → achat plus tard).\n- **Personnalisés** : chaque consommateur est unique (motivations, besoins, budget, valeurs). Facteurs d'influence : âge, contexte, urgence, canal préféré. ➔ **Connaître sa cible !**\n- **Multicanaux** : le client passe d'un canal à l'autre (site, réseaux, magasin, téléphone). *Ex. 1* : je vois une pub, j'achète directement. *Ex. 2* : je cherche sur Google, je compare 10 sites, je lis des avis, je demande à un ami, puis j'achète.\n\nUn vrai parcours ressemble plutôt à une **boucle** : s'informer, comparer, consulter des avis, obtenir un devis, acheter, interagir après l'achat, consommer, résoudre un problème, puis racheter ou quitter la marque. Chaque étape comporte ses irritants (offres complexes, rupture entre canaux, mauvaises expériences, absence d'information au bon moment…)."}, {"title": "5. Multicanal, cross-canal, omnicanal", "body": "| | **Multicanal** | **Cross-canal** | **Omnicanal** |\n|---|---|---|---|\n| Principe | Plusieurs canaux **pas forcément connectés** | Les canaux **se renforcent entre eux** | Tous les canaux sont **intégrés et fluides** |\n| Pour le client | Chaque canal est un silo | Il **peut changer de canal** de façon fluide | Il **n'a plus conscience de changer de canal** |\n| Exemple du cours | J'achète sur le site mais **je ne peux pas retourner en magasin** | Je **scanne un QR code en magasin** qui m'amène sur le site pour plus d'infos | Je **commence ma commande sur l'appli**, je **vais la chercher en magasin**, je **reçois une promo par email** |\n\n**Continuité de l'expérience** : si l'**inventaire**, le **paiement**, la **fidélité** et le **SAV** sont synchronisés dans **un seul écosystème**, alors c'est de l'omnicanal.\n\n**Vrai ou faux ?** « L'omnicanal, c'est avoir plusieurs canaux de vente qui fonctionnent en parallèle. » ➔ **FAUX**, ça, c'est du multicanal."}, {"title": "6. L'expérience client (CX)", "body": "**Définition** : la **perception globale** qu'a le client de la marque, basée sur **toutes ses interactions** (avant, pendant, après l'achat). Elle inclut des **moments de satisfaction** et des **points de friction**.\n\n- **Points de friction** : obstacles, irritants, frustrations qui freinent l'achat. ➔ Les supprimer améliore la **fluidité**.\n- **Points de satisfaction** : instants agréables qui créent confiance et attachement. ➔ Les renforcer crée de l'**émotion** et de la **fidélité**.\n- **Les deux comptent !**\n\nTrois idées clés : chaque étape du parcours génère une expérience ; la CX fait la différence entre un **achat unique** et une **fidélisation** ; elle est **mesurable** (enquêtes, avis clients, taux de réachat), même si ce n'est pas évident."}, {"title": "7. L'expérience avant le prix (souvent, mais pas tout le temps)", "body": "> **Le prix attire (acquisition), mais l'expérience retient (fidélisation).**\n\n- Plus de **70 %** des consommateurs choisissent une marque pour l'expérience qu'elle offre, pas seulement pour le prix (études **PwC & Salesforce**).\n- La concurrence par les prix est sans fin. Une bonne expérience (service fluide, relation personnalisée, simplicité d'achat, SAV efficace) touche l'**affect**, donc l'**émotion**.\n- **Apple** : prix élevés, mais expérience en boutique et écosystème cohérent ➔ fidélisation forte.\n- **Amazon** : pas forcément les prix les plus bas, mais expérience ultra fluide (livraison rapide, retours faciles) ➔ fidélisation forte."}, {"title": "8. Quantité de canaux ≠ qualité de la stratégie", "body": "**Vrai ou faux ?** « Plus une entreprise a de canaux, meilleure est sa stratégie omnicanale. » ➔ **FAUX**.\n\n- Beaucoup de canaux ne servent à rien s'ils fonctionnent **en silos**.\n- **Omnicanal = cohérence + intégration** : les canaux se complètent et communiquent (acheter en ligne, retourner en magasin, suivre la commande sur l'appli).\n- Le client ne veut pas « plus de canaux » : il veut un **parcours fluide, simple et sans friction**, avec la même information partout (commencer sur Instagram, finir en magasin)."}, {"title": "9. Le phénomène ROPO (Research Online, Purchase Offline)", "body": "**Vrai ou faux ?** « 70 % des consommateurs commencent leur parcours en ligne, même s'ils achètent ensuite en magasin. » ➔ **VRAI** : c'est le **ROPO**.\n\nLa plupart des consommateurs commencent par une **recherche en ligne**, même s'ils achètent ensuite **en magasin** ou via un autre canal. *Ex.* : regarder les avis Google ou les prix sur un site, puis acheter en boutique pour avoir le produit tout de suite.\n\n> **Le digital influence presque tous les parcours, même quand la vente finale n'a pas lieu en ligne.**\n\nLe schéma « On et offline » montre un parcours en 7 étapes : (1) lecture d'un magazine sur tablette → (2) recherche d'informations sur Internet → (3) essai et choix dans le magasin de l'enseigne A [**ROPO**, phase d'**acquisition**] → (4) comparatif des prix et achat sur le site de l'enseigne B → (5) retrait en magasin B et achat complémentaire [**transformation**] → (6) avis sur Internet → (7) enquête de satisfaction du service client [**fidélisation**].\n\n*Complément : l'inverse s'appelle le **showrooming** (voir en magasin, acheter en ligne), aussi appelé « reverse ROPO ».*"}, {"title": "10. Chaque canal a son rôle", "body": "**Vrai ou faux ?** « Le canal qui génère le plus de ventes directes est celui qu'il faut privilégier. » ➔ **FAUX**.\n\n- Un canal peut générer la **vente finale** (le site e-commerce) alors que d'autres ont permis d'**attirer** le client (réseaux sociaux, email, magasin, publicité).\n- Le consommateur ne raisonne pas en canaux : il veut passer d'un point de contact à l'autre **sans friction**.\n- ⚠️ Ne privilégier qu'un canal, c'est **risquer de perdre des ventes indirectes ou futures**."}, {"title": "11. Travaux à faire : classe inversée & projet fil rouge", "body": "- **Classe inversée** : lire les slides sur Learn, de « Les étapes classiques du parcours d'achat » à « Et l'automatisation ? » (points de contact, cartographie, moments de vérité, automatisation). Elles peuvent être testées en séance. Voir la séance 3.\n- **Projet fil rouge : Hurpeau Mousist**, fabricant d'**escaliers sur mesure**. Vous êtes consultants. **Livrable A** (1 page en PDF sur Learn avant la séance 3) : l'enjeu du client en une phrase ; sa cible (qui achète, qui prescrit, qui décide) ; ses points de contact actuels (physiques et digitaux) ; ce qui fonctionne et ce qui bloque ; vos 3 prochaines questions."}], "key_points": ["Communication = faire connaître (informer, séduire, convaincre, créer de la relation) ; distribution = mettre à disposition (acheter, recevoir).", "Canal = la voie ; média = le support concret (canal digital → Instagram, newsletter).", "Omnicanal = faire dialoguer communication et distribution pour une expérience fluide.", "Parcours d'achat : de la prise de conscience du besoin jusqu'à la fidélisation.", "AIDA a deux limites : il oublie la fidélisation et le rachat, et il est linéaire.", "See (sensibilisation, suspect) → Think (considération, prospect) → Do (achat, client) → Care (fidélisation, ambassadeur).", "Multicanal = silos ; cross-canal = les canaux se renforcent ; omnicanal = le client n'a plus conscience de changer de canal.", "CX = perception globale de toutes les interactions ; supprimer les frictions et renforcer les satisfactions.", "Le prix attire (acquisition), l'expérience retient (fidélisation) : plus de 70 % des consommateurs (PwC & Salesforce).", "ROPO = Research Online, Purchase Offline ; plus de canaux ne veut pas dire une meilleure stratégie ; chaque canal a son rôle."], "traps": ["« Plusieurs canaux en parallèle », c'est du multicanal, pas de l'omnicanal.", "Canal ≠ média : Instagram est un média du canal digital.", "Cross-canal : le client peut changer de canal de façon fluide. Omnicanal : il n'en a même plus conscience.", "L'expérience prime souvent sur le prix, mais pas toujours (le cours le précise).", "Le canal qui fait la vente finale n'est pas forcément le plus important (attribution des ventes indirectes).", "AIDA n'intègre ni la fidélisation ni le rachat, contrairement à See-Think-Do-Care."], "glossary": [{"term": "Canal de communication", "definition": "Voie par laquelle une marque transmet un message à sa cible. Rôles : informer, séduire, convaincre, créer de la relation."}, {"term": "Canal de distribution", "definition": "Voie par laquelle un produit ou service est mis à disposition du client final. Rôle : lui permettre d'acheter et de recevoir le produit."}, {"term": "Média", "definition": "Support ou outil concret utilisé dans un canal (ex. dans le canal digital : Instagram, site web, newsletter)."}, {"term": "Parcours d'achat / customer journey", "definition": "Ensemble des étapes suivies par un client, de la prise de conscience d'un besoin jusqu'à la fidélisation."}, {"term": "AIDA", "definition": "Attention, Intérêt, Désir, Action. Limites : ignore la fidélisation et le rachat, et il est linéaire."}, {"term": "See-Think-Do-Care", "definition": "Sensibilisation (suspect), Considération (prospect), Achat (client), Fidélisation (ambassadeur)."}, {"term": "Multicanal", "definition": "Plusieurs canaux pas forcément connectés. Ex. : j'achète sur le site mais je ne peux pas retourner en magasin."}, {"term": "Cross-canal", "definition": "Les canaux se renforcent entre eux. Ex. : QR code en magasin qui mène au site pour plus d'infos."}, {"term": "Omnicanal", "definition": "Canaux intégrés et fluides, client sans conscience de changer de canal ; stocks, paiement, fidélité et SAV synchronisés."}, {"term": "Continuité de l'expérience", "definition": "Le client passe d'un canal à l'autre sans rupture ni perte d'information : c'est la marque de l'omnicanal."}, {"term": "Expérience client (CX)", "definition": "Perception globale qu'a le client de la marque, basée sur toutes ses interactions avant, pendant et après l'achat."}, {"term": "Point de friction", "definition": "Obstacle, irritant ou frustration qui freine l'achat."}, {"term": "Point de satisfaction", "definition": "Instant agréable qui crée de la confiance et de l'attachement."}, {"term": "ROPO", "definition": "Research Online, Purchase Offline : on recherche en ligne puis on achète en magasin ou via un autre canal."}, {"term": "Silo", "definition": "Canal qui fonctionne de son côté, sans connexion avec les autres."}], "qcb": [{"q": "L'omnicanal, c'est avoir plusieurs canaux de vente (site, magasin, réseaux sociaux) qui fonctionnent en parallèle.", "answer": false, "explanation": "Des canaux en parallèle, c'est du multicanal. L'omnicanal suppose des canaux intégrés et fluides."}, {"q": "Plus une entreprise a de canaux, meilleure est sa stratégie omnicanale.", "answer": false, "explanation": "Quantité ≠ qualité : il faut de la cohérence et de l'intégration, pas des silos."}, {"q": "70 % des consommateurs commencent leur parcours d'achat en ligne, même s'ils achètent ensuite en magasin.", "answer": true, "explanation": "C'est le phénomène ROPO (Research Online, Purchase Offline)."}, {"q": "Le canal qui génère le plus de ventes directes est celui qu'il faut privilégier.", "answer": false, "explanation": "Chaque canal a son rôle : en privilégier un seul fait perdre des ventes indirectes ou futures."}, {"q": "L'expérience client est plus importante que le prix pour fidéliser un consommateur.", "answer": true, "explanation": "Souvent, mais pas tout le temps : le prix attire, l'expérience retient."}, {"q": "Le canal et le média désignent exactement la même chose.", "answer": false, "explanation": "Le canal est la voie (ex. digital) ; le média est le support concret (Instagram, newsletter)."}, {"q": "Le canal de distribution a pour rôle d'informer et de séduire la cible.", "answer": false, "explanation": "Ce sont les rôles du canal de communication. Le canal de distribution permet d'acheter et de recevoir le produit."}, {"q": "Le modèle AIDA ne prend pas en compte la fidélisation.", "answer": true, "explanation": "C'est l'une de ses deux limites, avec sa linéarité."}, {"q": "Dans See-Think-Do-Care, l'étape « Think » correspond au statut de prospect.", "answer": true, "explanation": "See = suspect, Think = prospect, Do = client, Care = ambassadeur."}, {"q": "Dans un parcours réel, un client peut revenir en arrière (abandon de panier puis nouvelle comparaison).", "answer": true, "explanation": "Les parcours sont non linéaires."}, {"q": "En cross-canal, le client n'a plus conscience de changer de canal.", "answer": false, "explanation": "C'est la définition de l'omnicanal. En cross-canal, il peut changer de canal de façon fluide."}, {"q": "L'expérience client inclut uniquement les moments positifs.", "answer": false, "explanation": "Elle inclut des moments de satisfaction et des points de friction : les deux comptent."}, {"q": "L'expérience client est mesurable (enquêtes, avis, taux de réachat).", "answer": true, "explanation": "Elle est mesurable, même si ce n'est pas évident."}, {"q": "Selon le cours, Amazon fidélise surtout grâce aux prix les plus bas du marché.", "answer": false, "explanation": "Amazon n'a pas forcément les prix les plus bas : il fidélise par une expérience ultra fluide (livraison rapide, retours faciles)."}, {"q": "Pouvoir acheter sur le site sans pouvoir retourner le produit en magasin est un exemple de multicanal.", "answer": true, "explanation": "C'est l'exemple du cours : les canaux ne sont pas connectés."}, {"q": "Le parcours d'achat s'arrête à l'acte d'achat.", "answer": false, "explanation": "Il va de la prise de conscience du besoin jusqu'à la fidélisation."}, {"q": "Événementiel et face-à-face sont des exemples de canaux de communication.", "answer": true, "explanation": "Avec le digital, le print et l'audiovisuel."}, {"q": "Les marketplaces sont un canal de communication.", "answer": false, "explanation": "Ce sont un canal de distribution (avec le magasin physique, l'e-commerce et les circuits hybrides)."}], "qcm": [{"q": "Quels sont les rôles d'un canal de communication ? (plusieurs réponses)", "options": ["Informer", "Séduire", "Convaincre", "Livrer le produit"], "answer": [0, 1, 2], "explanation": "Et créer de la relation. Livrer relève de la distribution."}, {"q": "Quels sont des exemples de canaux de distribution ? (plusieurs réponses)", "options": ["Magasin physique", "E-commerce", "Marketplaces", "Print"], "answer": [0, 1, 2], "explanation": "Le print est un canal de communication."}, {"q": "Dans le canal digital, lesquels sont des médias ? (plusieurs réponses)", "options": ["Instagram", "Site web", "Newsletter", "Le canal digital lui-même"], "answer": [0, 1, 2], "explanation": "Le canal est la voie ; les médias sont les supports concrets."}, {"q": "Selon le cours, l'omnicanal est :", "options": ["L'art de multiplier les canaux", "L'art de faire dialoguer communication et distribution pour une expérience fluide", "La vente exclusivement en ligne", "La publicité multi-supports"], "answer": [1], "explanation": "Formule clé de la séance 2."}, {"q": "Quelles sont les deux limites du modèle AIDA ? (plusieurs réponses)", "options": ["Il ne prend pas en compte la fidélisation et le rachat", "Il est linéaire", "Il est trop récent", "Il ignore l'attention"], "answer": [0, 1], "explanation": "Ces deux limites justifient des modèles comme See-Think-Do-Care."}, {"q": "Remettez dans l'ordre See-Think-Do-Care :", "options": ["Sensibilisation → Considération → Achat → Fidélisation", "Achat → Considération → Sensibilisation → Fidélisation", "Considération → Sensibilisation → Fidélisation → Achat", "Fidélisation → Achat → Considération → Sensibilisation"], "answer": [0], "explanation": "See, Think, Do, Care."}, {"q": "À quelle étape du modèle le client devient-il « ambassadeur » ?", "options": ["See", "Think", "Do", "Care"], "answer": [3], "explanation": "Care = fidélisation : feedbacks, témoignages, achat renouvelé."}, {"q": "Quelle phase de See-Think-Do-Care est décrite comme « inconsciente » et liée à la notoriété ?", "options": ["See", "Think", "Do", "Care"], "answer": [0], "explanation": "See = sensibilisation : se faire connaître."}, {"q": "Je scanne un QR code en magasin qui m'amène sur le site pour plus d'infos. C'est :", "options": ["Du multicanal", "Du cross-canal", "De l'omnicanal", "Du ROPO"], "answer": [1], "explanation": "Exemple du cours pour le cross-canal : les canaux se renforcent entre eux."}, {"q": "Je commence ma commande sur l'appli, la récupère en magasin et reçois une promo par email. C'est :", "options": ["Du multicanal", "Du cross-canal", "De l'omnicanal", "Du showrooming"], "answer": [2], "explanation": "Exemple du cours pour l'omnicanal : continuité totale."}, {"q": "Quels éléments doivent être synchronisés pour parler d'omnicanal ? (plusieurs réponses)", "options": ["Inventaire", "Paiement", "Fidélité", "Service après-vente"], "answer": [0, 1, 2, 3], "explanation": "Tous dans un seul écosystème."}, {"q": "Selon le cours, pourquoi les parcours sont-ils complexes ? (plusieurs réponses)", "options": ["Ils sont non linéaires", "Ils sont personnalisés", "Les clients passent d'un canal à l'autre", "Tous les clients suivent AIDA"], "answer": [0, 1, 2], "explanation": "Non linéaires, personnalisés et multicanaux."}, {"q": "Qu'est-ce qu'un point de friction ?", "options": ["Un instant agréable qui crée de l'attachement", "Un obstacle, irritant ou frustration qui freine l'achat", "Un canal de distribution", "Une promotion"], "answer": [1], "explanation": "Le supprimer améliore la fluidité."}, {"q": "Quelle phrase résume la relation prix / expérience ?", "options": ["Le prix retient, l'expérience attire", "Le prix attire (acquisition), l'expérience retient (fidélisation)", "Seul le prix compte", "Seule l'expérience compte, toujours"], "answer": [1], "explanation": "Avec la nuance « souvent, mais pas tout le temps »."}, {"q": "Quelles sources sont citées pour le chiffre « plus de 70 % choisissent une marque pour l'expérience » ?", "options": ["PwC et Salesforce", "Google et Meta", "INSEE et Eurostat", "McKinsey et BCG"], "answer": [0], "explanation": "Études PwC & Salesforce."}, {"q": "Que signifie ROPO ?", "options": ["Return Online, Pay Offline", "Research Online, Purchase Offline", "Retail Omnichannel Process Optimization", "Research Offline, Purchase Online"], "answer": [1], "explanation": "On cherche en ligne, on achète en magasin."}, {"q": "Un client lit les avis Google, compare les prix en ligne, puis achète en boutique pour avoir le produit tout de suite. Ce comportement illustre :", "options": ["Le multicanal", "Le ROPO", "Le showrooming", "AIDA"], "answer": [1], "explanation": "Recherche en ligne puis achat hors ligne."}, {"q": "Quelles marques le cours cite-t-il comme exemples de fidélisation par l'expérience ? (plusieurs réponses)", "options": ["Apple", "Amazon", "Shein", "Lidl"], "answer": [0, 1], "explanation": "Apple (boutique, écosystème) et Amazon (livraison, retours)."}], "open_questions": [{"question": "Distinguez canal de communication et canal de distribution. Expliquez en quoi l'omnicanal les relie.", "answer": "**Canal de communication** : voie par laquelle la marque transmet un message à sa cible pour informer, séduire, convaincre et créer de la relation (digital, print, événementiel, face-à-face, audiovisuel). Verbe clé : **faire connaître**.\n\n**Canal de distribution** : voie par laquelle le produit est mis à disposition du client final pour qu'il puisse l'acheter et le recevoir (magasin, e-commerce, marketplaces, circuits hybrides). Verbe clé : **mettre à disposition**.\n\n**Lien** : l'omnicanal est « l'art de faire dialoguer ces deux univers » pour une expérience client fluide. *Ex.* : une publicité Instagram (communication) renvoie vers un produit réservable en magasin (distribution), avec un stock visible en temps réel."}, {"question": "Présentez le modèle AIDA, ses limites et un modèle plus adapté.", "answer": "**AIDA** : Attention → Intérêt → Désir → Action.\n\n**Limites** : (1) il ignore la **fidélisation et le rachat** ; (2) il est **linéaire**, alors que les parcours réels sont non linéaires, personnalisés et multicanaux.\n\n**Modèle plus adapté : See-Think-Do-Care**. See (sensibilisation, suspect), Think (considération, prospect), Do (achat, client), Care (fidélisation, ambassadeur). Il intègre l'après-achat. On peut aussi représenter le parcours comme une **boucle** (s'informer, comparer, acheter, utiliser, résoudre un problème, racheter ou quitter)."}, {"question": "Comparez multicanal, cross-canal et omnicanal avec un exemple pour chacun.", "answer": "- **Multicanal** : plusieurs canaux non connectés. *Ex.* : j'achète sur le site mais je ne peux pas retourner en magasin.\n- **Cross-canal** : les canaux se renforcent, le client peut passer de l'un à l'autre. *Ex.* : un QR code en magasin renvoie vers la fiche produit du site.\n- **Omnicanal** : canaux intégrés, le client n'a plus conscience de changer de canal. Stocks, paiement, fidélité et SAV sont synchronisés. *Ex.* : commande sur l'appli, retrait en magasin, promo personnalisée par email.\n\nLa différence clé tient dans la **continuité de l'expérience**."}, {"question": "« Plus une entreprise a de canaux, meilleure est sa stratégie omnicanale. » Discutez.", "answer": "**Faux.** Quantité de canaux ≠ qualité de la stratégie.\n\n- Des canaux nombreux mais **en silos** créent des ruptures (information différente, retours impossibles) et donc des **frictions**.\n- L'omnicanal repose sur la **cohérence** et l'**intégration** : les canaux se complètent et communiquent.\n- Le client ne veut pas plus de canaux, il veut un **parcours fluide, simple et sans friction**.\n\nConclusion : mieux vaut peu de canaux bien intégrés que beaucoup de canaux déconnectés."}, {"question": "Qu'est-ce que l'expérience client ? Pourquoi est-elle souvent plus déterminante que le prix ?", "answer": "**CX** : perception globale du client sur la marque, construite par toutes ses interactions avant, pendant et après l'achat. Elle comprend des moments de satisfaction et des points de friction.\n\n**Pourquoi elle prime souvent** : la guerre des prix est sans fin (un concurrent peut toujours faire moins cher), alors qu'une bonne expérience touche l'**affect** et crée de l'**émotion**, donc de la fidélité. Plus de 70 % des consommateurs choisissent une marque pour l'expérience (PwC, Salesforce). Exemples : **Apple** et **Amazon**.\n\n**Nuance** : « souvent, mais pas tout le temps ». Le prix reste décisif pour l'**acquisition** et pour certains produits ou cibles."}, {"question": "Expliquez le phénomène ROPO et ses conséquences pour une enseigne.", "answer": "**ROPO** (Research Online, Purchase Offline) : le client se renseigne en ligne (avis, prix, comparateurs) puis achète en magasin, par exemple pour avoir le produit immédiatement. Environ **70 %** des consommateurs commencent leur parcours en ligne.\n\n**Conséquences** : (1) le digital influence presque toutes les ventes, même physiques ; il faut des fiches produits, des avis et un stock visible en ligne ; (2) il ne faut pas juger un canal sur ses seules ventes directes ; (3) il faut relier les données en ligne et en magasin (programme de fidélité, e-réservation)."}], "exercises": [{"title": "Étude de cas — Diagnostic Hurpeau Mousist (Livrable A)", "statement": "**Hurpeau Mousist** est un fabricant d'**escaliers sur mesure**. En tant que consultants, préparez le diagnostic de la situation client en 1 page.", "questions": ["Formulez l'enjeu du client en une phrase.", "Qui achète, qui prescrit, qui décide ?", "Listez des points de contact physiques et digitaux probables.", "Proposez 3 questions à poser au dirigeant."], "answer": "*Corrigé type : les hypothèses sont à vérifier auprès du dirigeant et par vos recherches.*\n\n1. **Enjeu** : générer davantage de demandes de devis qualifiées et rendre le parcours (de l'inspiration à la pose) fluide entre le digital et le physique.\n2. **Cible** : **acheteurs** = particuliers qui construisent ou rénovent ; **prescripteurs** = architectes, architectes d'intérieur, constructeurs, menuisiers, artisans du bâtiment ; **décideurs** = souvent le couple propriétaire (budget), parfois le maître d'œuvre.\n3. **Points de contact** : site web et formulaire de devis, fiche Google et avis, Instagram et Pinterest (inspiration), Houzz, salons de l'habitat, showroom ou atelier, visite technique et prise de mesures, devis, pose, SAV et entretien, bouche-à-oreille.\n4. **Questions** : d'où viennent vos demandes de devis aujourd'hui ? Quel est votre taux de transformation devis → commande, et pourquoi perdez-vous des projets ? Combien de temps s'écoule entre le premier contact et la pose, et où sont les frictions (délais, prix, visualisation du rendu) ?"}, {"title": "Exercice — Classer les canaux", "statement": "Classez : affichage métro, marketplace Amazon, salon professionnel, newsletter, boutique, conseiller par téléphone, spot TV, click & collect.", "questions": ["Canal de communication ou de distribution ?"], "answer": "**Communication** : affichage métro (print), salon professionnel (événementiel), newsletter (média du canal digital), spot TV (audiovisuel), conseiller par téléphone (face-à-face ou relation).\n**Distribution** : marketplace Amazon, boutique, click & collect (circuit hybride).\n\n*Nuance : la boutique et le conseiller peuvent jouer les deux rôles. C'est justement là que l'omnicanal fait dialoguer les deux univers.*"}], "resources": []}, {"id": "omni-03", "title": "Séance 3 — Points de contact, mapping & moments de vérité", "subtitle": "Classe inversée : étapes du parcours, cartographie, moments de vérité, automatisation", "date": "14/10/2026", "status": "vu", "sources": ["03 - 2026.10.14 - Cours Stratégie Omnicanale Classe inversée.pdf"], "objectives": ["Connaître les 6 étapes classiques du parcours d'achat.", "Définir un point de contact (touchpoint) et un moment de vérité, et savoir les distinguer.", "Savoir construire une cartographie (mapping) du parcours client.", "Comprendre le rôle de l'automatisation dans l'expérience omnicanale."], "summary": [{"title": "1. Les 6 étapes classiques du parcours d'achat", "body": "| Étape | Ce que fait le client | Exemple : baskets |\n|---|---|---|\n| **1. Prise de conscience** | Prend conscience d'un besoin ou découvre une marque | Voit une pub de baskets sur Instagram |\n| **2. Considération** | Cherche des infos, compare, lit des avis, demande conseil | Regarde des tests sur YouTube, des comparateurs |\n| **3. Décision / Achat** | Choisit une option et passe à l'acte | Commande en ligne ou achète en magasin |\n| **4. Expérience / Utilisation** | Vit l'expérience d'utilisation | Teste ses baskets en courant |\n| **5. Fidélisation** | Satisfait, revient acheter ou s'abonne | Rachète la marque, rejoint le programme de fidélité |\n| **6. Recommandation** | Devient ambassadeur | Poste un avis sur Trustpilot, recommande à un ami |\n\nLes points de contact correspondants : pub Insta ➔ YouTube et comparateurs ➔ magasin (échanges humains) ➔ newsletter (astuces), mail promo ➔ programme de fidélité ➔ mail d'incitation à laisser un avis ou récompense en échange d'un avis."}, {"title": "2. Le point de contact (touchpoint)", "body": "**Définition** : **toute interaction** entre un client et une marque au cours de son parcours d'achat.\n\n| Moment | Exemples |\n|---|---|\n| **Avant l'achat** | Pub, réseaux sociaux, site web, bouche-à-oreille |\n| **Pendant l'achat** | Vendeur en magasin, site e-commerce, appli mobile |\n| **Après l'achat** | Service client, newsletters, programme de fidélité |\n\n**Objectifs du travail sur les points de contact** :\n1. **Identifier** tous les points de contact clés\n2. **Comprendre / analyser** leur rôle dans l'expérience client\n3. **Optimiser** chaque interaction pour **réduire les frictions** et **renforcer la satisfaction**"}, {"title": "3. La cartographie du parcours (mapping)", "body": "**Définition** : une **représentation visuelle** de toutes les étapes qu'un client traverse **avant, pendant et après** l'achat d'un produit ou service.\n\n**Pourquoi cartographier ?**\n- Identifier les **blocages** qui font perdre des clients\n- Repérer les **moments clés** qui créent satisfaction et fidélité\n- Mettre en place des **actions concrètes** ➔ améliorer l'expérience et **augmenter les conversions**\n\n**Lignes d'une cartographie** (modèle Different Factory) : étape du parcours · objectifs clients · points de contact (canal) · attentes · **douleurs (pains)** · émotions. D'autres formats existent : experience map, ou « pains et gains » (exemple d'un prêt bancaire)."}, {"title": "4. Trame générale de consolidation (exemple à connaître)", "body": "| Étape | Points de contact | Actions | Émotions | Satisfaction | Friction | Opportunités |\n|---|---|---|---|---|---|---|\n| **Prise de conscience (See)** | Réseaux sociaux, bouche-à-oreille, pub | Découvre un besoin, une pub, une reco | Curiosité, intérêt, doute | Contenu attractif et clair, reco crédible | Pub intrusive, mauvais ciblage | Contenu attractif, visibilité accrue |\n| **Considération (Think)** | Avis clients, site, comparateurs, YouTube | Compare, cherche des avis | Hésitation, recherche de confiance | Fiche produit complète, avis clients | Photos de mauvaise qualité, avis négatifs non traités | Preuves sociales, contenu comparatif |\n| **Achat (Do)** | E-commerce, magasin, appli | Commande, va en magasin | Excitation, peur de se tromper | Checkout simple, preuves de sécurité (avis, badges) | Création de compte obligatoire, temps de chargement | Simplifier, rassurer avec SAV et garantie |\n| **Fidélisation (Care)** | SAV, newsletters, fidélité, réseaux | Utilise, partage son expérience | Satisfaction, frustration, fierté | Bon service client, offre personnalisée, fidélité | Communication générique, retours compliqués | Suivi personnalisé, offres exclusives |\n\n**Pour aller plus loin**, chaque opportunité est ensuite analysée selon : son **coût**, sa **faisabilité**, son **alignement avec les valeurs et la marque**, et sa **cohérence avec la stratégie omnicanale**. ➔ La cartographie est un **outil vivant**, à affiner avec les données clients (expérience terrain)."}, {"title": "5. Moments de vérité vs points de contact", "body": "- **Point de contact** : **toute** interaction client ↔ marque.\n- **Moment de vérité** : un point de contact **décisif**, qui **influence fortement** la perception du client et sa décision. C'est le moment où le client dit « **Oui, je fais confiance à cette marque** » ou « **Non, je pars ailleurs** ».\n\n> **Tous les moments de vérité sont des points de contact, MAIS tous les points de contact ne sont pas des moments de vérité.**\n\nLes moments de vérité sont les **points critiques qui peuvent faire basculer l'expérience** en positif ou en négatif.\n\n*Complément (souvent attendu en culture marketing) : **ZMOT** (Zero Moment of Truth, Google : la recherche en ligne avant l'achat), **FMOT** (First Moment of Truth, P&G : face au produit en rayon), **SMOT** (Second Moment of Truth : l'expérience d'usage).*"}, {"title": "6. Identifier les moments de vérité : la méthode en 4 étapes", "body": "1. **Lister les points de contact existants** : cartographier tous les moments d'interaction (pub → site → ajout au panier → paiement → livraison → SAV).\n2. **Observer et collecter des données** : chercher où ça bloque et où ça enchante (feedback clients, avis, enquêtes ; taux d'abandon de panier, clics, réclamations ; tests utilisateurs).\n3. **Évaluer l'impact de chaque point de contact** : « Ça enchante ? » Est-ce que ça augmente vraiment la confiance ou la satisfaction ? « Ça bloque ? » Est-ce que ça détruit la relation immédiatement ?\n4. **Prioriser les moments critiques** avec une grille simple :\n   - **Haute importance** = moment de vérité ➔ à maîtriser absolument\n   - **Importance moyenne** ➔ points à améliorer\n   - **Faible importance** ➔ points secondaires\n   (et recommencer au besoin)"}, {"title": "7. À retenir : émotion et observation", "body": "- L'**affect** joue énormément sur l'impact (ou non) de chaque moment de vérité, d'où l'importance du **travail sur la marque** (branding ou personal branding). ➔ **ÉMOTION**\n- Il faut **observer** le comportement des consommateurs pour savoir ce qui est un moment de vérité ou non, car **cela varie d'une personne à l'autre**. ➔ **OBSERVATION**\n- Il faut **s'adapter** : le contexte peut changer très vite."}, {"title": "8. Et l'automatisation ?", "body": "| Objectif | Exemples |\n|---|---|\n| **Gagner en réactivité** | Automatiser les mails, le suivi de commande, la FAQ |\n| **Personnaliser à grande échelle** | Mails ou messages adaptés au comportement du client |\n| **Réduire la friction** | Paiement en 1 clic, relance de panier abandonné |"}], "key_points": ["Six étapes : prise de conscience, considération, décision/achat, expérience/utilisation, fidélisation, recommandation.", "Point de contact = toute interaction client ↔ marque (avant, pendant, après l'achat).", "Objectifs : identifier, comprendre/analyser, optimiser (réduire les frictions, renforcer la satisfaction).", "Mapping = représentation visuelle des étapes avant, pendant et après l'achat.", "Pourquoi cartographier : repérer les blocages, les moments clés, puis agir pour augmenter les conversions.", "Lignes d'une carte : étapes, objectifs, points de contact, attentes, douleurs, émotions (+ satisfactions, frictions, opportunités).", "Moment de vérité = point de contact décisif (« oui je fais confiance » / « non je pars »).", "Tous les moments de vérité sont des points de contact, pas l'inverse.", "Méthode : lister → observer et collecter → évaluer (enchante ou bloque ?) → prioriser (haute, moyenne, faible).", "Automatisation : réactivité, personnalisation à grande échelle, réduction de la friction."], "traps": ["Un point de contact n'est pas forcément un moment de vérité : seul un point de contact décisif l'est.", "Le parcours ne s'arrête pas à l'achat : utilisation, fidélisation et recommandation en font partie.", "La cartographie n'est pas figée : c'est un outil vivant à mettre à jour avec les données clients.", "Les moments de vérité varient selon les personnes et le contexte : il faut observer.", "Une opportunité d'amélioration doit être évaluée (coût, faisabilité, alignement avec la marque, cohérence omnicanale) avant d'être lancée."], "glossary": [{"term": "Point de contact / touchpoint", "definition": "Toute interaction entre un client et une marque au cours de son parcours d'achat (avant, pendant, après)."}, {"term": "Moment de vérité", "definition": "Point de contact décisif qui influence fortement la perception du client et sa décision : « Oui, je fais confiance » ou « Non, je pars ailleurs »."}, {"term": "Cartographie / mapping", "definition": "Représentation visuelle de toutes les étapes qu'un client traverse avant, pendant et après l'achat."}, {"term": "Prise de conscience", "definition": "Première étape : le client prend conscience d'un besoin ou découvre une marque."}, {"term": "Considération", "definition": "Le client cherche des infos, compare, lit des avis, demande conseil."}, {"term": "Recommandation", "definition": "Dernière étape : le client devient ambassadeur et recommande la marque (avis, bouche-à-oreille)."}, {"term": "Douleurs (pains)", "definition": "Difficultés et frustrations vécues par le client à une étape du parcours."}, {"term": "Gains", "definition": "Bénéfices et satisfactions attendus ou vécus par le client."}, {"term": "Preuve sociale", "definition": "Éléments rassurants venant d'autres clients (avis, notes, témoignages) qui lèvent l'hésitation."}, {"term": "Taux d'abandon de panier", "definition": "Part des paniers créés mais non payés ; un indicateur clé pour repérer une friction."}, {"term": "Automatisation", "definition": "Usage d'outils pour gagner en réactivité, personnaliser à grande échelle et réduire la friction (relance panier, paiement 1 clic, FAQ)."}, {"term": "ZMOT (complément)", "definition": "Zero Moment of Truth (Google) : moment où le consommateur se renseigne en ligne avant l'achat."}], "qcb": [{"q": "Tous les points de contact sont des moments de vérité.", "answer": false, "explanation": "Tous les moments de vérité sont des points de contact, mais pas l'inverse."}, {"q": "Tous les moments de vérité sont des points de contact.", "answer": true, "explanation": "Un moment de vérité est un point de contact décisif."}, {"q": "Le parcours d'achat classique compte 6 étapes, de la prise de conscience à la recommandation.", "answer": true, "explanation": "Prise de conscience, considération, décision/achat, expérience/utilisation, fidélisation, recommandation."}, {"q": "La cartographie du parcours ne concerne que les étapes avant l'achat.", "answer": false, "explanation": "Elle couvre l'avant, le pendant et l'après-achat."}, {"q": "Un service client et une newsletter sont des points de contact après l'achat.", "answer": true, "explanation": "Tout comme le programme de fidélité."}, {"q": "L'un des objectifs de la cartographie est d'augmenter les conversions.", "answer": true, "explanation": "En repérant les blocages et les moments clés, on met en place des actions concrètes."}, {"q": "La cartographie est un document figé, réalisé une fois pour toutes.", "answer": false, "explanation": "C'est un outil vivant, à affiner avec les données clients."}, {"q": "L'obligation de créer un compte pour commander est un exemple de point de friction à l'étape d'achat.", "answer": true, "explanation": "Exemple de la trame de consolidation, avec le temps de chargement."}, {"q": "Les moments de vérité sont identiques pour tous les consommateurs.", "answer": false, "explanation": "Ils peuvent varier d'une personne à l'autre : il faut observer."}, {"q": "L'affect et le travail sur la marque influencent l'impact des moments de vérité.", "answer": true, "explanation": "D'où l'importance du branding."}, {"q": "Le taux d'abandon de panier est une donnée utile pour repérer des moments de vérité.", "answer": true, "explanation": "Il fait partie de l'analyse des données (avec les clics et les réclamations)."}, {"q": "La relance de panier abandonné est un exemple d'automatisation qui réduit la friction.", "answer": true, "explanation": "Tout comme le paiement en 1 clic."}, {"q": "Dans la grille de priorisation, un poin
