<style>
/* Layout: cahier de révision. Sommaire des matières à gauche (en haut sur mobile), page de cours à droite avec onglets. */
:root {
  --paper: #f5f7fb;
  --sheet: #ffffff;
  --ink: #1b2233;
  --muted: #5b6478;
  --line: #dde2ec;
  --accent: #2346a8;      /* encre bleue */
  --accent-soft: #e6ecfb;
  --pen: #c23a2b;         /* stylo rouge de correction */
  --pen-soft: #fbe9e6;
  --ok: #23774a;
  --ok-soft: #e3f3ea;
  --warn: #9a6400;
  --warn-soft: #fbf1dc;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11141b; --sheet: #181c25; --ink: #e5e8ef; --muted: #9aa3b5; --line: #2a303d;
    --accent: #93acff; --accent-soft: #1f2843; --pen: #ff8a7a; --pen-soft: #3a1f1c;
    --ok: #6fd39a; --ok-soft: #173126; --warn: #f0bf5a; --warn-soft: #33290f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11141b; --sheet: #181c25; --ink: #e5e8ef; --muted: #9aa3b5; --line: #2a303d;
  --accent: #93acff; --accent-soft: #1f2843; --pen: #ff8a7a; --pen-soft: #3a1f1c;
  --ok: #6fd39a; --ok-soft: #173126; --warn: #f0bf5a; --warn-soft: #33290f; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100vh; }
.side { border-right: 1px solid var(--line); background: var(--sheet); padding: 20px 14px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; }
.brand { display: flex; flex-direction: column; gap: 2px; padding: 0 8px 16px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.brand b { font-family: var(--font-display); font-size: 1.35rem; font-weight: 800; letter-spacing: -0.01em; }
.brand span { color: var(--muted); font-size: .82rem; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { text-align: left; background: none; border: 0; border-radius: 8px; padding: 8px 10px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.nav-item:hover { background: var(--accent-soft); }
.nav-item[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.nav-subject { font-family: var(--font-display); font-weight: 700; font-size: .98rem; margin-top: 10px; }
.nav-course { font-size: .88rem; padding-left: 20px; color: var(--muted); }
.nav-course[aria-current="true"] { color: var(--accent); }
.nav-num { font-variant-numeric: tabular-nums; font-size: .75rem; color: var(--muted); }
.nav-sep { border-top: 1px solid var(--line); margin: 12px 0 6px; }
.tag { display: inline-block; font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.tag.later { background: var(--warn-soft); color: var(--warn); }

.main { padding-block: 28px 64px; padding-inline: clamp(16px, 4vw, 48px); min-width: 0; }
.wrap { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.mobile-nav { display: none; }

.eyebrow { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.title-xl { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 800; letter-spacing: -0.02em; }
.title-l { font-size: clamp(1.4rem, 3vw, 1.9rem); font-weight: 700; }
.lead { color: var(--muted); max-width: 65ch; margin: 0; }

.stats { display: flex; flex-wrap: wrap; gap: 28px; padding: 16px 0; border-block: 1px solid var(--line); }
.stat b { display: block; font-family: var(--font-display); font-size: 1.9rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--accent); }
.stat span { color: var(--muted); font-size: .85rem; }

.subjects { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.subject-card { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 10px; text-align: left; }
.subject-card:hover { border-color: var(--accent); }
.subject-card h3 { font-size: 1.15rem; }
.subject-card p { margin: 0; color: var(--muted); font-size: .92rem; }
.subject-card .meta { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: auto; }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); }

.dates { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.date-row { display: grid; grid-template-columns: 110px 150px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: .92rem; }
.date-row b { font-variant-numeric: tabular-nums; }
.date-row span:first-child { color: var(--muted); }

.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: thin; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--paper); z-index: 2; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 12px; white-space: nowrap; color: var(--muted); font-weight: 700; font-size: .92rem; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tab small { font-weight: 400; font-variant-numeric: tabular-nums; }

.section { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); }
.section > summary { cursor: pointer; padding: 14px 18px; font-family: var(--font-display); font-weight: 700; font-size: 1.08rem; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
.section > summary::after { content: "+"; color: var(--muted); }
.section[open] > summary::after { content: "−"; }
.md { padding: 0 18px 16px; min-width: 0; }
.md p { margin: .5em 0; max-width: 72ch; }
.md ul, .md ol { padding-left: 1.3em; margin: .4em 0; }
.md li { margin: .2em 0; }
.md blockquote { margin: .8em 0; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; }
.md blockquote p { margin: 0; }
.md em { color: var(--muted); }
.md strong { color: var(--ink); }
.tablewrap { overflow-x: auto; margin: .6em 0; border: 1px solid var(--line); border-radius: 8px; }
.md table { border-collapse: collapse; width: 100%; font-size: .9rem; }
.md th, .md td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.md th { background: var(--accent-soft); font-weight: 700; }
.md tr:last-child td { border-bottom: 0; }

.list-plain { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.objectives li { padding-left: 22px; position: relative; }
.objectives li::before { content: "→"; position: absolute; left: 0; color: var(--accent); }
.keypoints { counter-reset: kp; }
.keypoints li { counter-increment: kp; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.keypoints li::before { content: counter(kp); font-family: var(--font-display); font-weight: 800; color: var(--accent); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.trap { background: var(--warn-soft); border-radius: 8px; padding: 10px 14px; color: var(--ink); }
.trap::before { content: "Piège · "; font-weight: 700; color: var(--warn); }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.score { font-variant-numeric: tabular-nums; font-weight: 700; }
.btn { border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 8px 14px; font-weight: 700; font-size: .9rem; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
.btn:disabled { opacity: .5; cursor: default; }

.q { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.q.right { border-color: var(--ok); }
.q.wrong { border-color: var(--pen); }
.q-head { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 8px; font-weight: 700; }
.q-head .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.q-src { font-size: .78rem; color: var(--muted); font-weight: 400; display: block; }
.tf { display: flex; gap: 10px; flex-wrap: wrap; }
.tf .btn { min-width: 96px; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { display: grid; grid-template-columns: 22px 22px minmax(0, 1fr); gap: 8px; align-items: start; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; }
.opt input { margin: 3px 0 0; accent-color: var(--accent); }
.opt .l { font-weight: 700; color: var(--muted); }
.opt.is-right { background: var(--ok-soft); border-color: var(--ok); }
.opt.is-missed { border-color: var(--ok); border-style: dashed; }
.opt.is-wrong { background: var(--pen-soft); border-color: var(--pen); }
.btn.picked-right { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.btn.picked-wrong { background: var(--pen-soft); border-color: var(--pen); color: var(--pen); }
.btn.was-right { border-color: var(--ok); color: var(--ok); }
.feedback { border-radius: 8px; padding: 10px 14px; font-size: .94rem; }
.feedback.ok { background: var(--ok-soft); }
.feedback.ok b { color: var(--ok); }
.feedback.ko { background: var(--pen-soft); }
.feedback.ko b { color: var(--pen); }
.result { background: var(--sheet); border: 2px solid var(--accent); border-radius: var(--r); padding: 18px; display: flex; flex-wrap: wrap; gap: 18px; align-items: center; justify-content: space-between; }
.result .big { font-family: var(--font-display); font-size: 2.2rem; font-weight: 800; font-variant-numeric: tabular-nums; }

.card-stage { display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
.flash { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; min-height: 220px; padding: 28px; display: flex; flex-direction: column; gap: 14px; justify-content: center; text-align: center; cursor: pointer; width: 100%; }
.flash h3 { font-size: clamp(1.3rem, 3vw, 1.8rem); }
.flash p { margin: 0 auto; max-width: 55ch; }
.flash .hint { color: var(--muted); font-size: .88rem; }
.flash-ctrl { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.gloss { display: grid; grid-template-columns: minmax(140px, 220px) minmax(0, 1fr); border-top: 1px solid var(--line); }
.gloss dt, .gloss dd { margin: 0; padding: 10px 0; border-bottom: 1px solid var(--line); }
.gloss dt { font-weight: 700; padding-right: 12px; }

textarea { width: 100%; min-height: 110px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); font: inherit; resize: vertical; }
details.answer { border-top: 1px dashed var(--line); padding-top: 8px; }
details.answer > summary { cursor: pointer; color: var(--accent); font-weight: 700; }
details.answer .md { padding: 8px 0 0; }

.exam-form { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.checks label { display: flex; gap: 6px; align-items: center; }
.ranges { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.ranges label { display: flex; flex-direction: column; gap: 4px; font-weight: 700; font-size: .9rem; }
.ranges output { font-variant-numeric: tabular-nums; color: var(--accent); }
input[type=range] { accent-color: var(--accent); width: 100%; }
.empty { background: var(--sheet); border: 1px dashed var(--line); border-radius: var(--r); padding: 24px; color: var(--muted); }
.res-list a { word-break: break-word; }

.levels { display: flex; flex-wrap: wrap; gap: 8px; }
.lvl { border: 1px solid var(--line); background: var(--sheet); border-radius: 99px; padding: 6px 14px; font-weight: 700; font-size: .88rem; }
.lvl small { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.lvl:hover { border-color: var(--accent); }
.lvl[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
.lvl[aria-pressed="true"] small { color: inherit; opacity: .85; }
.lvl:disabled { opacity: .45; cursor: default; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .mobile-nav { display: flex; flex-direction: column; gap: 8px; }
  .mobile-nav select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); font: inherit; }
  .date-row { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .gloss { grid-template-columns: minmax(0, 1fr); }
  .gloss dt { border-bottom: 0; padding-bottom: 0; }
}
@media (prefers-reduced-motion: no-preference) {
  .q, .flash { transition: border-color .2s; }
}
</style>

les aspirations d'une société tout entière."}, {"title": "2. Avant le consommateur : l'acheteur utilitaire (jusqu'au XIXe siècle)", "body": "L'acte d'achat est **fonctionnel, utilitaire et local**. Il répond à un besoin concret, sans dimension expérientielle ni émotionnelle, et **sans mise en scène commerciale**.\n\n- Choix restreint de produits\n- Aucune publicité, aucun marketing\n- Relations directes artisan-producteur ↔ acheteur\n- Achat fondé sur la **nécessité**, pas sur le désir\n- Commerce local et saisonnier"}, {"title": "3. Naissance de la consommation de masse (fin XIXe – début XXe)", "body": "Trois moteurs à retenir :\n\n1. **Industrialisation et standardisation** : la mécanisation permet la production de masse et démocratise les produits manufacturés.\n2. **Grands magasins** (ex. **Le Bon Marché** à Paris) : le client devient un « **visiteur** » séduit par la mise en scène des vitrines (théâtralisation).\n3. **Publicité et marques** : on passe de la réponse au besoin à la **création du désir**, de l'aspiration et du rêve.\n\n*Complément culture générale : Le Bon Marché est fondé par Aristide Boucicaut (1852) ; Émile Zola s'en inspire dans « Au Bonheur des Dames » (1883).*"}, {"title": "4. Le marketing naît avec la société de consommation (1920–1960)", "body": "Facteurs de transformation :\n\n- Croissance économique soutenue après-guerre\n- Urbanisation accélérée\n- Production de masse de biens standardisés\n- Médias de masse (radio, télévision)\n- Élévation du niveau de vie des classes moyennes\n\nLe marketing devient une **discipline scientifique** avec trois concepts fondamentaux : **segmentation, ciblage, positionnement**. Le consommateur devient **l'acteur central** du système économique capitaliste.\n\n| Notion | Définition |\n|---|---|\n| Segmentation | Diviser le marché en groupes homogènes (critères démographiques, sociologiques, comportementaux) |\n| Ciblage | Choisir le ou les segments à atteindre |\n| Positionnement | Définir la place / l'image que la marque veut occuper dans l'esprit du consommateur |\n\n*Attention piège : le cours associe cette période aux « Trente Glorieuses ». Historiquement, l'expression (Jean Fourastié) désigne plutôt 1945–1975. Si on vous demande la date des Trente Glorieuses : 1945–1975.*"}, {"title": "5. Ruptures contemporaines (1968–2000)", "body": "| Période | Ce qui se passe | À retenir |\n|---|---|---|\n| **Mai 68** | Remise en cause de la société marchande | Dénonciation de l'**aliénation** par la consommation, idéal moins matérialiste |\n| **Années 1980** | Apogée individualiste | Le « **yuppie** », réussite sociale par la consommation ostentatoire et le luxe |\n| **Crise écologique** | Premiers doutes | Discours sur la **sobriété** et la consommation responsable face aux limites planétaires |\n| **Alternatives** | Pratiques émergentes | **Bio, commerce équitable, seconde main** : marginales, elles annoncent le XXIe siècle |"}, {"title": "6. Les trois sociologues à connaître par cœur", "body": "| Auteur | Idée clé | Mot-clé | Exemple |\n|---|---|---|---|\n| **Jean Baudrillard** | « On ne consomme pas des objets, mais des **signes** » : la consommation est un **langage social** | Consommation **symbolique** | Acheter un iPhone pour ce qu'il dit de soi |\n| **Pierre Bourdieu** | La consommation révèle et **reproduit les habitus** et les inégalités de classe ; les goûts ne sont jamais neutres | **Habitus** / distinction | Goûts musicaux ou alimentaires liés au milieu social |\n| **Thorstein Veblen** | La consommation **ostentatoire** sert à démontrer publiquement son statut ; le luxe devient performance sociale | Consommation **ostentatoire** | Montre de luxe, voiture de prestige exhibée |\n\n**Astuce mémo** : Baudrillard = **SIGNES** · Bourdieu = **MILIEU SOCIAL** · Veblen = **STATUT / FRIME**.\n\n*Complément (œuvres utiles en copie) : Veblen, « Théorie de la classe de loisir » (1899) ; Baudrillard, « La Société de consommation » (1970) ; Bourdieu, « La Distinction » (1979).*"}, {"title": "7. Typologies contemporaines du consommateur", "body": "| Profil | Comportement |\n|---|---|\n| **Rationnel** | Compare les prix, lit les avis, planifie, optimise le rapport qualité-prix |\n| **Émotionnel** | Instinct, coups de cœur, expérience sensorielle, plaisir immédiat, esthétique |\n| **Zappeur** | Attention fragmentée, boulimie d'informations commerciales, change souvent de marque (culture numérique) |\n| **Responsable** | Intègre l'écologie, le social et l'éthique, parfois au détriment du prix ou de la praticité |\n\n⚠️ Ces typologies **ne sont pas exclusives** : un même individu combine plusieurs profils selon le **contexte** et la **catégorie de produits**."}, {"title": "8. Le consommateur du XXIe siècle", "body": "- **Hyperconnexion** et parcours client **fragmenté**\n- Recherche d'**expériences authentiques** et de valeurs éthiques\n- Profil **paradoxal** : à la fois responsable et impulsif\n- Tension entre **liberté de choix** et **influence algorithmique**\n- Oscillation entre **plaisir** et aspiration à la **sobriété**\n\nRessource du cours : Benoît Heilbrunn, « Le consommateur n'existe pas et le marketing ne prédit pas les achats »."}, {"title": "9. Les quatre paradoxes du consommateur moderne", "body": "| Paradoxe | Explication | Exemple |\n|---|---|---|\n| **Éthique vs impulsivité** | Aspirations éthiques sincères mais achats impulsifs dictés par l'immédiateté digitale | Défendre l'écologie et acheter sur Shein |\n| **Global vs local** | Attrait des marques mondiales vs circuits courts et artisanat local | Commander sur Amazon et faire son marché |\n| **Hyperconnexion vs authenticité** | Chercher l'authentique tout en étant guidé par les algorithmes | Choisir une destination « nature » vue chez un influenceur |\n| **Accumulation vs sobriété** | Héritage du XXe (posséder = réussir) vs minimalisme, décroissance | Vouloir le dernier smartphone et prôner le minimalisme |"}, {"title": "10. Synthèse : le consommateur, miroir de son époque", "body": "| Siècle | Figure du consommateur |\n|---|---|\n| **XIXe** | Acheteur **utilitaire** : besoins fonctionnels, rareté, production artisanale |\n| **XXe** | Consommateur **moderne** : industrialisation, grands magasins, publicité, consommation de masse |\n| **XXIe** | Consommateur **paradoxal**, hyperconnecté, fragmenté : entre hédonisme et responsabilité, individualisme et conscience collective |\n\n**Enjeu contemporain** : concilier les aspirations individuelles (bien-être, plaisir) avec les impératifs collectifs (**durabilité environnementale** et **justice sociale**)."}], "key_points": ["Le consommateur est une construction sociale qui évolue avec son époque.", "Avant le XIXe siècle : acheteur utilitaire, achat de nécessité, local, sans publicité.", "Industrialisation + grands magasins (Le Bon Marché) + publicité/marques = naissance de la consommation de masse.", "1920–1960 : le marketing devient une discipline : segmentation, ciblage, positionnement.", "Mai 68 : critique de la société marchande et de l'aliénation par la consommation.", "Années 1980 : apogée individualiste, yuppies, consommation ostentatoire.", "Baudrillard = signes (consommation symbolique) ; Bourdieu = habitus (milieu social) ; Veblen = consommation ostentatoire (statut).", "Quatre profils non exclusifs : rationnel, émotionnel, zappeur, responsable.", "Quatre paradoxes : éthique/impulsivité, global/local, hyperconnexion/authenticité, accumulation/sobriété.", "Enjeu du XXIe siècle : concilier plaisir individuel, durabilité environnementale et justice sociale."], "traps": ["Ne pas confondre Veblen (montrer sa richesse) et Baudrillard (consommer des signes en général, pas forcément du luxe).", "Bourdieu ne parle pas de « frime » : l'habitus est inconscient et hérité du milieu social.", "Segmentation ≠ ciblage ≠ positionnement : diviser → choisir → se placer dans l'esprit.", "Les typologies ne sont pas exclusives : une même personne peut être rationnelle pour un frigo et émotionnelle pour un parfum.", "Les alternatives (bio, équitable, seconde main) apparaissent dès la fin du XXe siècle, elles ne sont pas nées avec Internet.", "Les grands magasins datent de la fin du XIXe siècle, pas de l'après-guerre."], "glossary": [{"term": "Consommateur", "definition": "Individu qui achète et utilise des biens ou services. Sa conception a évolué de l'acheteur utilitaire du XIXe siècle à un acteur central et complexe du système économique."}, {"term": "Acheteur utilitaire", "definition": "Modèle pré-industriel où l'achat répond exclusivement à un besoin fonctionnel immédiat, sans dimension expérientielle, émotionnelle ou symbolique."}, {"term": "Industrialisation", "definition": "Transformation économique (fin XIXe) : mécanisation, production de masse standardisée, émergence de la consommation à grande échelle."}, {"term": "Grands magasins", "definition": "Espaces commerciaux apparus fin XIXe (Le Bon Marché) qui transforment l'achat en expérience sensorielle et sociale grâce à la théâtralisation des vitrines."}, {"term": "Société de consommation", "definition": "Modèle sociétal du XXe siècle où l'acquisition et l'usage de biens deviennent centraux dans l'identité sociale et l'économie."}, {"term": "Segmentation marketing", "definition": "Diviser le marché en groupes homogènes de consommateurs selon des critères démographiques, sociologiques ou comportementaux."}, {"term": "Ciblage", "definition": "Choix du ou des segments que l'entreprise souhaite atteindre."}, {"term": "Positionnement", "definition": "Place et image que la marque veut occuper dans l'esprit du consommateur, par rapport à ses concurrents."}, {"term": "Habitus (Bourdieu)", "definition": "Système de dispositions durables et transposables, acquises dans un milieu social, qui orientent inconsciemment les goûts, pratiques et choix de consommation."}, {"term": "Consommation ostentatoire (Veblen)", "definition": "Acquisition démonstrative de biens de luxe pour afficher son statut social élevé et se distinguer des classes inférieures."}, {"term": "Consommation symbolique (Baudrillard)", "definition": "Les individus consomment des signes (statut, appartenance, identité) plutôt que la valeur d'usage des objets."}, {"term": "Consommation responsable", "definition": "Pratiques d'achat intégrant des préoccupations éthiques, écologiques et sociales : commerce équitable, bio, circuits courts, économie circulaire."}, {"term": "Mai 68 et critique consumériste", "definition": "Mouvement social et culturel remettant en cause la société marchande, les valeurs matérialistes et l'aliénation par la consommation."}, {"term": "Économie circulaire", "definition": "Modèle privilégiant réutilisation, réparation et recyclage ; incarné par la seconde main (Vinted, Leboncoin)."}, {"term": "Yuppie", "definition": "Figure des années 1980 (young urban professional) : réussite sociale affichée par la consommation ostentatoire et les marques de luxe."}], "qcb": [{"q": "Selon le cours, il existe une « nature » consumériste universelle, identique à toutes les époques.", "answer": false, "explanation": "Le cours affirme l'inverse : le consommateur est une construction sociale évolutive, miroir de son époque."}, {"q": "Avant le XIXe siècle, l'achat est essentiellement fonctionnel, utilitaire et local.", "answer": true, "explanation": "C'est la définition de l'acheteur utilitaire : besoin concret, commerce local et saisonnier."}, {"q": "La publicité joue déjà un rôle central dans le commerce pré-industriel.", "answer": false, "explanation": "La période pré-industrielle se caractérise par l'absence complète de publicité et de marketing."}, {"q": "Les grands magasins transforment le client en « visiteur » séduit par la mise en scène des vitrines.", "answer": true, "explanation": "Exemple du Bon Marché : théâtralisation de l'offre et achat-expérience."}, {"q": "Segmentation, ciblage et positionnement sont les concepts fondamentaux du marketing qui émerge entre 1920 et 1960.", "answer": true, "explanation": "Le marketing devient alors une discipline scientifique structurée autour de ces trois concepts."}, {"q": "Mai 68 marque l'apogée du consumérisme individualiste.", "answer": false, "explanation": "Mai 68 est une remise en cause de la société marchande. L'apogée individualiste correspond aux années 1980."}, {"q": "Pour Baudrillard, on consomme des signes plutôt que des objets.", "answer": true, "explanation": "« On ne consomme pas des objets, mais des signes » : la consommation est un langage social."}, {"q": "Pour Bourdieu, les goûts sont neutres et purement individuels.", "answer": false, "explanation": "Pour Bourdieu, les goûts sont socialement déterminés par l'habitus et reproduisent les inégalités de classe."}, {"q": "Veblen analyse la consommation ostentatoire comme un outil de distinction sociale.", "answer": true, "explanation": "Le luxe devient une performance sociale qui démontre publiquement le statut économique."}, {"q": "L'habitus est un ensemble de dispositions conscientes et choisies librement par l'individu.", "answer": false, "explanation": "L'habitus est acquis dans un milieu social et oriente les goûts de façon largement inconsciente."}, {"q": "Les quatre typologies (rationnel, émotionnel, zappeur, responsable) sont exclusives : chaque individu n'appartient qu'à une seule.", "answer": false, "explanation": "Elles ne sont pas exclusives : un individu combine plusieurs profils selon les contextes et produits."}, {"q": "Le consommateur zappeur se caractérise par une forte fidélité à ses marques.", "answer": false, "explanation": "Le zappeur change fréquemment de marques, avec une attention fragmentée."}, {"q": "Le consommateur responsable peut faire passer l'éthique avant le prix ou la praticité.", "answer": true, "explanation": "Il intègre écologie, social et éthique, parfois au détriment du prix ou de la praticité."}, {"q": "Le commerce équitable et la seconde main émergent comme pratiques alternatives dès la fin du XXe siècle.", "answer": true, "explanation": "Ces pratiques d'abord marginales annoncent les transformations du XXIe siècle."}, {"q": "Le consommateur du XXIe siècle est décrit comme cohérent et prévisible.", "answer": false, "explanation": "Il est paradoxal : responsable et impulsif, en quête d'authenticité mais influencé par les algorithmes."}, {"q": "Acheter local tout en commandant régulièrement sur Amazon illustre le paradoxe global vs local.", "answer": true, "explanation": "Tension entre marques mondiales accessibles et volonté de circuits courts."}, {"q": "L'économie circulaire privilégie l'achat systématique de produits neufs.", "answer": false, "explanation": "Elle privilégie réutilisation, réparation et recyclage (seconde main, Vinted, Leboncoin)."}, {"q": "L'enjeu contemporain est de concilier plaisir individuel, durabilité environnementale et justice sociale.", "answer": true, "explanation": "C'est l'enjeu formulé dans la synthèse du cours."}, {"q": "Un cadre qui publie ses voyages de luxe et collectionne les montres illustre bien la théorie de Veblen.", "answer": true, "explanation": "Consommation visible destinée à afficher un statut : consommation ostentatoire."}, {"q": "La segmentation consiste à choisir l'image que la marque veut occuper dans l'esprit des clients.", "answer": false, "explanation": "Ça, c'est le positionnement. La segmentation consiste à diviser le marché en groupes homogènes."}, {"q": "Dans le cours, l'émergence du marketing comme discipline scientifique est associée à la période 1920–1960, et non à la fin du XIXe siècle.", "answer": true, "explanation": "La fin du XIXe siècle voit naître la consommation de masse (industrialisation, grands magasins, publicité). Le marketing structuré (segmentation, ciblage, positionnement) arrive entre 1920 et 1960.", "level": "moyen"}, {"q": "Pour Veblen, la consommation ostentatoire concerne surtout les besoins vitaux des classes populaires.", "answer": false, "explanation": "Veblen analyse la « classe de loisir » : des dépenses visibles et superflues destinées à afficher un statut élevé, pas la satisfaction de besoins vitaux.", "level": "moyen"}, {"q": "Un même consommateur peut être rationnel pour l'achat d'un réfrigérateur et émotionnel pour l'achat d'un parfum.", "answer": true, "explanation": "Les typologies ne sont pas exclusives : le profil dépend du contexte et de la catégorie de produits.", "level": "moyen"}, {"q": "L'acheteur utilitaire disparaît complètement au XXe siècle : plus aucun achat n'est fait par simple nécessité.", "answer": false, "explanation": "Le cours décrit des figures dominantes par époque, pas des disparitions totales. Des achats de nécessité existent toujours ; c'est leur place dans la société qui change.", "level": "moyen"}, {"q": "Une personne qui achète uniquement en seconde main parce que c'est moins cher, sans aucune motivation écologique, illustre parfaitement le profil « responsable ».", "answer": false, "explanation": "Le profil responsable se définit par la motivation éthique ou écologique. Acheter d'occasion pour le prix relève plutôt du profil rationnel, même si le comportement ressemble à celui du responsable.", "level": "difficile"}, {"q": "Une lecture bourdieusienne de la famille « Biocoop et marché local » peut considérer ce mode de consommation comme un marqueur de classe et pas seulement comme un choix éthique.", "answer": true, "explanation": "Pour Bourdieu, même des goûts « vertueux » sont liés au capital culturel et économique du milieu : ce mode de vie peut aussi distinguer socialement.", "level": "difficile"}], "qcm": [{"q": "Quelle est l'idée centrale du cours ?", "options": ["Le consommateur agit toujours rationnellement", "Le consommateur est une construction sociale évolutive", "La publicité n'a aucune influence", "Tous les consommateurs ont les mêmes goûts"], "answer": [1], "explanation": "Le consommateur reflète les transformations économiques, technologiques et culturelles de son époque."}, {"q": "Quelles caractéristiques décrivent l'époque pré-industrielle ? (plusieurs réponses)", "options": ["Choix restreint de produits", "Relations directes artisans-acheteurs", "Publicité massive", "Commerce local et saisonnier"], "answer": [0, 1, 3], "explanation": "Il n'y a pas de publicité avant l'industrialisation."}, {"q": "Quels sont les trois moteurs de la consommation de masse (fin XIXe – début XXe) ?", "options": ["Industrialisation, grands magasins, publicité et marques", "Internet, smartphones, réseaux sociaux", "Mai 68, écologie, seconde main", "Artisanat, troc, marchés locaux"], "answer": [0], "explanation": "La production de masse, la mise en scène des grands magasins et la création du désir par la publicité."}, {"q": "Quel grand magasin parisien est cité dans le cours ?", "options": ["Les Galeries Lafayette", "Le Printemps", "Le Bon Marché", "La Samaritaine"], "answer": [2], "explanation": "Le Bon Marché est l'exemple du cours."}, {"q": "Quels facteurs expliquent l'émergence de la société de consommation (1920–1960) ? (plusieurs réponses)", "options": ["Croissance économique d'après-guerre", "Urbanisation accélérée", "Développement des médias de masse", "Recul du niveau de vie des classes moyennes"], "answer": [0, 1, 2], "explanation": "Le niveau de vie des classes moyennes s'élève, il ne recule pas."}, {"q": "Les trois concepts fondamentaux du marketing sont :", "options": ["Habitus, classe, distinction", "Segmentation, ciblage, positionnement", "Réparation, recyclage, sobriété", "Attention, intérêt, désir"], "answer": [1], "explanation": "Segmentation → ciblage → positionnement."}, {"q": "Quel auteur associer à la phrase « On ne consomme pas des objets, mais des signes » ?", "options": ["Pierre Bourdieu", "Thorstein Veblen", "Jean Baudrillard", "Benoît Heilbrunn"], "answer": [2], "explanation": "Baudrillard : la consommation comme langage social."}, {"q": "L'habitus de Bourdieu désigne :", "options": ["Une technique publicitaire", "Des dispositions durables acquises dans un milieu social qui orientent les goûts", "Une habitude d'achat en promotion", "Un label écologique"], "answer": [1], "explanation": "Dispositions durables et transposables, largement inconscientes."}, {"q": "La consommation ostentatoire selon Veblen vise à :", "options": ["Satisfaire un besoin vital", "Afficher son statut social par des achats visibles", "Réduire son empreinte carbone", "Comparer les prix"], "answer": [1], "explanation": "Le luxe comme performance sociale et outil de distinction."}, {"q": "Que dénonce Mai 68 ?", "options": ["L'insuffisance de la publicité", "L'aliénation par la consommation et la société marchande", "Le manque de grands magasins", "La disparition du commerce local"], "answer": [1], "explanation": "Critique radicale du consumérisme et des valeurs matérialistes."}, {"q": "Quelle figure symbolise les années 1980 dans le cours ?", "options": ["Le hippie", "Le yuppie", "Le zappeur", "L'artisan"], "answer": [1], "explanation": "Le yuppie : réussite sociale affichée par le luxe."}, {"q": "Quelles pratiques alternatives apparaissent avec la crise écologique ? (plusieurs réponses)", "options": ["Agriculture biologique", "Commerce équitable", "Seconde main", "Fast fashion"], "answer": [0, 1, 2], "explanation": "La fast fashion n'est pas une alternative responsable, au contraire."}, {"q": "Quel profil compare les prix et lit les avis avant d'acheter ?", "options": ["Émotionnel", "Zappeur", "Rationnel", "Responsable"], "answer": [2], "explanation": "Le rationnel planifie et optimise le rapport qualité-prix."}, {"q": "Le consommateur zappeur se caractérise par : (plusieurs réponses)", "options": ["Attention fragmentée", "Changement fréquent de marques", "Boulimie d'informations commerciales", "Fidélité absolue"], "answer": [0, 1, 2], "explanation": "Reflet de la culture numérique contemporaine."}, {"q": "Un étudiant commande sur UberEats, achète sur Vinted et Shein et suit des influenceurs TikTok. Quel(s) profil(s) mobilise-t-il ? (plusieurs réponses)", "options": ["Zappeur / hyperconnecté", "Émotionnel (achats compulsifs)", "Responsable sur certains achats (seconde main Vinted)", "Acheteur utilitaire pré-industriel"], "answer": [0, 1, 2], "explanation": "Profil paradoxal : Vinted relève de l'économie circulaire, Shein de l'impulsivité."}, {"q": "Une famille qui achète bio chez Biocoop, au marché local et refuse la fast fashion illustre :", "options": ["La consommation ostentatoire", "La consommation responsable", "Le consommateur zappeur", "L'acheteur utilitaire"], "answer": [1], "explanation": "Elle intègre des critères écologiques et éthiques. Une lecture bourdieusienne est aussi possible (habitus de classe)."}, {"q": "Quel paradoxe illustre une personne qui cherche des expériences « déconnectées » repérées sur Instagram ?", "options": ["Global vs local", "Hyperconnexion vs authenticité", "Accumulation vs sobriété", "Éthique vs impulsivité"], "answer": [1], "explanation": "Rechercher l'authentique tout en étant guidé par les algorithmes."}, {"q": "Quelles sont les caractéristiques du consommateur du XXIe siècle ? (plusieurs réponses)", "options": ["Hyperconnexion et parcours fragmenté", "Profil à la fois responsable et impulsif", "Tension entre liberté de choix et influence algorithmique", "Achat exclusivement local et saisonnier"], "answer": [0, 1, 2], "explanation": "Le local et saisonnier exclusif caractérise l'acheteur pré-industriel."}, {"q": "L'économie circulaire est incarnée dans le cours par :", "options": ["Amazon et Shein", "Vinted et Leboncoin", "Tesla et LinkedIn", "UberEats"], "answer": [1], "explanation": "Plateformes de seconde main : réutilisation des biens."}, {"q": "Quel est le grand enjeu de la consommation au XXIe siècle ?", "options": ["Supprimer les marques", "Revenir au commerce du XIXe siècle", "Concilier plaisir individuel, durabilité et justice sociale", "Maximiser l'accumulation de biens"], "answer": [2], "explanation": "Tension entre aspirations individuelles et impératifs collectifs."}, {"q": "Remettez dans l'ordre chronologique : (1) yuppies et consommation ostentatoire, (2) grands magasins, (3) segmentation-ciblage-positionnement, (4) critique de Mai 68.", "options": ["2 → 4 → 3 → 1", "2 → 3 → 4 → 1", "2 → 3 → 1 → 4", "3 → 2 → 4 → 1"], "answer": [1], "explanation": "Grands magasins (fin XIXe) → marketing structuré (1920–1960) → Mai 68 → années 1980 (yuppies).", "level": "moyen"}, {"q": "Quelles affirmations sur Bourdieu sont exactes ? (plusieurs réponses)", "options": ["Les goûts ne sont jamais neutres", "L'habitus est acquis dans le milieu social", "L'habitus est un choix conscient de se distinguer", "La consommation peut reproduire les inégalités de classe"], "answer": [0, 1, 3], "explanation": "L'habitus est largement inconscient : on ne « choisit » pas de se distinguer, nos goûts sont façonnés par notre milieu.", "level": "moyen"}, {"q": "Quelle différence principale sépare Baudrillard de Veblen ?", "options": ["Il n'y a aucune différence, ils disent la même chose", "Baudrillard étudie le XIXe siècle, Veblen le XXIe", "Baudrillard parle de tous les objets comme signes, Veblen surtout de l'affichage du statut par le luxe", "Veblen pense que la consommation est inconsciente, Baudrillard qu'elle est rationnelle"], "answer": [2], "explanation": "Chez Baudrillard, tout objet est un signe (pas forcément luxueux). Chez Veblen, l'accent est sur la dépense visible pour montrer son rang.", "level": "moyen"}, {"q": "Quels éléments relèvent du consommateur du XXIe siècle selon le cours ? (plusieurs réponses)", "options": ["Influence des algorithmes sur les choix", "Recherche d'expériences authentiques", "Absence totale de préoccupation éthique", "Parcours client fragmenté"], "answer": [0, 1, 3], "explanation": "Il est paradoxal : il a des aspirations éthiques, même s'il ne les applique pas toujours.", "level": "moyen"}, {"q": "Mise en situation : Léa, 24 ans, achète une paire de sneakers en édition limitée qu'elle ne porte presque jamais, mais elle poste la photo de l'unboxing sur Instagram. Quelles lectures sont pertinentes ? (plusieurs réponses)", "options": ["Baudrillard : l'objet vaut surtout comme signe d'appartenance", "Acheteur utilitaire : l'achat répond à un besoin fonctionnel", "Veblen : afficher un statut par un achat visible et rare", "Paradoxe hyperconnexion vs authenticité ou accumulation vs sobriété selon son discours"], "answer": [0, 2, 3], "explanation": "L'achat n'est pas fonctionnel (elle ne les porte pas). C'est l'affichage et la valeur de signe qui comptent.", "level": "difficile"}, {"q": "Mise en situation : une marque de cosmétiques veut cibler les 25-35 ans urbains sensibles à l'écologie. Elle se présente comme « clean beauty premium ». Ces trois étapes correspondent à :", "options": ["Ciblage → segmentation → positionnement", "Positionnement → ciblage → segmentation", "Segmentation → ciblage → positionnement", "Segmentation → positionnement → ciblage"], "answer": [2], "explanation": "On découpe d'abord le marché (âge, sensibilité écologique), on choisit le segment urbain 25-35, puis on définit l'image « clean beauty premium ».", "level": "difficile"}, {"q": "Mise en situation : un étudiant milite pour le climat, mais commande chaque mois sur Shein pendant les soldes flash. Quel paradoxe est le PLUS précisément illustré ?", "options": ["Global vs local", "Hyperconnexion vs authenticité", "Accumulation vs sobriété", "Éthique vs impulsivité"], "answer": [3], "explanation": "Les quatre se touchent, mais le cœur est la contradiction entre conviction éthique sincère et achat impulsif déclenché par le digital (soldes flash).", "level": "difficile"}, {"q": "Mise en situation : pour expliquer en copie pourquoi « le consommateur est une construction sociale », quels arguments sont recevables ? (plusieurs réponses)", "options": ["Le passage de l'acheteur utilitaire au consommateur moderne avec l'industrialisation", "L'existence d'une nature humaine consumériste identique à toutes les époques", "Le rôle de la publicité dans la création du désir", "L'évolution des valeurs (Mai 68, crise écologique) qui modifie les pratiques"], "answer": [0, 2, 3], "explanation": "La réponse C dit l'inverse de la thèse du cours : il n'y a pas de nature consumériste universelle.", "level": "difficile"}, {"q": "Mise en situation : un concept store parisien mise sur une mise en scène sensorielle (musique, odeurs, décor) pour transformer la visite en expérience. De quelle innovation historique est-ce l'héritier direct ?", "options": ["Des grands magasins de la fin du XIXe siècle", "Des médias de masse de l'après-guerre", "Du commerce local et saisonnier pré-industriel", "Des alternatives de seconde main des années 1990"], "answer": [0], "explanation": "Les grands magasins (Le Bon Marché) ont inventé la théâtralisation : le client devient un visiteur séduit par la mise en scène.", "level": "difficile"}], "open_questions": [{"question": "Pourquoi dit-on que le consommateur est une « construction sociale » ?", "answer": "**Définition** : une construction sociale est une réalité produite par la société et non une donnée naturelle.\n\n**Explication** : la figure du consommateur change selon les époques. Au XIXe siècle, l'acheteur utilitaire répond à des besoins concrets. Au XXe siècle, l'industrialisation, les grands magasins, la publicité et le marketing créent le consommateur moderne. Au XXIe siècle, il devient hyperconnecté et paradoxal.\n\n**Exemple** : on est passé du CD au streaming, du marché local au e-commerce, puis au retour du local et de la seconde main.\n\n**Conclusion** : il n'existe pas de nature consumériste universelle. Le consommateur est le miroir des valeurs et des contradictions de son époque."}, {"question": "Présentez les grandes étapes historiques de l'évolution du consommateur.", "answer": "1. **Jusqu'au XIXe siècle** : acheteur utilitaire. Achat de nécessité, local, sans publicité.\n2. **Fin XIXe – début XXe** : industrialisation, grands magasins (Le Bon Marché), publicité et marques. Naissance de la consommation de masse.\n3. **1920–1960** : société de consommation. Le marketing se structure (segmentation, ciblage, positionnement).\n4. **1968–2000** : critique de Mai 68, apogée individualiste des années 80, premiers doutes écologiques, alternatives (bio, équitable, seconde main).\n5. **XXIe siècle** : consommateur hyperconnecté, fragmenté et paradoxal."}, {"question": "Expliquez les théories de Baudrillard, Bourdieu et Veblen en donnant un exemple pour chacune.", "answer": "- **Baudrillard** : on consomme des **signes**. La consommation est un langage social. *Ex.* : porter une marque streetwear pour signifier son appartenance à une communauté.\n- **Bourdieu** : l'**habitus**, ce sont des dispositions acquises dans un milieu social qui orientent inconsciemment les goûts et reproduisent les inégalités. *Ex.* : fréquenter l'opéra ou les festivals de musique classique selon son origine sociale.\n- **Veblen** : la consommation **ostentatoire** affiche le statut. *Ex.* : exhiber une Rolex ou une Tesla sur les réseaux sociaux.\n\nPoint commun : tous dépassent l'analyse purement économique pour montrer la **fonction sociale** de la consommation."}, {"question": "Distinguez les consommateurs rationnel, émotionnel, zappeur et responsable.", "answer": "- **Rationnel** : compare, lit les avis, planifie, optimise le rapport qualité-prix. *Ex.* : comparer trois smartphones.\n- **Émotionnel** : coup de cœur, instinct, expérience sensorielle. *Ex.* : acheter un parfum dès la première odeur.\n- **Zappeur** : attention fragmentée, change souvent de marque. *Ex.* : passer d'une marque de vêtements à l'autre au gré des pubs.\n- **Responsable** : critères éthiques et écologiques. *Ex.* : acheter bio, local, de seconde main.\n\nCes profils **ne sont pas exclusifs** : ils se combinent selon les contextes."}, {"question": "Expliquez deux paradoxes du consommateur contemporain.", "answer": "**Éthique vs impulsivité** : le consommateur adhère sincèrement aux valeurs écologiques mais cède à l'achat impulsif favorisé par le digital (ex. défendre le climat et commander sur Shein).\n\n**Accumulation vs sobriété** : l'héritage du XXe siècle associe posséder et réussir, tandis que de nouveaux modèles valorisent le minimalisme et la décroissance (ex. suivre des comptes minimalistes tout en achetant des gadgets).\n\nAutres paradoxes possibles : global vs local, hyperconnexion vs authenticité."}, {"question": "Définissez la segmentation, le ciblage et le positionnement.", "answer": "- **Segmentation** : diviser le marché en groupes homogènes de consommateurs (critères démographiques, sociologiques, comportementaux).\n- **Ciblage** : choisir le ou les segments que l'entreprise veut atteindre.\n- **Positionnement** : définir la place et l'image que la marque veut occuper dans l'esprit des consommateurs ciblés, face aux concurrents.\n\n*Ex.* : une marque de cosmétiques segmente par âge et sensibilité écologique, cible les 25-35 ans urbains engagés, se positionne « clean beauty premium »."}, {"question": "Quel est l'enjeu principal de la consommation au XXIe siècle ? Argumentez.", "answer": "Concilier les **aspirations individuelles** (plaisir, bien-être, liberté de choix) avec les **impératifs collectifs** (durabilité environnementale, justice sociale).\n\nArguments : limites planétaires, essor de la consommation responsable et de l'économie circulaire, mais persistance des achats impulsifs et de l'influence algorithmique. Pour les marques : proposer une offre à la fois désirable et responsable (seconde main, réparation, transparence)."}, {"question": "En quoi les grands magasins ont-ils transformé l'acte d'achat ?", "answer": "Ils font passer l'achat du **besoin** à l'**expérience** : le client devient un visiteur séduit par la mise en scène (vitrines, abondance, théâtralisation). L'achat devient sensoriel et social. Ils préfigurent le marketing expérientiel actuel (concept stores, flagships)."}], "exercises": [{"title": "Cas 1 — Analyser un profil fictif (Activité 2 du cours)", "statement": "**Le statut social affiché** : cadre supérieur de 40 ans, propriétaire d'une Tesla, fréquente des restaurants étoilés, collectionne les montres de luxe et publie systématiquement ses voyages haut de gamme sur LinkedIn et Instagram.", "questions": ["Quelle théorie sociologique s'applique le mieux ? Justifiez.", "Quelle typologie moderne peut-on mobiliser ?", "Quelles tensions ou paradoxes ce profil peut-il révéler ?"], "answer": "1. **Veblen (consommation ostentatoire)** : les achats sont visibles et publiés pour démontrer un statut. **Baudrillard** aussi : la Tesla est un signe (modernité, écologie, réussite). **Bourdieu** possible : goûts « distingués » liés à l'habitus de classe supérieure.\n2. Typologie : plutôt **émotionnel** (plaisir, expérience gastronomique), avec une dimension **rationnelle** sur des achats patrimoniaux (montres qui prennent de la valeur).\n3. Paradoxe **éthique vs ostentation** : la Tesla affiche une image écologique, mais les voyages haut de gamme ont une forte empreinte carbone. Paradoxe **hyperconnexion vs authenticité** : vivre des expériences pour les publier."}, {"title": "Cas 2 — Les trois autres profils fictifs", "statement": "Analysez rapidement : (a) **l'hyperconnecté digital** (21 ans, UberEats, Vinted et Shein, influenceurs TikTok, shopping compulsif) ; (b) **la famille écologiquement responsable** (Biocoop, marché local, refus de la fast fashion, covoiturage) ; (c) **le consumériste impulsif** (25 ans, promos, Amazon, sneakers limitées, gadgets).", "questions": ["Associez à chaque profil une théorie et une typologie.", "Identifiez au moins un paradoxe par profil."], "answer": "**(a) Hyperconnecté** : Baudrillard (signes, tendances TikTok). Typologie **zappeur** et **émotionnel**. Paradoxe : Vinted (circulaire) et Shein (fast fashion) en même temps, donc éthique vs impulsivité.\n\n**(b) Famille responsable** : typologie **responsable**. Bourdieu : ce mode de vie peut refléter un habitus de classe moyenne ou supérieure diplômée (capital culturel). Paradoxe possible : vivre en périphérie implique de dépendre de la voiture, d'où le covoiturage.\n\n**(c) Consumériste impulsif** : typologie **émotionnel** et **zappeur**. Veblen ou Baudrillard pour les sneakers limitées (signe d'appartenance, rareté). Paradoxe accumulation vs sobriété, global (Amazon) vs local."}, {"title": "Cas 3 — Quand nos habitudes changent (Activité 3)", "statement": "Choisissez le domaine **musique** et analysez son évolution sur 20 ans.", "questions": ["Quelles sont les causes de cette évolution ?", "Quelles valeurs sociétales reflète-t-elle ?", "Quelles conséquences pour les marques et le marketing ?"], "answer": "**Évolution** : CD → téléchargement → streaming (Spotify, Deezer) → retour du vinyle.\n\n1. **Causes** : numérisation, smartphones, Internet haut débit, modèle de l'abonnement, algorithmes de recommandation.\n2. **Valeurs** : accès plutôt que possession, immédiateté, personnalisation, mais aussi recherche d'authenticité et d'objets symboliques (le vinyle, au sens de Baudrillard).\n3. **Conséquences** : marketing de la playlist et des algorithmes, influenceurs et TikTok comme prescripteurs, fidélisation par l'abonnement, éditions collector et merchandising pour monétiser le symbolique."}, {"title": "Cas 4 — Hier et aujourd'hui (Activité 1)", "statement": "Comparez une pratique historique (avant 1960) et une pratique contemporaine (après 2000).", "questions": ["Proposez un exemple par période avec un mot-clé.", "Expliquez en une phrase la rupture ou la continuité."], "answer": "**Avant 1960** : les vitrines du Bon Marché. Mot-clé : **théâtralisation**.\n**Après 2000** : un influenceur Instagram qui présente un produit. Mot-clé : **prescription digitale**.\n\n**Continuité** : dans les deux cas, on met en scène le produit pour créer le désir. **Rupture** : la mise en scène passe de l'espace physique à l'écran, personnalisée par les algorithmes, et le prescripteur devient un pair (l'influenceur) plutôt que l'enseigne."}], "resources": [{"label": "Vidéo — « Conso – La consommation dans le rétro » (Télé Matin)", "url": "https://youtu.be/7J80FLDvyzI"}, {"label": "Vidéo — Benoît Heilbrunn : « Le consommateur n'existe pas et le marketing ne prédit pas les achats »", "url": "https://www.youtube.com/watch?v=Rug-JHrrzBE"}]}, {"id": "soc-02", "title": "Cours 2 — Les fondements théoriques de la sociologie du consommateur", "subtitle": "Maslow, Pavlov, Freud, Veblen, Bourdieu, Asch et Tarde : des théories à l'action marketing", "date": "", "status": "vu", "sources": ["COURS n°2 - Les fondements théoriques.pptx"], "objectives": ["Comprendre les grandes théories qui expliquent les comportements d'achat et leurs fondements.", "Identifier les apports des sciences humaines (psychologie, sociologie, économie) à la compréhension du consommateur.", "Mobiliser ces théories pour analyser des actions et des stratégies marketing contemporaines."], "summary": [{"title": "1. Les théories classiques de la consommation", "body": "Les comportements de consommation s'appuient sur des théories nées entre la **fin du XIXe et le XXe siècle**, issues de la **psychologie**, de la **sociologie** et de l'**économie**. Anciennes, elles restent **pertinentes** : ce sont des **grilles de lecture** pour comprendre **pourquoi** et **comment** on achète.\n\n> Le consommateur n'est jamais un acteur totalement rationnel et isolé, mais un **être social** influencé par son environnement et ses aspirations identitaires."}, {"title": "2. Abraham Maslow — la hiérarchie des besoins (1943)", "body": "| Niveau (du bas vers le haut) | Besoins | Exemple marketing du cours |\n|---|---|---|\n| 1. **Physiologiques** | Se nourrir, dormir, se vêtir | |\n| 2. **Sécurité** | Logement, stabilité, emploi, santé | |\n| 3. **Appartenance** | Amour, amitié, groupe social | **McDonald's** (moment convivial) |\n| 4. **Estime** | Reconnaissance, réussite, statut | **Rolex** (statut social) |\n| 5. **Accomplissement** | Créativité, dépassement, sens | **Apple** (créativité, innovation) |\n\nChaque produit répond à **un ou plusieurs niveaux** de la pyramide.\n\n**Les 3 limites du modèle** :\n1. **Hiérarchie trop rigide** : la progression n'est pas toujours linéaire. On peut rechercher l'estime avant d'avoir comblé sa sécurité.\n2. **Besoins entremêlés** : un même achat satisfait plusieurs besoins (un vêtement de marque est physiologique, d'appartenance et d'estime).\n3. **Influence culturelle** : dans les cultures **collectivistes**, l'appartenance peut primer sur l'accomplissement, ce qui inverse la hiérarchie."}, {"title": "3. Ivan Pavlov — le conditionnement classique", "body": "Pavlov (**prix Nobel 1904**) montre qu'un comportement peut être **appris par association** : un **stimulus neutre**, régulièrement associé à un **stimulus naturel**, finit par déclencher la réponse à lui seul.\n\n| Élément | En marketing |\n|---|---|\n| Stimulus **neutre** | Logo, son, couleur de marque |\n| Stimulus **naturel** | Émotion positive, plaisir, satisfaction |\n| Réponse **conditionnée** | Préférence automatique pour la marque |\n\n**Principe clé : la répétition**, qui crée habitude et automatisme. Exemples : le **son de Netflix** (attention, anticipation du divertissement), le **jingle d'Intel** (technologie de pointe), les **publicités Coca-Cola à Noël** (émotions joyeuses). L'influence est **largement inconsciente**."}, {"title": "4. Sigmund Freud — la psychanalyse du consommateur", "body": "**Idée clé** : le consommateur agit souvent sous l'influence de **motivations non rationnelles** : **inconscient**, **pulsions**, **désirs refoulés**.\n\nDans les **années 1950**, **Ernest Dichter**, pionnier des **« études de motivation »**, transpose ces concepts au marketing pour toucher les ressorts psychologiques profonds.\n\n**Application** : publicités jouant sur l'**érotisme**, le **pouvoir**, la **domination** ou la **transgression**. Exemple type : les **parfums** (Chanel, Dior) qui évoquent désir, sensualité et mystère."}, {"title": "5. Thorstein Veblen — la consommation ostentatoire (1899)", "body": "Dans **« Théorie de la classe de loisir » (1899)**, Veblen montre que certaines dépenses servent moins à satisfaire un besoin qu'à **afficher un statut social** : on **dépense pour être vu**.\n\n**L'effet Veblen** : paradoxalement, la **demande augmente avec le prix**, car le produit devient un symbole de prestige. Plus il est cher, mieux il remplit sa fonction distinctive.\n\nExemples modernes : luxe (**Hermès, Balenciaga**), véhicules premium (**Porsche, Ferrari**), voyages exclusifs et expériences VIP, **éditions limitées** et collaborations rares. Traduction marketing : **stratégies de luxe et premiumisation**."}, {"title": "6. Pierre Bourdieu — habitus, capitaux et distinction (1979)", "body": "Dans **« La Distinction » (1979)** : nos goûts et nos achats dépendent de notre **habitus**, l'ensemble des **dispositions acquises par l'éducation et le milieu social**. Nos choix ne sont **jamais totalement libres** : **les goûts sont socialement construits**.\n\n| Capital | Contenu |\n|---|---|\n| **Économique** | Revenus, patrimoine, pouvoir d'achat |\n| **Culturel** | Éducation, culture générale, diplômes, pratiques culturelles |\n| **Social** | Réseaux relationnels et professionnels, appartenance à des groupes |\n| **Symbolique** | Prestige, reconnaissance, réputation, légitimité |\n\n**Lecture marketing** : le positionnement doit **correspondre à l'habitus** de la cible.\n- **Bio et éthique** → classes cultivées au **capital culturel élevé**\n- **Technologie** → classes actives urbaines, **capital économique moyen à élevé**, goût de l'innovation\n- **Luxe** → classes dominantes cumulant **capitaux économique, culturel et symbolique**, en quête de **distinction**"}, {"title": "7. La psychologie sociale : l'individu et le groupe", "body": "Nous ne sommes pas des décideurs isolés et rationnels : nos choix sont façonnés par les **interactions**, les **normes** et les **attentes du groupe**. Trois mécanismes : **conformisme**, **imitation**, **influence des pairs**. Ils sont au cœur du marketing d'influence et des réseaux sociaux.\n\n**Solomon Asch — le conformisme (1951)** : expérimentalement, les individus adoptent l'**avis majoritaire même manifestement faux**, pour éviter l'exclusion ou le jugement. Marketing : **phénomène des modes** et viralité ; **preuve sociale** (« Meilleure vente », « 95 % de satisfaction ») pour réduire l'incertitude.\n\n*Complément : dans l'expérience, il fallait comparer la longueur de lignes. Environ un tiers des réponses suivaient la majorité complice, alors que la bonne réponse était évidente.*\n\n**Gabriel Tarde — l'imitation (1890, « Les Lois de l'imitation »)** : les comportements se propagent par **mimétisme**. On imite ceux qu'on admire (leaders d'opinion, influenceurs, célébrités, pairs perçus comme supérieurs). Marketing : **stratégie d'influence**, **placement de produits**, **effet boule de neige** (viralité).\n\n**Les groupes de référence** (amis, collègues, communautés en ligne) : on recherche leur approbation, qu'on y **appartienne** ou qu'on **aspire** à y appartenir. Marketing : **avis clients et notes** (norme sociale), **recommandations personnelles** (le bouche-à-oreille reste l'influence la plus puissante), **communautés de marque** (Apple, joueurs, sportifs : l'appartenance à une tribu renforce la fidélité)."}, {"title": "8. Synthèse : des théories à l'action marketing", "body": "| Théorie | Concept clé | Exemple marketing |\n|---|---|---|\n| **Maslow** | Hiérarchie des besoins | Rolex (estime), Apple (accomplissement), McDonald's (appartenance) |\n| **Pavlov** | Conditionnement classique | Sons Netflix et Intel, Coca-Cola à Noël |\n| **Freud** | Désir et inconscient | Parfums Chanel, Dior |\n| **Veblen** | Consommation ostentatoire | Luxe, premiumisation |\n| **Bourdieu** | Habitus et distinction | Positionnement socioculturel : bio, tech, luxe |\n| **Asch / Tarde** | Conformisme et imitation | Marketing d'influence, avis clients, preuve sociale |\n\n> « Les comportements de consommation ne sont jamais neutres : ils traduisent des besoins, des désirs, des influences sociales et une quête identitaire profonde. »\n\n**Chronologie express** : Tarde **1890** · Veblen **1899** · Pavlov Nobel **1904** · Maslow **1943** · Asch **1951** · Dichter **années 1950** · Bourdieu **1979**."}], "key_points": ["Maslow (1943) : 5 niveaux de besoins (physiologiques, sécurité, appartenance, estime, accomplissement).", "Limites de Maslow : hiérarchie rigide, besoins entremêlés, variations culturelles.", "Pavlov (Nobel 1904) : conditionnement classique ; stimulus neutre + stimulus naturel → réponse conditionnée ; la répétition crée l'automatisme.", "Freud : inconscient, pulsions, désirs refoulés ; Ernest Dichter et les études de motivation (années 1950) ; parfums.", "Veblen (1899, « Théorie de la classe de loisir ») : consommation ostentatoire ; effet Veblen = la demande monte avec le prix.", "Bourdieu (1979, « La Distinction ») : habitus + 4 capitaux (économique, culturel, social, symbolique).", "Asch (1951) : conformisme à la majorité, même fausse → modes, preuve sociale.", "Tarde (1890, « Les Lois de l'imitation ») : imitation de ceux qu'on admire → influenceurs, placement de produits.", "Groupes de référence : avis clients, bouche-à-oreille (influence la plus puissante), communautés de marque.", "Le consommateur n'est ni totalement rationnel ni isolé : c'est un être social."], "traps": ["Ne pas confondre Asch (conformisme : suivre la majorité) et Tarde (imitation : copier ceux qu'on admire).", "Pavlov = conditionnement classique (association), pas une théorie des besoins.", "L'effet Veblen contredit la loi de la demande habituelle : ici, un prix plus élevé augmente la demande.", "Bourdieu : 4 capitaux, pas seulement l'argent. Le capital culturel explique par exemple l'attrait du bio.", "Dichter n'est pas Freud : c'est lui qui transpose la psychanalyse au marketing dans les années 1950.", "Dans l'ordre de Maslow, l'appartenance vient avant l'estime."], "glossary": [{"term": "Pyramide de Maslow", "definition": "Hiérarchie de 5 besoins : physiologiques, sécurité, appartenance, estime, accomplissement (1943)."}, {"term": "Conditionnement classique", "definition": "Apprentissage par association : un stimulus neutre associé à un stimulus naturel finit par déclencher la réponse seul (Pavlov)."}, {"term": "Stimulus neutre", "definition": "En marketing : logo, son, couleur de marque qui, associé à une émotion positive, devient déclencheur."}, {"term": "Inconscient (Freud)", "definition": "Part de la vie psychique hors de la conscience : pulsions et désirs refoulés qui orientent les choix."}, {"term": "Études de motivation", "definition": "Approche d'Ernest Dichter (années 1950) qui applique la psychanalyse au marketing."}, {"term": "Effet Veblen", "definition": "La demande d'un bien de prestige augmente avec son prix, car le prix élevé signale le statut."}, {"term": "Habitus", "definition": "Dispositions acquises par l'éducation et le milieu social, qui orientent les goûts (Bourdieu)."}, {"term": "Capital culturel", "definition": "Éducation, diplômes, culture générale et pratiques culturelles (Bourdieu)."}, {"term": "Capital social", "definition": "Réseau de relations personnelles et professionnelles, appartenance à des groupes (Bourdieu)."}, {"term": "Capital symbolique", "definition": "Prestige, reconnaissance sociale, réputation, légitimité (Bourdieu)."}, {"term": "Conformisme (Asch)", "definition": "Tendance à adopter l'avis majoritaire, même faux, pour éviter l'exclusion."}, {"term": "Preuve sociale", "definition": "Signal indiquant ce que fait la majorité (« meilleure vente », avis, notes) pour rassurer l'acheteur."}, {"term": "Imitation (Tarde)", "definition": "Propagation des comportements par mimétisme envers ceux que l'on admire."}, {"term": "Groupe de référence", "definition": "Groupe auquel on appartient ou aspire à appartenir et dont on cherche l'approbation."}, {"term": "Communauté de marque", "definition": "« Tribu » d'utilisateurs partageant une marque (Apple, gamers…), qui renforce la fidélité."}], "qcb": [{"q": "La pyramide de Maslow a été proposée en 1943.", "answer": true, "explanation": "Elle hiérarchise cinq niveaux de besoins."}, {"q": "Dans la pyramide de Maslow, l'estime se situe juste au-dessus de l'appartenance.", "answer": true, "explanation": "Ordre : physiologiques, sécurité, appartenance, estime, accomplissement."}, {"q": "Selon le cours, Rolex répond surtout au besoin d'accomplissement.", "answer": false, "explanation": "Rolex répond au besoin d'estime (statut). Apple illustre l'accomplissement."}, {"q": "Une limite de Maslow est que la hiérarchie peut varier selon les cultures.", "answer": true, "explanation": "Dans les cultures collectivistes, l'appartenance peut primer."}, {"q": "Pavlov a reçu le prix Nobel en 1904.", "answer": true, "explanation": "Ses travaux sur le conditionnement ont influencé le marketing."}, {"q": "Dans le conditionnement classique, le logo d'une marque joue le rôle de stimulus naturel.", "answer": false, "explanation": "Le logo est un stimulus neutre ; l'émotion positive est le stimulus naturel."}, {"q": "La répétition est le principe fondamental du conditionnement classique.", "answer": true, "explanation": "Elle crée l'habitude et l'automatisme."}, {"q": "Ernest Dichter a transposé la psychanalyse au marketing dans les années 1950.", "answer": true, "explanation": "C'est le pionnier des études de motivation."}, {"q": "Pour Freud, le consommateur est guidé avant tout par la raison.", "answer": false, "explanation": "Il est souvent guidé par des motivations non rationnelles : pulsions, désirs refoulés."}, {"q": "L'effet Veblen signifie que la demande baisse quand le prix d'un produit de luxe augmente.", "answer": false, "explanation": "C'est l'inverse : la demande augmente avec le prix, signe de prestige."}, {"q": "« La Distinction » de Bourdieu date de 1979.", "answer": true, "explanation": "L'ouvrage où il développe habitus et capitaux."}, {"q": "Bourdieu distingue quatre formes de capital : économique, culturel, social et symbolique.", "answer": true, "explanation": "Le capital symbolique renvoie au prestige et à la reconnaissance."}, {"q": "Selon le cours, les produits bio et éthiques ciblent surtout les classes au capital culturel élevé.", "answer": true, "explanation": "Classes cultivées, sensibles à l'environnement."}, {"q": "L'expérience d'Asch montre que les individus résistent toujours à l'avis majoritaire quand il est faux.", "answer": false, "explanation": "Ils ont une forte tendance à se conformer, même à un avis manifestement faux."}, {"q": "Gabriel Tarde a écrit « Les Lois de l'imitation » en 1890.", "answer": true, "explanation": "Les comportements se propagent par mimétisme."}, {"q": "La mention « Meilleure vente » exploite la preuve sociale.", "answer": true, "explanation": "Elle s'appuie sur le besoin de suivre la majorité (conformisme)."}, {"q": "Selon le cours, la publicité télévisée reste l'influence la plus puissante sur les décisions d'achat.", "answer": false, "explanation": "C'est le bouche-à-oreille (les recommandations personnelles)."}, {"q": "Selon Maslow, le besoin d'estime se situe juste au-dessus du besoin d'appartenance.", "answer": true, "explanation": "Ordre : physiologiques → sécurité → appartenance → estime → accomplissement.", "level": "moyen"}, {"q": "Ernest Dichter est le psychanalyste qui a fondé la théorie de l'inconscient reprise ensuite par Freud.", "answer": false, "explanation": "C'est l'inverse : Freud fonde la psychanalyse ; Dichter transpose ses idées au marketing dans les années 1950 (études de motivation).", "level": "moyen"}, {"q": "Chez Bourdieu, le prestige et la réputation relèvent du capital symbolique.", "answer": true, "explanation": "Capital symbolique = prestige, reconnaissance, réputation, légitimité.", "level": "moyen"}, {"q": "Dans l'expérience d'Asch, la majorité des participants a suivi le groupe à chaque essai.", "answer": false, "explanation": "Environ un tiers des réponses suivaient la majorité complice. C'est beaucoup pour une réponse évidente, mais ce n'est pas la majorité des réponses.", "level": "moyen"}, {"q": "Une campagne « 9 clients sur 10 recommandent ce produit » s'appuie d'abord sur le mécanisme décrit par Tarde.", "answer": false, "explanation": "C'est la preuve sociale, liée au conformisme d'Asch : on suit la majorité pour réduire l'incertitude. Tarde décrit l'imitation de figures admirées (influenceurs, célébrités).", "level": "difficile"}, {"q": "Un étudiant qui achète un smartphone haut de gamme à crédit alors qu'il peine à payer son loyer illustre une limite du modèle de Maslow.", "answer": true, "explanation": "Il recherche l'estime avant d'avoir comblé la sécurité : la hiérarchie n'est pas toujours linéaire, c'est la première limite du modèle.", "level": "difficile"}], "qcm": [{"q": "Quels sont les besoins de la pyramide de Maslow ? (plusieurs réponses)", "options": ["Sécurité", "Appartenance", "Accomplissement", "Ostentation"], "answer": [0, 1, 2], "explanation": "Physiologiques, sécurité, appartenance, estime, accomplissement. L'ostentation renvoie à Veblen."}, {"q": "McDonald's, selon le cours, satisfait principalement le besoin :", "options": ["Physiologique uniquement", "D'appartenance (moment convivial)", "D'accomplissement", "De sécurité"], "answer": [1], "explanation": "Le moment convivial partagé."}, {"q": "Quelles sont les limites du modèle de Maslow ? (plusieurs réponses)", "options": ["Hiérarchie trop rigide", "Besoins entremêlés", "Influence culturelle", "Il ignore totalement les besoins physiologiques"], "answer": [0, 1, 2], "explanation": "Les besoins physiologiques sont la base de la pyramide."}, {"q": "Le son d'ouverture de Netflix illustre :", "options": ["La consommation ostentatoire", "Le conditionnement classique", "L'habitus", "La preuve sociale"], "answer": [1], "explanation": "Association répétée d'un son et d'une émotion (Pavlov)."}, {"q": "Dans le schéma de Pavlov appliqué au marketing, la « réponse conditionnée » est :", "options": ["Le logo", "L'émotion positive", "La préférence automatique pour la marque", "Le prix"], "answer": [2], "explanation": "Stimulus neutre + stimulus naturel → préférence."}, {"q": "Quels ressorts les publicités d'inspiration freudienne mobilisent-elles ? (plusieurs réponses)", "options": ["Érotisme", "Pouvoir et domination", "Transgression", "Comparaison des prix"], "answer": [0, 1, 2], "explanation": "Des mécanismes inconscients, pas un raisonnement rationnel."}, {"q": "Quel auteur associer aux « études de motivation » ?", "options": ["Gabriel Tarde", "Ernest Dichter", "Solomon Asch", "Pierre Bourdieu"], "answer": [1], "explanation": "Années 1950, transposition de Freud au marketing."}, {"q": "Quels exemples illustrent l'effet Veblen ? (plusieurs réponses)", "options": ["Un sac Hermès plus désiré parce que très cher", "Une édition limitée de sneakers à prix élevé", "Une Ferrari", "Un paquet de pâtes premier prix"], "answer": [0, 1, 2], "explanation": "Le prix élevé signale le prestige."}, {"q": "Le capital culturel chez Bourdieu comprend : (plusieurs réponses)", "options": ["Les diplômes", "La culture générale", "Les pratiques culturelles", "Le patrimoine immobilier"], "answer": [0, 1, 2], "explanation": "Le patrimoine relève du capital économique."}, {"q": "Le réseau professionnel d'une personne relève du capital :", "options": ["Économique", "Culturel", "Social", "Symbolique"], "answer": [2], "explanation": "Réseaux relationnels et appartenance à des groupes."}, {"q": "Selon le cours, les produits de luxe visent :", "options": ["Les classes actives urbaines au capital économique moyen", "Les classes dominantes cumulant capitaux économique, culturel et symbolique", "Uniquement les classes populaires", "Les classes cultivées au faible capital économique"], "answer": [1], "explanation": "En quête de distinction sociale."}, {"q": "Quels mécanismes de psychologie sociale le cours présente-t-il ? (plusieurs réponses)", "options": ["Conformisme", "Imitation", "Influence des pairs", "Conditionnement classique"], "answer": [0, 1, 2], "explanation": "Le conditionnement relève de Pavlov (psychologie comportementale)."}, {"q": "Un influenceur porte une marque et ses abonnés l'achètent. Quelle théorie l'explique le mieux ?", "options": ["Tarde (imitation)", "Maslow (sécurité)", "Pavlov (Nobel)", "Bourdieu (capital économique)"], "answer": [0], "explanation": "On imite ceux qu'on admire."}, {"q": "Un site affiche « 95 % de clients satisfaits ». Quels concepts sont mobilisés ? (plusieurs réponses)", "options": ["Preuve sociale", "Conformisme (Asch)", "Réduction de l'incertitude", "Consommation ostentatoire"], "answer": [0, 1, 2], "explanation": "Suivre la majorité pour se rassurer."}, {"q": "Remettez les auteurs dans l'ordre chronologique de leurs travaux cités :", "options": ["Tarde (1890) → Veblen (1899) → Maslow (1943) → Asch (1951) → Bourdieu (1979)", "Maslow → Tarde → Veblen → Bourdieu → Asch", "Veblen → Bourdieu → Tarde → Asch → Maslow", "Asch → Maslow → Tarde → Veblen → Bourdieu"], "answer": [0], "explanation": "1890, 1899, 1943, 1951, 1979."}, {"q": "Quelles stratégies relèvent des groupes de référence ? (plusieurs réponses)", "options": ["Avis clients et notation", "Communautés de marque", "Recommandations personnelles", "Jingle radio répété"], "answer": [0, 1, 2], "explanation": "Le jingle relève du conditionnement."}, {"q": "Dans le schéma de Pavlov appliqué au jingle Intel, quel est le stimulus NEUTRE ?", "options": ["L'image de technologie de pointe", "Le prix de l'ordinateur", "Le jingle sonore", "La préférence pour les PC équipés Intel"], "answer": [2], "explanation": "Le son est neutre au départ ; associé à l'idée de technologie performante, il finit par déclencher seul une réponse favorable.", "level": "moyen"}, {"q": "Quels capitaux de Bourdieu sont cumulés par la cible du luxe selon le cours ? (plusieurs réponses)", "options": ["Culturel", "Symbolique", "Économique", "Aucun : le luxe s'adresse à tous les milieux de la même façon"], "answer": [0, 1, 2], "explanation": "Le cours décrit les classes dominantes cumulant capitaux économique, culturel et symbolique, en quête de distinction.", "level": "moyen"}, {"q": "Quelle phrase décrit le mieux l'effet Veblen ?", "options": ["Le prix n'a aucun effet sur la demande de luxe", "Quand le prix baisse, la demande augmente toujours", "Quand le prix monte, la demande augmente car le produit gagne en prestige", "Les produits chers sont achetés uniquement pour leur qualité"], "answer": [2], "explanation": "L'effet Veblen contredit la loi de la demande classique : la cherté fait partie de la valeur du produit.", "level": "moyen"}, {"q": "Associez correctement : quelle paire auteur / date est exacte ? (plusieurs réponses)", "options": ["Tarde — 1890", "Asch — 1951", "Maslow — 1943", "Bourdieu — 1899"], "answer": [0, 1, 2], "explanation": "Bourdieu publie « La Distinction » en 1979. 1899, c'est Veblen.", "level": "moyen"}, {"q": "Mise en situation : une marque de parfum diffuse une publicité en clair-obscur, avec une égérie mystérieuse et une ambiance de transgression. Quelle grille de lecture est la plus adaptée ?", "options": ["Maslow : besoin de sécurité", "Freud : désirs inconscients et pulsions", "Bourdieu : capital social", "Pavlov : répétition d'un stimulus neutre"], "answer": [1], "explanation": "Désir, sensualité, mystère, transgression : ressorts non rationnels de l'approche freudienne, transposée au marketing par Dichter.", "level": "difficile"}, {"q": "Mise en situation : une enseigne bio ouvre un magasin. Selon la lecture bourdieusienne du cours, quelle cible et quel capital privilégier ?", "options": ["Classes actives urbaines au capital économique moyen à élevé, goût de l'innovation", "Tous les milieux sans distinction, car le bio est un besoin physiologique", "Classes dominantes cumulant tous les capitaux, en quête de distinction", "Classes cultivées au capital culturel élevé"], "answer": [3], "explanation": "Bio et éthique → capital culturel élevé. B correspond à la technologie, C au luxe.", "level": "difficile"}, {"q": "Mise en situation : une marque de soda diffuse chaque année la même publicité festive en décembre, avec la même musique. Quels éléments relèvent de Pavlov ? (plusieurs réponses)", "options": ["Une préférence pour la marque devenue automatique", "Le choix rationnel du soda le moins cher", "La répétition annuelle du même univers", "L'association de la marque à des émotions joyeuses"], "answer": [0, 2, 3], "explanation": "Stimulus neutre (marque, musique) + stimulus naturel (joie de Noël) + répétition → réponse conditionnée. Le choix rationnel n'en fait pas partie.", "level": "difficile"}, {"q": "Mise en situation : une marque de vêtements de luxe augmente ses prix de 15 % et ses ventes progressent. Elle sort aussi une édition limitée qui part en quelques heures. Quels concepts expliquent ces résultats ? (plusieurs réponses)", "options": ["Conditionnement classique de Pavlov", "Consommation ostentatoire", "Distinction au sens de Bourdieu", "Effet Veblen"], "answer": [1, 2, 3], "explanation": "La hausse de prix renforce le prestige (Veblen) ; la rareté sert la distinction. Pavlov n'intervient pas : il n'y a pas d'association répétée stimulus/réponse ici.", "level": "difficile"}, {"q": "Mise en situation : dans une copie, un étudiant écrit : « Le vêtement de marque satisfait uniquement le besoin d'estime. » Quelle critique est la plus juste ?", "options": ["Il fallait citer le besoin de sécurité uniquement", "Maslow ne s'applique pas aux vêtements", "C'est exact, un vêtement de marque ne touche qu'un seul niveau", "Les besoins sont entremêlés : le vêtement couvre aussi les besoins physiologiques et d'appartenance"], "answer": [3], "explanation": "C'est l'exemple même du cours pour la limite « besoins entremêlés » : physiologique (se vêtir), appartenance (groupe) et estime (statut).", "level": "difficile"}], "open_questions": [{"question": "Présentez la pyramide de Maslow, son intérêt marketing et ses limites.", "answer": "**Définition** : Maslow (1943) hiérarchise 5 besoins : physiologiques, sécurité, appartenance, estime, accomplissement.\n\n**Intérêt marketing** : chaque produit répond à un ou plusieurs niveaux. McDonald's vise l'appartenance (convivialité), Rolex l'estime (statut), Apple l'accomplissement (créativité). La marque choisit le besoin qu'elle met en avant dans sa communication.\n\n**Limites** : hiérarchie trop rigide (on peut chercher l'estime avant la sécurité) ; besoins entremêlés (un vêtement de marque satisfait plusieurs niveaux) ; influence culturelle (l'appartenance prime dans les cultures collectivistes).\n\n**Conclusion** : une grille utile pour comprendre les motivations, mais pas une loi universelle."}, {"question": "Expliquez le conditionnement classique de Pavlov et son usage en marketing.", "answer": "Pavlov (Nobel 1904) montre qu'un comportement s'apprend par **association** : un stimulus neutre, associé de façon répétée à un stimulus naturel, déclenche ensuite seul la réponse.\n\nEn marketing : **stimulus neutre** = logo, son, couleur ; **stimulus naturel** = émotion positive ; **réponse** = préférence automatique pour la marque. La **répétition** crée l'automatisme.\n\nExemples : son Netflix, jingle Intel, Coca-Cola à Noël. L'effet est largement **inconscient**."}, {"question": "Comparez Veblen et Bourdieu : en quoi éclairent-ils la consommation de luxe ?", "answer": "**Veblen (1899)** : la consommation **ostentatoire** vise à afficher richesse et pouvoir. **Effet Veblen** : la demande augmente avec le prix. Le luxe est une **démonstration** visible.\n\n**Bourdieu (1979)** : les goûts dépendent de l'**habitus** et des **capitaux** (économique, culturel,
