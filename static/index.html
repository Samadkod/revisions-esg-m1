 social, symbolique). Le luxe vise les classes dominantes qui cumulent ces capitaux et cherchent la **distinction**. Le « bon goût » est lui-même un marqueur social.\n\n**Différence** : Veblen insiste sur la **dépense visible** ; Bourdieu sur les **goûts socialement construits**, souvent inconscients. Un luxe discret (« quiet luxury ») s'explique mieux par Bourdieu que par Veblen."}, {"question": "Comment la psychologie sociale (Asch, Tarde, groupes de référence) explique-t-elle le marketing d'influence ?", "answer": "**Asch (1951)** : on se **conforme** à la majorité, même quand elle a tort, d'où les modes, la viralité et la preuve sociale (avis, « meilleure vente »).\n\n**Tarde (1890)** : on **imite** ceux qu'on admire, d'où les influenceurs, le placement de produits et l'effet boule de neige.\n\n**Groupes de référence** : on cherche l'approbation de ses pairs ou du groupe auquel on aspire, d'où les avis clients, le bouche-à-oreille et les communautés de marque.\n\n**Conclusion** : le marketing d'influence combine imitation (l'influenceur admiré) et conformisme (« tout le monde l'a »)."}], "exercises": [{"title": "Activité 3 — Atelier d'analyse de campagnes", "statement": "Analysez trois campagnes : (a) la publicité de Noël Coca-Cola avec ses camions illuminés ; (b) une publicité de parfum mettant en scène un couple dans une ambiance sensuelle ; (c) une marque de cosmétiques qui fait porter sa nouvelle gamme par une influenceuse et affiche « déjà 10 000 avis 5 étoiles ».", "questions": ["Quelle(s) théorie(s) chaque campagne mobilise-t-elle ?", "Justifiez avec le vocabulaire du cours."], "answer": "**(a) Coca-Cola à Noël → Pavlov.** Association répétée chaque année entre la marque (stimulus neutre) et la joie des fêtes (stimulus naturel), d'où une préférence conditionnée. On peut aussi citer Maslow (appartenance : le partage en famille).\n\n**(b) Parfum sensuel → Freud et Dichter.** La publicité fait appel à l'inconscient, au désir et à la sensualité, pas à des arguments rationnels.\n\n**(c) Influenceuse + avis → Tarde, Asch et groupes de référence.** On imite l'influenceuse admirée (Tarde). Les « 10 000 avis » sont une preuve sociale qui pousse au conformisme (Asch). Les avis forment une norme sociale."}, {"title": "Activité 1 — Les théories en images", "statement": "Associez chaque situation à une théorie : (1) une étudiante achète un sac de créateur très cher pour le montrer à ses amies ; (2) un cadre fréquente l'opéra comme ses parents ; (3) après avoir vu la même pub 20 fois, vous choisissez spontanément cette marque ; (4) vous achetez le livre que « tout le monde lit » ; (5) un sportif s'offre une montre connectée pour battre ses records personnels.", "questions": ["Donnez la théorie et le concept pour chaque cas."], "answer": "(1) **Veblen** : consommation ostentatoire (éventuellement Maslow, estime).\n(2) **Bourdieu** : habitus et capital culturel hérité.\n(3) **Pavlov** : conditionnement par la répétition.\n(4) **Asch** : conformisme et preuve sociale.\n(5) **Maslow** : besoin d'accomplissement (dépassement de soi)."}, {"title": "Activité 2 — L'expérience d'Asch en classe", "statement": "En classe, on montre des images (longueur de lignes, couleur d'un mot, objet le plus lourd, récipient qui contient le plus d'eau) et plusieurs complices donnent volontairement une mauvaise réponse avant vous.", "questions": ["Que cherche-t-on à montrer ?", "Quel lien avec le marketing ?"], "answer": "On cherche à montrer la **pression du groupe** : même face à une réponse évidente, beaucoup d'individus suivent la majorité pour éviter le jugement ou l'exclusion (**conformisme**).\n\n**Lien marketing** : les marques mettent en avant la majorité (« best-seller », nombre d'avis, « 9 personnes regardent ce produit ») pour déclencher l'adhésion. C'est la **preuve sociale**, moteur des modes et de la viralité."}], "resources": []}]}, {"id": "english-business", "order": 3, "folder": "03. ENGLISH BUSSINESS", "title": "Business English — Global Launch Project", "short": "English", "teacher": "Evelise Guioto de Souza", "description": "Vocabulaire du business international, construit autour du Global Launch Project : analyse de marché, stratégie d'entrée, marketing, opérations et finance.", "key_dates": [{"date": "23 Nov 2026", "label": "Class 4 — Marketing Strategy + Book test 1"}, {"date": "18 Dec 2026", "label": "Oral Mid-Term (group research progress)"}, {"date": "12 Jan 2027", "label": "Written Quiz"}, {"date": "25 Mar 2027", "label": "Global Launch Board Game + Book test 2"}, {"date": "24 May 2027", "label": "Final Oral Presentation (~15 min)"}, {"date": "28 May 2027", "label": "Written Exam"}], "exam_info": "Written exams: **handwritten notes in a notebook allowed**, no screens, no printed material, no loose sheets. Content: grammar and vocabulary seen in class, **not limited to the words in the program**. Oral presentations are **graded individually** on grammar, vocabulary and pronunciation. Slides: keywords, numbers, charts and images only, **no sentences**. Reading is NOT oral production.", "courses": [{"id": "eng-00", "title": "Module 0 — Course rules, assessment & the Global Launch Project", "subtitle": "How the class works, how you are graded, what the project requires", "date": "01/10/2026", "status": "vu", "sources": ["English_Class_Rules_EN_FR.docx (2).pdf", "Global_Launch_Project_Guidelines_M1_2026-2027.docx (1).pdf", "M1MC_ESG_English Program 2026-2027 (1).pdf", "M1CM_2026-2027_Program.xlsx"], "objectives": ["Know the class rules and how written and oral assessments work.", "Understand the five parts of the Global Launch Project and its deliverables.", "Prepare an oral presentation that respects the rules (no reading, no text on slides)."], "summary": [{"title": "1. Course overview", "body": "- **Content**: grammar, vocabulary, projects (the **final presentation is GRADED**).\n- **Methodology**: explanations and practice, autonomy (projects, role play), **flipped classroom**, and **SPEAK ENGLISH**: ask your questions at the end of class.\n- **Grades**: **written** (in-class evaluations, book tests, quizzes) and **oral presentations**.\n- **Learn to learn**: take notes, build your own vocabulary list, always check the **pronunciation**, be smart with technology."}, {"title": "2. Assessment rules (very important)", "body": "| | Oral presentations | Written exams |\n|---|---|---|\n| Graded | **Individually** (no group grade) | Individually |\n| Criteria | **Grammar, vocabulary, pronunciation** | Grammar and vocabulary **seen in class**, not only the words in the program |\n| Allowed | Slides with **symbols, keywords, dates, figures, statistics** | **Handwritten notes in your notebook** |\n| Forbidden | **Reading a text**, full sentences on slides, phone, notes | **Any screen** (phone, computer, smartwatch), **printed material**, **loose sheets** |\n\n> Reading a text out loud is **NOT** oral production."}, {"title": "3. Flipped class & homework", "body": "- **Before class**: do the reading, get the main ideas, take notes (**quizzes in class**), learn the **target vocabulary**.\n- AI may be used to **simplify** a text that is really too hard, but **NOT to extract the main ideas or to translate**.\n- Assessments are in English: **there's no point in translating everything!** Prefer **definitions over translations**.\n- **Homework rhythm**: **45 minutes, 3 times a week** ✅, rather than 3 hours once a month ❌. Regularity beats intensity, like at the gym.\n- Classroom rules: **no phones, no computers**, unless the teacher asks.\n- *If ChatGPT does your work, the only one learning is AI, not you.*"}, {"title": "4. The Global Launch Project", "body": "Research a **real company** that expanded into a **new international market** and reconstruct **what actually happened**, using evidence. It's a **research project, not an invention**.\n\nExamples (not mandatory): Starbucks in China · IKEA in India · Tesla in Germany · Netflix in South Korea · Carrefour in Brazil. Pick a case with **enough public information in English**: that matters more than a famous name.\n\n| Part | Topic | Key vocabulary |\n|---|---|---|\n| 1 | **Market Analysis** | market size, target segment, market demand, competitor analysis, market share, entry barriers |\n| 2 | **Entry Strategy** | joint venture, acquisition, direct investment, strategic alliance, licensing/franchising, greenfield investment |\n| 3 | **Marketing Strategy** | positioning, product adaptation, pricing strategy, promotion mix, brand awareness, distribution channel, market segmentation |\n| 4 | **Operations & Supply Chain** | logistics, supply chain, local management, outsourcing, quality control, economies of scale |\n| 5 | **Financial Objectives & Conclusion** | break-even point, ROI, revenue forecast, profit margin, strategic objectives, cash flow |\n\n**Sources**: company reports, investor presentations, press releases, financial news (Reuters, FT, Bloomberg), case studies (Harvard, McKinsey, Statista), trade journals. **AI is a tool, NOT a source**: every fact must be traceable to a real document, with its link.\n\n**Deliverables**: list of links (in English) · **~15 min oral presentation** covering the 5 parts **in order** · visual support (PowerPoint, Prezi, Canva) showing your sources."}, {"title": "5. Useful phrases for your presentation", "body": "| Function | Phrases |\n|---|---|\n| Opening | *Good morning everyone. Today we're going to talk about…* / *Our case study is…* |\n| Structuring | *First of all… Then… After that… Finally…* / *Let's move on to part 2.* |\n| Showing data | *As you can see on this chart… / Sales rose by 12% / The market share dropped to…* |\n| Giving evidence | *According to Reuters… / The company's annual report states that…* |\n| Opinion | *In our view… / We believe the expansion was successful because…* |\n| Concluding | *To sum up… / Thank you for your attention. Do you have any questions?* |\n\n**Trend verbs**: rise / increase / grow ↗ · fall / decrease / decline / drop ↘ · remain stable / level off → · peak / reach a peak."}, {"title": "6. False friends French speakers often get wrong", "body": "| ❌ Don't say | ✅ Say | Why |\n|---|---|---|\n| *actually* (= actuellement) | **currently / nowadays** | *actually* = en fait |\n| *eventually* (= éventuellement) | **possibly** | *eventually* = finalement |\n| *informations* | **information** (uncountable) | no plural |\n| *concurrence* | **competition** | *competitor* = concurrent |\n| *benefit* (= bénéfice comptable) | **profit** | *benefit* = avantage |\n| *a formation* | **training** | |\n| *to assist to a meeting* | **to attend a meeting** | *to assist* = aider |\n| *a librairie* | **a bookshop** | *library* = bibliothèque |\n| *sensible* | **sensitive** | *sensible* = raisonnable |\n| *achieve* (= achever) | **finish / complete** | *achieve* = atteindre, réussir |"}], "key_points": ["Oral grade is individual: grammar, vocabulary, pronunciation.", "Slides: keywords, symbols, numbers, charts. No sentences. No reading.", "Written exams: handwritten notebook allowed; no screens, no printed material, no loose sheets.", "Written content: grammar and vocabulary seen in class, not only program words.", "Flipped class: read before class, learn target vocabulary; quizzes in class.", "AI may simplify a hard text, not extract main ideas or translate. AI is a tool, NOT a source.", "Homework: 45 min × 3 per week beats 3 h once a month.", "Project: a real company's real international expansion, 5 parts in order, ~15 min, sources with links."], "traps": ["« The project is a creative business plan » → NO: it's research on what really happened.", "ChatGPT is never a source to cite: every fact needs a traceable link.", "You may bring handwritten notes to the written exam, but only in a notebook (no loose sheets).", "Group project but individual grade."], "glossary": [{"term": "Flipped classroom", "definition": "You study the material (reading, vocabulary) before class; class time is for practice. FR : classe inversée."}, {"term": "Oral production", "definition": "Speaking spontaneously in English; reading a text aloud does not count. FR : production orale."}, {"term": "Deliverable", "definition": "A piece of work you must hand in or present. FR : livrable."}, {"term": "Source", "definition": "A traceable article, report or document supporting a fact. AI tools are not sources."}, {"term": "Case study", "definition": "In-depth analysis of a real company situation. FR : étude de cas."}, {"term": "Signposting", "definition": "Phrases that guide the audience through a presentation (first, then, let's move on to…)."}], "qcb": [{"q": "The oral presentation is graded as a group: everyone gets the same mark.", "answer": false, "explanation": "Presentations are graded individually; there is no group grade."}, {"q": "Your slides may contain keywords, figures and statistics, but not full sentences.", "answer": true, "explanation": "Symbols, keywords, dates, figures and charts are allowed; text is not."}, {"q": "Reading your notes aloud during the presentation counts as oral production.", "answer": false, "explanation": "Reading a text is NOT oral production. No reading during the presentation."}, {"q": "During written exams you may use handwritten notes kept in a notebook.", "answer": true, "explanation": "Only notes in your notebook: no loose sheets, no printed material, no screens."}, {"q": "The written exam only covers the words listed in the program.", "answer": false, "explanation": "It covers grammar and vocabulary seen in class, not limited to the program words."}, {"q": "You may use AI to translate the flipped-class reading into French.", "answer": false, "explanation": "AI may only simplify a text that is really too hard, not translate it or extract its main ideas."}, {"q": "ChatGPT can be cited as a source in the Global Launch Project.", "answer": false, "explanation": "AI tools are not sources: every fact must be traceable to a real article or report."}, {"q": "The project must present the five parts in order.", "answer": true, "explanation": "Market Analysis, Entry Strategy, Marketing Strategy, Operations & Supply Chain, Financial Objectives."}, {"q": "Studying 45 minutes three times a week is better than 3 hours once a month.", "answer": true, "explanation": "Regularity matters more than intensity."}, {"q": "Choosing a famous company is more important than having enough public information.", "answer": false, "explanation": "Enough public information in English matters more than fame."}, {"q": "The final presentation lasts approximately 15 minutes.", "answer": true, "explanation": "About 15 minutes, covering all five parts."}, {"q": "In the written exam, you may bring your handwritten notes on loose sheets of paper.", "answer": false, "explanation": "Handwritten notes are allowed only in your notebook. Loose sheets are forbidden.", "level": "moyen"}, {"q": "The group presents the project together, but each student receives an individual grade.", "answer": true, "explanation": "Oral presentations are graded individually: grammar, vocabulary, pronunciation.", "level": "moyen"}, {"q": "Using AI to extract the main ideas of the reading before class is allowed if you check the result.", "answer": false, "explanation": "AI may only simplify a text that is really too hard. Extracting main ideas or translating is not allowed.", "level": "moyen"}, {"q": "« We will eventually open a second store » means « Nous ouvrirons peut-être un second magasin ».", "answer": false, "explanation": "Eventually = finalement / à terme. « Peut-être » = possibly.", "level": "moyen"}, {"q": "A student says: « This expansion was sensible because the market was very sensitive to price. » Both words are used correctly.", "answer": true, "explanation": "Sensible = raisonnable ; sensitive = sensible (au prix). Both are correct here, which is the trap.", "level": "difficile"}, {"q": "If your case study is about a little-known company with plenty of English sources, it is a worse choice than a famous brand with few sources.", "answer": false, "explanation": "The course says enough public information in English matters more than a famous name.", "level": "difficile"}], "qcm": [{"q": "What is the oral grade based on? (several answers)", "options": ["Grammar", "Vocabulary", "Pronunciation", "The design of the slides"], "answer": [0, 1, 2], "explanation": "Oral production: grammar, vocabulary, pronunciation."}, {"q": "Which items are FORBIDDEN in the written exam? (several answers)", "options": ["Smartwatch", "Printed material", "Loose sheets of paper", "Your handwritten notebook"], "answer": [0, 1, 2], "explanation": "Only the handwritten notebook is allowed."}, {"q": "Which of these are acceptable sources for the project? (several answers)", "options": ["Company annual reports", "Reuters or Financial Times articles", "Harvard or McKinsey case studies", "A ChatGPT answer"], "answer": [0, 1, 2], "explanation": "AI is a tool, not a source."}, {"q": "What is the correct order of the five project parts?", "options": ["Marketing → Market Analysis → Finance → Entry → Operations", "Market Analysis → Entry Strategy → Marketing Strategy → Operations & Supply Chain → Financial Objectives", "Entry Strategy → Finance → Marketing → Market Analysis → Operations", "Operations → Marketing → Entry → Finance → Market Analysis"], "answer": [1], "explanation": "That's the required order."}, {"q": "Choose the correct sentence.", "options": ["We found many informations about IKEA.", "We found a lot of information about IKEA.", "We found an information about IKEA.", "We found much informations about IKEA."], "answer": [1], "explanation": "Information is uncountable: no plural, no « an »."}, {"q": "« Actuellement, Tesla produit en Allemagne. » The best translation is:", "options": ["Actually, Tesla produces in Germany.", "Currently, Tesla produces in Germany.", "Eventually, Tesla produces in Germany.", "Actively, Tesla produces in Germany."], "answer": [1], "explanation": "Actually = en fait ; currently = actuellement."}, {"q": "Which word means « concurrence » in a business context?", "options": ["Concurrence", "Competition", "Competence", "Concourse"], "answer": [1], "explanation": "Competition ; a competitor = un concurrent."}, {"q": "What is the deliverable list for the project? (several answers)", "options": ["A list of links to every source used (in English)", "A ~15-minute oral presentation", "Visual support showing your sources", "A 30-page written report"], "answer": [0, 1, 2], "explanation": "No written report is required."}, {"q": "Which phrase is best to move to the next part of your presentation?", "options": ["Let's move on to the entry strategy.", "I read now the next slide.", "Now I am going to read you part 2.", "Next informations are…"], "answer": [0], "explanation": "Signposting phrase; never « read »."}, {"q": "« Sales went from 10 to 15 million. » Which verbs describe this trend? (several answers)", "options": ["Sales rose", "Sales increased", "Sales declined", "Sales grew"], "answer": [0, 1, 3], "explanation": "Rise / increase / grow ↗ ; decline ↘."}, {"q": "Which sentences are correct? (several answers)", "options": ["We attended the investor meeting last week.", "We assisted to a training about logistics.", "The company made a large profit in 2023.", "We need more information about the market."], "answer": [0, 2, 3], "explanation": "« Assist to » is wrong: say « attend a training session ». Information is uncountable and « profit » is the accounting term.", "level": "moyen"}, {"q": "Which slide content follows the course rules?", "options": ["No slides, just reading from your phone", "The script you will read aloud", "A full paragraph explaining the strategy", "« 2019 → entry · 12% share · $3 bn » with a chart"], "answer": [3], "explanation": "Slides may show keywords, symbols, dates, figures and statistics. No sentences, no reading, no phone.", "level": "moyen"}, {"q": "« Our case study shows the company actually lost money in India. » What does « actually » mean here?", "options": ["En fait", "Éventuellement", "Finalement", "Actuellement"], "answer": [0], "explanation": "Actually = en fait. Actuellement = currently / nowadays.", "level": "moyen"}, {"q": "Which sources can you cite in the project? (several answers)", "options": ["The company's annual report", "A Harvard case study", "A summary written by ChatGPT", "A Reuters article with its link"], "answer": [0, 1, 3], "explanation": "AI is a tool, not a source. Every fact must come from a real, traceable document.", "level": "moyen"}, {"q": "Scenario: during your presentation you want to quote a figure from the Financial Times showing sales fell from $5 bn to $4 bn. Which sentence is the best? ", "options": ["The FT says the benefits fell to 4 billions.", "Sales have eventually rised to $4 billion.", "According to the Financial Times, sales dropped from $5 billion to $4 billion.", "Actually, the sales decreased of 1 billion according to FT."], "answer": [2], "explanation": "B: wrong preposition and false friend. C: benefits ≠ profit, « billions » after a number takes no s. D: wrong trend and « rised » is not a verb form.", "level": "difficile"}, {"q": "Scenario: your teammate wants to « translate the whole reading with DeepL to understand it better ». What does the course recommend? (several answers)", "options": ["Don't translate everything, the assessments are in English", "Translate everything so nothing is missed", "AI may simplify a text that is really too hard", "Prefer definitions over translations"], "answer": [0, 2, 3], "explanation": "The course says « there's no point in translating everything ». Simplification is allowed, translation is not.", "level": "difficile"}, {"q": "Scenario: you study 3 hours the night before each quiz, once a month. Your friend studies 45 minutes three times a week. Which statement matches the course?", "options": ["Your friend's method is better: regularity beats intensity", "Both are equal since the total time is similar", "Your method is better because it's more intense", "Studying only before quizzes is what the flipped class recommends"], "answer": [0], "explanation": "45 min × 3 per week is the recommended rhythm (« like at the gym »).", "level": "difficile"}, {"q": "Scenario: you present Part 4 before Part 2 because « it's more interesting ». What's the problem?", "options": ["The 5 parts must be presented in order", "Nothing, the order is free", "You must present only 3 parts", "Part 4 doesn't exist"], "answer": [0], "explanation": "Deliverable: ~15-minute presentation covering the 5 parts in order (market analysis → entry → marketing → operations → finance).", "level": "difficile"}, {"q": "Scenario: your slide shows « Sales went from 8 to 8 million, then from 8 to 11 million. » Which verbs describe the two phases in order?", "options": ["remain stable, then rise", "peak, then drop", "increase, then remain stable", "level off, then decline"], "answer": [0], "explanation": "8 → 8 = remain stable / level off ; 8 → 11 = rise / increase / grow.", "level": "difficile"}], "open_questions": [{"question": "Explain in English the main rules for the final oral presentation.", "answer": "The presentation lasts about **15 minutes** and covers the **five parts in order**. It is **graded individually** on **grammar, vocabulary and pronunciation**. **Reading is not allowed**: reading a text is not oral production. Slides may only contain **keywords, symbols, numbers, charts and images**, never full sentences, and must show the **links to the real sources**."}, {"question": "Present your Global Launch Project case in three sentences (model answer).", "answer": "*Model:* « Our case study is **IKEA's expansion into India**, which opened its first store in **Hyderabad in 2018**. We will analyse the **market**, IKEA's **entry strategy** through a **wholly-owned subsidiary**, its **product and pricing adaptation**, its **local sourcing**, and its **financial objectives**. Finally, we will explain why we believe the expansion has been **partly successful**. »\n\n*(Check every fact in your sources.)*"}], "exercises": [{"title": "Correct the mistakes", "statement": "Correct this student's slide notes: « Actually, the concurrence in China is very strong. We have many informations about the benefits of Starbucks. Eventually they will open 500 stores. »", "questions": ["Rewrite the sentences correctly."], "answer": "« **Currently**, the **competition** in China is very strong. We have **a lot of information** about Starbucks' **profits**. **Possibly** (or: *They may / plan to*) open 500 stores. »\n\nIf *eventually* meant « finalement », it's correct: « Eventually, they opened 500 stores. »"}], "resources": []}, {"id": "eng-01", "title": "Class 2 — Market Analysis", "subtitle": "Market size, target segment, demand, competitors, market share, entry barriers", "date": "14/10/2026", "status": "vu", "sources": ["M1CM_2026-2027_Program.xlsx", "Global_Launch_Project_Guidelines (Part 1)", "Market_analysis_word_spiders_ANSWER_KEY.docx (1).pdf"], "objectives": ["Master the six Market Analysis keywords and use them in sentences.", "Answer project questions 1–6 for your company.", "Know the six popular market entry types from the reading (Shopify)."], "summary": [{"title": "1. Target vocabulary — Market Analysis", "body": "| Term | Definition | FR |\n|---|---|---|\n| **Market size** | Total value (or volume) of sales in a market over a period | taille du marché |\n| **Target segment** | The specific group of customers a company chooses to serve | segment cible |\n| **Market demand** | How much customers want and are able to buy a product | demande du marché |\n| **Competitor analysis** | Study of rivals' strengths, weaknesses, prices and positioning | analyse concurrentielle |\n| **Market share** | A company's sales as a percentage of total market sales | part de marché |\n| **Entry barriers** | Obstacles that make it hard to enter a market (regulation, high costs, strong brands, culture, tariffs) | barrières à l'entrée |"}, {"title": "2. Project questions — Part 1", "body": "1. How big is the target market (**market size**)?\n2. Who is the **target segment**?\n3. What evidence shows **market demand**?\n4. Who are the main competitors (**competitor analysis**)?\n5. What **market share** did the company aim for or achieve?\n6. What **entry barriers** did it face?"}, {"title": "3. Useful formulas & collocations", "body": "- **Market share (%)** = company sales ÷ total market sales × 100\n- *The market is worth $X billion* · *The market is growing at X% a year* · *to gain / lose / increase market share* · *to target young urban professionals* · *to face / overcome / lower entry barriers* · *demand for coffee is rising*.\n\n*Example*: if the Indian furniture market is worth $20 bn and IKEA sells $200 m, IKEA's market share = 200 ÷ 20,000 × 100 = **1%**."}, {"title": "3b. Word spiders — collocations to use (answer key from class)", "body": "| Keyword | + Adjectives | + Verbs |\n|---|---|---|\n| **Market size** | a **large / sizeable / limited** market (also: niche, profitable, underserved, which collocate with *market* but don't describe size) | to **estimate / measure** the market size · to measure a market **in value or volume** · to **be worth** €2 billion |\n| **Target segment** | a **niche / profitable / underserved** segment (also: large, sizeable) | to **identify / target** a segment · to **focus on** a segment |\n| **Market demand** | **strong / growing / untapped** demand | to **assess / meet** demand · demand **rises** |\n| **Competitor analysis** | a **thorough** analysis · **main / direct** competitors (also: strong) · a **saturated** market (also: growing, untapped) | to **carry out** a competitor analysis · to **outperform** competitors · to **assess** competitors' strengths and weaknesses |\n| **Market share** | a **large / growing / dominant** share (also: high, significant) | to **gain / lose** market share · to **capture** a share of the market |\n| **Entry barriers** (also: *barriers to entry*) | **high / significant / legal** barriers | to **face / overcome / underestimate** barriers |\n\n**Upgrade your sentences (●○○ → ●●●)**:\n- ●○○ *The market was very big.* → ●●● *Their research **estimated the market at €2 billion annually**, with around 5 million potential customers.*\n- ●○○ *They wanted to sell to young people in big cities.* → ●●● *Their analysis revealed a **profitable, underserved segment**: young urban professionals with high disposable income.*\n- ●○○ *A lot of people wanted this product.* → ●●● *The study revealed **untapped demand** for vegan snacks.*\n- ●○○ *Many companies sold the same product.* → ●●● *A **thorough competitor analysis** revealed that the market was already **saturated**.*\n- ●○○ *They wanted to sell more than the others.* → ●●● *They aimed to **gain market share** quickly at the expense of the market leader.*\n- ●○○ *The rules were difficult, so they found a partner.* → ●●● *Having initially **underestimated the barriers**, they had to partner with an established local firm.*"}, {"title": "4. Reading — 6 popular types of market entry strategies (Shopify)", "body": "| Type | Meaning | Risk / control |\n|---|---|---|\n| **Exporting** | Selling products made at home to a foreign market (directly or via intermediaries) | Low risk, low control |\n| **Licensing** | Allowing a foreign company to use your intellectual property (brand, patent) in exchange for **royalties** | Low cost, limited control |\n| **Franchising** | Licensing a **whole business model** (brand + processes); franchisee pays fees and royalties (e.g. McDonald's) | Fast growth, moderate control |\n| **Acquisitions** | **Buying an existing local company** | Fast access, high cost |\n| **Joint ventures** | Creating a business **co-owned with a local partner**, sharing risks, costs and local knowledge | Shared control |\n| **New product development** | Creating new products tailored to the new market | Costly, can fit local needs |\n\n*Summary written from the course reading list; read the original article for details.*"}], "key_points": ["Market size = total value of sales in a market.", "Target segment = the group of customers a company chooses to serve.", "Market demand = how much customers want and can buy.", "Competitor analysis = studying rivals.", "Market share = company sales ÷ market sales × 100.", "Entry barriers = regulation, costs, strong local brands, culture, tariffs.", "Entry types: exporting, licensing, franchising, acquisitions, joint ventures, new product development."], "traps": ["Market size ≠ market share: size is the whole pie, share is your slice.", "Target segment ≠ market segmentation: segmentation divides the market, the target is the chosen group.", "Licensing (one asset: brand or patent) ≠ franchising (a whole business model)."], "glossary": [{"term": "Market size", "definition": "Total value or volume of sales in a market over a period. FR : taille du marché."}, {"term": "Target segment", "definition": "The specific group of customers a company chooses to serve. FR : segment cible."}, {"term": "Market demand", "definition": "The quantity of a product customers want and can afford to buy. FR : demande."}, {"term": "Competitor analysis", "definition": "Evaluation of rivals' strengths, weaknesses, prices and strategies. FR : analyse concurrentielle."}, {"term": "Market share", "definition": "Percentage of total market sales held by one company. FR : part de marché."}, {"term": "Entry barriers", "definition": "Obstacles preventing or slowing a company's entry into a market. FR : barrières à l'entrée."}, {"term": "Exporting", "definition": "Selling domestically produced goods to a foreign market."}, {"term": "Royalties", "definition": "Payments made to the owner of a brand or patent for the right to use it. FR : redevances."}, {"term": "Tariff", "definition": "A tax on imported goods. FR : droit de douane."}], "qcb": [{"q": "Market share is the total value of all sales in a market.", "answer": false, "explanation": "That's market size. Market share is one company's percentage of the market."}, {"q": "High import tariffs can be an entry barrier.", "answer": true, "explanation": "Regulations, tariffs, costs and strong local brands are typical entry barriers."}, {"q": "A target segment is the group of customers a company chooses to serve.", "answer": true, "explanation": "Correct definition."}, {"q": "Competitor analysis means studying your own employees.", "answer": false, "explanation": "It means studying your rivals."}, {"q": "If a company sells $50 m in a $1 bn market, its market share is 5%.", "answer": true, "explanation": "50 ÷ 1,000 × 100 = 5%."}, {"q": "Exporting is generally the lowest-risk entry mode.", "answer": true, "explanation": "Low investment abroad, but also low control."}, {"q": "Franchising means buying an existing local company.", "answer": false, "explanation": "That's an acquisition. Franchising licenses a whole business model."}, {"q": "In a joint venture, the company shares ownership with a partner.", "answer": true, "explanation": "Risks, costs and local knowledge are shared."}, {"q": "Licensing usually involves the payment of royalties.", "answer": true, "explanation": "The licensee pays royalties to use the brand or patent."}, {"q": "Market demand only measures what customers want, not what they can afford.", "answer": false, "explanation": "Demand = willingness AND ability to buy."}, {"q": "Market segmentation and target segment mean exactly the same thing.", "answer": false, "explanation": "Segmentation divides the market into groups; the target segment is the group the company chooses to serve.", "level": "moyen"}, {"q": "Licensing gives a foreign company the right to use one asset, such as a brand or patent, in exchange for royalties.", "answer": true, "explanation": "Licensing = one asset. Franchising = a whole business model (brand + processes).", "level": "moyen"}, {"q": "« Market size » can be measured in value or in volume.", "answer": true, "explanation": "Collocation from class: to measure a market in value or volume.", "level": "moyen"}, {"q": "« Untapped demand » means that customers no longer want the product.", "answer": false, "explanation": "Untapped demand = demand that exists but no company is serving yet: an opportunity.", "level": "moyen"}, {"q": "If a company's market share rises from 10% to 12% while the market size shrinks, its sales must have increased.", "answer": false, "explanation": "Not necessarily. 10% of $10 bn = $1 bn; 12% of $8 bn = $0.96 bn. A bigger slice of a smaller pie can mean lower sales.", "level": "difficile"}, {"q": "« Niche » and « profitable » collocate with « market », but they don't describe its size.", "answer": true, "explanation": "The word spider answer key notes this: large, sizeable or limited describe size; niche, profitable and underserved don't.", "level": "difficile"}], "qcm": [{"q": "« The Chinese coffee market is worth $15 billion. » This sentence describes:", "options": ["Market share", "Market size", "Entry barriers", "Target segment"], "answer": [1], "explanation": "The total value of the market."}, {"q": "Which are examples of entry barriers? (several answers)", "options": ["Strict government regulation", "Strong local competitors", "High start-up costs", "A large target segment"], "answer": [0, 1, 2], "explanation": "A large segment is an opportunity, not a barrier."}, {"q": "Choose the correct collocation:", "options": ["to win market share", "to gain market share", "to make market share", "to do market share"], "answer": [1], "explanation": "gain / increase / lose market share."}, {"q": "Starbucks targeted young urban middle-class professionals in China. This is its:", "options": ["Market size", "Target segment", "Market share", "Entry barrier"], "answer": [1], "explanation": "The chosen group of customers."}, {"q": "Which entry mode means allowing a foreign firm to use your patent for royalties?", "options": ["Exporting", "Licensing", "Acquisition", "Joint venture"], "answer": [1], "explanation": "Licensing = use of intellectual property."}, {"q": "McDonald's opening restaurants run by local owners who pay fees is an example of:", "options": ["Franchising", "Exporting", "Greenfield investment", "Market demand"], "answer": [0], "explanation": "The franchisee uses the full business model."}, {"q": "What evidence can show market demand? (several answers)", "options": ["Growing sales in the category", "Surveys of consumer interest", "Rising middle-class income", "The CEO's favourite colour"], "answer": [0, 1, 2], "explanation": "Data on sales, consumers and purchasing power."}, {"q": "Company A: $300 m sales; total market: $6 bn. Market share =", "options": ["0.5%", "5%", "50%", "20%"], "answer": [1], "explanation": "300 ÷ 6,000 × 100 = 5%."}, {"q": "Which entry mode gives FAST access to customers but at HIGH cost?", "options": ["Exporting", "Licensing", "Acquisition", "New product development"], "answer": [2], "explanation": "Buying an existing company is fast but expensive."}, {"q": "Fill in: « Netflix had to ______ strong local competitors in South Korea. »", "options": ["face", "do", "make", "take"], "answer": [0], "explanation": "to face competitors / barriers."}, {"q": "Which adjectives collocate with « demand »? (several answers)", "options": ["strong", "growing", "untapped", "saturated"], "answer": [0, 1, 2], "explanation": "strong / growing / untapped demand. *Saturated* goes with *market*."}, {"q": "Fill in: « They opened a new factory to ______ the growing demand. »", "options": ["meet", "make", "do", "rise"], "answer": [0], "explanation": "to meet demand (also: to assess demand)."}, {"q": "Which verbs collocate with « entry barriers »? (several answers)", "options": ["face", "overcome", "underestimate", "gain"], "answer": [0, 1, 2], "explanation": "to face / overcome / underestimate barriers. *Gain* goes with market share."}, {"q": "Fill in: « Their goal was to ______ 5% of the market within two years. »", "options": ["capture", "carry out", "meet", "identify"], "answer": [0], "explanation": "to capture (or gain) a share of the market."}, {"q": "Choose the correct collocation:", "options": ["to carry out a competitor analysis", "to make out a competitor analysis", "to do up a competitor analysis", "to rise a competitor analysis"], "answer": [0], "explanation": "to carry out an analysis."}, {"q": "Which sentence is the most advanced (●●●) way to describe the market size?", "options": ["The market was very big.", "The market was worth about €2 billion a year.", "Their research estimated the market at €2 billion annually, with around 5 million potential customers.", "A lot of people bought this product."], "answer": [2], "explanation": "Precise figures + a strong verb (*estimated*)."}, {"q": "A company sells $450 m in a market worth $9 bn. Its market share is:", "options": ["0.5%", "5%", "50%", "2%"], "answer": [1], "explanation": "450 ÷ 9,000 × 100 = 5%.", "level": "moyen"}, {"q": "Which entry modes involve sharing control with a local partner or licensee? (several answers)", "options": ["Exporting directly from home", "Joint venture", "Franchising", "Licensing"], "answer": [1, 2, 3], "explanation": "In a JV control is shared; in licensing and franchising the local firm runs the business. Exporting keeps control at home (low risk, low control over the market).", "level": "moyen"}, {"q": "Choose the most advanced (●●●) sentence:", "options": ["Many companies sold the same product.", "There was a lot of competitors.", "The competitors were many and strong.", "A thorough competitor analysis revealed that the market was already saturated."], "answer": [3], "explanation": "It uses class collocations (thorough analysis, saturated market). C is also grammatically wrong (there were).", "level": "moyen"}, {"q": "Which words collocate with « market share »? (several answers)", "options": ["to underestimate", "to capture", "to gain", "a dominant"], "answer": [1, 2, 3], "explanation": "« Underestimate » collocates with barriers, not with market share.", "level": "moyen"}, {"q": "Scenario: a French brand wants to enter India quickly, keep full control and has a big budget. Local regulations allow foreign ownership. Which mode fits best?", "options": ["Acquisition of a local company", "Exporting via intermediaries", "Licensing", "Franchising"], "answer": [0], "explanation": "Acquisition gives fast access and control, at high cost. Licensing and franchising mean less control; exporting is slow to build presence.", "level": "difficile"}, {"q": "Scenario: a foreign retailer faces a law requiring a local partner, strong cultural differences and no local knowledge. Which mode is the most logical answer to these barriers?", "options": ["New product development alone", "Exporting", "Licensing a patent", "Joint venture"], "answer": [3], "explanation": "A JV is co-owned with a local partner who brings local knowledge and can meet legal requirements, and shares risks and costs.", "level": "difficile"}, {"q": "Scenario: « Having initially ______ the barriers, they had to partner with an established local firm. » Which word fits?", "options": ["underestimated", "overcome", "gained", "met"], "answer": [0], "explanation": "They needed a partner afterwards because they had underestimated the barriers. « Overcome » would contradict the second clause.", "level": "difficile"}, {"q": "Scenario: in your presentation you say « The market share of Starbucks in China is $15 billion. » What's wrong? (several answers)", "options": ["Market share is a percentage, not an amount", "Nothing, the sentence is correct", "« Market share » should be « market size » if you mean the whole market value", "$15 bn describes market size (the whole market)"], "answer": [0, 2, 3], "explanation": "Size = the whole pie (value). Share = your slice, in %.", "level": "difficile"}, {"q": "Scenario: Company X sold $600 m last year. The market is worth $12 bn and is growing at 10% a year. If X keeps the same market share, its sales next year will be:", "options": ["$600 m", "$660 m", "$1.2 bn", "$612 m"], "answer": [1], "explanation": "Share = 600 ÷ 12,000 = 5%. Next year's market = 13.2 bn → 5% = 660 m.", "level": "difficile"}], "open_questions": [{"question": "Define market size and market share and explain the difference with an example.", "answer": "**Market size** is the total value of sales in a market (e.g. the German EV market is worth €X bn). **Market share** is the percentage of that market held by one company (e.g. Tesla holds 15% of the German EV market). Size is the **whole pie**; share is the company's **slice**."}, {"question": "What entry barriers might a Western retailer face in India?", "answer": "**Regulatory barriers** (foreign direct investment rules, local sourcing requirements), **cultural barriers** (different tastes, family-run local shops), **economic barriers** (lower average purchasing power, price sensitivity), **logistics barriers** (infrastructure), and **strong local competitors**. *Example: IKEA had to source a share of its products locally to meet Indian FDI rules (check this in your sources).*"}], "exercises": [{"title": "Apply Part 1 to your company", "statement": "Choose your project company and write one sentence per keyword.", "questions": ["market size", "target segment", "market demand", "competitor analysis", "market share", "entry barriers"], "answer": "*Model (Starbucks in China, check the figures in your sources):*\n- **Market size**: « China's coffee market is worth several billion dollars and is growing fast. »\n- **Target segment**: « Starbucks targeted young, urban, middle-class consumers. »\n- **Market demand**: « Coffee consumption per person is low but rising quickly, especially among young people. »\n- **Competitor analysis**: « Its main competitors include Luckin Coffee and local tea chains. »\n- **Market share**: « Starbucks was the market leader but has lost market share to Luckin. »\n- **Entry barriers**: « The main barriers were a tea-drinking culture and the need for local partners. »"}], "resources": [{"label": "Reading — Market Entry Strategy Guide: 6 Ways to Enter New Markets (Shopify) — section « Popular types of market entry strategies »", "url": "https://www.shopify.com/nz/blog/market-entry-strategy"}]}, {"id": "eng-02", "title": "Class 3 — Market Entry Strategy", "subtitle": "Joint venture, acquisition, direct investment, strategic alliance, licensing/franchising, greenfield", "date": "16/10/2026", "status": "vu", "sources": ["M1CM_2026-2027_Program.xlsx", "Global_Launch_Project_Guidelines (Part 2)"], "objectives": ["Identify your company's market entry strategy and apply the concepts.", "Distinguish greenfield vs brownfield (acquisition) direct investment.", "Understand how businesses adapt the marketing mix for international audiences (reading)."], "summary": [{"title": "1. Target vocabulary — Entry Strategy", "body": "| Term | Definition | FR |\n|---|---|---|\n| **Joint venture (JV)** | A new business **jointly owned** by two or more companies (often a foreign firm and a local partner) | coentreprise |\n| **Acquisition** | **Buying** an existing company (or a controlling stake) | acquisition / rachat |\n| **Direct investment (FDI)** | Investing money directly in operations abroad (factories, stores, subsidiaries) | investissement direct (IDE) |\n| **Strategic alliance** | **Cooperation agreement** between independent companies **without creating a new company** | alliance stratégique |\n| **Licensing / franchising** | Selling the right to use a brand, patent or whole business model for fees and royalties | licence / franchise |\n| **Greenfield investment** | Direct investment that **builds new operations from scratch** | investissement *greenfield* (création ex nihilo) |\n\n**Greenfield vs brownfield**: if it's direct investment, did the company **build from scratch** (greenfield) or **buy an existing business** (acquisition, sometimes called **brownfield**)?"}, {"title": "2. Project questions — Part 2", "body": "7. Which entry strategy did the company use?\n8. If direct investment: **greenfield** or **acquisition (brownfield)**?\n9. Who were the local or international **partners**, and what type of **agreement** did they have?"}, {"title": "3. Comparing entry modes", "body": "| Mode | Control | Investment / risk | Speed | Example |\n|---|---|---|---|---|\n| Licensing / franchising | Low–medium | Low | Fast | McDonald's franchises |\n| Strategic alliance | Shared | Low–medium | Fast | Airline alliances (Star Alliance) |\n| Joint venture | Shared | Medium | Medium | Starbucks' early JVs in China |\n| Acquisition | High | High | Fast | Walmart buying Flipkart in India (2018) |\n| Greenfield | **Full** | **Highest** | **Slow** | Tesla's Gigafactory near Berlin (Grünheide) |\n\n**Rule of thumb**: the more **control** you want, the more **investment and risk** you accept."}, {"title": "4. Reading — Adapting the marketing mix for international audiences (TutorChase)", "body": "Companies decide between **standardisation** (same mix everywhere: economies of scale, consistent brand) and **adaptation** (adjusting to local culture, laws, income). The middle way is called **glocalisation** (« think global, act local »).\n\n| 4P | Typical adaptations |\n|---|---|\n| **Product** | Local tastes, sizes, ingredients, regulations, language on packaging (McDonald's McAloo Tikki in India, no beef) |\n| **Price** | Local purchasing power, currency, taxes, competitors' prices |\n| **Place** | Local distribution channels and partners, retail habits (markets vs malls vs online) |\n| **Promotion** | Language, cultural values, humour, media habits, local celebrities, legal limits on advertising |\n\n*Summary written from the course reading list; read the original article for details.*"}], "key_points": ["JV = new company jointly owned; strategic alliance = cooperation without a new company.", "Acquisition = buying an existing business (brownfield); greenfield = building from scratch.", "Direct investment (FDI) can be greenfield or acquisition.", "Licensing = rights to a brand or patent; franchising = whole business model; both pay royalties.", "More control means more investment and more risk.", "Standardisation vs adaptation of the 4Ps; glocalisation = think global, act local."], "traps": ["Joint venture ≠ strategic alliance: only the JV creates a new jointly-owned entity.", "Greenfield = from scratch; brownfield = existing business or facilities.", "Acquisition is a form of direct investment, not an alternative to it."], "glossary": [{"term": "Joint venture", "definition": "A business entity created and jointly owned by two or more companies. FR : coentreprise."}, {"term": "Acquisition", "definition": "Purchase of an existing company or of a controlling stake in it. FR : rachat."}, {"term": "Direct investment (FDI)", "definition": "Investment by a company in operations it controls in another country. FR : investissement direct à l'étranger."}, {"term": "Strategic alliance", "definition": "Agreement between independent firms to cooperate (share resources, knowledge, distribution) without forming a new company."}, {"term": "Licensing", "definition": "Granting the right to use intellectual property (brand, patent, technology) in exchange for royalties."}, {"term": "Franchising", "definition": "Granting the right to operate a whole business model under a brand, against fees and royalties."}, {"term": "Greenfield investment", "definition": "Building new facilities from scratch in a foreign country."}, {"term": "Brownfield investment", "definition": "Investing by buying or leasing existing facilities or companies."}, {"term": "Subsidiary", "definition": "A company controlled by a parent company. FR : filiale."}, {"term": "Stake", "definition": "A share of ownership in a company. FR : participation."}, {"term": "Glocalisation", "definition": "Combining a global brand strategy with local adaptation."}], "qcb": [{"q": "A greenfield investment means buying an existing local company.", "answer": false, "explanation": "Greenfield = building from scratch. Buying an existing company = acquisition (brownfield)."}, {"q": "A joint venture creates a new business owned by two or more partners.", "answer": true, "explanation": "That's what distinguishes it from a simple alliance."}, {"q": "A strategic alliance always creates a new legal company.", "answer": false, "explanation": "An alliance is a cooperation agreement without a new entity."}, {"q": "Greenfield investment gives the company full control but requires high investment.", "answer": true, "explanation": "Maximum control, maximum cost and risk, slow."}, {"q": "Franchising is a low-investment way to expand quickly.", "answer": true, "explanation": "Franchisees invest their own money."}, {"q": "Acquisition is a type of direct investment.", "answer": true, "explanation": "FDI can be greenfield or by acquisition."}, {"q": "Standardisation means adapting every element of the marketing mix to each country.", "answer": false, "explanation": "That's adaptation. Standardisation = the same mix everywhere."}, {"q": "Selling vegetarian burgers in India is an example of product adaptation.", "answer": true, "explanation": "Adapting the product to local culture and religion."}, {"q": "Glocalisation means « think global, act local ».", "answer": true, "explanation": "A global brand with local adaptation."}, {"q": "Licensing gives the licensor strong control over how the licensee runs its business.", "answer": false, "explanation": "Licensing offers limited control."}, {"q": "An acquisition is a form of direct investment.", "answer": true, "explanation": "Direct investment (FDI) can be greenfield (from scratch) or an acquisition (brownfield).", "level": "moyen"}, {"q": "A strategic alliance always creates a new company jointly owned by the partners.", "answer": false, "explanation": "That's a joint venture. A strategic alliance is cooperation between independent companies without a new entity.", "level": "moyen"}, {"q": "Glocalisation means using exactly the same marketing mix in every country.", "answer": false, "explanation": "That's standardisation. Glocalisation = « think global, act local », a middle way.", "level": "moyen"}, {"q": "Greenfield investment is usually the slowest entry mode because everything is built from scratch.", "answer": true, "explanation": "Greenfield gives full control but has the highest investment and is slow (e.g. Tesla near Berlin).", "level": "moyen"}, {"q": "A company that buys an old, empty factory abroad and converts it into its own plant is doing a greenfield investment.", "answer": false, "explanation": "Using existing facilities is brownfield. Greenfield means building new operations from scratch.", "level": "difficile"}, {"q": "Standardisation can lower costs thanks to economies of scale, but may fail if local tastes differ strongly.", "answer": true, "explanation": "That's the trade-off between standardisation (economies of scale, consistent brand) and adaptation.", "level": "difficile"}], "qcm": [{"q": "Tesla built a brand-new factory near Berlin. This is:", "options": ["A joint venture", "A greenfield investment", "Licensing", "An acquisition"], "answer": [1], "explanation": "New operations built from scratch."}, {"q": "Walmart bought a majority stake in Flipkart (India). This is:", "options": ["An acquisition", "Franchising", "Exporting", "A strategic alliance"], "answer": [0], "explanation": "Buying an existing company."}, {"q": "Two companies share distribution networks without creating a new firm. This is:", "options": ["A joint venture", "A strategic alliance", "Greenfield", "Licensing"], "answer": [1], "explanation": "Cooperation without a new entity."}, {"q": "Which modes involve royalties? (several answers)", "options": ["Licensing", "Franchising", "Greenfield investment", "Acquisition"], "answer": [0, 1], "explanation": "The licensee or franchisee pays royalties."}, {"q": "Which mode offers the MOST control?", "options": ["Licensing", "Strategic alliance", "Joint venture", "Greenfield investment (wholly owned)"], "answer": [3], "explanation": "A wholly owned subsidiary built from scratch."}, {"q": "Why do companies choose a joint venture with a local partner? (several answers)", "options": ["Access to local knowledge and networks", "Sharing risks and costs", "Sometimes required by local law", "To keep 100% of the profits"], "answer": [0, 1, 2], "explanation": "In a JV, profits are shared."}, {"q": "Which of the 4Ps does « using local celebrities in ads » adapt?", "options": ["Product", "Price", "Place", "Promotion"], "answer": [3], "explanation": "Promotion adapts language, culture and media."}, {"q": "Adjusting prices to local purchasing power adapts:", "options": ["Product", "Price", "Place", "Promotion"], "answer": [1], "explanation": "Price."}, {"q": "Which are advantages of standardisation? (several answers)", "options": ["Economies of scale", "Consistent global brand image", "Lower costs", "Perfect fit with every local culture"], "answer": [0, 1, 2], "explanation": "A perfect local fit is the advantage of adaptation."}, {"q": "Fill in: « The company ______ a 51% stake in the local firm. »", "options": ["acquired", "franchised", "allied", "greenfielded"], "answer": [0], "explanation": "to acquire a stake."}, {"q": "Rank these modes from LEAST to MOST control:", "options": ["Joint venture → licensing → greenfield → acquisition", "Licensing → joint venture → acquisition → greenfield", "Acquisition → licensing → JV → greenfield", "Greenfield → acquisition → JV → licensing"], "answer": [1], "explanation": "Rule of thumb: more control = more investment and risk. Licensing (low–medium) < JV (shared) < acquisition (high) < greenfield (full).", "level": "moyen"}, {"q": "McDonald's sells the McAloo Tikki and no beef in India. Which statements are true? (several answers)", "options": ["It's an example of glocalisation", "It's a product adaptation", "It reflects local culture and religion", "It's pure standardisation"], "answer": [0, 1, 2], "explanation": "Adapting the product to local tastes and values while keeping the global brand = glocalisation.", "level": "moyen"}, {"q": "Which are typical PROMOTION adaptations? (several answers)", "options": ["Using local celebrities", "Respecting legal limits on advertising", "Changing the currency of prices", "Translating slogans"], "answer": [0, 1, 3], "explanation": "Currency is a PRICE adaptation.", "level": "moyen"}, {"q": "Star Alliance (airlines sharing routes and lounges, each remaining independent) is:", "options": ["Greenfield investment", "A joint venture", "A strategic alliance", "An acquisition"], "answer": [2], "explanation": "Cooperation agreement without creating a new company.", "level": "moyen"}, {"q": "Scenario: a car maker wants FULL control of quality and technology in Germany, and accepts a long, expensive project. Which mode?", "options": ["Licensing", "Greenfield investment", "Strategic alliance", "Franchising"], "answer": [1], "explanation": "Full control, highest investment, slow: greenfield (like Tesla's Gigafactory).", "level": "difficile"}, {"q": "Scenario: an online retailer wants to enter India FAST with an existing customer base, and has a large budget. Which mode? ", "options": ["Exporting", "Licensing", "Greenfield", "Acquisition"], "answer": [3], "explanation": "Acquisition = fast access + high control + high cost (e.g. Walmart / Flipkart, 2018).", "level": "difficile"}, {"q": "Scenario: two pharmaceutical firms create a NEW company, owned 50/50, to sell vaccines in Brazil. Which statements are correct? (several answers)", "options": ["It's a strategic alliance without a new company", "A new legal entity is created", "Control and risks are shared", "It's a joint venture"], "answer": [1, 2, 3], "explanation": "The creation of a new jointly-owned company makes it a JV, not a simple alliance.", "level": "difficile"}, {"q": "Scenario: a brand keeps the same logo and product worldwide, but cuts prices in Vietnam and uses Vietnamese influencers. What is this?", "options": ["Full adaptation of all 4Ps", "Pure standardisation", "Greenfield investment", "Glocalisation: standard product, adapted price and promotion"], "answer": [3], "explanation": "Product standardised, price and promotion adapted: the middle way.", "level": "difficile"}, {"q": "Scenario: « The company acquired a 51% stake in a local firm. » Which conclusions are valid? (several answers)", "options": ["It's a brownfield-type entry", "It is a form of direct investment", "It built new operations from scratch", "It now has a controlling stake"], "answer": [0, 1, 3], "explanation": "Buying a controlling stake = acquisition = direct investment, brownfield, not greenfield.", "level": "difficile"}], "open_questions": [{"question": "Explain the difference between a joint venture and a strategic alliance, with examples.", "answer": "A **joint venture** creates a **new company jointly owned** by the partners, who share capital, risks and profits (e.g. a foreign carmaker and a Chinese partner creating a jointly owned manufacturing company). A **strategic alliance** is a **cooperation agreement** between independent companies **without a new entity** (e.g. airlines in Star Alliance sharing flights and lounges). The JV is deeper and harder to exit."}, {"question": "Greenfield or acquisition: what are the pros and cons of each?", "answer": "**Greenfield**: + full control, modern facilities designed to your standards, brand consistency; − slow, expensive, high risk, no local network at the start.\n**Acquisition (brownfield)**: + fast market access, existing customers, staff, brand and distribution; − high price, integration problems, cultural clashes, hidden liabilities."}], "exercises": [{"title": "Identify the entry strategy", "statement": "Name the entry mode: (a) IKEA opens its own store built from scratch in Hyderabad; (b) a hotel chain lets local owners run hotels under its brand; (c) a Western bank buys 60% of a local bank; (d) two tech firms agree to share R&D without merging.", "questions": ["Give the mode and justify in one sentence."], "answer": "(a) **Greenfield direct investment**: a new store built from scratch and wholly owned.\n(b) **Franchising** (or management contract): local owners use the brand and model and pay fees.\n(c) **Acquisition** (brownfield): purchase of a controlling stake in an existing company.\n(d) **Strategic alliance**: cooperation without creating a new company."}], "resources": [{"label": "Reading — How do businesses adjust their marketing mix for international audiences? (TutorChase)", "url": "https://www.tutorchase.com/answers/ib/business-management/how-do-businesses-adjust-their-marketing-mix-for-international-audiences"}]}, {"id": "eng-reader", "title": "Reader — Women in Business (Penguin Readers)", "subtitle": "Five businesswomen: Coco Chanel, Hanae Mori, Anita Roddick, Oprah Winfrey, Madonna + business wordlist", "date": "", "status": "vu", "sources": ["-women-in-business-penguin-readers-l4-3-pdf-free.pdf"], "objectives": ["Know the key facts and business lessons of each of the five stories.", "Learn the book's business wordlist (definitions in English).", "Talk about entrepreneurs in English: past simple, figures, business verbs."], "summary": [{"title": "1. The big idea of the book", "body": "In the 20th century, top business jobs were almost always held by men. The book tells the stories of **five women from very different backgrounds** who reached the top by **creating completely new kinds of companies**. They had to break through the **glass ceiling**, the invisible barrier that stops women from reaching top positions.\n\n*Summary written in our own words; read the book for the full stories.*"}, {"title": "2. Coco Chanel — fashion that changed women's lives", "body": "| Date | Key fact |\n|---|---|\n| **1910** | Opens her first **hat shop in Paris** at 27, with money lent by a rich friend, **Boy Capel** |\n| **World War I** | Women work outside the home and need **practical clothes**, which Chanel designs |\n| **1920s** | Creates **Chanel No. 5**, the most successful perfume of the century |\n| **1930s** | Hollywood producer **Sam Goldwyn** pays her **$1 million** to dress film stars, but her style is too simple for Hollywood and he doesn't use her again. Her business employs about **4,000 people** |\n| **WWII and after** | Fights **Pierre Wertheimer** for control of Chanel No. 5; lives quietly in **Switzerland** for about eight years, rich from the perfume |\n| **5 February 1954** | Returns to fashion at **70**. The first show is criticised, but she keeps going and succeeds again |\n\n**Business lesson**: fashion is about **how people live**. A strong brand image (the same square bottle of No. 5) lasts for decades."}, {"title": "3. Hanae Mori — East meets West", "body": "- Married to a rich businessman, she was not satisfied with life as a housewife and started making clothes.\n- In the **1950s**, her most important customers were **Japanese film stars**: she designed costumes for films.\n- **1961**: she meets **Coco Chanel** in Paris, an important inspiration.\n- Her style **mixes ideas from East and West**.\n- She builds an **international operation**: **over 70 shops in Japan**, **3 in Paris**, and sales points around the world. Like Chanel, she launches her **own perfume**, which benefits from the image of her clothes (brand extension).\n\n**Business lesson**: a designer brand can expand beyond clothes thanks to its **image**."}, {"title": "4. Anita Roddick — The Body Shop: business with values", "body": "| Date | Key fact |\n|---|---|\n| **1976** | Opens the first **Body Shop in Brighton** (England) with a **£4,000 bank loan**: natural cosmetics, cheap, in **re-usable bottles** |\n| Second shop | The bank refuses another loan; **Ian McGlinn** gives **£4,000 in exchange for half the business** |\n| **1984** | Shares are sold on the **London Stock Exchange**; the price rises from **£0.95 to £1.65** on the first day. At **42**, Anita is a **millionaire** |\n| 1980s | Growing concern for the environment helps natural cosmetics |\n| Brazil | Works with the **Kayapo** people, who sell plant oil to The Body Shop at a **fair price** |\n| **1994** | Media **criticise** the company for not doing enough for the environment; the share price falls |\n\n**Business lesson**: business is not just about making money; it can **help make the world better** (fair trade, environment)."}, {"title": "5. Oprah Winfrey — control is the key to success", "body": "- Early 1970s: **newsreader** for small stations, then in **Baltimore**. Not a success: she became **too emotionally involved** in the stories. She moves to a morning **talk show**, *People Are Talking*, and becomes a star.\n- **1983–84**: hired by a **Chicago** station for *A.M. Chicago* (**$200,000 a year**); an immediate hit.\n- Plays in Spielberg's film ***The Color Purple***; the station gives her a break to do it.\n- She **negotiates**: the show is renamed ***The Oprah Winfrey Show*** and she gets a **share of the money from sales to other stations**. When 138 stations buy it, her earnings jump from **$200,000 to $30 million a year**.\n- **1986**: creates **Harpo Productions** (*Harpo* = *Oprah* backwards); **1988**: Harpo **buys the show** and her own studios.\n\n**Business lesson**: **owning and controlling** your product creates value."}, {"title": "6. Madonna — the material girl as CEO", "body": "- **1978**: arrives in New York at 19 with **$35**; does many jobs and learns music.\n- **1982**: first recording contract (*Everybody*). She understands that **MTV** (launched **1981**) makes **videos** essential, and convinces top manager **Freddy Demann** by performing in his office.\n- Mid-1980s: global star (*Holiday*, *Material Girl*), films, constant **publicity**.\n- **1992**: a **$60 million deal with Time Warner** creates her own company, **Maverick** (records, videos, TV, books), which gives her **complete control** over her products.\n- Maverick finds new talent: **Alanis Morissette** (1995, over 27 million records sold). In **1999**, Maverick's sales reached about **$750 million**.\n\n**Business lesson**: careful **planning**, smart use of **publicity** and **control** of her own brand."}, {"title": "7. Business wordlist (from the book)", "body": "| Word | Meaning |\n|---|---|\n| **accountant** | a person who reports the financial health of an organisation |\n| **branch** | a part of a large organisation, often a store or an office |\n| **capital** | money that helps to build a new business |\n| **compete** | to try to win |\n| **consultant** | a person who gives business advice |\n| **contract** | a formal legal agreement |\n| **corporation** | a big company |\n| **deal** | to buy and sell (noun: a business agreement) |\n| **expand** | to increase or grow |\n| **finances** | the amount of money that a business or person has |\n| **industry** | a type of business |\n| **loss** | the amount of money that a business loses |\n| **negotiate** | to try to come to an agreement with another person |\n| **objective** | a business aim |\n| **partnership** | a business owned by two or more people |\n| **profit** | money that is made in business |\n| **risk** | the danger of losing money |\n| **sack** | to tell someone to leave their job |\n| **share** | a piece of paper that says you own part of a company |\n| **stock exchange** | a place where people buy and sell shares |"}], "key_points": ["Chanel: hat shop in Paris (1910), Chanel No. 5, Hollywood failure with Goldwyn, comeback at 70 (1954).", "Hanae Mori: met Chanel in 1961, costumes for Japanese films, East-West style, 70+ shops in Japan, own perfume.", "Anita Roddick: The Body Shop, Brighton 1976, £4,000 loan; McGlinn's £4,000 for half; stock exchange 1984 → millionaire at 42; Kayapo; criticism in 1994.", "Oprah: failed newsreader, star of talk shows; negotiated a share of sales ($200,000 → $30 million a year); Harpo Productions (1986).", "Madonna: arrived in New York with $35 (1978), MTV and videos, Maverick (1992, $60 million deal with Time Warner), Alanis Morissette.", "Glass ceiling = the invisible barrier preventing women from reaching top jobs.", "Wordlist: capital, profit, loss, share, stock exchange, partnership, negotiate, expand, contract, deal, branch, sack."], "traps": ["Profit (money made) ≠ loss (money lost) ≠ capital (money to build a business).", "« To sack » someone = to fire them (licencier), not to put them in a bag!", "A branch is part of a big organisation (une succursale), not a tree branch, in this context.", "Harpo is Oprah spelled backwards."], "glossary": [{"term": "Glass ceiling", "definition": "An invisible barrier that stops women (or minorities) from reaching top positions."}, {"term": "Accountant", "definition": "A person who reports the financial health of an organisation. FR : comptable."}, {"term": "Branch", "definition": "A part of a large organisation, often a store or an office. FR : succursale, agence."}, {"term": "Capital", "definition": "Money that helps to build a new business."}, {"term": "Consultant", "definition": "A person who gives business advice."}, {"term": "Contract", "definition": "A formal legal agreement."}, {"term": "Corporation", "definition": "A big company."}, {"term": "Expand", "definition": "To increase or grow."}, {"term": "Loss", "definition": "The amount of money that a business loses. FR : perte."}, {"term": "Negotiate", "definition": "To try to come to an agreement with another person."}, {"term": "Objective", "definition": "A business aim."}, {"term": "Partnership", "definition": "A business that is owned by two or more people."}, {"term": "Profit", "definition": "Money that is made in business. FR : bénéfice."}, {"term": "Risk", "definition": "The danger of losing money."}, {"term": "Sack", "definition": "To tell someone to leave their job. FR : licencier, renvoyer."}, {"term": "Share", "definition": "A piece of paper that says you own part of a company. FR : action."}, {"term": "Stock exchange", "definition": "A place where people buy and sell shares. FR : la Bourse."}], "qcb": [{"q": "Coco Chanel opened her first shop, a hat shop, in Paris in 1910.", "answer": true, "explanation": "She was 27, with money lent by Boy Capel."}, {"q": "Sam Goldwyn kept using Chanel's designs in all his later films.", "answer": false, "explanation": "Her style was too simple for Hollywood; he decided not to use her clothes again."}, {"q": "Coco Chanel returned to fashion at the age of seventy.", "answer": true, "explanation": "Her comeback show took place on 5 February 1954."}, {"q": "Hanae Mori met Coco Chanel in 1961.", "answer": true, "explanation": "An important meeting in her life and career."}, {"q": "Hanae Mori's style mixes ideas from East and West.", "answer": true, "explanation": "That's what makes her style special."}, {"q": "Anita Roddick opened the first Body Shop in London.", "answer": false, "explanation": "In Brighton, in 1976."}, {"q": "Ian McGlinn gave Anita £4,000 in exchange for half of the business.", "answer": true, "explanation": "The bank had refused a second loan."}, {"q": "Anita Roddick became a millionaire when The Body Shop's shares went on sale in 1984.", "answer": true, "explanation": "At 42, her shares were worth £1.5 million."}, {"q": "Oprah Winfrey was a very successful newsreader in Baltimore.", "answer": false, "explanation": "She became too emotionally involved in the news; she succeeded on talk shows instead."}, {"q": "« Harpo » is « Oprah » spelled backwards.", "answer": true, "explanation": "Harpo Productions was created in 1986."}, {"q": "Madonna's company Maverick was created through a deal with Time Warner in 1992.", "answer": true, "explanation": "A $60 million deal giving her complete control."}, {"q": "« To sack » someone means to hire them.", "answer": false, "explanation": "It means to tell someone to leave their job (to fire)."}, {"q": "A partnership is a business owned by two or more people.", "answer": true, "explanation": "Definition from the business wordlist."}, {"q": "Coco Chanel opened her first shop in Paris with money lent by Boy Capel.", "answer": true, "explanation": "1910: hat shop in Paris, aged 27, with money from a rich friend, Boy Capel.", "level": "moyen"}, {"q": "Sam Goldwyn's $1 million deal with Chanel was a big success and he hired her again for many films.", "answer": false, "explanation": "Her style was too simple for Hollywood; he didn't use her again.", "level": "moyen"}, {"q": "Hanae Mori's style mixes ideas from East and West.", "answer": true, "explanation": "That's her signature, after meeting Chanel in 1961.", "level": "moyen"}, {"q": "Ian McGlinn lent Anita Roddick £4,000 with interest, like a bank.", "answer": false, "explanation": "He gave £4,000 in exchange for HALF the business: it was an investment, not a loan.", "level": "moyen"}, {"q": "Hanae Mori's perfume illustrates the same business lesson as Chanel No. 5: a strong brand image can be extended to new products.", "answer": true, "explanation": "Brand extension: the perfume benefits from the image of the clothes.", "level": "difficile"}, {"q": "Oprah's and Madonna's stories teach opposite lessons: Oprah succeeded through ownership, Madonna through giving control to Time Warner.", "answer": false, "explanation": "Both teach the same lesson: control. Madonna's Time Warner deal created Maverick, which gave her complete control over her products.", "level": "difficile"}], "qcm": [{"q": "Why was World War I good for Chanel's business?", "options": ["Women needed practical clothes for a new active, working life", "Men bought hats for their wives", "Hollywood paid her $1 million", "She sold weapons"], "answer": [0], "explanation": "Women worked outside the home and needed new clothes."}, {"q": "Which perfume made Chanel extremely rich?", "options": ["Chanel No. 5", "Chanel No. 19", "Mademoiselle", "Coco Noir"], "answer": [0], "explanation": "The most successful perfume of the past hundred years."}, {"q": "Who were Hanae Mori's most important customers in the 1950s?", "options": ["Japanese film stars", "American politicians", "Body Shop customers", "MTV presenters"], "answer": [0], "explanation": "She designed costumes for Japanese films."}, {"q": "What was different about The Body Shop's products? (several answers)", "options": ["Natural ingredients", "Cheap prices", "Re-usable bottles", "Luxury packaging"], "answer": [0, 1, 2], "explanation": "Natural, cheap and in re-usable bottles."}, {"q": "How did The Body Shop help the Kayapo people in Brazil?", "options": ["By buying plant oil from them at a fair price", "By opening a shop in their village", "By hiring them in Brighton", "By giving them shares"], "answer": [0], "explanation": "Money for health and education, and a natural product for The Body Shop."}, {"q": "Why did Oprah's earnings jump from $200,000 to $30 million a year?", "options": ["She negotiated a share of the money from sales of her show to other stations", "She won the lottery", "She sold Harpo", "She became a newsreader again"], "answer": [0], "explanation": "138 stations bought The Oprah Winfrey Show."}, {"q": "What lesson did Oprah learn from this negotiation?", "options": ["Control is the key to success", "Price is everything", "Never negotiate", "Television is dying"], "answer": [0], "explanation": "She then created Harpo Productions and bought her own show."}, {"q": "Which new medium helped Madonna become a global star in the early 1980s?", "options": ["MTV and music videos", "Radio only", "Newspapers", "The Internet"], "answer": [0], "explanation": "MTV started in 1981; a good song needed a good video."}, {"q": "What could Maverick produce? (several answers)", "options": ["Records", "Videos", "Books", "Cars"], "answer": [0, 1, 2], "explanation": "Also TV programmes."}, {"q": "Match the definition « a place where people buy and sell shares »:", "options": ["Stock exchange", "Branch", "Partnership", "Corporation"], "answer": [0], "explanation": "FR : la Bourse."}, {"q": "« Money that helps to build a new business » is:", "options": ["Capital", "Loss", "Profit", "Risk"], "answer": [0], "explanation": "Capital = start-up money."}, {"q": "Which words are about money? (several answers)", "options": ["Profit", "Loss", "Finances", "Consultant"], "answer": [0, 1, 2], "explanation": "A consultant is a person who gives advice."}, {"q": "Fill in: « Oprah decided to ______ with the TV station. »", "options": ["negotiate", "sack", "expand", "branch"], "answer": [0], "explanation": "to negotiate = to try to reach an agreement."}, {"q": "Put these events in chronological order: (1) Maverick created, (2) The Body Shop opens, (3) Chanel's comeback show, (4) Harpo Productions created.", "options": ["1 → 3 → 2 → 4", "3 → 2 → 4 → 1", "2 → 3 → 4 → 1", "3 → 4 → 2 → 1"], "answer": [1], "explanation": "1954 (Chanel) → 1976 (Body Shop) → 1986 (Harpo) → 1992 (Maverick).", "level": "moyen"}, {"q": "On the first day on the London Stock Exchange (1984), The Body Shop's share price:", "options": ["doubled to £4", "stayed at £0.95", "fell from £1.65 to £0.95", "rose from £0.95 to £1.65"], "answer": [3], "explanation": "It rose from £0.95 to £1.65, and Anita became a millionaire at 42.", "level": "moyen"}, {"q": "Which words in the wordlist are about people? (several answers)", "options": ["partnership", "consultant", "accountant", "stock exchange"], "answer": [1, 2], "explanation": "Partnership is a type of business; stock exchange is a place.", "level": "moyen"}, {"q": "Why did Oprah fail as a newsreader?", "options": ["She became too emotionally involved in the stories", "The station closed", "She couldn't read fast enough", "She preferred acting in films"], "answer": [0], "explanation": "Too emotional for news, perfect for a talk show.", "level": "moyen"}, {"q": "Scenario: in your essay you write « Oprah became rich because her salary was raised to $30 million. » What's the more accurate explanation?", "options": ["She sold Harpo Productions", "She negotiated a share of the money from sales of the show to other stations", "The Chicago station gave her a bonus for The Color Purple", "She became a newsreader in Baltimore"], "answer": [1], "explanation": "When 138 stations bought the show, her share made earnings jump from $200,000 to $30 million a year.", "level": "difficile"}, {"q": "Scenario: which businesswoman's story best illustrates « business can help make the world better »?", "options": ["Anita Roddick", "Coco Chanel", "Oprah Winfrey", "Madonna"], "answer": [0], "explanation": "Fair price with the Kayapo, re-usable bottles, environmental values.", "level": "difficile"}, {"q": "Scenario: match the business lesson to the right person. Which pairs are correct? (several answers)", "options": ["Madonna: planning, publicity and control of her brand", "Oprah: owning and controlling your product creates value", "Roddick: a brand should avoid any social or environmental commitment", "Chanel: fashion is about how people live"], "answer": [0, 1, 3], "explanation": "Roddick's lesson is the opposite: business with values.", "level": "difficile"}, {"q": "Scenario: « The company had to ______ 200 workers after a huge ______. » Which pair fits best?", "options": ["compete / share", "sack / loss", "negotiate / capital", "expand / profit"], "answer": [1], "explanation": "A big loss leads to sacking (firing) workers.", "level": "difficile"}, {"q": "Scenario: the 1994 media criticism of The Body Shop shows which business risk? (several answers)", "options": ["Reputation is part of the company's value", "Bad press can mak
