ois : il faut le solliciter immédiatement.", "level": "difficile"}], "qcm": [{"q": "Quelles sont les trois compétences étudiées dans le cas ?", "options": ["CRM, Données, Coordination", "Vente, Achat, Logistique", "Design, SEO, Juridique", "Comptabilité, Paie, Recrutement"], "answer": [0], "explanation": "Fiabiliser le CRM, analyser les données, coordonner."}, {"q": "Que signifie le niveau 3 de l'échelle de maîtrise ?", "options": ["Ne réalise pas l'activité", "Réalise avec accompagnement", "Réalise en autonomie", "Maîtrise les situations complexes et transmet"], "answer": [3], "explanation": "Le niveau 3 permet aussi de former les autres."}, {"q": "Quel est l'écart en CRM par rapport à la cible ?", "options": ["−1 autonome", "−2 autonomes", "Aucun écart", "−3 autonomes"], "answer": [1], "explanation": "2 autonomes (Amina, Karim) pour une cible de 4."}, {"q": "Pendant l'absence de Noé, combien de personnes sont autonomes en Données ?", "options": ["0", "1", "2", "3"], "answer": [0], "explanation": "Tous les autres sont au niveau 0 ou 1."}, {"q": "Qui est le mieux placé pour transmettre la compétence CRM ?", "options": ["Karim", "Elsa", "Léa", "Hugo"], "answer": [0], "explanation": "Karim est au niveau 3 en CRM."}, {"q": "Quels collaborateurs sont au niveau 1 en Données et pourraient monter en autonomie ? (plusieurs réponses)", "options": ["Amina", "Karim", "Léa", "Hugo"], "answer": [0, 1, 2], "explanation": "Elsa aussi. Hugo est au niveau 0."}, {"q": "Quels éléments sont des faiblesses internes ? (plusieurs réponses)", "options": ["Dépendance à Noé pour les données", "Dossiers CRM incomplets", "Décisions orales peu tracées", "Partenaire extérieur disponible"], "answer": [0, 1, 2], "explanation": "Le partenaire est une opportunité externe."}, {"q": "Quels éléments sont des forces internes ? (plusieurs réponses)", "options": ["Karim au niveau 3 en CRM", "Amina au niveau 3 en Coordination", "Léa demandeuse d'accompagnement", "Concurrents qui recrutent"], "answer": [0, 1, 2], "explanation": "Les concurrents relèvent des menaces."}, {"q": "Pourquoi la compétence Données est-elle la priorité la plus urgente ? (plusieurs réponses)", "options": ["Un seul autonome, qui s'absente dès le 2e mois", "Elle est indispensable pour personnaliser les campagnes", "Le marché des analystes est tendu", "Elle n'a aucun lien avec le projet"], "answer": [0, 1, 2], "explanation": "Risque maximal pour l'objectif de +20 %."}, {"q": "Quelle orientation respecte la contrainte de la direction ?", "options": ["Recruter un analyste en CDI", "Former en interne et solliciter le partenaire extérieur", "Abandonner l'objectif de 20 %", "Externaliser toute l'équipe"], "answer": [1], "explanation": "Aucun recrutement n'est autorisé."}, {"q": "Quels risques sont liés au travail hybride dans le cas ? (plusieurs réponses)", "options": ["Validations bloquées", "Décisions peu tracées", "Difficulté à accompagner Léa à distance", "Hausse des prix des matières premières"], "answer": [0, 1, 2], "explanation": "Le prix des matières premières est hors sujet."}, {"q": "Quels repères préviennent les risques du travail hybride ? (plusieurs réponses)", "options": ["Circuit de validation avec délais et délégations", "Décisions consignées dans un outil partagé", "Formations placées les jours sur site", "Interdire tout télétravail sans analyse"], "answer": [0, 1, 2], "explanation": "Des repères proportionnés, pas une suppression brutale."}, {"q": "Quels sont les critères de réussite du cas ? (plusieurs réponses)", "options": ["Cohérence avec le projet commercial", "Exactitude des calculs", "Distinction entre faits et hypothèses", "Longueur du document"], "answer": [0, 1, 2], "explanation": "Et la qualité des justifications et le respect des contraintes."}, {"q": "Le partenaire extérieur est disponible « sous six semaines ». Qu'en déduire ?", "options": ["Il faut le solliciter immédiatement pour couvrir l'absence de Noé dès le 2e mois", "On peut attendre le 5e mois", "Il est inutile", "Il remplace le recrutement d'un CDI"], "answer": [0], "explanation": "Les échéances doivent être croisées."}, {"q": "Pour atteindre la cible CRM (4 autonomes), combien de personnes doivent passer au niveau 2 au minimum ?", "options": ["3", "2", "1", "4"], "answer": [1], "explanation": "Aujourd'hui 2 autonomes (Amina 2, Karim 3). Il en faut 4 : +2.", "level": "moyen"}, {"q": "Quels éléments sont des menaces ou contraintes, et non des forces ? (plusieurs réponses)", "options": ["L'interdiction de recruter", "Les concurrents recrutent des analystes", "Karim peut transmettre en CRM", "Le délai court de 6 mois"], "answer": [0, 1, 3], "explanation": "Karim (N3 en CRM) est une force interne. L'interdiction de recruter est plutôt une contrainte interne de la direction.", "level": "moyen"}, {"q": "Qui est le référent naturel pour faire monter des collaborateurs en Coordination ?", "options": ["Elsa", "Noé", "Hugo", "Amina"], "answer": [3], "explanation": "Amina est la seule au niveau 3 en Coordination : elle peut transmettre.", "level": "moyen"}, {"q": "Quelles questions font partie des « informations à vérifier » du cas ? (plusieurs réponses)", "options": ["Quelles validations bloquent à distance ?", "Le partenaire peut-il couvrir l'analyse de données ?", "Combien faut-il recruter d'analystes ?", "Noé peut-il préparer son absence ?"], "answer": [0, 1, 3], "explanation": "Le recrutement est interdit : ce n'est pas une piste à vérifier.", "level": "moyen"}, {"q": "Mise en situation : après tutorat, Hugo et Léa passent au niveau 2 en CRM. Quel est le nouvel état ?", "options": ["3 autonomes : écart −1", "4 autonomes mais aucun N3", "6 autonomes : cible dépassée", "4 autonomes dont 1 N3 : cible CRM atteinte"], "answer": [3], "explanation": "Amina 2, Karim 3, Hugo 2, Léa 2 = 4 autonomes, dont Karim au niveau 3.", "level": "difficile"}, {"q": "Mise en situation : dans sa copie, un étudiant propose « recruter un data analyst en CDD pour remplacer Noé ». Quelle est la critique principale ?", "options": ["Cela viole la contrainte de la direction : aucun recrutement", "C'est une bonne idée car le marché recrute", "Il fallait proposer un CDI", "Ce n'est pas lié aux données"], "answer": [0], "explanation": "Le recrutement est explicitement interdit. Le partenaire extérieur et le transfert de compétences sont les pistes compatibles.", "level": "difficile"}, {"q": "Mise en situation : vous devez hiérarchiser deux priorités. Quels faits justifient de placer les Données en priorité 1 ? (plusieurs réponses)", "options": ["La personnalisation des campagnes dépend de la donnée client", "L'absence de Noé tombe dès le 2e mois", "L'écart CRM est le plus grand (−2)", "Un seul autonome, Noé"], "answer": [0, 1, 3], "explanation": "L'écart CRM est plus grand en nombre, mais le risque Données est plus critique : perte totale d'expertise au moment où le projet monte en charge.", "level": "difficile"}, {"q": "Mise en situation : pendant le télétravail, une campagne attend 10 jours la validation d'Amina, qui était en déplacement. Quel repère de prévention est le plus adapté ?", "options": ["Supprimer le télétravail", "Envoyer plus d'emails de relance", "Recruter un assistant", "Circuit de validation clair : qui valide quoi, dans quel délai, avec délégation en cas d'absence"], "answer": [3], "explanation": "C'est le repère du corrigé pour le risque « validations bloquées ».", "level": "difficile"}, {"q": "Mise en situation : vous rédigez la partie SWOT. Quels classements sont rigoureux ? (plusieurs réponses)", "options": ["Léa demandeuse d'accompagnement → force (interne, motivation)", "Partenaire extérieur disponible → force (interne)", "Dépendance à Noé → faiblesse (interne)", "Concurrents qui recrutent des analystes → menace (externe)"], "answer": [0, 2, 3], "explanation": "Le partenaire est extérieur à l'entreprise : c'est une opportunité, pas une force.", "level": "difficile"}], "open_questions": [{"question": "Reformulez les enjeux stratégiques du projet NovaWear et ses conséquences sur l'équipe.", "answer": "**Projet** : augmenter de **20 %** le CA réalisé avec les **clients existants** en **6 mois**, en **personnalisant** les campagnes commerciales et les relances, **sans recrutement**.\n\n**Conséquences sur les activités** : exploiter davantage le **CRM** (dossiers fiables et complets) ; produire des **analyses de données** pour segmenter et personnaliser ; renforcer la **coordination** entre commerce, marketing, contenus et relation client.\n\n**Conséquences sur l'organisation** : montée en compétence obligatoire de l'équipe actuelle, réorganisation des rôles et des circuits de décision, attention au travail hybride (validations, traçabilité), et gestion de l'absence de Noé.\n\n**Conclusion** : le succès commercial dépend d'un **plan de développement des compétences** sous contrainte de temps."}, {"question": "Analysez les écarts entre la situation actuelle et les cibles à six mois.", "answer": "**Méthode** : autonome = niveau ≥ 2, et les niveaux 3 sont inclus.\n\n- **CRM** : 2 autonomes (Amina 2, Karim 3) pour 4 visés, soit **−2** ; niveau 3 atteint (Karim).\n- **Données** : 1 autonome (Noé 3) pour 2 visés, soit **−1** ; niveau 3 atteint, mais **pendant les 6 semaines d'absence** de Noé : 0 autonome, 0 niveau 3, soit **−2 et plus aucun expert**.\n- **Coordination** : 3 autonomes (Amina 3, Hugo 2, Karim 2) pour 4, soit **−1** ; niveau 3 atteint (Amina).\n\n**Conséquences** : sans données, pas de personnalisation, donc l'objectif de +20 % est menacé dès le 2e mois. Un CRM incomplet entraîne des relances mal ciblées. Une coordination faible bloque les validations et ralentit les campagnes. Comme on ne peut pas recruter, il faut développer les compétences en interne et mobiliser le partenaire."}, {"question": "Pourquoi faut-il distinguer faits et hypothèses dans un diagnostic RH ? Donnez des exemples tirés du cas.", "answer": "Un diagnostic doit être **fondé sur des éléments vérifiables** ; mélanger faits et suppositions fausse les priorités et affaiblit l'argumentation.\n\n**Faits** : Noé absent 6 semaines à partir du 2e mois ; validations bloquées à distance ; CRM incomplet ; Léa demande un accompagnement ; partenaire disponible sous 6 semaines ; concurrents qui recrutent des analystes.\n\n**Hypothèses** : Noé pourrait être tenté de partir ; Karim aurait le temps de tutorer ; le partenaire maîtriserait les outils de NovaWear.\n\nOn signale les hypothèses comme **informations à vérifier**."}], "exercises": [{"title": "Cas complet NovaWear — à rédiger en conditions réelles (1 heure)", "statement": "Reprenez l'énoncé (section « Le cas en bref » et « Les données de compétences ») et traitez les 6 demandes : enjeux, SWOT RH, cartographie avec 3 compétences critiques, écarts et risques avec calculs, 2 priorités hiérarchisées, travail hybride (2 risques, repères, informations à vérifier, faits vs hypothèses).", "questions": ["Rédigez votre production en 1 heure, puis comparez avec le corrigé.", "Préparez une restitution orale de 2 minutes qui commence par la priorité la plus urgente."], "answer": "Utilisez les sections 3, 5, 6 et 7 du résumé comme corrigé type.\n\n**Trame de restitution orale (2 min)** :\n1. « Notre priorité la plus urgente est de **sécuriser la compétence Données**. »\n2. **Faits** : un seul autonome (Noé), absent 6 semaines dès le 2e mois ; cible de 2 autonomes ; pas de recrutement ; concurrents qui recrutent.\n3. **Écart** : −1 en temps normal, −2 pendant l'absence, sans aucun expert. **Conséquence** : la personnalisation s'arrête au moment clé.\n4. **Orientation** : transfert de Noé vers Karim ou Amina dès le mois 1, documentation, partenaire sollicité tout de suite.\n5. « Notre deuxième priorité est de **fiabiliser le CRM** : −2 autonomes, dossiers incomplets ; tutorat de Karim pour Hugo et Léa. »"}, {"title": "Exercice de calcul — variante", "statement": "Même échelle. Cible en Données : 3 autonomes dont 1 de niveau 3. Niveaux actuels : A = 2, B = 1, C = 3, D = 0, E = 1. C sera absent un mois.", "questions": ["Quel est l'écart en temps normal ?", "Quel est l'écart pendant l'absence de C ?", "Qui former en priorité ?"], "answer": "1. Autonomes : A (2) et C (3), soit 2 pour une cible de 3 : **−1**. Niveau 3 atteint (C).\n2. Pendant l'absence de C : 1 seul autonome (A) et **aucun niveau 3**, soit **−2 autonomes et −1 niveau 3**.\n3. Former **B ou E** (niveau 1 → 2), tutorés par C **avant** son absence ; envisager de faire progresser A vers le niveau 3 pour ne plus dépendre de C."}], "resources": []}]}, {"id": "seo", "order": 6, "folder": "06. SEO", "title": "SEO & SEA — Référencement naturel et payant", "short": "SEO", "teacher": "Laurent Hentz", "description": "Référencement sur les moteurs, les réseaux et les IA : fonctionnement des moteurs, les trois piliers du SEO (contenu, technique, autorité), mots-clés, rédaction optimisée, GEO, audit et suivi des performances.", "key_dates": [{"date": "23/11/2026", "label": "Quiz (~20 questions) sur le pilier contenu + éléments introductifs — 4 points"}, {"date": "17/12/2026", "label": "Rendu du dossier de présentation + articles individuels — articles : 6 points"}, {"date": "18/12/2026", "label": "Présentation orale de groupe (chacun intervient) — 10 points (dossier 5 + oral 5)"}], "exam_info": "**Notation sur 20** :\n- **23/11** : quiz d'une **vingtaine de questions** sur le **pilier contenu** du SEO et les **éléments introductifs** → **4 points**.\n- **17/12** : rendu du **dossier de présentation** avec les **articles individuels** → les articles comptent pour **6 points**.\n- **18/12** : **présentation orale** de groupe, **chaque membre intervient au moins une fois** → note de groupe sur **10 points** (dossier **5** + oral **5**).\n\n**Trame imposée du dossier** (modèle fourni) : présentation du projet (3 paragraphes max) · cœur de cible, cible principale, cible secondaire · **3 personas** (besoins et objectifs, freins et frustrations, habitudes de recherche) · **objectifs SMART** · **mots-clés avec volume mensuel** · **arborescence de 5 pages minimum** avec un mot-clé principal par page · **5 concurrents** (URL + remarques) · charte graphique · conclusion (stratégie pour être visible sur les moteurs **et les IA**) · **3 articles individuels** (titre, meta description, mot-clé principal + 4 secondaires, contenu).\n\n**IA autorisée** (recherche, création, automatisation), mais un contenu rédigé par IA **sans plus-value** est refusé par Google.", "courses": [{"id": "seo-01", "title": "Cours 1 — Introduction au référencement & fonctionnement des moteurs", "subtitle": "Définitions, enjeux, ROI et KPI, acteurs de la recherche (moteurs, réseaux, IA), crawl → indexation → diffusion", "date": "", "status": "vu", "sources": ["Cours SEO.pptx", "Modele presentation projet SEO.pptx"], "objectives": ["Définir SEO, SEA, VSEO, SERP et GEO sans les confondre.", "Expliquer pourquoi le SEO et le SEA restent des leviers clés d'acquisition, y compris à l'heure de l'IA.", "Calculer un ROI et comparer les ROI par canal (SEO vs SEA, etc.).", "Connaître les principaux KPI du SEO et du SEA.", "Situer les acteurs : moteurs classiques, recherche sociale / vidéo / e-commerce, recherche sur les IA.", "Décrire les trois étapes du fonctionnement d'un moteur : exploration, indexation, diffusion."], "summary": [{"title": "1. Les définitions à connaître", "body": "| Sigle | Signification | En clair |\n|---|---|---|\n| **SEO** | Search Engine Optimisation | **Référencement naturel** (« gratuit ») : techniques pour améliorer ses positions sur les moteurs |\n| **SEA** | Search Engine Advertising | **Référencement payant** : optimiser ses campagnes publicitaires (Google Ads…) |\n| **VSEO** | Video SEO | Techniques du référencement appliquées à la **vidéo** |\n| **SERP** | Search Engine Results Pages | Les **pages de résultats** d'un moteur |\n| **GEO** | Generative Engine Optimisation | Techniques pour se positionner sur les **IA** (ChatGPT, Gemini…) |\n\n**À retenir** : le SEA est facile à lancer mais la visibilité **s'arrête dès qu'on cesse de payer**, et le SEA **n'a aucun impact sur le SEO**."}, {"title": "2. Pourquoi faire du SEO et du SEA ?", "body": "- Les moteurs attirent une **audience massive**, dans **tous les secteurs**, **BtoB compris**.\n- **Bon retour sur investissement**.\n- Ne pas **laisser la place aux concurrents** : si votre marque n'est pas trouvée, elle n'inspire pas confiance et le concurrent capte votre prospect **gratuitement**.\n- **Suivi fin** des audiences, du comportement d'achat et des **mots-clés qui convertissent**.\n- La plupart des internautes comprennent mal les résultats : ils cliquent sur le **premier résultat** en faisant confiance à Google.\n\n**Le SEO est-il encore utile avec l'IA ?** Oui : la recherche reste **massive** (et s'étend aux réseaux sociaux), les stratégies pour être présent sur les IA sont **proches du SEO**, et les clients cherchent de l'information **avant et après** leur décision (notamment sur ChatGPT). Une bonne présence sert de **réassurance** et de **déclencheur**.\n\n> Exemple du cours : un site joli et complet mais sans apport original (coffeealternatives.com) face à un site plus simple qui vise bien les **intentions de recherche** avec un contenu **original** (sanscafeine.fr)."}, {"title": "3. Les chiffres clés", "body": "- **130 000 milliards** de pages indexées par Google.\n- Google : **93 %** de part de marché dans le monde, **92 %** en France (environ **90 %** en Occident).\n- **3,3 milliards** de requêtes par jour, **100 milliards** par mois.\n- **30 %** des visites des sites viennent de Google.\n- Les **recherches transactionnelles** (achat) se font sur Google."}, {"title": "4. Le ROI et les KPI", "body": "**ROI** (Return On Investment) = **(Gains − Coûts) / Coûts × 100**. Il indique **combien on gagne pour 1 € dépensé**, permet de **prioriser les canaux** et d'optimiser le budget.\n\n**ROI du SEO** : investissement **initial élevé** mais **coût marginal décroissant** ; résultats **cumulatifs** ; trafic « gratuit » une fois les positions acquises ; positions **durables** ; mesure **complexe** (attribution difficile, cycle long) → **le ROI augmente avec le temps**. Sur le long terme, il est **plus intéressant** que celui de la publicité Google.\n\n| Canal | ROI estimé | Caractéristique |\n|---|---|---|\n| SEO | 5:1 à 20:1 | Long terme, effet cumulatif |\n| SEA / Google Ads | 2:1 à 8:1 | Immédiat, contrôlable, coût par clic |\n| Réseaux sociaux | 3:1 à 20:1 | Engagement, notoriété, ciblage |\n| Email marketing | 15:1 à 25:1 | Fidélisation, coût minimal |\n| Influenceurs | 3:1 à 25:1 | Crédibilité, audiences qualifiées |\n\n**Principaux KPI** : conversions, taux de conversion, valeur de conversion · **ROAS** (retour sur dépenses publicitaires) · **trafic organique** · **positions moyennes** · **CTR** (clics / impressions) · **impressions** · **pages indexées** · **temps de chargement** (Core Web Vitals) · **taux de rebond organique** · **backlinks** (nombre et qualité)."}, {"title": "5. Les acteurs de la recherche", "body": "**Moteurs classiques** : **Google** (~90 % en Occident) ; **Bing** (5 à 8 %), qui fournit sa technologie à Yahoo, DuckDuckGo, Ecosia, ChatGPT… et 2e plateforme publicitaire (**Microsoft Advertising**, complémentaire de Google Ads) ; en Europe **Qwant, Ecosia, Brave Search** (Qwant et Ecosia partagent l'index européen EUSP / Staan). Exceptions : **Naver** en Corée (~50 %), **Yandex** en Russie (~70 %), **Seznam** en Tchéquie (~20 %), **Baidu** en Chine (Google ~2 %).\n\n**Recherche sociale, vidéo, e-commerce** : les réseaux sont de vrais moteurs ; sur certaines tranches d'âge **TikTok passe devant Google** ; **YouTube = 2e moteur** ; pour l'e-commerce, **Amazon** et les marketplaces concurrencent Google.\n\n**Recherche sur les IA** : ChatGPT, Meta AI, Gemini / Google AIO, DeepSeek, Claude, Mistral, Perplexity, Grok. Elles s'appuient sur **Google, Bing ou Brave** ; médias, réseaux et forums y pèsent lourd. Elles apportent **peu de trafic direct** : on cherche surtout des **mentions / citations**. La recherche IA se termine souvent par une **recherche finale sur Google** (marque, produit)."}, {"title": "6. Les types de référencement", "body": "| Type | Points clés |\n|---|---|\n| **Naturel (SEO)** | Impact **long terme**, effets durables, parfois difficile à mettre en place |\n| **Local** | Google Maps et équivalents, pour les activités locales |\n| **Vidéo / réseaux (VSEO)** | **Bon ROI actuel**, assez facile, peut influencer les positions naturelles |\n| **E-commerce** | Optimisation des **métadonnées** et structuration des **flux produits** |\n| **Payant (SEA)** | Facile à lancer, expertise pour optimiser ; **plus de visibilité si on arrête de payer** ; **aucun impact sur le SEO** |\n| **Sur les IA (GEO)** | **Émergent**, proche du SEO |"}, {"title": "7. Comment fonctionne un moteur ?", "body": "**Trois étapes** :\n1. **Exploration (crawling)** : des robots parcourent le web de lien en lien.\n2. **Indexation** : les données sont **retraitées**, **classées** et **compressées** dans les centres de données.\n3. **Diffusion** : la requête est **analysée** (orthographe, synonymes, sens possibles, **géolocalisation**), puis les résultats sont envoyés.\n\n**Google** cherche à comprendre l'**intention** de l'utilisateur ; le résultat peut **différer entre mobile et ordinateur**. Avec la **recherche universelle**, il enrichit l'affichage selon la requête : résultats textuels, annonces, images, vidéos, extraits enrichis, données structurées, Knowledge Graph, Shopping, Maps, suggestions, Actualités, Discover, **AI Overview**.\n\n**Accès à ces affichages** : **Google Shopping, Maps et Actualités nécessitent une inscription** préalable ; les **données structurées** demandent une **implémentation technique** ; pour le reste, bien structurer son contenu et utiliser les bons mots-clés.\n\n**Bing** : critères proches de Google ; l'enjeu principal est l'**indexation** → **Bing Webmaster Tool** (ajout du sitemap) et, si pertinent, **IndexNow**."}], "key_points": ["SEO = référencement naturel ; SEA = référencement payant ; SERP = pages de résultats ; GEO = optimisation pour les IA ; VSEO = SEO vidéo.", "Le SEA n'a aucun impact sur le SEO, et sa visibilité s'arrête quand on arrête de payer.", "ROI = (Gains − Coûts) / Coûts × 100 : combien on gagne pour 1 € dépensé.", "Le ROI du SEO augmente avec le temps (coût marginal décroissant, effet cumulatif) ; sur le long terme il dépasse celui de Google Ads.", "Google : 93 % de part de marché mondiale, 92 % en France ; 3,3 milliards de requêtes/jour ; 30 % des visites des sites.", "Bing alimente de nombreux autres moteurs et IA (Yahoo, DuckDuckGo, Ecosia, ChatGPT…).", "YouTube est le 2e moteur de recherche ; TikTok devance Google sur certaines tranches d'âge.", "Les IA apportent peu de trafic direct : l'enjeu est d'être cité (mentions) et indexé sur Google, Bing et Brave.", "Fonctionnement d'un moteur : exploration (crawl) → indexation → diffusion.", "Google Shopping, Maps et Actualités exigent une inscription ; les données structurées une implémentation technique."], "traps": ["Ne pas dire que le SEA améliore le SEO : le cours est formel, il n'a aucun impact.", "Le SEO n'est pas « gratuit » au départ : l'investissement initial est élevé, c'est le coût marginal qui baisse.", "Le ROI se divise par les coûts, pas par les gains : (Gains − Coûts) / Coûts × 100.", "Le 2e moteur de recherche cité est YouTube, pas Bing.", "Les IA ne sont pas une source de trafic massif : elles génèrent peu de clics, on vise des mentions.", "Discover ne nécessite pas d'inscription, contrairement à Shopping, Maps et Actualités.", "Indexation ≠ exploration : on peut explorer une page sans l'indexer."], "glossary": [{"term": "SEO", "definition": "Search Engine Optimisation : référencement naturel, techniques pour améliorer ses positions sur les moteurs."}, {"term": "SEA", "definition": "Search Engine Advertising : référencement payant, optimisation des campagnes publicitaires sur les moteurs."}, {"term": "VSEO", "definition": "Techniques de référencement appliquées à la vidéo."}, {"term": "SERP", "definition": "Search Engine Results Pages : pages de résultats d'un moteur de recherche."}, {"term": "GEO", "definition": "Generative Engine Optimisation : techniques pour être visible et cité dans les réponses des IA."}, {"term": "ROI", "definition": "Return On Investment : (Gains − Coûts) / Coûts × 100."}, {"term": "ROAS", "definition": "Return On Ad Spend : retour sur les dépenses publicitaires."}, {"term": "CTR", "definition": "Taux de clic : clics / impressions dans les SERP."}, {"term": "KPI", "definition": "Indicateurs clés observés pour évaluer la performance des actions."}, {"term": "Crawling", "definition": "Exploration du web par les robots des moteurs, de lien en lien."}, {"term": "Indexation", "definition": "Retraitement, classement et compression des pages explorées dans l'index du moteur."}, {"term": "Recherche universelle", "definition": "Affichage enrichi des résultats Google selon la requête (images, vidéos, Maps, Shopping, AI Overview…)."}, {"term": "Knowledge Graph", "definition": "Panneau d'information de Google construit autour des entités (personnes, lieux, marques)."}, {"term": "IndexNow", "definition": "Protocole pour signaler rapidement ses nouvelles pages à Bing et aux moteurs compatibles."}], "qcb": [{"q": "Le SEA désigne le référencement naturel.", "answer": false, "explanation": "Le SEA est le référencement payant ; le SEO est le référencement naturel."}, {"q": "Le GEO regroupe les techniques pour se positionner sur les IA génératives.", "answer": true, "explanation": "GEO = Generative Engine Optimisation."}, {"q": "Faire du SEA améliore mécaniquement les positions SEO.", "answer": false, "explanation": "Le cours est explicite : le SEA n'a aucun impact sur le SEO."}, {"q": "Quand on arrête de payer ses annonces, on garde sa visibilité SEA quelques mois.", "answer": false, "explanation": "La visibilité SEA s'arrête dès qu'on cesse de payer."}, {"q": "Le ROI se calcule ainsi : (Gains − Coûts) / Coûts × 100.", "answer": true, "explanation": "C'est la formule donnée en cours."}, {"q": "Le ROI du SEO a tendance à diminuer avec le temps.", "answer": false, "explanation": "Il augmente : coût marginal décroissant et effet cumulatif."}, {"q": "Google détient environ 92 % de part de marché en France.", "answer": true, "explanation": "93 % dans le monde, 92 % en France."}, {"q": "Bing est présenté comme le 2e moteur de recherche en part de marché derrière Google.", "answer": false, "explanation": "C'est YouTube qui est considéré comme le 2e moteur de recherche."}, {"q": "Bing fournit sa technologie à d'autres moteurs comme Yahoo ou DuckDuckGo.", "answer": true, "explanation": "Bing alimente notamment Yahoo, DuckDuckGo, Ecosia et ChatGPT."}, {"q": "Les IA génératives apportent beaucoup de trafic direct aux sites.", "answer": false, "explanation": "Elles en apportent peu : les professionnels recherchent surtout des mentions."}, {"q": "Le SEO concerne aussi les entreprises BtoB.", "answer": true, "explanation": "Les moteurs concernent tous les secteurs, BtoB compris."}, {"q": "Les trois étapes d'un moteur sont : exploration, indexation, diffusion.", "answer": true, "explanation": "Crawling → indexation → diffusion."}, {"q": "Un résultat Google peut être différent sur mobile et sur ordinateur.", "answer": true, "explanation": "Google adapte ses résultats à l'appareil et au contexte."}, {"q": "Pour apparaître dans Google Maps, aucune inscription n'est nécessaire.", "answer": false, "explanation": "Il faut s'inscrire sur Google My Business (comme pour Shopping et Actualités)."}, {"q": "Sur certaines tranches d'âge, TikTok est devant Google en part de marché de la recherche.", "answer": true, "explanation": "Les réseaux sociaux sont devenus de vrais moteurs de recherche."}, {"q": "Le référencement vidéo a actuellement un bon ROI et est assez facile à mettre en place.", "answer": true, "explanation": "C'est l'un des leviers les plus rentables présentés."}, {"q": "Selon le cours, le 2e moteur de recherche est Bing.", "answer": false, "explanation": "Le cours cite YouTube comme 2e moteur. Bing pèse 5 à 8 % sur la recherche classique.", "level": "moyen"}, {"q": "Une page peut être explorée par un robot sans être indexée.", "answer": true, "explanation": "Exploration (crawl) et indexation sont deux étapes distinctes.", "level": "moyen"}, {"q": "Google Discover nécessite une inscription préalable, comme Google Shopping.", "answer": false, "explanation": "Shopping, Maps et Actualités nécessitent une inscription ; Discover non.", "level": "moyen"}, {"q": "Le résultat d'une même requête Google peut différer entre mobile et ordinateur.", "answer": true, "explanation": "Google adapte les résultats au contexte, notamment à l'appareil et à la géolocalisation.", "level": "moyen"}, {"q": "Une entreprise qui investit massivement en Google Ads améliore mécaniquement ses positions naturelles.", "answer": false, "explanation": "Le cours est formel : le SEA n'a aucun impact sur le SEO.", "level": "difficile"}, {"q": "Le ROI du SEO est souvent faible la première année puis augmente, car le coût marginal baisse et les effets se cumulent.", "answer": true, "explanation": "Investissement initial élevé, résultats cumulatifs, positions durables : le ROI augmente avec le temps.", "level": "difficile"}], "qcm": [{"q": "Que signifie SERP ?", "options": ["Search Engine Results Pages", "Search Engine Ranking Process", "Social Engine Result Platform", "Search Engine Referral Program"], "answer": [0], "explanation": "Les pages de résultats d'un moteur."}, {"q": "Quelles affirmations sur le SEA sont exactes ?", "options": ["Il est plutôt facile à mettre en place", "La visibilité cesse quand on arrête de payer", "Il améliore le SEO", "Il demande des connaissances poussées pour bien l'optimiser"], "answer": [0, 1, 3], "explanation": "Le SEA n'a aucun impact sur le SEO."}, {"q": "Une campagne coûte 2 000 € et rapporte 8 000 €. Quel est le ROI ?", "options": ["400 %", "300 %", "75 %", "25 %"], "answer": [1], "explanation": "(8 000 − 2 000) / 2 000 × 100 = 300 %."}, {"q": "Quelles caractéristiques décrivent le ROI du SEO ?", "options": ["Investissement initial élevé", "Coût marginal décroissant", "Résultats immédiats", "Mesure complexe (attribution difficile)"], "answer": [0, 1, 3], "explanation": "Les résultats sont cumulatifs dans le temps, pas immédiats."}, {"q": "Quel canal affiche le ROI estimé le plus élevé dans le cours (15:1 à 25:1) ?", "options": ["SEA / Google Ads", "Email marketing", "SEO", "Réseaux sociaux"], "answer": [1], "explanation": "Email : fidélisation et coût minimal."}, {"q": "Que mesure le CTR ?", "options": ["Les clics divisés par les impressions", "Le temps passé sur la page", "Le nombre de backlinks", "Le chiffre d'affaires par visite"], "answer": [0], "explanation": "Le taux de clic dans les SERP."}, {"q": "Lesquels sont des KPI cités pour le SEO / SEA ?", "options": ["ROAS", "Trafic organique", "Positions moyennes", "Nombre de salariés"], "answer": [0, 1, 2], "explanation": "S'y ajoutent CTR, impressions, pages indexées, Core Web Vitals, rebond, backlinks."}, {"q": "Quel moteur domine en Russie (~70 %) ?", "options": ["Baidu", "Naver", "Yandex", "Seznam"], "answer": [2], "explanation": "Baidu domine en Chine, Naver en Corée, Seznam pèse ~20 % en Tchéquie."}, {"q": "Sur quels index s'appuient la plupart des IA pour la recherche web ?", "options": ["Google", "Bing", "Brave Search", "Yandex"], "answer": [0, 1, 2], "explanation": "D'où l'enjeu d'être bien indexé sur ces trois moteurs."}, {"q": "Que se passe-t-il pendant l'indexation ?", "options": ["Retraitement des données", "Classement des données", "Compression des données", "Affichage des annonces"], "answer": [0, 1, 2], "explanation": "L'affichage relève de la diffusion."}, {"q": "Lors de la diffusion, sur quoi s'appuient les algorithmes pour analyser la requête ?", "options": ["Orthographe", "Synonymes et sens possibles", "Géolocalisation", "Couleur du site"], "answer": [0, 1, 2], "explanation": "Puis les résultats sont envoyés à l'utilisateur."}, {"q": "Quels services Google nécessitent une inscription préalable ?", "options": ["Google Shopping", "Google Maps", "Google Actualités", "Discover"], "answer": [0, 1, 2], "explanation": "Discover ne nécessite pas d'inscription obligatoire."}, {"q": "Quel outil utilise-t-on pour gérer l'indexation sur Bing ?", "options": ["Bing Webmaster Tool", "Google Tag Manager", "Google Merchant Center", "Screaming Frog"], "answer": [0], "explanation": "On y ajoute son sitemap, avec IndexNow si pertinent."}, {"q": "En quoi consiste surtout le référencement e-commerce ?", "options": ["Optimiser les métadonnées", "Structurer les flux produits", "Acheter des backlinks", "Créer des vidéos TikTok"], "answer": [0, 1], "explanation": "Métadonnées + flux produits."}, {"q": "Quelle part des visites des sites provient de Google selon le cours ?", "options": ["10 %", "30 %", "60 %", "90 %"], "answer": [1], "explanation": "30 % des visites ont Google comme source."}, {"q": "Une campagne Google Ads coûte 5 000 € et génère 15 000 € de gains. Quel est le ROI ?", "options": ["300 %", "66 %", "200 %", "33 %"], "answer": [2], "explanation": "(15 000 − 5 000) ÷ 5 000 × 100 = 200 %.", "level": "moyen"}, {"q": "Remettez dans l'ordre le fonctionnement d'un moteur :", "options": ["Exploration → indexation → diffusion", "Diffusion → exploration → indexation", "Indexation → exploration → diffusion", "Exploration → diffusion → indexation"], "answer": [0], "explanation": "Les robots explorent, les données sont indexées, puis les résultats sont diffusés à la requête.", "level": "moyen"}, {"q": "Quels moteurs ou IA s'appuient sur la technologie de Bing selon le cours ? (plusieurs réponses)", "options": ["Baidu", "Yahoo", "DuckDuckGo", "ChatGPT"], "answer": [1, 2, 3], "explanation": "Baidu est le moteur chinois, indépendant de Bing.", "level": "moyen"}, {"q": "Quel est le principal enjeu sur Bing selon le cours ?", "options": ["L'indexation (Bing Webmaster Tool, sitemap, IndexNow)", "Les backlinks uniquement", "L'inscription à Bing Maps", "La publicité obligatoire"], "answer": [0], "explanation": "Les critères sont proches de Google ; il faut surtout être bien indexé.", "level": "moyen"}, {"q": "Mise en situation : une start-up lance un produit dans 15 jours et a besoin de visibilité immédiate. Elle a aussi un objectif de trafic durable à 2 ans. Quelle combinaison est la plus cohérente ?", "options": ["SEO seul, car il est gratuit", "SEA seul, car il améliore aussi le SEO", "SEA pour le lancement, SEO en parallèle pour le long terme", "GEO seul, car les IA apportent beaucoup de trafic"], "answer": [2], "explanation": "SEA = immédiat mais s'arrête quand on arrête de payer ; SEO = long terme. Les IA apportent peu de trafic direct.", "level": "difficile"}, {"q": "Mise en situation : une marque constate que ChatGPT la cite souvent, mais ses visites venant des IA restent faibles. Quelles conclusions sont justes ? (plusieurs réponses)", "options": ["Les mentions servent la réassurance et la notoriété", "Elle doit abandonner le SEO", "La recherche IA se termine souvent par une recherche finale sur Google", "C'est normal : les IA apportent peu de trafic direct"], "answer": [0, 2, 3], "explanation": "L'objectif sur les IA est d'être cité. Les stratégies sont proches du SEO : l'abandonner serait contre-productif.", "level": "difficile"}, {"q": "Mise en situation : un restaurant veut apparaître sur Google Maps, avoir des avis étoilés dans les résultats et être dans Google Actualités pour un événement. Que doit-il faire ? (plusieurs réponses)", "options": ["S'inscrire pour Maps", "Implémenter des données structurées pour les extraits enrichis", "S'inscrire pour Actualités", "Rien : tout est automatique"], "answer": [0, 1, 2], "explanation": "Maps, Shopping et Actualités nécessitent une inscription ; les données structurées une implémentation technique.", "level": "difficile"}, {"q": "Mise en situation : une marque vise le marché sud-coréen. Quel moteur doit-elle intégrer en priorité, en plus de Google ?", "options": ["Baidu", "Yandex", "Naver", "Seznam"], "answer": [2], "explanation": "Naver pèse environ 50 % en Corée. Yandex = Russie, Seznam = Tchéquie, Baidu = Chine.", "level": "difficile"}, {"q": "Mise en situation : deux sites parlent d'alternatives au café. Le premier est beau et complet mais sans apport original ; le second est simple mais répond précisément aux intentions de recherche avec un contenu original. Selon le cours :", "options": ["Le premier gagne grâce au design", "Le second a plus de chances d'être bien positionné", "Seul le SEA peut départager", "Les deux seront positionnés à égalité"], "answer": [1], "explanation": "C'est l'exemple du cours : viser les intentions de recherche avec un contenu original l'emporte sur l'esthétique.", "level": "difficile"}], "open_questions": [{"question": "Définissez SEO, SEA et GEO et expliquez leur complémentarité.", "answer": "**SEO** : référencement **naturel**, techniques pour améliorer ses positions gratuites sur les moteurs ; effet **long terme**, ROI croissant.\n\n**SEA** : référencement **payant** (Google Ads, Microsoft Advertising) ; visibilité **immédiate et contrôlable**, mais qui **cesse dès qu'on arrête de payer** ; **aucun impact sur le SEO**.\n\n**GEO** : techniques pour être **cité par les IA** (ChatGPT, Gemini, Perplexity…), proches du SEO.\n\n**Complémentarité** : le SEA apporte des résultats rapides (lancement, tests de mots-clés), le SEO construit une visibilité durable, le GEO assure la présence là où les clients s'informent avant de décider. **Exemple** : une nouvelle boutique lance des annonces dès l'ouverture, pendant que ses articles SEO montent en puissance."}, {"question": "Pourquoi le SEO reste-t-il utile à l'heure de l'IA ?", "answer": "**1. La recherche reste massive** sur les moteurs et s'étend aux réseaux sociaux.\n\n**2. Les IA s'appuient sur les moteurs** (Google, Bing, Brave) : être bien indexé est la condition pour être repris.\n\n**3. Les stratégies sont proches** : contenu expert, structuré, sourcé.\n\n**4. Réassurance** : les clients se renseignent avant et après leur décision ; une marque introuvable inspire moins confiance et laisse le prospect au concurrent.\n\n**5. Conversion** : la recherche IA se termine souvent par une recherche finale sur Google (marque, produit)."}, {"question": "Comparez le ROI du SEO et celui du SEA.", "answer": "**Formule** : ROI = (Gains − Coûts) / Coûts × 100.\n\n**SEA** : ROI estimé **2:1 à 8:1**, résultats **immédiats**, coût par clic **récurrent** : le ROI reste stable tant qu'on paie.\n\n**SEO** : ROI estimé **5:1 à 20:1** ; **investissement initial élevé** mais **coût marginal décroissant**, résultats **cumulatifs** et **durables** ; mesure plus **complexe** (attribution, cycle long).\n\n**Conclusion** : à court terme le SEA est plus rapide, à long terme le SEO est **plus rentable**."}, {"question": "Expliquez les trois étapes du fonctionnement d'un moteur de recherche.", "answer": "1. **Exploration (crawling)** : les robots parcourent les pages en suivant les liens.\n2. **Indexation** : les données sont retraitées, classées et compressées dans l'index.\n3. **Diffusion** : la requête est analysée (orthographe, synonymes, sens, géolocalisation), puis les résultats sont classés et affichés, souvent enrichis (recherche universelle).\n\n**Conséquence SEO** : une page non explorée ou non indexée ne peut pas se positionner, d'où l'importance des liens, du sitemap et de la Search Console / Bing Webmaster Tool."}], "exercises": [{"title": "Calculs de ROI", "statement": "Une PME teste deux leviers sur un an.\n- **Google Ads** : 6 000 € dépensés, 18 000 € de marge générée.\n- **SEO** : 9 000 € investis (rédaction + technique), 45 000 € de marge générée.", "questions": ["Calculez le ROI de chaque levier.", "Lequel est le plus rentable ? Quelle nuance apporter pour l'année suivante ?"], "answer": "**Google Ads** : (18 000 − 6 000) / 6 000 × 100 = **200 %** (ratio 3:1).\n\n**SEO** : (45 000 − 9 000) / 9 000 × 100 = **400 %** (ratio 5:1).\n\n**Le SEO est plus rentable.** **Nuance** : l'année suivante, le coût marginal du SEO baisse (positions acquises, contenus déjà produits) alors que le SEA doit être repayé chaque mois : l'écart devrait **se creuser** en faveur du SEO. Mais le SEA reste utile pour des résultats **immédiats**."}], "resources": [{"label": "Site de l'intervenant — lhentz.com", "url": "https://lhentz.com"}, {"label": "Chaîne YouTube Numipage (Laurent Hentz)", "url": "https://www.youtube.com/@numipage"}]}, {"id": "seo-02", "title": "Cours 2 & 3 — Pilier contenu : mots-clés, cibles, objectifs et rédaction", "subtitle": "Recherche de mots-clés, intentions, longue traîne, cibles et personas, SMART, title, Hn, meta description, Navboost, E-E-A-T", "date": "", "status": "vu", "sources": ["Cours SEO.pptx", "Modele presentation projet SEO.pptx"], "objectives": ["Comprendre pourquoi et comment on recherche ses mots-clés, et ce qu'est un bon mot-clé.", "Classer les requêtes selon les intentions de recherche et y associer le bon type de page.", "Segmenter ses cibles (cœur, principale, secondaire), construire des personas et formuler des objectifs SMART.", "Rédiger un article optimisé : titre SEO, h1/h2, corps de texte, images, données structurées, meta description.", "Expliquer Navboost et E-E-A-T et leurs conséquences sur le contenu.", "Construire une première arborescence (5 pages minimum, un mot-clé par page)."], "summary": [{"title": "1. Les trois piliers et les critères de contenu", "body": "Google utilise **plus de 200 critères**, regroupés en **trois piliers** : **contenu**, **technique**, **liens / autorité**.\n\n**Critères déterminants du contenu** :\n- le choix des **bons mots-clés** ;\n- une bonne **structure** (**cocon sémantique**) ;\n- un contenu **bien structuré et attractif** ;\n- des **balises bien optimisées**.\n\n> Le quiz du 23/11 porte sur **ce pilier** et sur les éléments introductifs."}, {"title": "2. La recherche de mots-clés", "body": "**Méthode** :\n1. Définir les **cibles** et les **objectifs**.\n2. Se faire une **première liste**.\n3. Regarder les **suggestions Google** et analyser la **concurrence**.\n4. Étudier les **intentions de recherche**.\n5. Outils d'idées : **AnswerThePublic**, 1.fr (Text Optimizer), **ChatGPT, Claude, Perplexity, Mistral**.\n6. Outils de **volumes** : **Haloscan**, **Ubersuggest** ; aussi Google Ads, Search Console, Bing Webmaster Tool.\n\nLe **commercial** joue un rôle important grâce à son **contact direct avec le client**.\n\n**Un bon mot-clé** :\n- correspond à ce que cherche **réellement le public**, pas au **vocabulaire interne** ;\n- a un **volume suffisant** ;\n- a une **difficulté adaptée à l'autorité** du site ;\n- offre des **variations et synonymes** (opportunités complémentaires).\n\n| Niveau | Exemples (tourisme) |\n|---|---|\n| **Thématique** (pas un mot-clé) | montagnes, soleil, plages, hiver, Espagne |\n| **Mot-clé trop large** | marques ski, voyage Espagne, crème solaire |\n| **Bon mot-clé** (précis + intention réelle) | ski femme taille 36 Rossignol, voyage en Espagne tout compris, crème solaire bio pour bébé |\n\nOn part du **thème**, puis des mots-clés **larges**, pour aboutir à des mots-clés **précis** qui apportent du trafic."}, {"title": "3. Intentions de recherche, difficulté et longue traîne", "body": "| Intention | L'internaute… | Contenu adapté |\n|---|---|---|\n| **Informationnelle** | cherche une info générale (qui, quoi, où, quand, comment) | **Article** |\n| **Navigationnelle** | cherche une **marque qu'il connaît** | **Page d'accueil / landing page** |\n| **Commerciale** | compare activement avant d'acheter | **Avis / comparatif** |\n| **Transactionnelle** | sait ce qu'il veut, va acheter | **Page produit** |\n| **Locale** | cherche à proximité | Fiche Google Maps, page locale |\n\n**Difficulté d'un mot-clé** : rapport entre volume de recherche, nombre de résultats et présence de concurrents. Indices : **nombre de résultats** (s'il est très bas, vérifier la pertinence), **présence d'annonces**, et **type de pages** déjà positionnées.\n\n**Longue traîne** : sur les requêtes génériques (« photographe paris »), les concurrents installés sont difficiles à rattraper. Quand on débute, on vise des mots-clés **de niche**, plus nombreux et à **faible volume** : « photographe portrait paris 18ème », « séance photo en couple à Montmartre »…\n\n**Mots-clés et IA** : la notion reste pertinente ; l'IA réduit les requêtes en **mots-clés de longue traîne** ; on anticipe **toutes les questions** autour de la requête et le **profil** de la personne → les **personas** jouent un rôle majeur ; les **données personnelles** pèsent encore plus."}, {"title": "4. Cibles, personas et objectifs SMART", "body": "**Trois segments de cible** : **cœur de cible** · **cibles principales** · **cibles secondaires**. Une cible se décrit par : pays, langue, zone, âge, sexe, affinités, profession, revenus… (ex. « responsable des achats en Europe francophone », « PME en Auvergne-Rhône-Alpes »).\n\n**Persona** (modèle du dossier) : prénom, âge, métier · **besoins et objectifs** · **freins et frustrations** · **habitudes de recherche**.\n\n**Objectifs** : chaque projet et chaque contenu doit répondre à un objectif (CA, prospects, fidélisation via réseaux ou newsletter, collecte d'informations, test, téléchargement d'appli, trafic). Ils peuvent **varier selon les contenus** d'une même entreprise.\n\n**SMART** : **S**pécifique · **M**esurable · **A**tteignable · **R**éaliste / pertinent · **T**emporellement défini.\n\n> Exemples : « **200 abonnés** de plus à ma newsletter **dans six mois** via l'acquisition SEO » ; « **10 prospects** et **2 clients** de plus **chaque mois dans 1 an** grâce à la stratégie SEO »."}, {"title": "5. Rédiger : le titre", "body": "Deux titres à distinguer (c'est conseillé) :\n- le **titre SEO** = balise `<title>` : une des **premières informations** analysées par le moteur, et **celle affichée dans les résultats** ; générée automatiquement par la plupart des CMS à partir du titre de page ;\n- le **titre affiché sur la page** = balise `<h1>` (titre principal), complété par des sous-titres `<h2>`.\n\nOn peut aussi prévoir un **titre pour les réseaux sociaux**.\n\n**Réussir son titre SEO** :\n- il contient **absolument le mot-clé visé**, de préférence **au début ou au milieu**, **pas à la fin** (meilleur taux de clic) ;\n- **une page = un mot-clé** (unique) pour éviter que les pages se concurrencent ;\n- environ **60 caractères maximum** pour ne pas être coupé (plus long si nécessaire) ;\n- ajouter un élément **différenciant / appel à l'action** : « Thé noir de noël – plongez dans la magie des fêtes » plutôt que « Thé noir de noël »."}, {"title": "6. Rédiger : le corps du texte, les images, les données structurées", "body": "**Corps du texte** :\n- le **premier paragraphe** est très important : il contient les mots-clés cibles et peut être **repris par Google** ;\n- travailler la **densité** : répéter les mots-clés **un minimum et naturellement**, avec des **synonymes** pour élargir le champ lexical ;\n- structurer avec des `<h2>` qui répondent chacun à une **problématique** → champ lexical élargi et positionnement sur la **longue traîne** ;\n- **longueur** : **300 mots minimum**, **700–1 000** pour un article informatif de base, **plus de 1 000** pour un article complet ;\n- éléments synthétiques : **tableaux, schémas, FAQ, table des matières, points essentiels en début d'article**.\n\n**Images et vidéos** : la balise **alt** est un critère de positionnement (image et page) ; images utiles pour les partages ; **Open Graph (og:image)** ; images **compressées (72 dpi)** ; une vidéo allonge le temps passé, à héberger sur un **site tiers** (YouTube, Dailymotion) pour ne pas alourdir le site.\n\n**Données structurées** : informations balisées que les moteurs peuvent reprendre (recettes, agendas, tutoriels, avis) pour un **affichage enrichi** qui attire l'œil. Spécifications sur **schema.org**, plugins sur certains CMS."}, {"title": "7. La meta description, Navboost et E-E-A-T", "body": "**Meta description** : texte affiché dans les résultats (**pas toujours repris**). **Ce n'est pas un critère de référencement pour Google**, mais elle **augmente le taux de clic** → à renseigner. Environ **150–160 caractères**, avec les **mots-clés ciblés** (affichés **en gras** lors de la recherche).\n\n**Navboost** : système interne de Google qui mesure le **taux de clic** dans les résultats, et regarde si l'internaute **revient dans les résultats** après avoir consulté un site. **Critère important**. Pour y répondre : bon **titre**, bonne **meta description**, **favicon**, **images** ; site **performant**, **peu de pop-ups**, et surtout un contenu qui **correspond à l'attente**.\n\n**E-E-A-T** = **Expérience** (a vraiment testé ?), **Expertise** (maîtrise du sujet), **Autorité** (réputation dans le secteur), **Fiabilité** (confiance). S'applique surtout aux contenus **YMYL** (Your Money, Your Life).\n**En pratique** : donner son avis et son expertise ; créer une **page / un bloc auteur** (diplômes, ouvrages, conférences, lien LinkedIn) ; optimiser la page **à propos** ; obtenir des **liens / mentions** de sites de référence ; chargement rapide, peu de publicité ; **avis certifiés** (ex. Trustpilot)."}, {"title": "8. Appliquer au projet : arborescence et articles", "body": "**Arborescence** : **5 pages minimum** (Accueil + pages), chacune associée à **un mot-clé principal** ; l'organisation peut varier (demander à l'intervenant en cas de doute).\n\n**Chaque article individuel** comprend : **titre**, **meta description**, **mot-clé principal + 4 secondaires**, **contenu**.\n\n**Utiliser l'IA intelligemment** : idées et mots-clés, titres et meta descriptions, intro et FAQ, plans, correction. Rédiger entièrement avec une IA est possible avec une **méthode** (mots-clés → plan → intro → rédaction → révision → **vérification des informations**). Les IA respectent mal les **contraintes de longueur** : toujours **recompter** (titre ≤ 60 caractères, meta 140–155 dans le prompt du cours).\n\n> Prompt type du cours : « Peux-tu me donner 20 idées de titre SEO pour mon article. Le mot clé principal visé est [ ]. Il doit être présent dans le titre, dans l'idéal en début de titre. Respecte les règles de longueur ! »"}], "key_points": ["Plus de 200 critères, trois piliers : contenu, technique, liens / autorité.", "Un bon mot-clé = vocabulaire du public (pas interne) + volume suffisant + difficulté adaptée à l'autorité du site + variations possibles.", "Thématique (Espagne) → mot-clé large (voyage Espagne) → bon mot-clé précis (voyage en Espagne tout compris).", "Intentions : informationnelle → article ; navigationnelle → accueil / landing ; commerciale → avis / comparatif ; transactionnelle → page produit ; + locale.", "Quand on débute : longue traîne (requêtes de niche, faible volume, moins de concurrence).", "Cibles : cœur de cible, principales, secondaires ; personas : besoins, freins, habitudes de recherche.", "SMART : Spécifique, Mesurable, Atteignable, Réaliste, Temporellement défini.", "Titre SEO (balise title) : mot-clé au début ou au milieu, unique par page, ~60 caractères, élément différenciant.", "Texte : 1er paragraphe clé, densité naturelle + synonymes, h2 par problématique, 300 mots min, 700–1 000 pour un article de base.", "Meta description : pas un critère de positionnement Google mais augmente le CTR ; 150–160 caractères avec les mots-clés.", "Navboost mesure les clics et les retours aux résultats ; E-E-A-T = Expérience, Expertise, Autorité, Fiabilité (surtout YMYL)."], "traps": ["« Espagne », « plages » ou « hiver » ne sont pas des mots-clés mais des thématiques.", "La meta description n'est PAS un critère de référencement pour Google : elle sert le taux de clic.", "Le mot-clé se place au début ou au milieu du titre, pas à la fin.", "Une page = un mot-clé : deux pages sur le même mot-clé se concurrencent.", "Navigationnelle = recherche d'une marque déjà connue, à ne pas confondre avec commerciale (comparaison avant achat).", "La balise title (titre SEO) et le h1 (titre affiché) sont deux choses différentes ; il est conseillé de les distinguer.", "Utiliser le vocabulaire du client, pas le jargon interne de l'entreprise.", "E-E-A-T commence par Expérience (ajout récent), pas seulement « EAT ».", "Les IA respectent mal les limites de caractères : vérifier soi-même la longueur des titres et meta descriptions."], "glossary": [{"term": "Mot-clé", "definition": "Requête précise tapée par le public cible, correspondant à une intention réelle."}, {"term": "Longue traîne", "definition": "Ensemble de requêtes précises, peu concurrentielles et à faible volume, qui cumulées apportent beaucoup de trafic."}, {"term": "Intention de recherche", "definition": "But de l'internaute : informationnelle, navigationnelle, commerciale, transactionnelle ou locale."}, {"term": "Difficulté d'un mot-clé", "definition": "Rapport entre volume de recherche, nombre de résultats et présence de concurrents."}, {"term": "Persona", "definition": "Portrait fictif d'un client type : profil, besoins et objectifs, freins, habitudes de recherche."}, {"term": "Cœur de cible", "definition": "Segment de clientèle prioritaire, avant les cibles principales et secondaires."}, {"term": "SMART", "definition": "Spécifique, Mesurable, Atteignable, Réaliste, Temporellement défini."}, {"term": "Balise title", "definition": "Titre SEO de la page, analysé en priorité et affiché dans les résultats."}, {"term": "Balise h1 / h2", "definition": "Titre principal affiché sur la page (h1) et sous-titres structurant le contenu (h2)."}, {"term": "Meta description", "definition": "Résumé de la page affiché dans les résultats ; sert le taux de clic, pas le positionnement."}, {"term": "Balise alt", "definition": "Texte alternatif d'une image, critère de positionnement pour l'image et la page."}, {"term": "Open Graph (og:image)", "definition": "Balises indiquant l'image et le titre utilisés lors des partages et par certains résultats."}, {"term": "Données structurées", "definition": "Balisage (schema.org) qui permet aux moteurs d'afficher des résultats enrichis."}, {"term": "Navboost", "definition": "Système interne de Google mesurant le taux de clic et les retours aux résultats."}, {"term": "E-E-A-T", "definition": "Experience, Expertise, Authoritativeness, Trustworthiness : critères de qualité de Google."}, {"term": "YMYL", "definition": "Your Money, Your Life : contenus touchant la santé, l'argent, la sécurité, jugés plus sévèrement."}, {"term": "Cocon sémantique", "definition": "Structure de contenus par thématiques et sous-thématiques liées entre elles."}], "qcb": [{"q": "« Espagne » est un bon mot-clé pour une agence de voyages.", "answer": false, "explanation": "C'est une thématique ; « voyage en Espagne tout compris » est un bon mot-clé."}, {"q": "Un bon mot-clé reprend le vocabulaire interne de l'entreprise.", "answer": false, "explanation": "Il doit correspondre à ce que cherche réellement le public."}, {"q": "Le commercial joue un rôle important dans la recherche de mots-clés.", "answer": true, "explanation": "Grâce à son contact direct avec le client."}, {"q": "Une recherche navigationnelle porte sur une marque que l'utilisateur connaît déjà.", "answer": true, "explanation": "On y répond avec une page d'accueil ou une landing page optimisée."}, {"q": "Pour une recherche transactionnelle, on propose de préférence un article de blog.", "answer": false, "explanation": "On propose une page produit ; l'article répond aux requêtes informationnelles."}, {"q": "Un comparatif répond bien à une recherche commerciale.", "answer": true, "explanation": "La personne compare activement avant d'acheter."}, {"q": "Quand on débute, il vaut mieux viser des requêtes génériques très recherchées.", "answer": false, "explanation": "On vise la longue traîne : niche, faible volume, moins de concurrence."}, {"q": "La présence d'annonces sur une requête est un indice de sa difficulté.", "answer": true, "explanation": "Avec le nombre de résultats et les types de pages positionnées."}, {"q": "Dans SMART, le T signifie « temporellement défini ».", "answer": true, "explanation": "Time-bound : l'objectif a une échéance."}, {"q": "Le mot-clé doit idéalement être placé à la fin du titre SEO.", "answer": false, "explanation": "Au début ou au milieu, ce qui augmente le taux de clic."}, {"q": "On peut cibler le même mot-clé principal sur plusieurs pages pour renforcer sa position.", "answer": false, "explanation": "Une page = un mot-clé, sinon les pages se concurrencent."}, {"q": "On conseille de limiter le titre SEO à environ 60 caractères.", "answer": true, "explanation": "Pour qu'il ne soit pas coupé ; il peut être plus long si nécessaire."}, {"q": "La balise description est un critère de positionnement pour Google.", "answer": false, "explanation": "Elle n'en est pas un, mais elle augmente le taux de clic."}, {"q": "Un article informatif de base fait idéalement 700 à 1 000 mots.", "answer": true, "explanation": "300 minimum, plus de 1 000 pour un article complet."}, {"q": "La balise alt des images est un critère de positionnement.", "answer": true, "explanation": "Pour l'image et pour la page qui la contient."}, {"q": "Il est conseillé d'héberger ses vidéos directement sur son site.", "answer": false, "explanation": "Plutôt sur un site tiers (YouTube, Dailymotion) pour ne pas alourdir le site."}, {"q": "Navboost mesure notamment si l'internaute revient dans les résultats après avoir consulté un site.", "answer": true, "explanation": "Un retour rapide signale un contenu peu pertinent."}, {"q": "Les critères E-E-A-T s'appliquent surtout aux contenus YMYL.", "answer": true, "explanation": "Your Money, Your Life : santé, finance, sécurité…"}, {"q": "La meta description est un critère de positionnement pour Google.", "answer": false, "explanation": "Ce n'est pas un critère de référencement, mais elle augmente le taux de clic : il faut donc la renseigner.", "level": "moyen"}, {"q": "Une recherche « Decathlon » tapée par quelqu'un qui connaît la marque relève de l'intention navigationnelle.", "answer": true, "explanation": "Navigationnelle = recherche d'une marque connue → page d'accueil ou landing page.", "level": "moyen"}, {"q": "Il est conseillé de placer le mot-clé principal à la fin du titre SEO pour un meilleur taux de clic.", "answer": false, "explanation": "Au début ou au milieu, pas à la fin.", "level": "moyen"}, {"q": "La balise alt des images est un critère de positionnement, pour l'image comme pour la page.", "answer": true, "explanation": "C'est précisé dans le cours, avec la compression des images et l'Open Graph.", "level": "moyen"}, {"q": "Une entreprise qui crée deux pages optimisées sur le même mot-clé augmente ses chances de bien se positionner.", "answer": false, "explanation": "Une page = un mot-clé : deux pages sur le même mot-clé se concurrencent.", "level": "difficile"}, {"q": "Une page sur des conseils de placement financier est davantage concernée par l'E-E-A-T qu'une page de recettes de cuisine.", "answer": true, "explanation": "E-E-A-T s'applique surtout aux contenus YMYL (Your Money, Your Life) : argent, santé…", "level": "difficile"}], "qcm": [{"q": "Quels critères définissent un bon mot-clé ?", "options": ["Il correspond à ce que cherche le public", "Il a un volume suffisant", "Sa difficulté est adaptée à l'autorité du site", "Il reprend le jargon interne"], "answer": [0, 1, 2], "explanation": "Il doit aussi offrir des variations et synonymes."}, {"q": "Lequel est un bon mot-clé au sens du cours ?", "options": ["Hiver", "Crème solaire", "Crème solaire bio pour bébé", "Plages"], "answer": [2], "explanation": "Précis et lié à une intention réelle ; « crème solaire » est trop large."}, {"q": "Quels outils donnent des volumes de recherche ?", "options": ["Haloscan", "Ubersuggest", "AnswerThePublic", "Google Tag Manager"], "answer": [0, 1], "explanation": "AnswerThePublic sert surtout à trouver des questions et idées."}, {"q": "Quel contenu répond à une intention informationnelle ?", "options": ["Un article", "Une page produit", "Une page de paiement", "Une landing page de marque"], "answer": [0], "explanation": "Répondre aux questions qui, quoi, où, quand, comment."}, {"q": "« Meilleur aspirateur sans fil 2026 avis » relève de quelle intention ?", "options": ["Navigationnelle", "Commerciale", "Transactionnelle", "Locale"], "answer": [1], "explanation": "Recherche active avant achat → page d'avis ou comparatif."}, {"q": "Lesquels sont des mots-clés de longue traîne ?", "options": ["photographe paris", "séance photo en couple à Montmartre", "photographe portrait paris 18ème", "photographe"], "answer": [1, 2], "explanation": "Précis, de niche, à faible volume."}, {"q": "Quels sont les trois segments de cible du cours ?", "options": ["Cœur de cible", "Cibles principales", "Cibles secondaires", "Cibles concurrentes"], "answer": [0, 1, 2], "explanation": "Utilisés dans le dossier de projet."}, {"q": "Quelles rubriques composent un persona dans le modèle de dossier ?", "options": ["Besoins et objectifs", "Freins et frustrations", "Habitudes de recherche", "Numéro de carte bancaire"], "answer": [0, 1, 2], "explanation": "Avec prénom, âge, métier et photo."}, {"q": "Lequel est un objectif SMART ?", "options": ["Avoir plus de visibilité", "Gagner 200 abonnés newsletter en 6 mois via le SEO", "Être premier sur Google", "Améliorer notre image"], "answer": [1], "explanation": "Spécifique, chiffré, réaliste et daté."}, {"q": "Quelle balise correspond au titre SEO affiché dans les résultats ?", "options": ["title", "h1", "h2", "alt"], "answer": [0], "explanation": "Le h1 est le titre affiché sur la page."}, {"q": "Quelles bonnes pratiques s'appliquent au titre SEO ?", "options": ["Contenir le mot-clé visé", "Placer le mot-clé au début ou au milieu", "Environ 60 caractères maximum", "Le même mot-clé sur toutes les pages"], "answer": [0, 1, 2], "explanation": "Un mot-clé unique par page."}, {"q": "Quelle longueur minimale est conseillée pour un texte ?", "options": ["100 mots", "300 mots", "1 000 mots", "2 000 mots"], "answer": [1], "explanation": "700–1 000 pour un article informatif de base."}, {"q": "Quels éléments synthétiques le cours recommande-t-il d'ajouter ?", "options": ["Tableaux", "FAQ", "Table des matières", "Pop-ups"], "answer": [0, 1, 2], "explanation": "Ainsi que schémas et points essentiels en début d'article ; les pop-ups nuisent."}, {"q": "Quelle longueur est conseillée pour la meta description ?", "options": ["50–60 caractères", "150–160 caractères", "300 caractères", "500 mots"], "answer": [1], "explanation": "Avec les mots-clés ciblés, mis en gras dans les résultats."}, {"q": "Que faut-il soigner pour répondre au Navboost ?", "options": ["Titre et meta description", "Favicon et images", "Peu de pop-ups, site performant", "Le nombre de mots-clés répétés"], "answer": [0, 1, 2], "explanation": "Et surtout un contenu qui correspond à l'attente."}, {"q": "Que signifie le premier E de E-E-A-T ?", "options": ["Expérience", "Efficacité", "Engagement", "Exclusivité"], "answer": [0], "explanation": "Experience, Expertise, Authoritativeness, Trustworthiness."}, {"q": "Quelles actions renforcent l'E-E-A-T ?", "options": ["Créer une page auteur avec diplômes et LinkedIn", "Obtenir des mentions de sites de référence", "Afficher des avis certifiés", "Multiplier les publicités"], "answer": [0, 1, 2], "explanation": "Trop de publicité nuit à l'expérience."}, {"q": "Où trouve-t-on les spécifications des données structurées ?", "options": ["schema.org", "Google Analytics", "robots.txt", "Bing Webmaster Tool"], "answer": [0], "explanation": "Des plugins facilitent l'intégration sur certains CMS."}, {"q": "Classez du plus large au plus précis :", "options": ["Espagne → voyage en Espagne tout compris → voyage Espagne", "Voyage Espagne → Espagne → voyage en Espagne tout compris", "Voyage en Espagne tout compris → voyage Espagne → Espagne", "Espagne → voyage Espagne → voyage en Espagne tout compris"], "answer": [3], "explanation": "Thématique → mot-clé trop large → bon mot-clé précis avec une intention réelle.", "level": "moyen"}, {"q": "Que signifie le A de E-E-A-T ?", "options": ["Actualité", "Audience", "Autorité", "Accessibilité"], "answer": [2], "explanation": "Expérience, Expertise, Autorité (réputation dans le secteur), Fiabilité.", "level": "moyen"}, {"q": "Quels indices aident à estimer la difficulté d'un mot-clé ? (plusieurs réponses)", "options": ["La couleur du logo du concurrent", "La présence d'annonces", "Le nombre de résultats", "Le type de pages déjà positionnées"], "answer": [1, 2, 3], "explanation": "Difficulté = rapport entre volume, nombre de résultats et présence de concurrents.", "level": "moyen"}, {"q": "Que mesure le Navboost ? (plusieurs réponses)", "options": ["Le nombre de mots du texte", "Le taux de clic dans les résultats", "Le retour de l'internaute dans les résultats après avoir consulté un site", "Le nombre de balises h2"], "answer": [1, 2], "explanation": "Un internaute qui revient vite aux résultats signale que la page ne répondait pas à l'attente.", "level": "moyen"}, {"q": "Mise en situation : un photographe parisien lance son site. Quel mot-clé viser en premier ?", "options": ["Photographe paris", "Photo", "Séance photo en couple à Montmartre", "Paris"], "answer": [2], "explanation": "En débutant, on vise la longue traîne : moins de concurrence. « Photographe paris » est dominé par des acteurs installés ; « photo » et « Paris » sont des thématiques.", "level": "difficile"}, {"q": "Mise en situation : une marque d'outillage parle en interne de « solutions de perçage à percussion ». Ses clients tapent « perceuse à percussion pas chère ». Quel mot-clé choisir et pourquoi ?", "options": ["Les deux sur la même page", "« Perceuse à percussion pas chère » : c'est le vocabulaire réel du public", "Aucun : il faut faire du SEA", "« Solutions de perçage à percussion » : c'est plus professionnel"], "answer": [1], "explanation": "Un bon mot-clé correspond à ce que cherche réellement le public, pas au vocabulaire interne.", "level": "difficile"}, {"q": "Mise en situation : quels contenus associer à chaque intention ? (plusieurs réponses)", "options": ["« Nespresso » (marque connue) → article de blog", "« Acheter Delonghi Magnifica S » → page produit", "« Comment détartrer une cafetière » → article", "« Comparatif cafetières à grain 2026 » → avis / comparatif"], "answer": [1, 2, 3], "explanation": "Une recherche de marque connue (navigationnelle) appelle la page d'accueil ou une landing page.", "level": "difficile"}, {"q": "Mise en situation : quel titre SEO est le meilleur pour le mot-clé « thé vert bio » ?", "options": ["Thé vert bio – des feuilles cueillies à la main au Japon", "Découvrez nos thés", "Thé vert bio thé vert bio thé vert bio pas cher bio", "Notre sélection de produits pour votre bien-être, dont le thé vert bio"], "answer": [0], "explanation": "Mot-clé au début, élément différenciant, moins de 60 caractères. B : mot-clé à la fin et trop long ; C : pas de mot-clé ; D : bourrage de mots-clés.", "level": "difficile"}, {"q": "Mise en situation : lesquels de ces objectifs sont vraiment SMART ? (plusieurs réponses)", "options": ["Obtenir 200 abonnés de plus à la newsletter en 6 mois via le SEO", "Gagner 10 prospects et 2 clients de plus par mois d'ici 1 an grâce au SEO", "Améliorer notre visibilité sur Internet", "Être numéro 1 sur Google le plus vite possible"], "answer": [0, 1], "explanation": "C n'est ni mesurable ni daté. D n'est pas daté et rarement atteignable.", "level": "difficile"}], "open_questions": [{"question": "Qu'est-ce qu'un bon mot-clé ? Illustrez avec un exemple.", "answer": "**Définition** : un mot-clé qui correspond à ce que cherche **réellement le public** (pas au vocabulaire interne), qui a un **volume suffisant**, une **difficulté adaptée à l'autorité** du site et des **variations / synonymes** exploitables.\n\n**Démarche** : thème → mots-clés larges → mots-clés précis.\n\n**Exemple** : « Espagne » est une thématique, « voyage Espagne » est trop large, « voyage en Espagne tout compris » est un bon mot-clé : précis, il traduit une intention réelle.\n\n**Conclusion** : pour un site qui débute, on privilégie la **longue traîne**."}, {"question": "Présentez les intentions de recherche et le type de contenu qui répond à chacune.", "answer": "- **Informationnelle** : recherche d'informations (qui, quoi, comment) → **article**. Ex. « comment détartrer une cafetière ».\n- **Navigationnelle** : recherche d'une **marque connue** → **page d'accueil / landing page**. Ex. « Decathlon tente ».\n- **Commerciale** : comparaison avant achat → **avis / comparatif**. Ex. « meilleure tente 4 places avis ».\n- **Transactionnelle** : achat imminent → **page produit**. Ex. « acheter tente Quechua 2 seconds ».\n- **Locale** : proximité → **fiche Google Maps**.\n\n**Enjeu** : si le type de page ne correspond pas à l'intention, la page se positionne mal (et le Navboost la pénalise)."}, {"question": "Expliquez comment optimiser le titre SEO et la meta description d'un article.", "answer": "**Titre SEO (balise title)** : contient **le mot-clé visé**, placé **au début ou au milieu** ; **unique par page** ; **≈ 60 caractères** ; ajoute un **élément différenciant** ou un appel à l'action (« Thé noir de noël – plongez dans la magie des fêtes »). C'est le titre affiché dans les résultats ; le **h1** est le titre affiché sur la page.\n\n**Meta description** : **150–160 caractères**, avec les **mots-clés ciblés** (mis en gras dans les résultats). **Pas un critère de positionnement**, mais elle augmente le **taux de clic**.\n\n**Lien avec Navboost** : un bon titre et une bonne meta augmentent les clics, que Google mesure pour juger de la pertinence."}, {"question": "Qu'est-ce que l'E-E-A-T et comment le travailler sur un site ?", "answer": "**Définition** : **Expérience** (avoir réellement testé), **Expertise** (maîtrise du sujet), **Autorité** (réputation dans le secteur), **Fiabilité** (confiance). Critères de plus en plus déterminants, surtout pour les contenus **YMYL** (santé, argent).\n\n**Actions** : donner son avis et mettre en avant son expertise ; créer une **page auteur** (diplômes, ouvrages, conférences, LinkedIn) ; optimiser la page **à propos** et les mentions légales ; obtenir des **liens / mentions** de sites de référence ; soigner l'expérience (rapidité, peu de pub et de pop-ups) ; collecter des **avis certifiés** (Trustpilot)."}, {"question": "Rédigez deux objectifs SMART pour un site de vente de thés bio et justifiez chaque lettre.", "answer": "**Objectif 1** : « Obtenir **150 ventes par mois** issues du trafic organique **d'ici 9 mois**. » → **S** : ventes issues du SEO ; **M** : 150 ventes / mois ; **A / R** : cohérent avec un site jeune positionné sur la longue traîne ; **T** : 9 mois.\n\n**Objectif 2** : « Gagner **300 abonnés** à la newsletter **en 6 mois** grâce aux articles de blog. » → **S** : abonnés newsletter via le blog ; **M** : 300 ; **A / R** : formulaire sur chaque article ; **T** : 6 mois.\n\n**Rappel** : chaque contenu du site doit être relié à un objectif."}], "exercises": [{"title": "Atelier mots-clés et arborescence — préparation du dossier", "statement": "Projet fictif : **boutique en ligne de thés bio** basée à Strasbourg.", "questions": ["Classez en thématique / mot-clé large / bon mot-clé : « thé », « thé vert bio », « thé vert bio japonais sencha », « boisson chaude », « coffret thé de noël bio ».", "Associez une intention et un type de page à : « bienfaits du thé vert », « acheter sencha bio », « meilleur thé détox avis », « nom de la boutique + contact ».", "Proposez une arborescence de 5 pages avec un mot-clé principal unique par page.", "Rédigez un titre SEO (≤ 60 caractères) et une meta description (150–160 caractères) pour la page produit sencha."], "answer": "**1.** Thématiques : « thé », « boisson chaude » · Large : « thé vert bio » · Bons mots-clés : « thé vert bio japonais sencha », « coffret thé de noël bio ».\n\n**2.** « bienfaits du thé vert » → informationnelle → **article** · « acheter sencha bio » → transactionnelle → **page produit** · « meilleur thé détox avis » → commerciale → **comparatif** · « [boutique] contact » → navigationnelle → **accueil / contact**.\n\n**3.** | Page | Mot-clé principal |\n|---|---|\n| Accueil | thé bio en ligne |\n| Thés verts | thé vert bio |\n| Sencha | thé vert bio japonais sencha |\n| Coffrets | coffret thé de noël bio |\n| Blog | bienfaits du thé vert |\n\n**4.** Titre : « Thé vert bio japonais sencha – fraîcheur d'Uji » (≈ 47 caractères, mot-clé en tête). Meta : « Découvrez notre thé vert bio japonais sencha, cueilli à Uji : notes végétales, infusion facile et livraison rapide depuis Strasbourg. Commandez dès maintenant ! » (à recompter et ajuster à 150–160)."}, {"title": "Diagnostic d'un article", "statement": "Un article de 250 mots, titre SEO « Tout savoir — notre blog sur le thé vert bio », aucun h2, pas de meta description, images de 5 Mo sans alt.", "questions": ["Listez les problèmes SEO.", "Proposez une correction pour chacun."], "answer": "- **Texte trop court** (< 300 mots) → viser 700–1 000 mots, structurés.\n- **Mot-clé en fin de titre**, titre peu différenciant → « Thé vert bio : bienfaits et conseils d'infusion ».\n- **Aucun h2** → un h2 par problématique (bienfaits, préparation, choisir son thé…), qui ouvre la longue traîne.\n- **Pas de meta description** → la rédiger (150–160 caractères, mot-clé inclus) pour le CTR.\n- **Images lourdes sans alt** → compresser (72 dpi) et renseigner un alt descriptif avec le mot-clé.\n- Bonus : ajouter FAQ, tableau et points essentiels en début d'article."}], "resources": [{"label": "AnswerThePublic — questions autour d'un mot-clé", "url": "https://answerthepublic.com/"}, {"label": "Ubersuggest — volumes de recherche", "url": "https://neilpatel.com/fr/ubersuggest/"}, {"label": "Haloscan — recherche de mots-clés", "url": "https://www.haloscan.com/"}, {"label": "Schema.org — données structurées", "url": "https://schema.org/"}]}, {"id": "seo-03", "title": "Suite du cours — Autorité, technique, GEO, audit et suivi", "subtitle": "Liens et maillage, entités, Core Web Vitals, contenu dupliqué, robots.txt, multilingue, cocon sémantique, recherche universelle, social SEO, IA, audit, Analytics et Search Console", "date": "", "status": "a_venir", "sources": ["Cours SEO.pptx"], "objectives": ["Distinguer backlinks, liens externes et liens internes, et savoir obtenir des liens.", "Expliquer le maillage interne, le PageRank et le cocon sémantique.", "Connaître les critères techniques : Core Web Vitals, indexation, contenu dupliqué, robots.txt, multilingue.", "Exploiter la recherche universelle (Maps, Shopping, Actualités) et le SEO social (YouTube, TikTok, LinkedIn).", "Optimiser pour les IA (GEO) : query fan out, sources des IA, citations.", "Mener un audit SEO et suivre ses performances avec Google Analytics et la Search Console."], "summary": [{"title": "1. Le pilier autorité : les liens", "body": "**Types de liens** : **backlinks** (liens entrants d'autres sites) · **liens externes** (sortants) · **liens internes** (entre ses pages).\n\n**Critères** : **qualité et contexte** des liens entrants ; **texte des liens** (ancre) ; **maillage interne** et **profondeur** ; le classement se fait **par page, pas par domaine** ; les liens des **réseaux sociaux** et de **Wikipédia** ne contribuent **pas directement** au positionnement ; attributs **follow / nofollow / sponsored**.\n\n**Obtenir des liens** (travail de long terme) : chercher qui **mentionne la marque sans lien** ; analyser les liens des **concurrents** et les **liens cassés** ; partenaires, clients, fournisseurs (dans la **thématique**) ; **annuaires** (ex. annuaire local de la mairie) pour un site qui débute ; **content marketing** ; campagnes presse, salons ; influenceurs, blogueurs, médias (**payant**, ~100 € l'article sponsorisé, plateformes type Getfluence). **Varier les ancres**, ne pas sur-optimiser, ne pas lier uniquement vers l'accueil.\n\n**Maillage interne** : relier les contenus d'une même thématique, en particulier vers les **contenus stratégiques** (« cornerstone content ») ; ancres **variées** ; les liens transmettent du « **jus** » (PageRank).\n\n**Entités nommées** : identifient de manière unique une personne, un lieu, une marque ([Apple], [Paris]). Google (BERT, MUM) et les IA s'en servent pour comprendre et citer. On les optimise via les **données structurées** (Person, Organization, Place, Product), le balisage h1/h2, une **forme toujours identique** et le maillage vers les pages entités."}, {"title": "2. Le pilier technique", "body": "**Critères** : **Core Web Vitals** (temps de chargement des images, CSS, JS ; affichage mobile ; site sécurisé) · **indexation** (sitemaps, structure, contenu dupliqué, robots.txt, **llms.txt**) · erreurs HTML, **404**, spam · **multilingue**.\n\n**Contenu dupliqué** : le moteur n'affiche qu'**une** version parmi des contenus identiques, et pas forcément celle que vous voulez. Solutions : attribut **rel=canonical** (indique la page de référence, indispensable en e-commerce avec les filtres) ; **varier les fiches produits** (couteau suisse jaune / rouge / bleu) et les pages par ville ; attention aux contenus publiés **ailleurs avant** son propre site (communiqués, événements).\n\n**robots.txt** : communique avec les robots ; bloque des robots indésirables (ex. **AhrefsBot** pour gêner l'analyse concurrentielle) ou des sections ; indique le **sitemap** ; peut limiter la vitesse (**crawl-delay**). **Empêcher l'exploration ≠ empêcher l'indexation.**\n\n**Multilingue** : balises **hreflang** sur **toutes les pages** (avec x-default) ; éviter la traduction automatique selon l'IP ; éviter un **domaine par langue** (monsite.fr / monsite.com) qui **divise l'autorité** ; erreurs fréquentes : un **canonical** qui pointe vers une autre langue (la page risque d'être désindexée), un hreflang vers la mauvaise URL. WordPress nécessite une extension (**WPML, Polylang, Weglot**)."}, {"title": "3. Le cocon sémantique", "body": "La structure « **parfaite** » vers laquelle tendre, résultat des bonnes pratiques sur **les 3 piliers** :\n- chaque élément est défini par la **recherche de mots-clés**, classé par **thématiques puis sous-thématiques** jusqu'au plus petit dénominateur ;\n- les éléments **parents sont liés entre eux** et chaque page est optimisée ;\n- il **draine l'autorité** vers les pages stratégiques ;\n- il évite les **pages orphelines** ou **trop éloignées** de l'accueil (indexation)."}, {"title": "4. Recherche universelle et SEO social", "body": "| Service | Comment y être |\n|---|---|\n| **Google Maps** | Inscription **Google My Business** ; catégories, présentation, images régulières, services, publications ; pub possible |\n| **Google Actualités** | Contenu de qualité, fréquent, conditions techniques ; soumission via Publisher Center |\n| **Discover** | **Pas d'inscription** obligatoire |\n| **Google Shopping** | **Google Merchant Center** ; soumission **gratuite** des produits ; la recherche universelle demande en général des annonces |\n| **Images / vidéos** | Texte autour (légende), **alt**, mots-clés dans le **nom de fichier** ; vidéos YouTube, TikTok, Dailymotion, Facebook, Instagram indexées |\n\n**Google AI Overview** : réponses générées avec Gemini, surtout sur les requêtes **informatives** ; fait **baisser le taux de clic** des éditeurs ; taux d'erreur d'environ **10 %**.\n\n**Social SEO** : les liens sociaux **n'ont pas d'impact** sur le référencement ; Google analyse d
