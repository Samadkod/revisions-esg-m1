entreprise fictive), marque de **prêt-à-porter vendue en ligne**, veut **personnaliser ses campagnes et ses relances** pour **augmenter de 20 % le chiffre d'affaires réalisé avec les clients existants**, **en 6 mois**.\n\n**Contrainte majeure** : **aucun recrutement** n'est autorisé.\n\n| Collaborateur | Fonction |\n|---|---|\n| Amina | Responsable commerciale |\n| Hugo | Commercial |\n| Léa | Conseillère relation client |\n| Karim | Chargé de marketing |\n| Elsa | Créatrice de contenus |\n| Noé | Analyste des données clients |\n\n**Faits à prendre en compte** :\n- **Noé** sera **absent 6 semaines** à partir du **2e mois**.\n- **2 jours de télétravail** par semaine ; **certaines validations restent bloquées**.\n- Les décisions orales sont **peu tracées** ; des **dossiers CRM sont incomplets**.\n- **Léa** demande un **accompagnement** sur le nouvel outil.\n- Un **partenaire extérieur** peut intervenir **sous 6 semaines**. Les **concurrents recrutent des analystes**."}, {"title": "2. Les données de compétences", "body": "**Trois domaines** : **CRM** (fiabiliser et exploiter les dossiers clients) · **Données** (lire et analyser les résultats clients) · **Coordination** (suivre les engagements, partager les décisions).\n\n**Échelle de maîtrise** : **0** = ne réalise pas encore · **1** = réalise avec accompagnement · **2** = réalise **en autonomie** · **3** = maîtrise les situations complexes et **transmet**.\n\n| | CRM | Données | Coordination |\n|---|---|---|---|\n| Amina | 2 | 1 | **3** |\n| Hugo | 1 | 0 | 2 |\n| Léa | 1 | 1 | 1 |\n| Karim | **3** | 1 | 2 |\n| Elsa | 0 | 1 | 1 |\n| Noé | 1 | **3** | 1 |\n\n**Cibles à 6 mois** (autonome = niveau ≥ 2 ; les niveaux 3 comptent parmi les autonomes) :\n- **CRM** : 4 autonomes dont 1 de niveau 3\n- **Données** : 2 autonomes dont 1 de niveau 3\n- **Coordination** : 4 autonomes dont 1 de niveau 3"}, {"title": "3. Calcul des écarts (le cœur du cas)", "body": "| Compétence | Autonomes aujourd'hui (≥ 2) | Dont niveau 3 | Cible | **Écart** |\n|---|---|---|---|---|\n| **CRM** | 2 (Amina 2, Karim 3) | 1 (Karim) | 4 dont 1 N3 | **−2 autonomes** (N3 : OK) |\n| **Données** | 1 (Noé 3) | 1 (Noé) | 2 dont 1 N3 | **−1 autonome** |\n| **Coordination** | 3 (Amina 3, Hugo 2, Karim 2) | 1 (Amina) | 4 dont 1 N3 | **−1 autonome** (N3 : OK) |\n\n**Pendant l'absence de Noé (6 semaines dès le 2e mois)** : en Données, on tombe à **0 autonome et 0 niveau 3**, soit un **écart de −2 et la perte de la seule expertise**. C'est le **risque le plus critique** : la donnée client est indispensable pour **personnaliser** les campagnes.\n\n**Candidats naturels à la montée en compétence** (niveau 1 → 2) :\n- **CRM** : Hugo, Léa ou Noé (niveau 1), tutorés par **Karim** (niveau 3, peut transmettre). Elsa part de 0.\n- **Données** : Amina, Léa, Karim ou Elsa (niveau 1). Hugo part de 0.\n- **Coordination** : Léa, Elsa ou Noé (niveau 1), avec **Amina** (niveau 3) comme référente."}, {"title": "4. Méthode : les 6 questions du cas", "body": "1. **Reformuler les enjeux** : présenter le projet commercial et ses **conséquences** sur les activités (plus d'exploitation du CRM, plus d'analyse de données, plus de coordination des campagnes) et sur l'organisation.\n2. **SWOT RH** : **forces / faiblesses = interne** ; **opportunités / menaces = externe**. Chaque élément est **justifié par un fait**.\n3. **Cartographie des compétences** : représenter les ressources (tableau, radar, matrice) et identifier **3 compétences critiques** justifiées.\n4. **Écarts et risques** : comparer l'existant aux cibles, **montrer les calculs**, tenir compte des **échéances** (absence de Noé, partenaire sous 6 semaines) et des **contraintes** (pas de recrutement).\n5. **Deux priorités hiérarchisées** : pour chacune, le **risque traité**, les **faits déterminants**, une **première orientation** (pas de plan de formation détaillé).\n6. **Travail hybride** : **2 risques** + un **premier repère** de prévention ; signaler les **informations à vérifier** ; **distinguer hypothèses et faits**.\n\n*Complément : ce type de diagnostic relève de la **GPEC** (gestion prévisionnelle des emplois et des compétences), aujourd'hui appelée **GEPP** (gestion des emplois et des parcours professionnels).*"}, {"title": "5. Corrigé type — SWOT RH", "body": "| | **Positif** | **Négatif** |\n|---|---|---|\n| **Interne** | **Forces** : un expert CRM capable de transmettre (Karim, N3) ; une experte en coordination (Amina, N3) ; un expert données (Noé, N3) ; équipe complète couvrant commerce, marketing, contenu, relation client et données ; Léa **demandeuse** d'accompagnement (motivation) | **Faiblesses** : **dépendance à une seule personne** pour les données (Noé) ; **CRM incomplet** ; **décisions orales peu tracées** ; validations bloquées à distance ; Elsa à 0 en CRM, Hugo à 0 en données ; faible niveau global en données |\n| **Externe** | **Opportunités** : **partenaire extérieur disponible sous 6 semaines** ; nouvel outil (potentiel d'automatisation et de personnalisation) ; base de clients existants à valoriser | **Menaces** : **les concurrents recrutent des analystes** (marché tendu, risque d'attraction de Noé) ; délai court (6 mois) |\n\n⚠️ **« Aucun recrutement »** est une **contrainte de la direction** (interne). On peut la citer comme contrainte plutôt que comme menace externe : c'est un point de rigueur apprécié."}, {"title": "6. Corrigé type — deux priorités hiérarchisées", "body": "**Priorité 1 (la plus urgente) : sécuriser la compétence Données**\n- **Risque traité** : arrêt de l'analyse pendant l'absence de Noé, donc impossibilité de personnaliser campagnes et relances au moment où le projet doit monter en charge.\n- **Faits déterminants** : un seul autonome (Noé, N3) ; absence de 6 semaines dès le 2e mois ; cible de 2 autonomes ; concurrents qui recrutent des analystes ; pas de recrutement possible.\n- **Orientation** : **transfert de compétences** de Noé vers un collaborateur de niveau 1 (ex. Karim ou Amina) **dès le 1er mois** ; **documentation** des analyses et tableaux de bord ; recours au **partenaire extérieur** (disponible sous 6 semaines, donc à solliciter **immédiatement** pour couvrir l'absence) ; réflexion sur la **fidélisation** de Noé.\n\n**Priorité 2 : fiabiliser le CRM et faire monter 2 personnes en autonomie**\n- **Risque traité** : campagnes mal ciblées à cause de dossiers incomplets ; objectif +20 % compromis.\n- **Faits déterminants** : dossiers CRM incomplets ; 2 autonomes sur 4 visés ; Léa demande un accompagnement ; Karim (N3) peut transmettre.\n- **Orientation** : **tutorat** de Karim pour Hugo et Léa (niveau 1 → 2) ; règles de saisie communes ; temps dédié à la fiabilisation des fiches.\n\n*La coordination (écart −1) peut être traitée en lien avec le travail hybride : rituels, traçabilité des décisions.*"}, {"title": "7. Corrigé type — travail hybride", "body": "| Risque | Faits | Premier repère |\n|---|---|---|\n| **Blocage des validations** et ralentissement des campagnes | « Certaines validations restent bloquées » à distance | **Circuit de validation clair** : qui valide quoi, dans quel délai, délégation en cas d'absence |\n| **Perte d'information** et décisions non tracées | Décisions orales peu tracées, CRM incomplet | **Traçabilité** : compte rendu court et décisions consignées dans un outil partagé ou le CRM |\n| *(autre)* Isolement et apprentissage difficile à distance | Léa demande un accompagnement | Placer les temps de formation et de tutorat les **jours sur site** |\n\n**Informations à vérifier** : quels jours sont travaillés à distance ? Qui est concerné ? Quelles validations bloquent ? Le partenaire peut-il couvrir l'analyse de données ? Noé peut-il préparer son absence ?\n\n**Faits vs hypothèses** : « Noé absent 6 semaines » est un **fait** ; « les concurrents pourraient débaucher Noé » est une **hypothèse**."}], "key_points": ["Projet : +20 % de CA auprès des clients existants en 6 mois, par la personnalisation des campagnes et des relances, sans recrutement.", "Échelle : 0 (ne fait pas), 1 (avec accompagnement), 2 (autonome), 3 (complexe et transmet). Autonome = niveau ≥ 2.", "Écarts : CRM −2 autonomes ; Données −1 (−2 et plus aucun expert pendant l'absence de Noé) ; Coordination −1.", "Le risque le plus critique : la dépendance à Noé en Données, dont l'absence tombe dès le 2e mois.", "Ressources internes pour transmettre : Karim (CRM 3), Amina (Coordination 3), Noé (Données 3).", "SWOT RH : forces/faiblesses = interne ; opportunités/menaces = externe ; chaque élément justifié par un fait.", "Priorité 1 : sécuriser les Données (transfert, documentation, partenaire à solliciter tout de suite). Priorité 2 : fiabiliser le CRM (tutorat de Karim).", "Hybride : validations bloquées et décisions non tracées → circuit de validation et traçabilité.", "Toujours distinguer les faits de l'énoncé et vos hypothèses.", "Critères : cohérence avec le projet, exactitude des calculs, justification, respect des contraintes, faits vs hypothèses."], "traps": ["Les niveaux 3 sont inclus dans le nombre d'autonomes : ne les comptez pas deux fois.", "Un niveau 1 n'est pas autonome : seuls les niveaux 2 et 3 comptent.", "Oublier l'absence de Noé dans le calcul des risques : l'écart en Données passe de −1 à −2 pendant 6 semaines.", "Proposer un recrutement : c'est explicitement interdit par la direction.", "Le partenaire n'est disponible que sous 6 semaines et l'absence commence au 2e mois : il faut le solliciter immédiatement.", "Les tableaux de l'énoncé ne sont pas des tableaux de réponse : construisez vos propres représentations.", "Le plan de formation détaillé n'est pas demandé : une première orientation suffit."], "glossary": [{"term": "Diagnostic RH", "definition": "Analyse de la capacité des ressources humaines (compétences, organisation, risques) à réaliser un projet de l'entreprise."}, {"term": "SWOT RH", "definition": "Forces et faiblesses (internes) et opportunités et menaces (externes) appliquées aux ressources humaines."}, {"term": "Cartographie des compétences", "definition": "Représentation des compétences disponibles par personne et par domaine, comparée aux besoins."}, {"term": "Échelle de maîtrise", "definition": "Graduation des niveaux de compétence ; ici de 0 (ne réalise pas) à 3 (maîtrise les situations complexes et transmet)."}, {"term": "Autonomie (dans le cas)", "definition": "Niveau 2 ou plus : la personne réalise l'activité sans accompagnement."}, {"term": "Analyse des écarts", "definition": "Comparaison entre les compétences actuelles et les compétences cibles, pour mesurer ce qui manque."}, {"term": "Compétence critique", "definition": "Compétence indispensable à la réussite du projet, dont l'absence le met en danger."}, {"term": "Dépendance à une personne clé", "definition": "Situation où une compétence repose sur un seul collaborateur : risque élevé en cas d'absence ou de départ."}, {"term": "Transfert de compétences", "definition": "Transmission des savoir-faire d'un expert vers d'autres collaborateurs (tutorat, binôme, documentation)."}, {"term": "Tutorat", "definition": "Accompagnement d'un collaborateur par un pair expérimenté pour le faire monter en compétence."}, {"term": "CRM", "definition": "Customer Relationship Management : outil de gestion de la relation client qui centralise informations et échanges avec clients et prospects."}, {"term": "Travail hybride", "definition": "Organisation qui alterne travail sur site et à distance."}, {"term": "Traçabilité des décisions", "definition": "Fait de consigner les décisions prises pour pouvoir les retrouver et les suivre."}, {"term": "GPEC / GEPP (complément)", "definition": "Gestion prévisionnelle des emplois et des compétences, aujourd'hui gestion des emplois et des parcours professionnels : anticiper les besoins en compétences."}], "qcb": [{"q": "Le projet de NovaWear vise +20 % de chiffre d'affaires auprès de nouveaux clients.", "answer": false, "explanation": "Il vise +20 % auprès des clients existants, grâce à des campagnes et relances personnalisées."}, {"q": "La direction autorise un recrutement si nécessaire.", "answer": false, "explanation": "Aucun recrutement supplémentaire n'est autorisé : c'est la contrainte clé."}, {"q": "Un collaborateur de niveau 1 est considéré comme autonome.", "answer": false, "explanation": "Le niveau 1 réalise l'activité avec accompagnement. L'autonomie commence au niveau 2."}, {"q": "Les personnes de niveau 3 sont incluses dans le nombre total d'autonomes demandé.", "answer": true, "explanation": "Elles ne s'ajoutent pas en plus."}, {"q": "En CRM, l'équipe compte aujourd'hui 2 personnes autonomes.", "answer": true, "explanation": "Amina (2) et Karim (3)."}, {"q": "En CRM, la cible de niveau 3 est déjà atteinte.", "answer": true, "explanation": "Karim est au niveau 3 ; il manque 2 autonomes."}, {"q": "En Données, l'écart est de −1 autonome en temps normal.", "answer": true, "explanation": "Seul Noé est autonome ; la cible est de 2."}, {"q": "Pendant l'absence de Noé, l'équipe garde une personne de niveau 3 en Données.", "answer": false, "explanation": "Noé est le seul niveau 3 (et le seul autonome) : il ne reste aucun autonome."}, {"q": "En Coordination, l'équipe compte 3 autonomes pour une cible de 4.", "answer": true, "explanation": "Amina (3), Hugo (2), Karim (2) : écart −1."}, {"q": "Dans un SWOT RH, la proposition d'accompagnement du partenaire extérieur est une opportunité.", "answer": true, "explanation": "C'est un élément externe et favorable."}, {"q": "Le fait que les concurrents recrutent des analystes est une force de NovaWear.", "answer": false, "explanation": "C'est une menace externe : le marché des analystes est tendu."}, {"q": "Les décisions orales peu tracées constituent une faiblesse interne.", "answer": true, "explanation": "Elles fragilisent la coordination et le CRM."}, {"q": "Le cas demande un plan de formation détaillé.", "answer": false, "explanation": "Seule une première orientation est demandée à ce stade."}, {"q": "À l'oral, il faut présenter d'abord la priorité la plus urgente.", "answer": true, "explanation": "Consigne de restitution."}, {"q": "« Les concurrents pourraient débaucher Noé » est un fait de l'énoncé.", "answer": false, "explanation": "C'est une hypothèse. Le fait est seulement que les concurrents recrutent des analystes."}], "qcm": [{"q": "Quelles sont les trois compétences étudiées dans le cas ?", "options": ["CRM, Données, Coordination", "Vente, Achat, Logistique", "Design, SEO, Juridique", "Comptabilité, Paie, Recrutement"], "answer": [0], "explanation": "Fiabiliser le CRM, analyser les données, coordonner."}, {"q": "Que signifie le niveau 3 de l'échelle de maîtrise ?", "options": ["Ne réalise pas l'activité", "Réalise avec accompagnement", "Réalise en autonomie", "Maîtrise les situations complexes et transmet"], "answer": [3], "explanation": "Le niveau 3 permet aussi de former les autres."}, {"q": "Quel est l'écart en CRM par rapport à la cible ?", "options": ["−1 autonome", "−2 autonomes", "Aucun écart", "−3 autonomes"], "answer": [1], "explanation": "2 autonomes (Amina, Karim) pour une cible de 4."}, {"q": "Pendant l'absence de Noé, combien de personnes sont autonomes en Données ?", "options": ["0", "1", "2", "3"], "answer": [0], "explanation": "Tous les autres sont au niveau 0 ou 1."}, {"q": "Qui est le mieux placé pour transmettre la compétence CRM ?", "options": ["Karim", "Elsa", "Léa", "Hugo"], "answer": [0], "explanation": "Karim est au niveau 3 en CRM."}, {"q": "Quels collaborateurs sont au niveau 1 en Données et pourraient monter en autonomie ? (plusieurs réponses)", "options": ["Amina", "Karim", "Léa", "Hugo"], "answer": [0, 1, 2], "explanation": "Elsa aussi. Hugo est au niveau 0."}, {"q": "Quels éléments sont des faiblesses internes ? (plusieurs réponses)", "options": ["Dépendance à Noé pour les données", "Dossiers CRM incomplets", "Décisions orales peu tracées", "Partenaire extérieur disponible"], "answer": [0, 1, 2], "explanation": "Le partenaire est une opportunité externe."}, {"q": "Quels éléments sont des forces internes ? (plusieurs réponses)", "options": ["Karim au niveau 3 en CRM", "Amina au niveau 3 en Coordination", "Léa demandeuse d'accompagnement", "Concurrents qui recrutent"], "answer": [0, 1, 2], "explanation": "Les concurrents relèvent des menaces."}, {"q": "Pourquoi la compétence Données est-elle la priorité la plus urgente ? (plusieurs réponses)", "options": ["Un seul autonome, qui s'absente dès le 2e mois", "Elle est indispensable pour personnaliser les campagnes", "Le marché des analystes est tendu", "Elle n'a aucun lien avec le projet"], "answer": [0, 1, 2], "explanation": "Risque maximal pour l'objectif de +20 %."}, {"q": "Quelle orientation respecte la contrainte de la direction ?", "options": ["Recruter un analyste en CDI", "Former en interne et solliciter le partenaire extérieur", "Abandonner l'objectif de 20 %", "Externaliser toute l'équipe"], "answer": [1], "explanation": "Aucun recrutement n'est autorisé."}, {"q": "Quels risques sont liés au travail hybride dans le cas ? (plusieurs réponses)", "options": ["Validations bloquées", "Décisions peu tracées", "Difficulté à accompagner Léa à distance", "Hausse des prix des matières premières"], "answer": [0, 1, 2], "explanation": "Le prix des matières premières est hors sujet."}, {"q": "Quels repères préviennent les risques du travail hybride ? (plusieurs réponses)", "options": ["Circuit de validation avec délais et délégations", "Décisions consignées dans un outil partagé", "Formations placées les jours sur site", "Interdire tout télétravail sans analyse"], "answer": [0, 1, 2], "explanation": "Des repères proportionnés, pas une suppression brutale."}, {"q": "Quels sont les critères de réussite du cas ? (plusieurs réponses)", "options": ["Cohérence avec le projet commercial", "Exactitude des calculs", "Distinction entre faits et hypothèses", "Longueur du document"], "answer": [0, 1, 2], "explanation": "Et la qualité des justifications et le respect des contraintes."}, {"q": "Le partenaire extérieur est disponible « sous six semaines ». Qu'en déduire ?", "options": ["Il faut le solliciter immédiatement pour couvrir l'absence de Noé dès le 2e mois", "On peut attendre le 5e mois", "Il est inutile", "Il remplace le recrutement d'un CDI"], "answer": [0], "explanation": "Les échéances doivent être croisées."}], "open_questions": [{"question": "Reformulez les enjeux stratégiques du projet NovaWear et ses conséquences sur l'équipe.", "answer": "**Projet** : augmenter de **20 %** le CA réalisé avec les **clients existants** en **6 mois**, en **personnalisant** les campagnes commerciales et les relances, **sans recrutement**.\n\n**Conséquences sur les activités** : exploiter davantage le **CRM** (dossiers fiables et complets) ; produire des **analyses de données** pour segmenter et personnaliser ; renforcer la **coordination** entre commerce, marketing, contenus et relation client.\n\n**Conséquences sur l'organisation** : montée en compétence obligatoire de l'équipe actuelle, réorganisation des rôles et des circuits de décision, attention au travail hybride (validations, traçabilité), et gestion de l'absence de Noé.\n\n**Conclusion** : le succès commercial dépend d'un **plan de développement des compétences** sous contrainte de temps."}, {"question": "Analysez les écarts entre la situation actuelle et les cibles à six mois.", "answer": "**Méthode** : autonome = niveau ≥ 2, et les niveaux 3 sont inclus.\n\n- **CRM** : 2 autonomes (Amina 2, Karim 3) pour 4 visés, soit **−2** ; niveau 3 atteint (Karim).\n- **Données** : 1 autonome (Noé 3) pour 2 visés, soit **−1** ; niveau 3 atteint, mais **pendant les 6 semaines d'absence** de Noé : 0 autonome, 0 niveau 3, soit **−2 et plus aucun expert**.\n- **Coordination** : 3 autonomes (Amina 3, Hugo 2, Karim 2) pour 4, soit **−1** ; niveau 3 atteint (Amina).\n\n**Conséquences** : sans données, pas de personnalisation, donc l'objectif de +20 % est menacé dès le 2e mois. Un CRM incomplet entraîne des relances mal ciblées. Une coordination faible bloque les validations et ralentit les campagnes. Comme on ne peut pas recruter, il faut développer les compétences en interne et mobiliser le partenaire."}, {"question": "Pourquoi faut-il distinguer faits et hypothèses dans un diagnostic RH ? Donnez des exemples tirés du cas.", "answer": "Un diagnostic doit être **fondé sur des éléments vérifiables** ; mélanger faits et suppositions fausse les priorités et affaiblit l'argumentation.\n\n**Faits** : Noé absent 6 semaines à partir du 2e mois ; validations bloquées à distance ; CRM incomplet ; Léa demande un accompagnement ; partenaire disponible sous 6 semaines ; concurrents qui recrutent des analystes.\n\n**Hypothèses** : Noé pourrait être tenté de partir ; Karim aurait le temps de tutorer ; le partenaire maîtriserait les outils de NovaWear.\n\nOn signale les hypothèses comme **informations à vérifier**."}], "exercises": [{"title": "Cas complet NovaWear — à rédiger en conditions réelles (1 heure)", "statement": "Reprenez l'énoncé (section « Le cas en bref » et « Les données de compétences ») et traitez les 6 demandes : enjeux, SWOT RH, cartographie avec 3 compétences critiques, écarts et risques avec calculs, 2 priorités hiérarchisées, travail hybride (2 risques, repères, informations à vérifier, faits vs hypothèses).", "questions": ["Rédigez votre production en 1 heure, puis comparez avec le corrigé.", "Préparez une restitution orale de 2 minutes qui commence par la priorité la plus urgente."], "answer": "Utilisez les sections 3, 5, 6 et 7 du résumé comme corrigé type.\n\n**Trame de restitution orale (2 min)** :\n1. « Notre priorité la plus urgente est de **sécuriser la compétence Données**. »\n2. **Faits** : un seul autonome (Noé), absent 6 semaines dès le 2e mois ; cible de 2 autonomes ; pas de recrutement ; concurrents qui recrutent.\n3. **Écart** : −1 en temps normal, −2 pendant l'absence, sans aucun expert. **Conséquence** : la personnalisation s'arrête au moment clé.\n4. **Orientation** : transfert de Noé vers Karim ou Amina dès le mois 1, documentation, partenaire sollicité tout de suite.\n5. « Notre deuxième priorité est de **fiabiliser le CRM** : −2 autonomes, dossiers incomplets ; tutorat de Karim pour Hugo et Léa. »"}, {"title": "Exercice de calcul — variante", "statement": "Même échelle. Cible en Données : 3 autonomes dont 1 de niveau 3. Niveaux actuels : A = 2, B = 1, C = 3, D = 0, E = 1. C sera absent un mois.", "questions": ["Quel est l'écart en temps normal ?", "Quel est l'écart pendant l'absence de C ?", "Qui former en priorité ?"], "answer": "1. Autonomes : A (2) et C (3), soit 2 pour une cible de 3 : **−1**. Niveau 3 atteint (C).\n2. Pendant l'absence de C : 1 seul autonome (A) et **aucun niveau 3**, soit **−2 autonomes et −1 niveau 3**.\n3. Former **B ou E** (niveau 1 → 2), tutorés par C **avant** son absence ; envisager de faire progresser A vers le niveau 3 pour ne plus dépendre de C."}], "resources": []}]}]</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
const SUBJECTS = JSON.parse(document.getElementById("data").textContent).sort((a, b) => a.order - b.order);
const COURSES = {};
SUBJECTS.forEach(s => s.courses.forEach(c => { COURSES[c.id] = { ...c, subject: s }; }));
const TABS = [
  ["resume", "Résumé"], ["retenir", "À retenir"], ["flash", "Flashcards"],
  ["qcb", "QCB"], ["qcm", "QCM"], ["ouvertes", "Questions ouvertes"], ["cas", "Cas pratiques"]
];
const state = { view: "home", courseId: null, tab: "resume" };
const quiz = {};   // état des quiz en cours, par clé
let exam = null;

// ---------- stockage local (meilleurs scores) ----------
function loadBest() { try { return JSON.parse(localStorage.getItem("esg-best") || "{}"); } catch (e) { return {}; } }
function saveBest(key, pct) {
  const best = loadBest();
  if (!(key in best) || pct > best[key]) { best[key] = pct; try { localStorage.setItem("esg-best", JSON.stringify(best)); } catch (e) {} }
}

// ---------- utilitaires ----------
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
function md(text) {
  let html = window.marked ? marked.parse(text) : "<p>" + esc(text).replace(/\n/g, "<br>") + "</p>";
  return html.replace(/<table>/g, '<div class="tablewrap"><table>').replace(/<\/table>/g, "</table></div>");
}
const mdInline = text => window.marked ? marked.parseInline(text) : esc(text);
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function count(s, k) { return s.courses.reduce((n, c) => n + (c[k] || []).length, 0); }
const $ = sel => document.querySelector(sel);

// ---------- navigation ----------
function go(view, courseId, tab) {
  state.view = view; state.courseId = courseId || null; state.tab = tab || "resume";
  render(); window.scrollTo(0, 0);
}
function renderSide() {
  const best = loadBest();
  let h = `<div class="brand"><b>Révisions ESG</b><span>M1 Marketing &amp; Commerce · 2026–2027</span></div><nav class="nav">`;
  h += `<button class="nav-item nav-subject" data-go="home" aria-current="${state.view === "home"}">Accueil</button>`;
  SUBJECTS.forEach(s => {
    h += `<div class="nav-item nav-subject" style="cursor:default">${esc(s.title)}</div>`;
    if (!s.courses.length) h += `<div class="nav-item nav-course"><em>En attente des cours</em></div>`;
    s.courses.forEach(c => {
      const b = Math.max(best["qcb:" + c.id] ?? -1, best["qcm:" + c.id] ?? -1);
      h += `<button class="nav-item nav-course" data-course="${c.id}" aria-current="${state.courseId === c.id}"><span>${esc(c.title.split(" — ")[0])}</span><span class="nav-num">${b >= 0 ? b + " %" : ""}</span></button>`;
    });
  });
  h += `<div class="nav-sep"></div><button class="nav-item nav-subject" data-go="exam" aria-current="${state.view === "exam"}">Examen blanc</button></nav>`;
  $("#side").innerHTML = h;
}
function mobileNav() {
  let o = `<option value="home"${state.view === "home" ? " selected" : ""}>Accueil</option>`;
  SUBJECTS.forEach(s => {
    if (!s.courses.length) return;
    o += `<optgroup label="${esc(s.title)}">` + s.courses.map(c => `<option value="${c.id}"${state.courseId === c.id ? " selected" : ""}>${esc(c.title)}</option>`).join("") + `</optgroup>`;
  });
  o += `<option value="exam"${state.view === "exam" ? " selected" : ""}>Examen blanc</option>`;
  return `<div class="mobile-nav"><label class="eyebrow" for="mnav">Aller à</label><select id="mnav">${o}</select></div>`;
}

// ---------- pages ----------
function renderHome() {
  const nQ = SUBJECTS.reduce((n, s) => n + count(s, "qcb") + count(s, "qcm"), 0);
  const nC = SUBJECTS.reduce((n, s) => n + s.courses.length, 0);
  const nO = SUBJECTS.reduce((n, s) => n + count(s, "open_questions") + count(s, "exercises"), 0);
  const nG = SUBJECTS.reduce((n, s) => n + count(s, "glossary"), 0);
  const best = loadBest();
  let h = mobileNav() + `<div><div class="eyebrow">ESG · M1 Marketing &amp; Commerce · 2026–2027</div>
    <h1 class="title-xl">Tous vos cours, prêts pour l'examen</h1></div>
    <p class="lead">Choisissez un cours pour lire son résumé, mémoriser ses définitions, puis vous entraîner avec les QCB (vrai/faux), les QCM, les questions ouvertes et les cas pratiques corrigés.</p>
    <div class="stats"><div class="stat"><b>${nC}</b><span>cours</span></div><div class="stat"><b>${nQ}</b><span>QCB et QCM</span></div><div class="stat"><b>${nO}</b><span>questions ouvertes et cas</span></div><div class="stat"><b>${nG}</b><span>définitions</span></div></div>
    <h2 class="title-l">Matières</h2><div class="subjects">`;
  SUBJECTS.forEach(s => {
    const first = s.courses[0];
    const done = s.courses.filter(c => (best["qcb:" + c.id] ?? -1) >= 70 || (best["qcm:" + c.id] ?? -1) >= 70).length;
    const pct = s.courses.length ? Math.round(100 * done / s.courses.length) : 0;
    h += `<button class="subject-card" ${first ? `data-course="${first.id}"` : "disabled"}>
      <h3>${esc(s.title)}</h3><p>${esc(s.description)}</p>
      ${s.courses.length ? `<div class="bar" title="Cours réussis à 70 % ou plus"><i style="width:${pct}%"></i></div>
      <div class="meta">${s.courses.length} cours · ${count(s, "qcb")} QCB · ${count(s, "qcm")} QCM · ${done}/${s.courses.length} réussis</div>` : `<div class="meta">En attente des supports de cours</div>`}
    </button>`;
  });
  h += `</div>`;
  const dates = SUBJECTS.flatMap(s => (s.key_dates || []).map(d => ({ m: s.short, ...d })));
  if (dates.length) {
    h += `<h2 class="title-l">Dates clés</h2><div class="dates">` + dates.map(d => `<div class="date-row"><span>${esc(d.m)}</span><b>${esc(d.date)}</b><span>${esc(d.label)}</span></div>`).join("") + `</div>`;
  }
  h += `<h2 class="title-l">Méthode de révision</h2><ol class="list-plain keypoints">
    <li><span>Lire le <b>résumé</b>, puis la fiche <b>À retenir</b> et les <b>pièges</b>.</span></li>
    <li><span><b>Flashcards</b> : réciter la définition avant de retourner la carte.</span></li>
    <li><span><b>QCB puis QCM</b> sans le cours sous les yeux. Refaire jusqu'à 80 %.</span></li>
    <li><span><b>Questions ouvertes</b> : rédiger (définition → explication → exemple → conclusion) puis comparer au corrigé.</span></li>
    <li><span><b>Cas pratiques</b>, puis un <b>examen blanc</b> multi-matières.</span></li>
    <li><span>Un peu chaque jour : 45 minutes, 3 fois par semaine, valent mieux que 3 heures la veille.</span></li></ol>`;
  return h;
}

function renderCourse() {
  const c = COURSES[state.courseId]; const s = c.subject;
  const counts = { qcb: c.qcb.length, qcm: c.qcm.length, flash: (c.glossary || []).length, ouvertes: (c.open_questions || []).length, cas: (c.exercises || []).length };
  let h = mobileNav() + `<div><div class="eyebrow">${esc(s.title)}${s.teacher ? " · " + esc(s.teacher) : ""}</div>
    <h1 class="title-xl">${esc(c.title)}</h1></div>
    <div class="toolbar" style="justify-content:flex-start"><span class="tag ${c.status === "a_venir" ? "later" : ""}">${c.status === "a_venir" ? "À venir · préparation anticipée" : "Vu en cours"}</span>${c.date ? `<span class="q-src">${esc(c.date)}</span>` : ""}</div>
    ${c.subtitle ? `<p class="lead">${esc(c.subtitle)}</p>` : ""}
    <div class="tabs" role="tablist">` + TABS.map(([k, l]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${state.tab === k}">${l}${counts[k] != null ? ` <small>${counts[k]}</small>` : ""}</button>`).join("") + `</div><div id="tabbody" style="display:flex;flex-direction:column;gap:14px"></div>`;
  return h;
}

function renderTab() {
  const c = COURSES[state.courseId]; const s = c.subject; const box = $("#tabbody");
  if (state.tab === "resume") {
    let h = "";
    if (c.objectives?.length) h += `<div><div class="eyebrow">Objectifs du cours</div><ul class="list-plain objectives" style="margin-top:8px">${c.objectives.map(o => `<li>${esc(o)}</li>`).join("")}</ul></div>`;
    if (s.exam_info) h += `<details class="section"><summary>Modalités d'évaluation</summary><div class="md">${md(s.exam_info)}</div></details>`;
    h += c.summary.map(sec => `<details class="section" open><summary>${esc(sec.title)}</summary><div class="md">${md(sec.body)}</div></details>`).join("");
    if (c.resources?.length) h += `<div class="res-list"><div class="eyebrow">Ressources</div><ul>${c.resources.map(r => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.label)}</a></li>`).join("")}</ul></div>`;
    if (c.sources?.length) h += `<p class="q-src">Sources : ${c.sources.map(esc).join(" · ")}</p>`;
    box.innerHTML = h;
  } else if (state.tab === "retenir") {
    box.innerHTML = `<h2 class="title-l">La fiche de la veille d'examen</h2><ol class="list-plain keypoints">${(c.key_points || []).map(k => `<li><span>${mdInline(k)}</span></li>`).join("")}</ol>` +
      ((c.traps || []).length ? `<h2 class="title-l">Pièges classiques</h2><div class="list-plain" style="display:flex;flex-direction:column;gap:8px">${c.traps.map(t => `<div class="trap">${mdInline(t)}</div>`).join("")}</div>` : "");
  } else if (state.tab === "flash") {
    renderFlash(box, c);
  } else if (state.tab === "qcb" || state.tab === "qcm") {
    const key = state.tab + ":" + c.id;
    if (!quiz[key]) quiz[key] = newQuiz(state.tab, c[state.tab].map(q => ({ ...q, type: state.tab })), false);
    renderQuiz(box, key);
  } else if (state.tab === "ouvertes") {
    box.innerHTML = `<p class="lead">Rédigez votre réponse, puis ouvrez le corrigé pour comparer.</p>` + (c.open_questions || []).map((q, i) => `
      <div class="q"><div class="q-head"><span class="n">${i + 1}.</span><span>${esc(q.question)}</span></div>
      <label class="q-src" for="oq-${c.id}-${i}">Ma réponse</label><textarea id="oq-${c.id}-${i}" placeholder="Votre réponse…"></textarea>
      <details class="answer"><summary>Voir le corrigé</summary><div class="md">${md(q.answer)}</div></details></div>`).join("");
  } else if (state.tab === "cas") {
    box.innerHTML = (c.exercises || []).map(ex => `
      <div class="q"><h3 style="font-size:1.15rem">${esc(ex.title)}</h3><div class="md" style="padding:0">${md(ex.statement)}</div>
      ${ex.questions?.length ? `<ul style="margin:0">${ex.questions.map(q => `<li>${esc(q)}</li>`).join("")}</ul>` : ""}
      <details class="answer"><summary>Voir le corrigé</summary><div class="md">${md(ex.answer)}</div></details></div>`).join("") || `<div class="empty">Pas de cas pratique pour ce cours.</div>`;
  }
}

// ---------- flashcards ----------
const flash = {};
function renderFlash(box, c) {
  const g = c.glossary || [];
  if (!g.length) { box.innerHTML = `<div class="empty">Pas de définitions pour ce cours.</div>`; return; }
  const f = flash[c.id] || (flash[c.id] = { order: g.map((_, i) => i), i: 0, shown: false });
  const card = g[f.order[f.i]];
  box.innerHTML = `<div class="card-stage">
    <div class="toolbar"><span class="score">Carte ${f.i + 1} / ${g.length}</span><button class="btn" data-flash="shuffle">Mélanger</button></div>
    <button class="flash" data-flash="flip" aria-live="polite"><h3>${esc(card.term)}</h3>
      ${f.shown ? `<p>${esc(card.definition)}</p>` : `<p class="hint">Donnez la définition à voix haute, puis touchez la carte pour la retourner.</p>`}</button>
    <div class="flash-ctrl"><button class="btn" data-flash="prev">Précédente</button><button class="btn primary" data-flash="flip">${f.shown ? "Masquer" : "Retourner"}</button><button class="btn" data-flash="next">Suivante</button></div>
  </div>
  <details class="section"><summary>Tout le glossaire (${g.length})</summary><div class="md"><dl class="gloss">${g.map(x => `<dt>${esc(x.term)}</dt><dd>${esc(x.definition)}</dd>`).join("")}</dl></div></details>`;
}
function flashAction(a) {
  const c = COURSES[state.courseId]; const g = c.glossary; const f = flash[c.id];
  if (a === "flip") f.shown = !f.shown;
  if (a === "next") { f.i = (f.i + 1) % g.length; f.shown = false; }
  if (a === "prev") { f.i = (f.i - 1 + g.length) % g.length; f.shown = false; }
  if (a === "shuffle") { f.order = shuffle(f.order); f.i = 0; f.shown = false; }
  renderFlash($("#tabbody"), c);
}

// ---------- quiz ----------
// mode instantané (cours) : correction question par question ; mode examen : correction à la fin.
function newQuiz(kind, questions, examMode) {
  return { kind, examMode, questions, answers: questions.map(() => null), checked: questions.map(() => false), finished: false };
}
function isRight(q, a) {
  if (a == null) return false;
  if (q.type === "qcb") return a === q.answer;
  const exp = [...q.answer].sort().join(","); return [...a].sort().join(",") === exp;
}
function renderQuiz(box, key) {
  const z = quiz[key];
  const answered = z.checked.filter(Boolean).length;
  const right = z.questions.filter((q, i) => z.checked[i] && isRight(q, z.answers[i])).length;
  let h = `<div class="toolbar"><span class="score">${z.examMode ? `${z.answers.filter(a => a != null && (a.length ?? 1)).length} / ${z.questions.length} répondues` : `Score : ${right} / ${answered} · ${z.questions.length} questions`}</span>
    <span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-quiz="${key}" data-act="shuffle">Mélanger</button><button class="btn" data-quiz="${key}" data-act="reset">Recommencer</button></span></div>`;
  if (z.questions.some(q => q.type === "qcm")) h += `<p class="q-src">QCM : une ou plusieurs bonnes réponses. Une question n'est juste que si toutes les cases sont correctes.</p>`;
  if (z.finished || (!z.examMode && answered === z.questions.length)) h += resultBox(key, right, z.questions.length);
  z.questions.forEach((q, i) => {
    const done = z.checked[i]; const ok = done && isRight(q, z.answers[i]);
    h += `<div class="q ${done ? (ok ? "right" : "wrong") : ""}"><div class="q-head"><span class="n">${i + 1}.</span><span>${esc(q.q)}${q.src ? `<span class="q-src">${esc(q.src)}</span>` : ""}</span></div>`;
    if (q.type === "qcb") {
      h += `<div class="tf">` + [[true, "Vrai"], [false, "Faux"]].map(([v, l]) => {
        let cls = "";
        if (done) cls = z.answers[i] === v ? (v === q.answer ? "picked-right" : "picked-wrong") : (v === q.answer ? "was-right" : "");
        else if (z.answers[i] === v) cls = "primary";
        return `<button class="btn ${cls}" data-quiz="${key}" data-act="tf" data-i="${i}" data-v="${v}" ${done ? "disabled" : ""}>${l}</button>`;
      }).join("") + `</div>`;
    } else {
      const sel = z.answers[i] || [];
      h += `<div class="opts">` + q.options.map((o, j) => {
        let cls = "";
        if (done) { const exp = q.answer.includes(j), got = sel.includes(j); cls = exp && got ? "is-right" : exp ? "is-missed" : got ? "is-wrong" : ""; }
        const id = `${key}-${i}-${j}`.replace(/[^\w-]/g, "_");
        return `<label class="opt ${cls}" for="${id}"><input type="checkbox" id="${id}" data-quiz="${key}" data-act="pick" data-i="${i}" data-j="${j}" ${sel.includes(j) ? "checked" : ""} ${done ? "disabled" : ""}><span class="l">${String.fromCharCode(65 + j)}</span><span>${esc(o)}</span></label>`;
      }).join("") + `</div>`;
      if (!done && !z.examMode) h += `<div><button class="btn primary" data-quiz="${key}" data-act="check" data-i="${i}" ${sel.length ? "" : "disabled"}>Valider</button></div>`;
    }
    if (done) {
      const expected = q.type === "qcb" ? (q.answer ? "Vrai" : "Faux") : q.answer.map(a => String.fromCharCode(65 + a)).join(", ");
      h += `<div class="feedback ${ok ? "ok" : "ko"}"><b>${ok ? "Juste." : "Faux. Réponse : " + expected + "."}</b> ${mdInline(q.explanation)}</div>`;
    }
    h += `</div>`;
  });
  if (z.examMode && !z.finished) h += `<div><button class="btn primary" data-quiz="${key}" data-act="finish">Corriger l'examen</button></div>`;
  box.innerHTML = h;
}
function resultBox(key, right, total) {
  const pct = Math.round(100 * right / total), note = (20 * right / total).toFixed(1).replace(".", ",");
  const msg = pct >= 80 ? "Excellent, ce cours est maîtrisé." : pct >= 60 ? "Bon niveau. Relisez les explications des erreurs." : "Relisez le résumé et les pièges, puis recommencez.";
  return `<div class="result" role="status"><div><div class="eyebrow">Résultat</div><div class="big">${note} / 20</div></div><div>${right} bonnes réponses sur ${total} (${pct} %)<br><span class="q-src">${msg}</span></div></div>`;
}
function quizAction(el) {
  const key = el.dataset.quiz, z = quiz[key], act = el.dataset.act, i = +el.dataset.i;
  if (act === "tf") { z.answers[i] = el.dataset.v === "true"; if (!z.examMode) z.checked[i] = true; }
  if (act === "pick") { const j = +el.dataset.j, s = new Set(z.answers[i] || []); el.checked ? s.add(j) : s.delete(j); z.answers[i] = [...s]; }
  if (act === "check") z.checked[i] = true;
  if (act === "finish") { z.checked = z.checked.map(() => true); z.finished = true; }
  if (act === "reset" || act === "shuffle") {
    const qs = act === "shuffle" ? shuffle(z.questions) : z.questions;
    quiz[key] = newQuiz(z.kind, qs, z.examMode);
  }
  const fresh = quiz[key];
  const answered = fresh.checked.filter(Boolean).length;
  if (answered === fresh.questions.length && fresh.questions.length && !key.startsWith("exam")) {
    saveBest(key, Math.round(100 * fresh.questions.filter((q, k) => isRight(q, fresh.answers[k])).length / fresh.questions.length));
    renderSide();
  }
  const y = window.scrollY;
  if (key.startsWith("exam")) renderQuiz($("#exambody"), key); else renderQuiz($("#tabbody"), key);
  if (act === "pick") { const again = document.getElementById(el.id); if (again) again.focus({ preventScroll: true }); }
  if (act !== "finish" && act !== "reset" && act !== "shuffle") window.scrollTo(0, y);
  else if (act === "finish") $("#exambody").scrollIntoView({ behavior: "smooth" });
}

// ---------- examen blanc ----------
function renderExam() {
  const avail = SUBJECTS.filter(s => s.courses.length);
  return mobileNav() + `<div><div class="eyebrow">Toutes matières</div><h1 class="title-xl">Examen blanc</h1></div>
    <p class="lead">Un tirage aléatoire de QCB et de QCM dans les matières choisies. Répondez à tout, puis corrigez : la note est donnée sur 20.</p>
    <form class="exam-form" id="examform">
      <div><div class="eyebrow">Matières</div><div class="checks" style="margin-top:6px">${avail.map(s => `<label for="ex-${s.id}"><input type="checkbox" id="ex-${s.id}" value="${s.id}" checked> ${esc(s.title)}</label>`).join("")}</div></div>
      <label class="checks" for="ex-later"><input type="checkbox" id="ex-later"> Inclure les cours « à venir »</label>
      <div class="ranges">
        <label for="ex-nqcb">QCB (vrai/faux) : <output id="o-nqcb">10</output><input type="range" id="ex-nqcb" min="0" max="30" value="10"></label>
        <label for="ex-nqcm">QCM : <output id="o-nqcm">10</output><input type="range" id="ex-nqcm" min="0" max="30" value="10"></label>
      </div>
      <div><button class="btn primary" type="submit">Générer un examen</button></div>
    </form><div id="exambody" style="display:flex;flex-direction:column;gap:14px"></div>`;
}
function buildExam(form) {
  const ids = [...form.querySelectorAll(".checks input[value]:checked")].map(x => x.value);
  const later = $("#ex-later").checked;
  const pool = { qcb: [], qcm: [] };
  SUBJECTS.filter(s => ids.includes(s.id)).forEach(s => s.courses.forEach(c => {
    if (c.status === "a_venir" && !later) return;
    ["qcb", "qcm"].forEach(t => c[t].forEach(q => pool[t].push({ ...q, type: t, src: s.short + " · " + c.title.split(" — ")[0] })));
  }));
  const qs = shuffle(pool.qcb).slice(0, +$("#ex-nqcb").value).concat(shuffle(pool.qcm).slice(0, +$("#ex-nqcm").value));
  if (!qs.length) { $("#exambody").innerHTML = `<div class="empty">Sélectionnez au moins une matière et une question.</div>`; return; }
  const key = "exam:" + Date.now();
  quiz[key] = newQuiz("exam", qs, true);
  renderQuiz($("#exambody"), key);
}

// ---------- rendu global & événements ----------
function render() {
  renderSide();
  const v = $("#view");
  if (state.view === "home") v.innerHTML = renderHome();
  else if (state.view === "exam") v.innerHTML = renderExam();
  else { v.innerHTML = renderCourse(); renderTab(); }
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-course],[data-tab],[data-flash],[data-quiz]");
  if (!t) return;
  if (t.dataset.go) go(t.dataset.go);
  else if (t.dataset.course) go("course", t.dataset.course, "resume");
  else if (t.dataset.tab) { state.tab = t.dataset.tab; document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === state.tab)); renderTab(); }
  else if (t.dataset.flash) flashAction(t.dataset.flash);
  else if (t.dataset.quiz && t.dataset.act !== "pick") quizAction(t);
});
document.addEventListener("change", e => {
  if (e.target.id === "mnav") { const v = e.target.value; v === "home" || v === "exam" ? go(v) : go("course", v, "resume"); }
  else if (e.target.dataset.act === "pick") quizAction(e.target);
});
document.addEventListener("input", e => {
  if (e.target.id === "ex-nqcb" || e.target.id === "ex-nqcm") $("#o-" + e.target.id.slice(3)).textContent = e.target.value;
});
document.addEventListener("submit", e => { if (e.target.id === "examform") { e.preventDefault(); buildExam(e.target); } });
render();
</script>

</body></html>
