ard text, not extract main ideas or translate. AI is a tool, NOT a source.", "Homework: 45 min × 3 per week beats 3 h once a month.", "Project: a real company's real international expansion, 5 parts in order, ~15 min, sources with links."], "traps": ["« The project is a creative business plan » → NO: it's research on what really happened.", "ChatGPT is never a source to cite: every fact needs a traceable link.", "You may bring handwritten notes to the written exam, but only in a notebook (no loose sheets).", "Group project but individual grade."], "glossary": [{"term": "Flipped classroom", "definition": "You study the material (reading, vocabulary) before class; class time is for practice. FR : classe inversée."}, {"term": "Oral production", "definition": "Speaking spontaneously in English; reading a text aloud does not count. FR : production orale."}, {"term": "Deliverable", "definition": "A piece of work you must hand in or present. FR : livrable."}, {"term": "Source", "definition": "A traceable article, report or document supporting a fact. AI tools are not sources."}, {"term": "Case study", "definition": "In-depth analysis of a real company situation. FR : étude de cas."}, {"term": "Signposting", "definition": "Phrases that guide the audience through a presentation (first, then, let's move on to…)."}], "qcb": [{"q": "The oral presentation is graded as a group: everyone gets the same mark.", "answer": false, "explanation": "Presentations are graded individually; there is no group grade."}, {"q": "Your slides may contain keywords, figures and statistics, but not full sentences.", "answer": true, "explanation": "Symbols, keywords, dates, figures and charts are allowed; text is not."}, {"q": "Reading your notes aloud during the presentation counts as oral production.", "answer": false, "explanation": "Reading a text is NOT oral production. No reading during the presentation."}, {"q": "During written exams you may use handwritten notes kept in a notebook.", "answer": true, "explanation": "Only notes in your notebook: no loose sheets, no printed material, no screens."}, {"q": "The written exam only covers the words listed in the program.", "answer": false, "explanation": "It covers grammar and vocabulary seen in class, not limited to the program words."}, {"q": "You may use AI to translate the flipped-class reading into French.", "answer": false, "explanation": "AI may only simplify a text that is really too hard, not translate it or extract its main ideas."}, {"q": "ChatGPT can be cited as a source in the Global Launch Project.", "answer": false, "explanation": "AI tools are not sources: every fact must be traceable to a real article or report."}, {"q": "The project must present the five parts in order.", "answer": true, "explanation": "Market Analysis, Entry Strategy, Marketing Strategy, Operations & Supply Chain, Financial Objectives."}, {"q": "Studying 45 minutes three times a week is better than 3 hours once a month.", "answer": true, "explanation": "Regularity matters more than intensity."}, {"q": "Choosing a famous company is more important than having enough public information.", "answer": false, "explanation": "Enough public information in English matters more than fame."}, {"q": "The final presentation lasts approximately 15 minutes.", "answer": true, "explanation": "About 15 minutes, covering all five parts."}], "qcm": [{"q": "What is the oral grade based on? (several answers)", "options": ["Grammar", "Vocabulary", "Pronunciation", "The design of the slides"], "answer": [0, 1, 2], "explanation": "Oral production: grammar, vocabulary, pronunciation."}, {"q": "Which items are FORBIDDEN in the written exam? (several answers)", "options": ["Smartwatch", "Printed material", "Loose sheets of paper", "Your handwritten notebook"], "answer": [0, 1, 2], "explanation": "Only the handwritten notebook is allowed."}, {"q": "Which of these are acceptable sources for the project? (several answers)", "options": ["Company annual reports", "Reuters or Financial Times articles", "Harvard or McKinsey case studies", "A ChatGPT answer"], "answer": [0, 1, 2], "explanation": "AI is a tool, not a source."}, {"q": "What is the correct order of the five project parts?", "options": ["Marketing → Market Analysis → Finance → Entry → Operations", "Market Analysis → Entry Strategy → Marketing Strategy → Operations & Supply Chain → Financial Objectives", "Entry Strategy → Finance → Marketing → Market Analysis → Operations", "Operations → Marketing → Entry → Finance → Market Analysis"], "answer": [1], "explanation": "That's the required order."}, {"q": "Choose the correct sentence.", "options": ["We found many informations about IKEA.", "We found a lot of information about IKEA.", "We found an information about IKEA.", "We found much informations about IKEA."], "answer": [1], "explanation": "Information is uncountable: no plural, no « an »."}, {"q": "« Actuellement, Tesla produit en Allemagne. » The best translation is:", "options": ["Actually, Tesla produces in Germany.", "Currently, Tesla produces in Germany.", "Eventually, Tesla produces in Germany.", "Actively, Tesla produces in Germany."], "answer": [1], "explanation": "Actually = en fait ; currently = actuellement."}, {"q": "Which word means « concurrence » in a business context?", "options": ["Concurrence", "Competition", "Competence", "Concourse"], "answer": [1], "explanation": "Competition ; a competitor = un concurrent."}, {"q": "What is the deliverable list for the project? (several answers)", "options": ["A list of links to every source used (in English)", "A ~15-minute oral presentation", "Visual support showing your sources", "A 30-page written report"], "answer": [0, 1, 2], "explanation": "No written report is required."}, {"q": "Which phrase is best to move to the next part of your presentation?", "options": ["Let's move on to the entry strategy.", "I read now the next slide.", "Now I am going to read you part 2.", "Next informations are…"], "answer": [0], "explanation": "Signposting phrase; never « read »."}, {"q": "« Sales went from 10 to 15 million. » Which verbs describe this trend? (several answers)", "options": ["Sales rose", "Sales increased", "Sales declined", "Sales grew"], "answer": [0, 1, 3], "explanation": "Rise / increase / grow ↗ ; decline ↘."}], "open_questions": [{"question": "Explain in English the main rules for the final oral presentation.", "answer": "The presentation lasts about **15 minutes** and covers the **five parts in order**. It is **graded individually** on **grammar, vocabulary and pronunciation**. **Reading is not allowed**: reading a text is not oral production. Slides may only contain **keywords, symbols, numbers, charts and images**, never full sentences, and must show the **links to the real sources**."}, {"question": "Present your Global Launch Project case in three sentences (model answer).", "answer": "*Model:* « Our case study is **IKEA's expansion into India**, which opened its first store in **Hyderabad in 2018**. We will analyse the **market**, IKEA's **entry strategy** through a **wholly-owned subsidiary**, its **product and pricing adaptation**, its **local sourcing**, and its **financial objectives**. Finally, we will explain why we believe the expansion has been **partly successful**. »\n\n*(Check every fact in your sources.)*"}], "exercises": [{"title": "Correct the mistakes", "statement": "Correct this student's slide notes: « Actually, the concurrence in China is very strong. We have many informations about the benefits of Starbucks. Eventually they will open 500 stores. »", "questions": ["Rewrite the sentences correctly."], "answer": "« **Currently**, the **competition** in China is very strong. We have **a lot of information** about Starbucks' **profits**. **Possibly** (or: *They may / plan to*) open 500 stores. »\n\nIf *eventually* meant « finalement », it's correct: « Eventually, they opened 500 stores. »"}], "resources": []}, {"id": "eng-01", "title": "Class 2 — Market Analysis", "subtitle": "Market size, target segment, demand, competitors, market share, entry barriers", "date": "14/10/2026", "status": "vu", "sources": ["M1CM_2026-2027_Program.xlsx", "Global_Launch_Project_Guidelines (Part 1)", "Market_analysis_word_spiders_ANSWER_KEY.docx (1).pdf"], "objectives": ["Master the six Market Analysis keywords and use them in sentences.", "Answer project questions 1–6 for your company.", "Know the six popular market entry types from the reading (Shopify)."], "summary": [{"title": "1. Target vocabulary — Market Analysis", "body": "| Term | Definition | FR |\n|---|---|---|\n| **Market size** | Total value (or volume) of sales in a market over a period | taille du marché |\n| **Target segment** | The specific group of customers a company chooses to serve | segment cible |\n| **Market demand** | How much customers want and are able to buy a product | demande du marché |\n| **Competitor analysis** | Study of rivals' strengths, weaknesses, prices and positioning | analyse concurrentielle |\n| **Market share** | A company's sales as a percentage of total market sales | part de marché |\n| **Entry barriers** | Obstacles that make it hard to enter a market (regulation, high costs, strong brands, culture, tariffs) | barrières à l'entrée |"}, {"title": "2. Project questions — Part 1", "body": "1. How big is the target market (**market size**)?\n2. Who is the **target segment**?\n3. What evidence shows **market demand**?\n4. Who are the main competitors (**competitor analysis**)?\n5. What **market share** did the company aim for or achieve?\n6. What **entry barriers** did it face?"}, {"title": "3. Useful formulas & collocations", "body": "- **Market share (%)** = company sales ÷ total market sales × 100\n- *The market is worth $X billion* · *The market is growing at X% a year* · *to gain / lose / increase market share* · *to target young urban professionals* · *to face / overcome / lower entry barriers* · *demand for coffee is rising*.\n\n*Example*: if the Indian furniture market is worth $20 bn and IKEA sells $200 m, IKEA's market share = 200 ÷ 20,000 × 100 = **1%**."}, {"title": "3b. Word spiders — collocations to use (answer key from class)", "body": "| Keyword | + Adjectives | + Verbs |\n|---|---|---|\n| **Market size** | a **large / sizeable / limited** market (also: niche, profitable, underserved, which collocate with *market* but don't describe size) | to **estimate / measure** the market size · to measure a market **in value or volume** · to **be worth** €2 billion |\n| **Target segment** | a **niche / profitable / underserved** segment (also: large, sizeable) | to **identify / target** a segment · to **focus on** a segment |\n| **Market demand** | **strong / growing / untapped** demand | to **assess / meet** demand · demand **rises** |\n| **Competitor analysis** | a **thorough** analysis · **main / direct** competitors (also: strong) · a **saturated** market (also: growing, untapped) | to **carry out** a competitor analysis · to **outperform** competitors · to **assess** competitors' strengths and weaknesses |\n| **Market share** | a **large / growing / dominant** share (also: high, significant) | to **gain / lose** market share · to **capture** a share of the market |\n| **Entry barriers** (also: *barriers to entry*) | **high / significant / legal** barriers | to **face / overcome / underestimate** barriers |\n\n**Upgrade your sentences (●○○ → ●●●)**:\n- ●○○ *The market was very big.* → ●●● *Their research **estimated the market at €2 billion annually**, with around 5 million potential customers.*\n- ●○○ *They wanted to sell to young people in big cities.* → ●●● *Their analysis revealed a **profitable, underserved segment**: young urban professionals with high disposable income.*\n- ●○○ *A lot of people wanted this product.* → ●●● *The study revealed **untapped demand** for vegan snacks.*\n- ●○○ *Many companies sold the same product.* → ●●● *A **thorough competitor analysis** revealed that the market was already **saturated**.*\n- ●○○ *They wanted to sell more than the others.* → ●●● *They aimed to **gain market share** quickly at the expense of the market leader.*\n- ●○○ *The rules were difficult, so they found a partner.* → ●●● *Having initially **underestimated the barriers**, they had to partner with an established local firm.*"}, {"title": "4. Reading — 6 popular types of market entry strategies (Shopify)", "body": "| Type | Meaning | Risk / control |\n|---|---|---|\n| **Exporting** | Selling products made at home to a foreign market (directly or via intermediaries) | Low risk, low control |\n| **Licensing** | Allowing a foreign company to use your intellectual property (brand, patent) in exchange for **royalties** | Low cost, limited control |\n| **Franchising** | Licensing a **whole business model** (brand + processes); franchisee pays fees and royalties (e.g. McDonald's) | Fast growth, moderate control |\n| **Acquisitions** | **Buying an existing local company** | Fast access, high cost |\n| **Joint ventures** | Creating a business **co-owned with a local partner**, sharing risks, costs and local knowledge | Shared control |\n| **New product development** | Creating new products tailored to the new market | Costly, can fit local needs |\n\n*Summary written from the course reading list; read the original article for details.*"}], "key_points": ["Market size = total value of sales in a market.", "Target segment = the group of customers a company chooses to serve.", "Market demand = how much customers want and can buy.", "Competitor analysis = studying rivals.", "Market share = company sales ÷ market sales × 100.", "Entry barriers = regulation, costs, strong local brands, culture, tariffs.", "Entry types: exporting, licensing, franchising, acquisitions, joint ventures, new product development."], "traps": ["Market size ≠ market share: size is the whole pie, share is your slice.", "Target segment ≠ market segmentation: segmentation divides the market, the target is the chosen group.", "Licensing (one asset: brand or patent) ≠ franchising (a whole business model)."], "glossary": [{"term": "Market size", "definition": "Total value or volume of sales in a market over a period. FR : taille du marché."}, {"term": "Target segment", "definition": "The specific group of customers a company chooses to serve. FR : segment cible."}, {"term": "Market demand", "definition": "The quantity of a product customers want and can afford to buy. FR : demande."}, {"term": "Competitor analysis", "definition": "Evaluation of rivals' strengths, weaknesses, prices and strategies. FR : analyse concurrentielle."}, {"term": "Market share", "definition": "Percentage of total market sales held by one company. FR : part de marché."}, {"term": "Entry barriers", "definition": "Obstacles preventing or slowing a company's entry into a market. FR : barrières à l'entrée."}, {"term": "Exporting", "definition": "Selling domestically produced goods to a foreign market."}, {"term": "Royalties", "definition": "Payments made to the owner of a brand or patent for the right to use it. FR : redevances."}, {"term": "Tariff", "definition": "A tax on imported goods. FR : droit de douane."}], "qcb": [{"q": "Market share is the total value of all sales in a market.", "answer": false, "explanation": "That's market size. Market share is one company's percentage of the market."}, {"q": "High import tariffs can be an entry barrier.", "answer": true, "explanation": "Regulations, tariffs, costs and strong local brands are typical entry barriers."}, {"q": "A target segment is the group of customers a company chooses to serve.", "answer": true, "explanation": "Correct definition."}, {"q": "Competitor analysis means studying your own employees.", "answer": false, "explanation": "It means studying your rivals."}, {"q": "If a company sells $50 m in a $1 bn market, its market share is 5%.", "answer": true, "explanation": "50 ÷ 1,000 × 100 = 5%."}, {"q": "Exporting is generally the lowest-risk entry mode.", "answer": true, "explanation": "Low investment abroad, but also low control."}, {"q": "Franchising means buying an existing local company.", "answer": false, "explanation": "That's an acquisition. Franchising licenses a whole business model."}, {"q": "In a joint venture, the company shares ownership with a partner.", "answer": true, "explanation": "Risks, costs and local knowledge are shared."}, {"q": "Licensing usually involves the payment of royalties.", "answer": true, "explanation": "The licensee pays royalties to use the brand or patent."}, {"q": "Market demand only measures what customers want, not what they can afford.", "answer": false, "explanation": "Demand = willingness AND ability to buy."}], "qcm": [{"q": "« The Chinese coffee market is worth $15 billion. » This sentence describes:", "options": ["Market share", "Market size", "Entry barriers", "Target segment"], "answer": [1], "explanation": "The total value of the market."}, {"q": "Which are examples of entry barriers? (several answers)", "options": ["Strict government regulation", "Strong local competitors", "High start-up costs", "A large target segment"], "answer": [0, 1, 2], "explanation": "A large segment is an opportunity, not a barrier."}, {"q": "Choose the correct collocation:", "options": ["to win market share", "to gain market share", "to make market share", "to do market share"], "answer": [1], "explanation": "gain / increase / lose market share."}, {"q": "Starbucks targeted young urban middle-class professionals in China. This is its:", "options": ["Market size", "Target segment", "Market share", "Entry barrier"], "answer": [1], "explanation": "The chosen group of customers."}, {"q": "Which entry mode means allowing a foreign firm to use your patent for royalties?", "options": ["Exporting", "Licensing", "Acquisition", "Joint venture"], "answer": [1], "explanation": "Licensing = use of intellectual property."}, {"q": "McDonald's opening restaurants run by local owners who pay fees is an example of:", "options": ["Franchising", "Exporting", "Greenfield investment", "Market demand"], "answer": [0], "explanation": "The franchisee uses the full business model."}, {"q": "What evidence can show market demand? (several answers)", "options": ["Growing sales in the category", "Surveys of consumer interest", "Rising middle-class income", "The CEO's favourite colour"], "answer": [0, 1, 2], "explanation": "Data on sales, consumers and purchasing power."}, {"q": "Company A: $300 m sales; total market: $6 bn. Market share =", "options": ["0.5%", "5%", "50%", "20%"], "answer": [1], "explanation": "300 ÷ 6,000 × 100 = 5%."}, {"q": "Which entry mode gives FAST access to customers but at HIGH cost?", "options": ["Exporting", "Licensing", "Acquisition", "New product development"], "answer": [2], "explanation": "Buying an existing company is fast but expensive."}, {"q": "Fill in: « Netflix had to ______ strong local competitors in South Korea. »", "options": ["face", "do", "make", "take"], "answer": [0], "explanation": "to face competitors / barriers."}, {"q": "Which adjectives collocate with « demand »? (several answers)", "options": ["strong", "growing", "untapped", "saturated"], "answer": [0, 1, 2], "explanation": "strong / growing / untapped demand. *Saturated* goes with *market*."}, {"q": "Fill in: « They opened a new factory to ______ the growing demand. »", "options": ["meet", "make", "do", "rise"], "answer": [0], "explanation": "to meet demand (also: to assess demand)."}, {"q": "Which verbs collocate with « entry barriers »? (several answers)", "options": ["face", "overcome", "underestimate", "gain"], "answer": [0, 1, 2], "explanation": "to face / overcome / underestimate barriers. *Gain* goes with market share."}, {"q": "Fill in: « Their goal was to ______ 5% of the market within two years. »", "options": ["capture", "carry out", "meet", "identify"], "answer": [0], "explanation": "to capture (or gain) a share of the market."}, {"q": "Choose the correct collocation:", "options": ["to carry out a competitor analysis", "to make out a competitor analysis", "to do up a competitor analysis", "to rise a competitor analysis"], "answer": [0], "explanation": "to carry out an analysis."}, {"q": "Which sentence is the most advanced (●●●) way to describe the market size?", "options": ["The market was very big.", "The market was worth about €2 billion a year.", "Their research estimated the market at €2 billion annually, with around 5 million potential customers.", "A lot of people bought this product."], "answer": [2], "explanation": "Precise figures + a strong verb (*estimated*)."}], "open_questions": [{"question": "Define market size and market share and explain the difference with an example.", "answer": "**Market size** is the total value of sales in a market (e.g. the German EV market is worth €X bn). **Market share** is the percentage of that market held by one company (e.g. Tesla holds 15% of the German EV market). Size is the **whole pie**; share is the company's **slice**."}, {"question": "What entry barriers might a Western retailer face in India?", "answer": "**Regulatory barriers** (foreign direct investment rules, local sourcing requirements), **cultural barriers** (different tastes, family-run local shops), **economic barriers** (lower average purchasing power, price sensitivity), **logistics barriers** (infrastructure), and **strong local competitors**. *Example: IKEA had to source a share of its products locally to meet Indian FDI rules (check this in your sources).*"}], "exercises": [{"title": "Apply Part 1 to your company", "statement": "Choose your project company and write one sentence per keyword.", "questions": ["market size", "target segment", "market demand", "competitor analysis", "market share", "entry barriers"], "answer": "*Model (Starbucks in China, check the figures in your sources):*\n- **Market size**: « China's coffee market is worth several billion dollars and is growing fast. »\n- **Target segment**: « Starbucks targeted young, urban, middle-class consumers. »\n- **Market demand**: « Coffee consumption per person is low but rising quickly, especially among young people. »\n- **Competitor analysis**: « Its main competitors include Luckin Coffee and local tea chains. »\n- **Market share**: « Starbucks was the market leader but has lost market share to Luckin. »\n- **Entry barriers**: « The main barriers were a tea-drinking culture and the need for local partners. »"}], "resources": [{"label": "Reading — Market Entry Strategy Guide: 6 Ways to Enter New Markets (Shopify) — section « Popular types of market entry strategies »", "url": "https://www.shopify.com/nz/blog/market-entry-strategy"}]}, {"id": "eng-02", "title": "Class 3 — Market Entry Strategy", "subtitle": "Joint venture, acquisition, direct investment, strategic alliance, licensing/franchising, greenfield", "date": "16/10/2026", "status": "vu", "sources": ["M1CM_2026-2027_Program.xlsx", "Global_Launch_Project_Guidelines (Part 2)"], "objectives": ["Identify your company's market entry strategy and apply the concepts.", "Distinguish greenfield vs brownfield (acquisition) direct investment.", "Understand how businesses adapt the marketing mix for international audiences (reading)."], "summary": [{"title": "1. Target vocabulary — Entry Strategy", "body": "| Term | Definition | FR |\n|---|---|---|\n| **Joint venture (JV)** | A new business **jointly owned** by two or more companies (often a foreign firm and a local partner) | coentreprise |\n| **Acquisition** | **Buying** an existing company (or a controlling stake) | acquisition / rachat |\n| **Direct investment (FDI)** | Investing money directly in operations abroad (factories, stores, subsidiaries) | investissement direct (IDE) |\n| **Strategic alliance** | **Cooperation agreement** between independent companies **without creating a new company** | alliance stratégique |\n| **Licensing / franchising** | Selling the right to use a brand, patent or whole business model for fees and royalties | licence / franchise |\n| **Greenfield investment** | Direct investment that **builds new operations from scratch** | investissement *greenfield* (création ex nihilo) |\n\n**Greenfield vs brownfield**: if it's direct investment, did the company **build from scratch** (greenfield) or **buy an existing business** (acquisition, sometimes called **brownfield**)?"}, {"title": "2. Project questions — Part 2", "body": "7. Which entry strategy did the company use?\n8. If direct investment: **greenfield** or **acquisition (brownfield)**?\n9. Who were the local or international **partners**, and what type of **agreement** did they have?"}, {"title": "3. Comparing entry modes", "body": "| Mode | Control | Investment / risk | Speed | Example |\n|---|---|---|---|---|\n| Licensing / franchising | Low–medium | Low | Fast | McDonald's franchises |\n| Strategic alliance | Shared | Low–medium | Fast | Airline alliances (Star Alliance) |\n| Joint venture | Shared | Medium | Medium | Starbucks' early JVs in China |\n| Acquisition | High | High | Fast | Walmart buying Flipkart in India (2018) |\n| Greenfield | **Full** | **Highest** | **Slow** | Tesla's Gigafactory near Berlin (Grünheide) |\n\n**Rule of thumb**: the more **control** you want, the more **investment and risk** you accept."}, {"title": "4. Reading — Adapting the marketing mix for international audiences (TutorChase)", "body": "Companies decide between **standardisation** (same mix everywhere: economies of scale, consistent brand) and **adaptation** (adjusting to local culture, laws, income). The middle way is called **glocalisation** (« think global, act local »).\n\n| 4P | Typical adaptations |\n|---|---|\n| **Product** | Local tastes, sizes, ingredients, regulations, language on packaging (McDonald's McAloo Tikki in India, no beef) |\n| **Price** | Local purchasing power, currency, taxes, competitors' prices |\n| **Place** | Local distribution channels and partners, retail habits (markets vs malls vs online) |\n| **Promotion** | Language, cultural values, humour, media habits, local celebrities, legal limits on advertising |\n\n*Summary written from the course reading list; read the original article for details.*"}], "key_points": ["JV = new company jointly owned; strategic alliance = cooperation without a new company.", "Acquisition = buying an existing business (brownfield); greenfield = building from scratch.", "Direct investment (FDI) can be greenfield or acquisition.", "Licensing = rights to a brand or patent; franchising = whole business model; both pay royalties.", "More control means more investment and more risk.", "Standardisation vs adaptation of the 4Ps; glocalisation = think global, act local."], "traps": ["Joint venture ≠ strategic alliance: only the JV creates a new jointly-owned entity.", "Greenfield = from scratch; brownfield = existing business or facilities.", "Acquisition is a form of direct investment, not an alternative to it."], "glossary": [{"term": "Joint venture", "definition": "A business entity created and jointly owned by two or more companies. FR : coentreprise."}, {"term": "Acquisition", "definition": "Purchase of an existing company or of a controlling stake in it. FR : rachat."}, {"term": "Direct investment (FDI)", "definition": "Investment by a company in operations it controls in another country. FR : investissement direct à l'étranger."}, {"term": "Strategic alliance", "definition": "Agreement between independent firms to cooperate (share resources, knowledge, distribution) without forming a new company."}, {"term": "Licensing", "definition": "Granting the right to use intellectual property (brand, patent, technology) in exchange for royalties."}, {"term": "Franchising", "definition": "Granting the right to operate a whole business model under a brand, against fees and royalties."}, {"term": "Greenfield investment", "definition": "Building new facilities from scratch in a foreign country."}, {"term": "Brownfield investment", "definition": "Investing by buying or leasing existing facilities or companies."}, {"term": "Subsidiary", "definition": "A company controlled by a parent company. FR : filiale."}, {"term": "Stake", "definition": "A share of ownership in a company. FR : participation."}, {"term": "Glocalisation", "definition": "Combining a global brand strategy with local adaptation."}], "qcb": [{"q": "A greenfield investment means buying an existing local company.", "answer": false, "explanation": "Greenfield = building from scratch. Buying an existing company = acquisition (brownfield)."}, {"q": "A joint venture creates a new business owned by two or more partners.", "answer": true, "explanation": "That's what distinguishes it from a simple alliance."}, {"q": "A strategic alliance always creates a new legal company.", "answer": false, "explanation": "An alliance is a cooperation agreement without a new entity."}, {"q": "Greenfield investment gives the company full control but requires high investment.", "answer": true, "explanation": "Maximum control, maximum cost and risk, slow."}, {"q": "Franchising is a low-investment way to expand quickly.", "answer": true, "explanation": "Franchisees invest their own money."}, {"q": "Acquisition is a type of direct investment.", "answer": true, "explanation": "FDI can be greenfield or by acquisition."}, {"q": "Standardisation means adapting every element of the marketing mix to each country.", "answer": false, "explanation": "That's adaptation. Standardisation = the same mix everywhere."}, {"q": "Selling vegetarian burgers in India is an example of product adaptation.", "answer": true, "explanation": "Adapting the product to local culture and religion."}, {"q": "Glocalisation means « think global, act local ».", "answer": true, "explanation": "A global brand with local adaptation."}, {"q": "Licensing gives the licensor strong control over how the licensee runs its business.", "answer": false, "explanation": "Licensing offers limited control."}], "qcm": [{"q": "Tesla built a brand-new factory near Berlin. This is:", "options": ["A joint venture", "A greenfield investment", "Licensing", "An acquisition"], "answer": [1], "explanation": "New operations built from scratch."}, {"q": "Walmart bought a majority stake in Flipkart (India). This is:", "options": ["An acquisition", "Franchising", "Exporting", "A strategic alliance"], "answer": [0], "explanation": "Buying an existing company."}, {"q": "Two companies share distribution networks without creating a new firm. This is:", "options": ["A joint venture", "A strategic alliance", "Greenfield", "Licensing"], "answer": [1], "explanation": "Cooperation without a new entity."}, {"q": "Which modes involve royalties? (several answers)", "options": ["Licensing", "Franchising", "Greenfield investment", "Acquisition"], "answer": [0, 1], "explanation": "The licensee or franchisee pays royalties."}, {"q": "Which mode offers the MOST control?", "options": ["Licensing", "Strategic alliance", "Joint venture", "Greenfield investment (wholly owned)"], "answer": [3], "explanation": "A wholly owned subsidiary built from scratch."}, {"q": "Why do companies choose a joint venture with a local partner? (several answers)", "options": ["Access to local knowledge and networks", "Sharing risks and costs", "Sometimes required by local law", "To keep 100% of the profits"], "answer": [0, 1, 2], "explanation": "In a JV, profits are shared."}, {"q": "Which of the 4Ps does « using local celebrities in ads » adapt?", "options": ["Product", "Price", "Place", "Promotion"], "answer": [3], "explanation": "Promotion adapts language, culture and media."}, {"q": "Adjusting prices to local purchasing power adapts:", "options": ["Product", "Price", "Place", "Promotion"], "answer": [1], "explanation": "Price."}, {"q": "Which are advantages of standardisation? (several answers)", "options": ["Economies of scale", "Consistent global brand image", "Lower costs", "Perfect fit with every local culture"], "answer": [0, 1, 2], "explanation": "A perfect local fit is the advantage of adaptation."}, {"q": "Fill in: « The company ______ a 51% stake in the local firm. »", "options": ["acquired", "franchised", "allied", "greenfielded"], "answer": [0], "explanation": "to acquire a stake."}], "open_questions": [{"question": "Explain the difference between a joint venture and a strategic alliance, with examples.", "answer": "A **joint venture** creates a **new company jointly owned** by the partners, who share capital, risks and profits (e.g. a foreign carmaker and a Chinese partner creating a jointly owned manufacturing company). A **strategic alliance** is a **cooperation agreement** between independent companies **without a new entity** (e.g. airlines in Star Alliance sharing flights and lounges). The JV is deeper and harder to exit."}, {"question": "Greenfield or acquisition: what are the pros and cons of each?", "answer": "**Greenfield**: + full control, modern facilities designed to your standards, brand consistency; − slow, expensive, high risk, no local network at the start.\n**Acquisition (brownfield)**: + fast market access, existing customers, staff, brand and distribution; − high price, integration problems, cultural clashes, hidden liabilities."}], "exercises": [{"title": "Identify the entry strategy", "statement": "Name the entry mode: (a) IKEA opens its own store built from scratch in Hyderabad; (b) a hotel chain lets local owners run hotels under its brand; (c) a Western bank buys 60% of a local bank; (d) two tech firms agree to share R&D without merging.", "questions": ["Give the mode and justify in one sentence."], "answer": "(a) **Greenfield direct investment**: a new store built from scratch and wholly owned.\n(b) **Franchising** (or management contract): local owners use the brand and model and pay fees.\n(c) **Acquisition** (brownfield): purchase of a controlling stake in an existing company.\n(d) **Strategic alliance**: cooperation without creating a new company."}], "resources": [{"label": "Reading — How do businesses adjust their marketing mix for international audiences? (TutorChase)", "url": "https://www.tutorchase.com/answers/ib/business-management/how-do-businesses-adjust-their-marketing-mix-for-international-audiences"}]}, {"id": "eng-reader", "title": "Reader — Women in Business (Penguin Readers)", "subtitle": "Five businesswomen: Coco Chanel, Hanae Mori, Anita Roddick, Oprah Winfrey, Madonna + business wordlist", "date": "", "status": "vu", "sources": ["-women-in-business-penguin-readers-l4-3-pdf-free.pdf"], "objectives": ["Know the key facts and business lessons of each of the five stories.", "Learn the book's business wordlist (definitions in English).", "Talk about entrepreneurs in English: past simple, figures, business verbs."], "summary": [{"title": "1. The big idea of the book", "body": "In the 20th century, top business jobs were almost always held by men. The book tells the stories of **five women from very different backgrounds** who reached the top by **creating completely new kinds of companies**. They had to break through the **glass ceiling**, the invisible barrier that stops women from reaching top positions.\n\n*Summary written in our own words; read the book for the full stories.*"}, {"title": "2. Coco Chanel — fashion that changed women's lives", "body": "| Date | Key fact |\n|---|---|\n| **1910** | Opens her first **hat shop in Paris** at 27, with money lent by a rich friend, **Boy Capel** |\n| **World War I** | Women work outside the home and need **practical clothes**, which Chanel designs |\n| **1920s** | Creates **Chanel No. 5**, the most successful perfume of the century |\n| **1930s** | Hollywood producer **Sam Goldwyn** pays her **$1 million** to dress film stars, but her style is too simple for Hollywood and he doesn't use her again. Her business employs about **4,000 people** |\n| **WWII and after** | Fights **Pierre Wertheimer** for control of Chanel No. 5; lives quietly in **Switzerland** for about eight years, rich from the perfume |\n| **5 February 1954** | Returns to fashion at **70**. The first show is criticised, but she keeps going and succeeds again |\n\n**Business lesson**: fashion is about **how people live**. A strong brand image (the same square bottle of No. 5) lasts for decades."}, {"title": "3. Hanae Mori — East meets West", "body": "- Married to a rich businessman, she was not satisfied with life as a housewife and started making clothes.\n- In the **1950s**, her most important customers were **Japanese film stars**: she designed costumes for films.\n- **1961**: she meets **Coco Chanel** in Paris, an important inspiration.\n- Her style **mixes ideas from East and West**.\n- She builds an **international operation**: **over 70 shops in Japan**, **3 in Paris**, and sales points around the world. Like Chanel, she launches her **own perfume**, which benefits from the image of her clothes (brand extension).\n\n**Business lesson**: a designer brand can expand beyond clothes thanks to its **image**."}, {"title": "4. Anita Roddick — The Body Shop: business with values", "body": "| Date | Key fact |\n|---|---|\n| **1976** | Opens the first **Body Shop in Brighton** (England) with a **£4,000 bank loan**: natural cosmetics, cheap, in **re-usable bottles** |\n| Second shop | The bank refuses another loan; **Ian McGlinn** gives **£4,000 in exchange for half the business** |\n| **1984** | Shares are sold on the **London Stock Exchange**; the price rises from **£0.95 to £1.65** on the first day. At **42**, Anita is a **millionaire** |\n| 1980s | Growing concern for the environment helps natural cosmetics |\n| Brazil | Works with the **Kayapo** people, who sell plant oil to The Body Shop at a **fair price** |\n| **1994** | Media **criticise** the company for not doing enough for the environment; the share price falls |\n\n**Business lesson**: business is not just about making money; it can **help make the world better** (fair trade, environment)."}, {"title": "5. Oprah Winfrey — control is the key to success", "body": "- Early 1970s: **newsreader** for small stations, then in **Baltimore**. Not a success: she became **too emotionally involved** in the stories. She moves to a morning **talk show**, *People Are Talking*, and becomes a star.\n- **1983–84**: hired by a **Chicago** station for *A.M. Chicago* (**$200,000 a year**); an immediate hit.\n- Plays in Spielberg's film ***The Color Purple***; the station gives her a break to do it.\n- She **negotiates**: the show is renamed ***The Oprah Winfrey Show*** and she gets a **share of the money from sales to other stations**. When 138 stations buy it, her earnings jump from **$200,000 to $30 million a year**.\n- **1986**: creates **Harpo Productions** (*Harpo* = *Oprah* backwards); **1988**: Harpo **buys the show** and her own studios.\n\n**Business lesson**: **owning and controlling** your product creates value."}, {"title": "6. Madonna — the material girl as CEO", "body": "- **1978**: arrives in New York at 19 with **$35**; does many jobs and learns music.\n- **1982**: first recording contract (*Everybody*). She understands that **MTV** (launched **1981**) makes **videos** essential, and convinces top manager **Freddy Demann** by performing in his office.\n- Mid-1980s: global star (*Holiday*, *Material Girl*), films, constant **publicity**.\n- **1992**: a **$60 million deal with Time Warner** creates her own company, **Maverick** (records, videos, TV, books), which gives her **complete control** over her products.\n- Maverick finds new talent: **Alanis Morissette** (1995, over 27 million records sold). In **1999**, Maverick's sales reached about **$750 million**.\n\n**Business lesson**: careful **planning**, smart use of **publicity** and **control** of her own brand."}, {"title": "7. Business wordlist (from the book)", "body": "| Word | Meaning |\n|---|---|\n| **accountant** | a person who reports the financial health of an organisation |\n| **branch** | a part of a large organisation, often a store or an office |\n| **capital** | money that helps to build a new business |\n| **compete** | to try to win |\n| **consultant** | a person who gives business advice |\n| **contract** | a formal legal agreement |\n| **corporation** | a big company |\n| **deal** | to buy and sell (noun: a business agreement) |\n| **expand** | to increase or grow |\n| **finances** | the amount of money that a business or person has |\n| **industry** | a type of business |\n| **loss** | the amount of money that a business loses |\n| **negotiate** | to try to come to an agreement with another person |\n| **objective** | a business aim |\n| **partnership** | a business owned by two or more people |\n| **profit** | money that is made in business |\n| **risk** | the danger of losing money |\n| **sack** | to tell someone to leave their job |\n| **share** | a piece of paper that says you own part of a company |\n| **stock exchange** | a place where people buy and sell shares |"}], "key_points": ["Chanel: hat shop in Paris (1910), Chanel No. 5, Hollywood failure with Goldwyn, comeback at 70 (1954).", "Hanae Mori: met Chanel in 1961, costumes for Japanese films, East-West style, 70+ shops in Japan, own perfume.", "Anita Roddick: The Body Shop, Brighton 1976, £4,000 loan; McGlinn's £4,000 for half; stock exchange 1984 → millionaire at 42; Kayapo; criticism in 1994.", "Oprah: failed newsreader, star of talk shows; negotiated a share of sales ($200,000 → $30 million a year); Harpo Productions (1986).", "Madonna: arrived in New York with $35 (1978), MTV and videos, Maverick (1992, $60 million deal with Time Warner), Alanis Morissette.", "Glass ceiling = the invisible barrier preventing women from reaching top jobs.", "Wordlist: capital, profit, loss, share, stock exchange, partnership, negotiate, expand, contract, deal, branch, sack."], "traps": ["Profit (money made) ≠ loss (money lost) ≠ capital (money to build a business).", "« To sack » someone = to fire them (licencier), not to put them in a bag!", "A branch is part of a big organisation (une succursale), not a tree branch, in this context.", "Harpo is Oprah spelled backwards."], "glossary": [{"term": "Glass ceiling", "definition": "An invisible barrier that stops women (or minorities) from reaching top positions."}, {"term": "Accountant", "definition": "A person who reports the financial health of an organisation. FR : comptable."}, {"term": "Branch", "definition": "A part of a large organisation, often a store or an office. FR : succursale, agence."}, {"term": "Capital", "definition": "Money that helps to build a new business."}, {"term": "Consultant", "definition": "A person who gives business advice."}, {"term": "Contract", "definition": "A formal legal agreement."}, {"term": "Corporation", "definition": "A big company."}, {"term": "Expand", "definition": "To increase or grow."}, {"term": "Loss", "definition": "The amount of money that a business loses. FR : perte."}, {"term": "Negotiate", "definition": "To try to come to an agreement with another person."}, {"term": "Objective", "definition": "A business aim."}, {"term": "Partnership", "definition": "A business that is owned by two or more people."}, {"term": "Profit", "definition": "Money that is made in business. FR : bénéfice."}, {"term": "Risk", "definition": "The danger of losing money."}, {"term": "Sack", "definition": "To tell someone to leave their job. FR : licencier, renvoyer."}, {"term": "Share", "definition": "A piece of paper that says you own part of a company. FR : action."}, {"term": "Stock exchange", "definition": "A place where people buy and sell shares. FR : la Bourse."}], "qcb": [{"q": "Coco Chanel opened her first shop, a hat shop, in Paris in 1910.", "answer": true, "explanation": "She was 27, with money lent by Boy Capel."}, {"q": "Sam Goldwyn kept using Chanel's designs in all his later films.", "answer": false, "explanation": "Her style was too simple for Hollywood; he decided not to use her clothes again."}, {"q": "Coco Chanel returned to fashion at the age of seventy.", "answer": true, "explanation": "Her comeback show took place on 5 February 1954."}, {"q": "Hanae Mori met Coco Chanel in 1961.", "answer": true, "explanation": "An important meeting in her life and career."}, {"q": "Hanae Mori's style mixes ideas from East and West.", "answer": true, "explanation": "That's what makes her style special."}, {"q": "Anita Roddick opened the first Body Shop in London.", "answer": false, "explanation": "In Brighton, in 1976."}, {"q": "Ian McGlinn gave Anita £4,000 in exchange for half of the business.", "answer": true, "explanation": "The bank had refused a second loan."}, {"q": "Anita Roddick became a millionaire when The Body Shop's shares went on sale in 1984.", "answer": true, "explanation": "At 42, her shares were worth £1.5 million."}, {"q": "Oprah Winfrey was a very successful newsreader in Baltimore.", "answer": false, "explanation": "She became too emotionally involved in the news; she succeeded on talk shows instead."}, {"q": "« Harpo » is « Oprah » spelled backwards.", "answer": true, "explanation": "Harpo Productions was created in 1986."}, {"q": "Madonna's company Maverick was created through a deal with Time Warner in 1992.", "answer": true, "explanation": "A $60 million deal giving her complete control."}, {"q": "« To sack » someone means to hire them.", "answer": false, "explanation": "It means to tell someone to leave their job (to fire)."}, {"q": "A partnership is a business owned by two or more people.", "answer": true, "explanation": "Definition from the business wordlist."}], "qcm": [{"q": "Why was World War I good for Chanel's business?", "options": ["Women needed practical clothes for a new active, working life", "Men bought hats for their wives", "Hollywood paid her $1 million", "She sold weapons"], "answer": [0], "explanation": "Women worked outside the home and needed new clothes."}, {"q": "Which perfume made Chanel extremely rich?", "options": ["Chanel No. 5", "Chanel No. 19", "Mademoiselle", "Coco Noir"], "answer": [0], "explanation": "The most successful perfume of the past hundred years."}, {"q": "Who were Hanae Mori's most important customers in the 1950s?", "options": ["Japanese film stars", "American politicians", "Body Shop customers", "MTV presenters"], "answer": [0], "explanation": "She designed costumes for Japanese films."}, {"q": "What was different about The Body Shop's products? (several answers)", "options": ["Natural ingredients", "Cheap prices", "Re-usable bottles", "Luxury packaging"], "answer": [0, 1, 2], "explanation": "Natural, cheap and in re-usable bottles."}, {"q": "How did The Body Shop help the Kayapo people in Brazil?", "options": ["By buying plant oil from them at a fair price", "By opening a shop in their village", "By hiring them in Brighton", "By giving them shares"], "answer": [0], "explanation": "Money for health and education, and a natural product for The Body Shop."}, {"q": "Why did Oprah's earnings jump from $200,000 to $30 million a year?", "options": ["She negotiated a share of the money from sales of her show to other stations", "She won the lottery", "She sold Harpo", "She became a newsreader again"], "answer": [0], "explanation": "138 stations bought The Oprah Winfrey Show."}, {"q": "What lesson did Oprah learn from this negotiation?", "options": ["Control is the key to success", "Price is everything", "Never negotiate", "Television is dying"], "answer": [0], "explanation": "She then created Harpo Productions and bought her own show."}, {"q": "Which new medium helped Madonna become a global star in the early 1980s?", "options": ["MTV and music videos", "Radio only", "Newspapers", "The Internet"], "answer": [0], "explanation": "MTV started in 1981; a good song needed a good video."}, {"q": "What could Maverick produce? (several answers)", "options": ["Records", "Videos", "Books", "Cars"], "answer": [0, 1, 2], "explanation": "Also TV programmes."}, {"q": "Match the definition « a place where people buy and sell shares »:", "options": ["Stock exchange", "Branch", "Partnership", "Corporation"], "answer": [0], "explanation": "FR : la Bourse."}, {"q": "« Money that helps to build a new business » is:", "options": ["Capital", "Loss", "Profit", "Risk"], "answer": [0], "explanation": "Capital = start-up money."}, {"q": "Which words are about money? (several answers)", "options": ["Profit", "Loss", "Finances", "Consultant"], "answer": [0, 1, 2], "explanation": "A consultant is a person who gives advice."}, {"q": "Fill in: « Oprah decided to ______ with the TV station. »", "options": ["negotiate", "sack", "expand", "branch"], "answer": [0], "explanation": "to negotiate = to try to reach an agreement."}], "open_questions": [{"question": "Write a one- or two-line description of the power of each businesswoman in the book.", "answer": "*Model answers:*\n- **Coco Chanel** changed the way women dressed and built a brand, Chanel No. 5, that still sells today.\n- **Hanae Mori** created an international fashion business that mixes Japanese and Western styles.\n- **Anita Roddick** proved that a company can make profits while protecting the environment and paying fair prices.\n- **Oprah Winfrey** gained control of her own TV show and built a media company, Harpo Productions.\n- **Madonna** used publicity and control of her image to build her own entertainment company, Maverick."}, {"question": "Compare Coco Chanel and Hanae Mori: how are they similar and different?", "answer": "**Similarities**: both are fashion designers who built **international brands** and launched **perfumes** using the image of their clothes; both stayed active at an advanced age.\n\n**Differences**: Chanel came from an **ordinary family** and had **no money** (she borrowed from Boy Capel), while Mori was married to a **rich businessman**. Chanel's style was **French and simple**; Mori's style **mixes East and West**. Mori was **inspired by Chanel** after meeting her in 1961."}, {"question": "Explain how a person with a famous name can use it to sell products. Use two examples from the book.", "answer": "A famous name brings **instant brand awareness** and **trust**, so new products sell more easily.\n\n- **Coco Chanel**: her name on a perfume (Chanel No. 5) linked it to the elegant image of her clothes.\n- **Oprah Winfrey**: her name on the show (*The Oprah Winfrey Show*) and her company (Harpo) let her sell the programme to 138 stations.\n- **Madonna**: Maverick used her fame to launch books, records and new artists.\n\n**Conclusion**: a famous name is a **brand**; controlling it creates value."}], "exercises": [{"title": "Business lessons for your Global Launch Project", "statement": "Choose one woman from the book and explain in English what your project company could learn from her.", "questions": ["Which strategy did she use?", "Which target words from the program can you reuse?"], "answer": "*Model (Anita Roddick)*: She **positioned** The Body Shop as an ethical brand with natural products and fair trade. She **expanded** with outside **capital** (a **partnership** with Ian McGlinn) and then sold **shares** on the **stock exchange**. A company entering a new market can learn that **values** can be a strong **positioning** and help build **brand awareness**.\n\nReusable target words: *positioning, brand awareness, product adaptation, profit margin, strategic objectives*."}], "resources": []}, {"id": "eng-03", "title": "Class 4 — Marketing Strategy (à venir)", "subtitle": "Positioning, product adaptation, pricing, promotion mix, brand awareness, distribution, segmentation", "date": "23/11/2026", "status": "a_venir", "sources": ["M1CM_2026-2027_Program.xlsx", "Global_Launch_Project_Guidelines (Part 3)"], "objectives": ["Prepare in advance: master the seven Marketing Strategy keywords.", "Answer project questions 10–16 for your company.", "Prepare for Book test 1 (same date)."], "summary": [{"title": "1. Target vocabulary — Marketing Strategy", "body": "| Term | Definition | FR |\n|---|---|---|\n| **Positioning** | The place a brand wants to occupy in customers' minds compared with competitors | positionnement |\n| **Product adaptation** | Changing a product to fit local tastes, needs or regulations | adaptation du produit |\n| **Pricing strategy** | The method used to set prices (premium, penetration, skimming, competitive) | stratégie de prix |\n| **Promotion mix** | The combination of advertising, PR, sales promotion, digital, events, personal selling | mix promotionnel / communication |\n| **Brand awareness** | How well customers know and recognise a brand | notoriété |\n| **Distribution channel** | The route a product takes to reach customers (own stores, retailers, online, marketplaces) | canal de distribution |\n| **Market segmentation** | Dividing a market into groups of customers with similar characteristics | segmentation |"}, {"title": "2. Pricing strategies to know", "body": "| Strategy | Idea | Example |\n|---|---|---|\n| **Premium pricing** | High price to signal quality and status | Starbucks, Apple |\n| **Penetration pricing** | Low price at launch to win market share fast | A new streaming service at €1 for the first month |\n| **Price skimming** | High launch price, then lowered over time | New smartphones |\n| **Competitive pricing** | Price aligned with competitors | Supermarkets |"}, {"title": "3. Project questions — Part 3", "body": "10. How did the company **position** itself? 11. What **product adaptation**? 12. What **pricing strategy**? 13. What made up its **promotion mix**? 14. How did it build **brand awareness**? 15. Which **distribution channel(s)**? 16. How did it **segment** the market?"}, {"title": "4. Reading for next class — Global supply chain management tips (Travelers)", "body": "Typical themes of this kind of article, useful for Part 4: **map** your supply chain, **diversify suppliers** to reduce dependency, assess **risks** (geopolitical, natural disasters, transport disruption), know **customs and trade regulations**, use **technology for visibility**, communicate with partners, protect cargo with **insurance**, keep **buffer stock**.\n\n*Read the original article: this is a general preparation summary.*"}], "key_points": ["Positioning = place in the customer's mind versus competitors.", "Product adaptation = local tastes, needs, regulations.", "Pricing: premium, penetration, skimming, competitive.", "Promotion mix = advertising, PR, sales promotion, digital, events, personal selling.", "Brand awareness = recognition of the brand.", "Distribution channel = the route to the customer.", "Segmentation divides; targeting chooses; positioning places."], "traps": ["Brand awareness (notoriété) ≠ brand image (perception, qualité de l'image).", "Penetration pricing (low price at launch) ≠ skimming (high price at launch)."], "glossary": [{"term": "Positioning", "definition": "The place a brand occupies in consumers' minds relative to competitors."}, {"term": "Product adaptation", "definition": "Modifying a product for local tastes, needs or regulations."}, {"term": "Pricing strategy", "definition": "The approach used to set prices (premium, penetration, skimming, competitive)."}, {"term": "Promotion mix", "definition": "The combination of communication tools: advertising, PR, sales promotion, digital, events, personal selling."}, {"term": "Brand awareness", "definition": "The extent to which consumers recognise and remember a brand. FR : notoriété."}, {"term": "Distribution channel", "definition": "The path through which a product reaches the final customer."}, {"term": "Market segmentation", "definition": "Dividing a market into distinct groups of buyers with similar needs or characteristics."}, {"term": "Penetration pricing", "definition": "Setting a low initial price to gain market share quickly."}, {"term": "Price skimming", "definition": "Setting a high initial price, then lowering it over time."}], "qcb": [{"q": "Penetration pricing means launching a product at a high price.", "answer": false, "explanation": "Penetration = low price at launch. High price at launch = skimming."}, {"q": "Brand awareness measures how well customers recognise a brand.", "answer": true, "explanation": "FR : notoriété."}, {"q": "The promotion mix includes advertising, PR and events.", "answer": true, "explanation": "Plus sales promotion, digital and personal selling."}, {"q": "Positioning is the same thing as market segmentation.", "answer": false, "explanation": "Segmentation divides the market; positioning defines the brand's place in customers' minds."}, {"q": "Selling through an online marketplace is a distribution channel.", "answer": true, "explanation": "A route to reach customers."}, {"q": "Starbucks uses a premium pricing strategy.", "answer": true, "explanation": "High prices that signal quality and experience."}, {"q": "Product adaptation can be required by local regulations.", "answer": true, "explanation": "E.g. labelling or ingredient rules."}, {"q": "Sponsoring a local football club is part of the distribution strategy.", "answer": false, "explanation": "It's part of the promotion mix (sponsorship, PR)."}], "qcm": [{"q": "« Netflix produced Korean dramas for the local market. » This illustrates:", "options": ["Product adaptation", "Penetration pricing", "Outsourcing", "Market size"], "answer": [0], "explanation": "Content adapted to local tastes."}, {"q": "Which are part of the promotion mix? (several answers)", "options": ["TV advertising", "Influencer campaigns", "Press releases (PR)", "Warehouse location"], "answer": [0, 1, 2], "explanation": "Warehouse location relates to logistics."}, {"q": "A company launches at a low price to win customers quickly. Its strategy is:", "options": ["Premium pricing", "Price skimming", "Penetration pricing", "Cost-plus pricing"], "answer": [2], "explanation": "Low entry price to gain share."}, {"q": "« IKEA wants to be seen as affordable, Scandinavian and family-friendly. » This is its:", "options": ["Positioning", "Distribution channel", "Market share", "Supply chain"], "answer": [0], "explanation": "The image it wants in customers' minds."}, {"q": "Which criteria can be used for market segmentation? (several answers)", "options": ["Age", "Income", "Lifestyle", "The company's tax rate"], "answer": [0, 1, 2], "explanation": "Demographic, socio-economic, psychographic criteria."}, {"q": "Fill in: « The campaign helped ______ brand awareness among students. »", "options": ["raise", "rise", "arise", "grow up"], "answer": [0], "explanation": "to raise (transitive) awareness; « rise » is intransitive."}, {"q": "Which is a distribution channel?", "options": ["A flagship store", "A TV spot", "A press release", "A logo"], "answer": [0], "explanation": "A physical point of sale."}, {"q": "High launch price for a new smartphone, then lowered months later:", "options": ["Penetration", "Skimming", "Competitive pricing", "Discounting"], "answer": [1], "explanation": "Price skimming."}], "open_questions": [{"question": "Describe the marketing strategy of a company entering a foreign market, using at least five target words.", "answer": "*Model (Starbucks in China)*: Starbucks used **premium positioning** as a « third place » between home and work. It made **product adaptations** (tea-based drinks, mooncakes, local flavours) and kept a **premium pricing strategy**. Its **promotion mix** relied on store design, digital partnerships (Alibaba, WeChat) and social media to build **brand awareness**. Its main **distribution channels** were company-operated stores plus delivery apps. It **segmented** the market by income and lifestyle, targeting young urban professionals."}], "exercises": [{"title": "Apply Part 3 to your company", "statement": "For your project company, answer questions 10–16 in English, one or two sentences each.", "questions": ["positioning", "product adaptation", "pricing strategy", "promotion mix", "brand awareness", "distribution channel", "market segmentation"], "answer": "Use the model in the open question above. Each answer must be backed by a **source with a link**, and remember: keywords only on slides."}], "resources": [{"label": "Reading — Global Supply Chain Management Tips (Travelers)", "url": "https://www.travelers.com/resources/supply-chain-management/global-supply-chain-management-tips"}]}, {"id": "eng-04", "title": "Class 7 — Operations & Supply Chain (à venir, S2)", "subtitle": "Logistics, supply chain, local management, outsourcing, quality control, economies of scale", "date": "03/03/2027", "status": "a_venir", "sources": ["M1CM_2026-2027_Program.xlsx", "Global_Launch_Project_Guidelines (Part 4)"], "objectives": ["Prepare in advance: master the six Operations & Supply Chain keywords.", "Answer project questions 17–22.", "Understand break-even analysis (reading for the next class)."], "summary": [{"title": "1. Target vocabulary — Operations & Supply Chain", "body": "| Term | Definition | FR |\n|---|---|---|\n| **Logistics** | Planning and managing the movement and storage of goods | logistique |\n| **Supply chain** | The whole network from raw materials to the final customer (suppliers, factories, warehouses, transport, retailers) | chaîne d'approvisionnement |\n| **Local management** | Managers hired in the host country rather than sent from headquarters (expatriates) | management local |\n| **Outsourcing** | Contracting another company to perform part of your operations | externalisation / sous-traitance |\n| **Quality control** | Checking that products or services meet standards | contrôle qualité |\n| **Economies of scale** | Lower cost per unit as production volume increases | économies d'échelle |"}, {"title": "2. Project questions — Part 4", "body": "17. How did the company manage **logistics**? 18. Was the **supply chain** local, regional or international? 19. **Local management** or managers from **headquarters**? 20. Did it **outsource** anything? What, and why? 21. How did it ensure **quality control** in a new location? 22. Did the expansion create **economies of scale**? How?"}, {"title": "3. Reading for next class — Break-even analysis (Visa)", "body": "**Break-even point (BEP)**: the level of sales at which **total revenue = total costs**, so profit = 0.\n\n- **BEP (units)** = Fixed costs ÷ (Price per unit − Variable cost per unit)\n- (Price − Variable cost) = **contribution margin** per unit\n\n*Example*: fixed costs €100,000; price €50; variable cost €30 → contribution €20 → **BEP = 5,000 units**."}], "key_points": ["Logistics = movement and storage of goods; supply chain = the whole network.", "Local management vs expatriates from headquarters.", "Outsourcing = contracting out part of operations.", "Quality control = checking standards.", "Economies of scale = lower unit cost with higher volume.", "BEP (units) = fixed costs ÷ (price − variable cost)."], "traps": ["Logistics is only one part of the supply chain.", "Outsourcing ≠ offshoring: offshoring moves activities abroad (it can be in-house)."], "glossary": [{"term": "Logistics", "definition": "Managing the flow and storage of goods from origin to destination."}, {"term": "Supply chain", "definition": "The full network of organisations and activities involved in producing and delivering a product."}, {"term": "Local management", "definition": "Hiring managers from the host country."}, {"term": "Outsourcing", "definition": "Contracting an external company to perform activities. FR : externalisation."}, {"term": "Offshoring", "definition": "Moving activities to another country (in-house or outsourced). FR : délocalisation."}, {"term": "Quality control", "definition": "Processes ensuring products meet defined standards."}, {"term": "Economies of scale", "definition": "Reduction in cost per unit resulting from increased production."}, {"term": "Headquarters (HQ)", "definition": "The main office of a company. FR : siège social."}, {"term": "Contribution margin", "definition": "Price per unit minus variable cost per unit."}], "qcb": [{"q": "Economies of scale mean that the cost per unit falls when production increases.", "answer": true, "explanation": "Fixed costs are spread over more units."}, {"q": "Outsourcing means doing everything in-house.", "answer": false, "explanation": "It means contracting another company."}, {"q": "The supply chain only includes transport.", "answer": false, "explanation": "It includes suppliers, production, warehouses, transport and retailers."}, {"q": "Hiring managers in the host country is called local management.", "answer": true, "explanation": "As opposed to expatriates from headquarters."}, {"q": "At the break-even point, profit equals zero.", "answer": true, "explanation": "Total revenue = total costs."}, {"q": "Fixed costs €60,000, price €40, variable cost €25 → BEP = 4,000 units.", "answer": true, "explanation": "60,000 ÷ (40 − 25) = 60,000 ÷ 15 = 4,000."}], "qcm": [{"q": "IKEA sources part of its products from Indian suppliers. Its supply chain is partly:", "options": ["Local", "Outsourced to France", "Non-existent", "Greenfield"], "answer": [0], "explanation": "Local sourcing."}, {"q": "Which are examples of outsourcing? (several answers)", "options": ["Hiring a logistics company to deliver goods", "Using an external call centre", "Contracting a local factory to produce goods", "Opening your own warehouse"], "answer": [0, 1, 2], "explanation": "Opening your own warehouse is in-house."}, {"q": "Fixed costs €200,000; price €100; variable cost €60. BEP =", "options": ["2,000 units", "5,000 units", "3,333 units", "20,000 units"], "answer": [1], "explanation": "200,000 ÷ 40 = 5,000."}, {"q": "Which help ensure quality control abroad? (several answers)", "options": ["Standard operating procedures", "Regular audits and inspections", "Training local staff", "Ignoring customer complaints"], "answer": [0, 1, 2], "explanation": "Standards, checks and training."}, {"q": "« Opening 100 stores lowered the cost per coffee. » This shows:", "options": ["Economies of scale", "Entry barriers", "Penetration pricing", "Brand awareness"], "answer": [0], "explanation": "Lower unit cost with volume."}, {"q": "Choose the correct word: « The company relies on a complex global ______ chain. »", "options": ["supply", "supplies", "supplier", "supplying"], "answer": [0], "explanation": "Supply chain."}], "open_questions": [{"question": "Explain the difference between logistics and supply chain.", "answer": "**Logistics** is the planning and management of the **movement and storage** of goods (transport, warehousing, delivery). The **supply chain** is the **whole network**, from raw material suppliers to production, distribution and the final customer. Logistics is **one part** of supply chain management."}], "exercises": [{"title": "Break-even calculation", "statement": "A coffee chain opens in a new city. Monthly fixed costs: €45,000. Average price per drink: €5. Variable cost per drink: €2.", "questions": ["Calculate the break-even point in drinks per month.", "How many drinks per day (30 days)?", "Explain the result in English."], "answer": "1. Contribution margin = 5 − 2 = **€3**. BEP = 45,000 ÷ 3 = **15,000 drinks per month**.\n2. 15,000 ÷ 30 = **500 drinks per day**.\n3. « The store needs to sell **500 drinks a day to break even**. Above this level it makes a profit; below it, it makes a loss. »"}], "resources": [{"label": "Reading — Break-Even Analysis (Practical Business Skills, Visa)", "url": "https://pbsorg.siuat.visa.com/en/resources/calculators/breakeven-analysis.html"}]}, {"id": "eng-05", "title": "Classes 8–9 — Financial Objectives & Conclusion (à venir, S2)", "subtitle": "Break-even point, ROI, revenue forecast, profit margin, strategic objectives, cash flow + Starbucks case", "date": "24/03/2027", "status": "a_venir", "sources": ["M1CM_2026-2027_Program.xlsx", "Global_Launch_Project_Guidelines (Part 5)"], "objectives": ["Prepare in advance: master the six financial keywords and their formulas.", "Answer project questions 23–25 and judge whether the expansion succeeded.", "Understand Starbucks' international growth model (reading)."], "summary": [{"title": "1. Target vocabulary — Financial Objectives", "body": "| Term | Definition / formula | FR |\n|---|---|---|\n| **Break-even point** | Sales level where revenue = costs. Units = fixed costs ÷ (price − variable cost) | seuil de rentabilité / point mort |\n| **Return on investment (ROI)** | (Gain − Cost of investment) ÷ Cost of investment × 100 | retour sur investissement |\n| **Revenue forecast** | Prediction of future sales income | prévision de chiffre d'affaires |\n| **Profit margin** | Profit ÷ Revenue × 100 | marge bénéficiaire |\n| **Strategic objectives** | Long-term goals (market share, number of stores, growth targets) | objectifs stratégiques |\n| **Cash flow** | Money coming in and going out of a business over a period | flux de trésorerie |\n\n⚠️ **Revenue** (chiffre d'affaires) ≠ **profit** (bénéfice)."}, {"title": "2. Project questions — Part 5", "body": "23. What **financial objectives** did the company publicly state (growth targets, investment amount, timeline)?\n24. Is there public information about **break-even, ROI, revenue forecast, profit margin, cash flow**? Report what exists, even if partial.\n25. **Was the expansion successful?** Justify with evidence.\n\nExact figures are rarely public: base your judgement on **qualitative evidence** too (market response, press coverage, continued operations, expansion or withdrawal)."}, {"title": "3. Reading — Starbucks' International Growth Blueprint (Think Insights)", "body": "Key ideas to look for while reading:\n\n- **Multi-domestic framework**: strategy adapted country by country rather than one global approach.\n- **Market entry models**: a mix of **company-owned stores**, **licensing** and **joint ventures / co-owned stores** depending on the market.\n- **Cultural adaptation as a competitive advantage**: local menus (e.g. tea-based drinks in Asia), store design, the « third place » concept.\n- **Premium positioning without compromise**: high prices and the experience maintained abroad.\n- **Phased expansion over decades**: test, learn, then scale.\n- **Current challenges**: intense local competition (e.g. Luckin Coffee in China), price pressure.\n\n*Preparation summary: read Parts 1 and 2 of the article as assigned.*"}], "key_points": ["ROI = (gain − cost) ÷ cost × 100.", "Profit margin = profit ÷ revenue × 100.", "Break-even: revenue = costs, profit = 0.", "Cash flow = cash in − cash out over a period.", "Revenue ≠ profit.", "Judge the success of the expansion with evidence, qualitative if numbers are missing.", "Starbucks: multi-domestic strategy, mixed entry models, cultural adaptation, premium positioning, phased expansion."], "traps": ["Revenue (turnover / chiffre d'affaires) is not profit.", "A profitable company can still have cash-flow problems (timing of payments).", "« Benefit » does not mean accounting profit."], "glossary": [{"term": "Break-even point", "definition": "Point where total revenue equals total costs. FR : point mort."}, {"term": "Return on investment (ROI)", "definition": "(Gain − cost) ÷ cost × 100: measures the profitability of an investment."}, {"term": "Revenue forecast", "definition": "Estimate of future sales revenue."}, {"term": "Profit margin", "definition": "Profit as a percentage of revenue."}, {"term": "Strategic objectives", "definition": "Long-term goals that guide a company's decisions."}, {"term": "Cash flow", "definition": "Net amount of cash moving into and out of a business."}, {"term": "Revenue / turnover", "definition": "Total income from sales. FR : chiffre d'affaires."}, {"term": "Multi-domestic strategy", "definition": "International strategy adapting products and marketing to each national market."}], "qcb": [{"q": "Revenue and profit mean the same thing.", "answer": false, "explanation": "Revenue = total sales income; profit = revenue minus costs."}, {"q": "An investment of €100,000 that generates a gain of €130,000 has an ROI of 30%.", "answer": true, "explanation": "(130,000 − 100,000) ÷ 100,000 × 100 = 30%."}, {"q": "Profit margin = profit ÷ revenue × 100.", "answer": true, "explanation": "Correct formula."}, {"q": "A company with positive profit can never have cash-flow problems.", "answer": false, "explanation": "Cash can be short if customers pay late or investment is heavy."}, {"q": "If exact financial figures are not public, you can judge the expansion on qualitative evidence.", "answer": true, "explanation": "Market response, press, continued operations, expansion or withdrawal."}, {"q": "A multi-domestic strategy uses exactly the same approach in every country.", "answer": false, "explanation": "It adapts to each national market."}], "qcm": [{"q": "Revenue €2 m, profit €300,000. Profit margin =", "options": ["6%", "15%", "30%", "66%"], "answer": [1], "explanation": "300,000 ÷ 2,000,000 × 100 = 15%."}, {"q": "Investment €50,000, gain €60,000. ROI =", "options": ["10%", "20%", "120%", "83%"], "answer": [1], "explanation": "(60,000 − 50,000) ÷ 50,000 = 20%."}, {"q": "« We aim to open 1,000 stores in China by 2030. » This is a:", "options": ["Strategic objective", "Cash flow", "Profit margin", "Break-even point"], "answer": [0], "explanation": "A long-term growth target."}, {"q": "Which evidence can show that an expansion was successful? (several answers)", "options": ["Continued operations and new store openings", "Growing market share", "Positive press coverage and sales growth", "Withdrawal from the market"], "answer": [0, 1, 2], "explanation": "Withdrawal suggests failure."}, {"q": "Which entry models are associated with Starbucks' international growth? (several answers)", "options": ["Company-owned stores", "Licensing", "Joint ventures", "Exporting coffee machines only"], "answer": [0, 1, 2], "explanation": "A mix depending on the market."}, {"q": "Fill in: « The company expects to ______ even within three years. »", "options": ["break", "make", "do", "reach"], "answer": [0], "explanation": "to break even = atteindre le point mort."}], "open_questions": [{"question": "Was your company's expansion successful? Structure your answer (model).", "answer": "**Structure**: (1) recall the stated **objectives**; (2) present **quantitative evidence** (revenue growth, number of stores, market share, any ROI or break-even data); (3) add **qualitative evidence** (press, customer response, competition, continued investment or withdrawal); (4) give a **nuanced opinion**: « Overall, we believe the expansion was **largely successful** because…, although… »\n\nUseful phrases: *according to*, *the figures suggest that*, *on the other hand*, *to sum up*."}], "exercises": [{"title": "Financial calculations", "statement": "A retailer invests €400,000 in a new country. Year 1: revenue €1.2 m, total costs €1.05 m.", "questions": ["Profit and profit margin?", "If the investment generates €480,000 in total gains, what is the ROI?", "Write one sentence in English summarising the results."], "answer": "1. Profit = 1,200,000 − 1,050,000 = **€150,000**; margin = 150,000 ÷ 1,200,000 = **12.5%**.\n2. ROI = (480,000 − 400,000) ÷ 400,000 = **20%**.\n3. « In its first year, the company made a profit of €150,000, a 12.5% profit margin, and the investment delivered a 20% return. »"}], "resources": [{"label": "Reading — Starbucks' International Growth Blueprint (Think Insights)", "url": "https://thinkinsights.net/print/pdf/node/30188"}]}]}, {"id": "strategie-omnicanale", "order": 4, "folder": "04. STRASTREGIE OMNICALE", "title": "Stratégie omnicanale", "short": "Omnicanal", "teacher": "Amalia Vogler", "description": "Canaux de communication et de distribution, parcours d'achat, expérience client, mapping, points de contact et moments de vérité.", "key_dates": [{"date": "Séance 2, 3 ou 4", "label": "Quiz théorique : 20 % de la note, sans IA ni Internet ni cours"}, {"date": "Mar. 3 novembre", "label": "Séance 4 (8h30–12h00)"}, {"date": "Jeu. 5 novembre", "label": "Séance 5 : examen individuel, 80 % de la note"}], "exam_info": "Quiz théorique (20 %) sans IA ni Internet ni cours, en séance 2, 3 ou 4. Examen individuel (80 %) en séance 5, de 1h30 à 2h : **QCM, questions ouvertes, étude de cas**. Les slides de classe inversée peuvent être testées en séance.", "courses": [{"id": "omni-01", "title": "Séance 1 — Cadre du module & introduction à l'omnicanalité", "subtitle": "Objectifs, évaluation et première approche de l'omnicanal", "date": "30/09/2026", "status": "vu", "sources": ["01 - 2026.09.30 - Cours Stratégie Omnicanal.pdf"], "objectives": ["Analyser les canaux de distribution et de communication pour optimiser l'expérience client.", "Intégrer des outils numériques et physiques dans une stratégie omnicanale cohérente.", "Évaluer les performances des différents canaux pour ajuster la stratégie."], "summary": [{"title": "1. Organisation du module", "body": "- **17h30** de cours : **5 séances de 3h30**\n- Intervenante : **Amalia Vogler** (contact par mail ou via la messagerie Learn du module)\n\n| Séance | Date | Horaire |\n|---|---|---|\n| 1 | Mer. 30 septembre | 8h30–12h00 |\n| 2 | Mar. 13 octobre | 8h30–12h00 |\n| 3 | Mer. 14 octobre | 13h15–16h45 |\n| 4 | Mar. 3 novembre | 8h30–12h00 |\n| 5 | Jeu. 5 novembre | 8h30–12h00 |"}, {"title": "2. Évaluation : ce qui compte pour la note", "body": "| Épreuve | Contenu | Quand | Poids |\n|---|---|---|---|\n| **Quiz** (théorie) | Sans IA, sans Internet, sans cours | Séance 2, 3 ou 4 | **20 %** |\n| **Examen individuel** (théorie + pratique) | 1h30 à 2h : QCM, questions ouvertes, étude de cas | Séance 5 | **80 %** |\n\nL'intervenante peut modifier le format à tout moment. **Les slides de classe inversée peuvent être testées.**"}, {"title": "3. La philosophie du cours", "body": "**ANTICIPATION** (travailler tout le semestre) · **RESPECT** (ponctualité) · **ASSIDUITÉ** (prendre des notes) · **PARTICIPATION** · **AUTONOMIE** · **TRICHERIE non tolérée**.\n\nAbsent ? C'est à vous de **rattraper le cours en autonomie**. Posez vos questions en séance plutôt que la veille par mail."}, {"title": "4. L'omnicanalité, c'est quoi ? (première approche)", "body": "L'**omnicanal** consiste à **intégrer tous les canaux** (magasin, site, appli, réseaux sociaux, service client…) dans **un seul écosystème** pour que le client puisse **commencer son parcours sur un canal et le poursuivre sur un autre sans rupture**.\n\nOn distingue trois niveaux, détaillés en séance 2 :\n\n- **Multicanal** : plusieurs canaux, pas forcément connectés (silos).\n- **Cross-canal** : les canaux se renforcent entre eux.\n- **Omnicanal** : les canaux sont intégrés et fluides. Le client **n'a plus conscience de changer de canal**.\n\n*Exemples parlants (complément) : click & collect, e-réservation en magasin, retour en boutique d'un achat en ligne, vendeur équipé d'une tablette pour commander un produit absent du rayon.*"}, {"title": "5. L'exposé « Le prof, c'est vous ! »", "body": "- Groupes de **5** : préparer un exposé qui explique l'omnicanalité.\n- Contenus possibles : théorie, définition, exemples concrets, mise en situation, visuels, vidéos, jeu de rôle, infographies.\n- **Règle du jeu : interdit de se répéter.** Le groupe 1 parle environ 6 minutes, les suivants 3 à 5 minutes avec **uniquement du nouveau** (compléter, clarifier, autre exemple ou autre angle).\n- Ordre de passage tiré au sort : il faut préparer large et s'adapter en direct."}], "key_points": ["Module de 17h30 en 5 séances de 3h30.", "Quiz = 20 % (sans IA, Internet ni cours), en séance 2, 3 ou 4.", "Examen = 80 % (séance 5, 1h30–2h) : QCM, questions ouvertes, étude de cas.", "Trois objectifs : analyser les canaux, intégrer digital et physique, évaluer la performance des canaux.", "Omnicanal = tous les canaux intégrés, parcou
