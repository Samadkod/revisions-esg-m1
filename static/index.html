rs sans rupture."], "traps": ["Ne pas inverser les poids : quiz 20 %, examen 80 %.", "Le quiz se fait sans aucun support : il faut connaître les définitions par cœur."], "glossary": [{"term": "Omnicanal", "definition": "Stratégie où tous les canaux sont intégrés et fluides : le client commence sur un canal et poursuit sur un autre sans rupture, sans même avoir conscience de changer de canal."}, {"term": "Multicanal", "definition": "L'entreprise utilise plusieurs canaux, pas forcément connectés entre eux."}, {"term": "Cross-canal", "definition": "Les canaux ne sont pas seulement multiples, ils se renforcent entre eux. Le client peut passer de l'un à l'autre de façon fluide."}], "qcb": [{"q": "Le module de stratégie omnicanale dure 17h30, réparties en 5 séances.", "answer": true, "explanation": "5 séances × 3h30 = 17h30."}, {"q": "Le quiz théorique compte pour 80 % de la note finale.", "answer": false, "explanation": "Le quiz compte pour 20 % ; l'examen individuel de la séance 5 compte pour 80 %."}, {"q": "Le quiz peut être fait avec ses notes de cours.", "answer": false, "explanation": "Il se fait sans IA, sans Internet et sans cours."}, {"q": "L'examen final peut comporter une étude de cas.", "answer": true, "explanation": "Il comporte des QCM, des questions ouvertes et une étude de cas."}, {"q": "Un étudiant absent doit rattraper le cours en autonomie.", "answer": true, "explanation": "C'est de sa responsabilité, selon les règles de l'intervenante."}, {"q": "Dans l'exposé « Le prof, c'est vous », chaque groupe peut répéter ce qu'ont dit les groupes précédents.", "answer": false, "explanation": "Règle du jeu : interdit de se répéter. « Déjà dit = on passe »."}, {"q": "L'un des objectifs du module est d'évaluer la performance des différents canaux pour ajuster la stratégie.", "answer": true, "explanation": "C'est le troisième objectif pédagogique."}, {"q": "En omnicanal, le client doit recommencer son parcours à zéro quand il change de canal.", "answer": false, "explanation": "C'est l'inverse : il poursuit son parcours sans rupture."}], "qcm": [{"q": "Quels sont les objectifs pédagogiques du module ? (plusieurs réponses)", "options": ["Analyser les canaux de distribution et de communication", "Intégrer outils numériques et physiques dans une stratégie cohérente", "Évaluer les performances des canaux", "Créer un site e-commerce de A à Z"], "answer": [0, 1, 2], "explanation": "Les trois objectifs officiels du module."}, {"q": "Quel est le format de l'examen individuel ?", "options": ["Uniquement un oral", "QCM, questions ouvertes et étude de cas, entre 1h30 et 2h", "Un dossier à rendre", "Un quiz de 10 minutes"], "answer": [1], "explanation": "Théorie et pratique, en séance 5."}, {"q": "Quelles valeurs fait partie de la « philosophie » du cours ? (plusieurs réponses)", "options": ["Anticipation", "Assiduité", "Participation", "Improvisation la veille"], "answer": [0, 1, 2], "explanation": "Aussi : respect, autonomie, tricherie non tolérée."}, {"q": "Quelle définition correspond le mieux à l'omnicanal ?", "options": ["Avoir le plus de canaux possible", "Des canaux qui fonctionnent chacun de leur côté", "Des canaux intégrés permettant un parcours fluide sans rupture", "Vendre uniquement en ligne"], "answer": [2], "explanation": "Intégration et continuité de l'expérience."}, {"q": "Quand a lieu l'examen individuel ?", "options": ["Séance 1", "Séance 3", "Séance 5", "Hors des séances"], "answer": [2], "explanation": "Séance 5, le jeudi 5 novembre."}, {"q": "Par quels canaux contacter l'intervenante ? (plusieurs réponses)", "options": ["Par mail", "Via la messagerie Learn du module", "Par WhatsApp", "Par LinkedIn"], "answer": [0, 1], "explanation": "Les autres canaux sont considérés comme privés."}], "open_questions": [{"question": "Expliquez avec vos mots ce qu'est l'omnicanalité et donnez un exemple.", "answer": "L'omnicanalité est une stratégie qui **intègre tous les canaux** d'une marque (magasin, site, appli, réseaux sociaux, service client) dans un **écosystème unique et synchronisé** (stocks, paiement, fidélité, SAV). Le client peut commencer son parcours sur un canal et le terminer sur un autre **sans rupture**, sans même avoir conscience de changer de canal.\n\n*Exemple* : je commence ma commande sur l'appli, je vais la chercher en magasin, puis je reçois une promotion personnalisée par email."}], "exercises": [{"title": "Préparer l'exposé « Le prof, c'est vous ! »", "statement": "Vous passez en 4e position. Les groupes précédents ont déjà donné la définition et l'exemple de Decathlon.", "questions": ["Que pouvez-vous apporter de NOUVEAU en 3 à 5 minutes ?"], "answer": "Pistes : (1) la **distinction multi / cross / omni** avec un exemple pour chacun ; (2) un **autre secteur** (banque, automobile, luxe) ; (3) les **conditions techniques** (stocks, CRM, paiement et fidélité unifiés) ; (4) un **contre-exemple** (marque qui fonctionne en silos : impossible de rendre en magasin un achat web) ; (5) un format différent : jeu de rôle client/vendeur, quiz interactif, infographie du parcours."}], "resources": []}, {"id": "omni-02", "title": "Séance 2 — Canaux, parcours d'achat & expérience client", "subtitle": "Communication vs distribution, AIDA, See-Think-Do-Care, multi/cross/omni, CX, ROPO", "date": "13/10/2026", "status": "vu", "sources": ["02 - 2026.10.13 - Cours Stratégie Omnicanale.pdf"], "objectives": ["Distinguer canal de communication, canal de distribution et média.", "Définir le parcours d'achat et connaître les modèles AIDA et See-Think-Do-Care.", "Différencier multicanal, cross-canal et omnicanal.", "Comprendre l'expérience client (CX), les frictions et le phénomène ROPO."], "summary": [{"title": "1. Canal de communication vs canal de distribution", "body": "| | Canal de **communication** | Canal de **distribution** |\n|---|---|---|\n| Définition | La voie par laquelle une marque **transmet un message** à sa cible | La voie par laquelle un produit ou service est **mis à disposition** du client final (mode d'accès au produit) |\n| Rôles | **Informer, séduire, convaincre, créer de la relation** | **Permettre d'acheter et de recevoir** le produit |\n| Exemples | Digital, print, événementiel, face-à-face, audiovisuel | Magasin physique, e-commerce, marketplaces, circuits hybrides |\n| Verbe clé | **Faire connaître** | **Mettre à disposition** |\n\n⚠️ **Canal ≠ média** : le **canal** est le chemin, la « voie » ; le **média** est le support concret utilisé dans ce canal. *Ex.* : canal = digital ; médias = Instagram, site web, newsletter.\n\n> **L'omnicanal = l'art de faire dialoguer ces deux univers pour une expérience client fluide.**"}, {"title": "2. Le parcours d'achat (parcours client / customer journey)", "body": "**Définition** : l'ensemble des étapes suivies par un client, **de la prise de conscience d'un besoin jusqu'à la fidélisation**.\n\n**Modèle AIDA** : **A**ttention → **I**ntérêt → **D**ésir → **A**ction.\n\nLes **deux limites d'AIDA** :\n1. Il **ne prend pas en compte la fidélisation et le rachat**.\n2. Il est **linéaire**, donc pas réaliste."}, {"title": "3. Le modèle See – Think – Do – Care", "body": "| Étape | Phase | Ce qui se passe | Statut du client |\n|---|---|---|---|\n| **See** | Sensibilisation | Phase inconsciente, notoriété, se faire connaître | **Suspect** |\n| **Think** | Considération | Évaluation des options via des recherches | **Prospect** |\n| **Do** | Achat | Acquisition des produits ou services | **Client** |\n| **Care** | Fidélisation | Feedbacks, témoignages, achat renouvelé | **Ambassadeur** |\n\nPar rapport à AIDA, **il intègre la fidélisation** (Care).\n\n*Complément : modèle proposé par Avinash Kaushik (Google).*"}, {"title": "4. Des parcours complexes", "body": "- **Non linéaires** : le client ne suit pas toutes les étapes dans l'ordre (achat impulsif sans recherche) et peut **revenir en arrière** (abandon de panier → nouvelle comparaison → achat plus tard).\n- **Personnalisés** : chaque consommateur est unique (motivations, besoins, budget, valeurs). Facteurs d'influence : âge, contexte, urgence, canal préféré. ➔ **Connaître sa cible !**\n- **Multicanaux** : le client passe d'un canal à l'autre (site, réseaux, magasin, téléphone). *Ex. 1* : je vois une pub, j'achète directement. *Ex. 2* : je cherche sur Google, je compare 10 sites, je lis des avis, je demande à un ami, puis j'achète.\n\nUn vrai parcours ressemble plutôt à une **boucle** : s'informer, comparer, consulter des avis, obtenir un devis, acheter, interagir après l'achat, consommer, résoudre un problème, puis racheter ou quitter la marque. Chaque étape comporte ses irritants (offres complexes, rupture entre canaux, mauvaises expériences, absence d'information au bon moment…)."}, {"title": "5. Multicanal, cross-canal, omnicanal", "body": "| | **Multicanal** | **Cross-canal** | **Omnicanal** |\n|---|---|---|---|\n| Principe | Plusieurs canaux **pas forcément connectés** | Les canaux **se renforcent entre eux** | Tous les canaux sont **intégrés et fluides** |\n| Pour le client | Chaque canal est un silo | Il **peut changer de canal** de façon fluide | Il **n'a plus conscience de changer de canal** |\n| Exemple du cours | J'achète sur le site mais **je ne peux pas retourner en magasin** | Je **scanne un QR code en magasin** qui m'amène sur le site pour plus d'infos | Je **commence ma commande sur l'appli**, je **vais la chercher en magasin**, je **reçois une promo par email** |\n\n**Continuité de l'expérience** : si l'**inventaire**, le **paiement**, la **fidélité** et le **SAV** sont synchronisés dans **un seul écosystème**, alors c'est de l'omnicanal.\n\n**Vrai ou faux ?** « L'omnicanal, c'est avoir plusieurs canaux de vente qui fonctionnent en parallèle. » ➔ **FAUX**, ça, c'est du multicanal."}, {"title": "6. L'expérience client (CX)", "body": "**Définition** : la **perception globale** qu'a le client de la marque, basée sur **toutes ses interactions** (avant, pendant, après l'achat). Elle inclut des **moments de satisfaction** et des **points de friction**.\n\n- **Points de friction** : obstacles, irritants, frustrations qui freinent l'achat. ➔ Les supprimer améliore la **fluidité**.\n- **Points de satisfaction** : instants agréables qui créent confiance et attachement. ➔ Les renforcer crée de l'**émotion** et de la **fidélité**.\n- **Les deux comptent !**\n\nTrois idées clés : chaque étape du parcours génère une expérience ; la CX fait la différence entre un **achat unique** et une **fidélisation** ; elle est **mesurable** (enquêtes, avis clients, taux de réachat), même si ce n'est pas évident."}, {"title": "7. L'expérience avant le prix (souvent, mais pas tout le temps)", "body": "> **Le prix attire (acquisition), mais l'expérience retient (fidélisation).**\n\n- Plus de **70 %** des consommateurs choisissent une marque pour l'expérience qu'elle offre, pas seulement pour le prix (études **PwC & Salesforce**).\n- La concurrence par les prix est sans fin. Une bonne expérience (service fluide, relation personnalisée, simplicité d'achat, SAV efficace) touche l'**affect**, donc l'**émotion**.\n- **Apple** : prix élevés, mais expérience en boutique et écosystème cohérent ➔ fidélisation forte.\n- **Amazon** : pas forcément les prix les plus bas, mais expérience ultra fluide (livraison rapide, retours faciles) ➔ fidélisation forte."}, {"title": "8. Quantité de canaux ≠ qualité de la stratégie", "body": "**Vrai ou faux ?** « Plus une entreprise a de canaux, meilleure est sa stratégie omnicanale. » ➔ **FAUX**.\n\n- Beaucoup de canaux ne servent à rien s'ils fonctionnent **en silos**.\n- **Omnicanal = cohérence + intégration** : les canaux se complètent et communiquent (acheter en ligne, retourner en magasin, suivre la commande sur l'appli).\n- Le client ne veut pas « plus de canaux » : il veut un **parcours fluide, simple et sans friction**, avec la même information partout (commencer sur Instagram, finir en magasin)."}, {"title": "9. Le phénomène ROPO (Research Online, Purchase Offline)", "body": "**Vrai ou faux ?** « 70 % des consommateurs commencent leur parcours en ligne, même s'ils achètent ensuite en magasin. » ➔ **VRAI** : c'est le **ROPO**.\n\nLa plupart des consommateurs commencent par une **recherche en ligne**, même s'ils achètent ensuite **en magasin** ou via un autre canal. *Ex.* : regarder les avis Google ou les prix sur un site, puis acheter en boutique pour avoir le produit tout de suite.\n\n> **Le digital influence presque tous les parcours, même quand la vente finale n'a pas lieu en ligne.**\n\nLe schéma « On et offline » montre un parcours en 7 étapes : (1) lecture d'un magazine sur tablette → (2) recherche d'informations sur Internet → (3) essai et choix dans le magasin de l'enseigne A [**ROPO**, phase d'**acquisition**] → (4) comparatif des prix et achat sur le site de l'enseigne B → (5) retrait en magasin B et achat complémentaire [**transformation**] → (6) avis sur Internet → (7) enquête de satisfaction du service client [**fidélisation**].\n\n*Complément : l'inverse s'appelle le **showrooming** (voir en magasin, acheter en ligne), aussi appelé « reverse ROPO ».*"}, {"title": "10. Chaque canal a son rôle", "body": "**Vrai ou faux ?** « Le canal qui génère le plus de ventes directes est celui qu'il faut privilégier. » ➔ **FAUX**.\n\n- Un canal peut générer la **vente finale** (le site e-commerce) alors que d'autres ont permis d'**attirer** le client (réseaux sociaux, email, magasin, publicité).\n- Le consommateur ne raisonne pas en canaux : il veut passer d'un point de contact à l'autre **sans friction**.\n- ⚠️ Ne privilégier qu'un canal, c'est **risquer de perdre des ventes indirectes ou futures**."}, {"title": "11. Travaux à faire : classe inversée & projet fil rouge", "body": "- **Classe inversée** : lire les slides sur Learn, de « Les étapes classiques du parcours d'achat » à « Et l'automatisation ? » (points de contact, cartographie, moments de vérité, automatisation). Elles peuvent être testées en séance. Voir la séance 3.\n- **Projet fil rouge : Hurpeau Mousist**, fabricant d'**escaliers sur mesure**. Vous êtes consultants. **Livrable A** (1 page en PDF sur Learn avant la séance 3) : l'enjeu du client en une phrase ; sa cible (qui achète, qui prescrit, qui décide) ; ses points de contact actuels (physiques et digitaux) ; ce qui fonctionne et ce qui bloque ; vos 3 prochaines questions."}], "key_points": ["Communication = faire connaître (informer, séduire, convaincre, créer de la relation) ; distribution = mettre à disposition (acheter, recevoir).", "Canal = la voie ; média = le support concret (canal digital → Instagram, newsletter).", "Omnicanal = faire dialoguer communication et distribution pour une expérience fluide.", "Parcours d'achat : de la prise de conscience du besoin jusqu'à la fidélisation.", "AIDA a deux limites : il oublie la fidélisation et le rachat, et il est linéaire.", "See (sensibilisation, suspect) → Think (considération, prospect) → Do (achat, client) → Care (fidélisation, ambassadeur).", "Multicanal = silos ; cross-canal = les canaux se renforcent ; omnicanal = le client n'a plus conscience de changer de canal.", "CX = perception globale de toutes les interactions ; supprimer les frictions et renforcer les satisfactions.", "Le prix attire (acquisition), l'expérience retient (fidélisation) : plus de 70 % des consommateurs (PwC & Salesforce).", "ROPO = Research Online, Purchase Offline ; plus de canaux ne veut pas dire une meilleure stratégie ; chaque canal a son rôle."], "traps": ["« Plusieurs canaux en parallèle », c'est du multicanal, pas de l'omnicanal.", "Canal ≠ média : Instagram est un média du canal digital.", "Cross-canal : le client peut changer de canal de façon fluide. Omnicanal : il n'en a même plus conscience.", "L'expérience prime souvent sur le prix, mais pas toujours (le cours le précise).", "Le canal qui fait la vente finale n'est pas forcément le plus important (attribution des ventes indirectes).", "AIDA n'intègre ni la fidélisation ni le rachat, contrairement à See-Think-Do-Care."], "glossary": [{"term": "Canal de communication", "definition": "Voie par laquelle une marque transmet un message à sa cible. Rôles : informer, séduire, convaincre, créer de la relation."}, {"term": "Canal de distribution", "definition": "Voie par laquelle un produit ou service est mis à disposition du client final. Rôle : lui permettre d'acheter et de recevoir le produit."}, {"term": "Média", "definition": "Support ou outil concret utilisé dans un canal (ex. dans le canal digital : Instagram, site web, newsletter)."}, {"term": "Parcours d'achat / customer journey", "definition": "Ensemble des étapes suivies par un client, de la prise de conscience d'un besoin jusqu'à la fidélisation."}, {"term": "AIDA", "definition": "Attention, Intérêt, Désir, Action. Limites : ignore la fidélisation et le rachat, et il est linéaire."}, {"term": "See-Think-Do-Care", "definition": "Sensibilisation (suspect), Considération (prospect), Achat (client), Fidélisation (ambassadeur)."}, {"term": "Multicanal", "definition": "Plusieurs canaux pas forcément connectés. Ex. : j'achète sur le site mais je ne peux pas retourner en magasin."}, {"term": "Cross-canal", "definition": "Les canaux se renforcent entre eux. Ex. : QR code en magasin qui mène au site pour plus d'infos."}, {"term": "Omnicanal", "definition": "Canaux intégrés et fluides, client sans conscience de changer de canal ; stocks, paiement, fidélité et SAV synchronisés."}, {"term": "Continuité de l'expérience", "definition": "Le client passe d'un canal à l'autre sans rupture ni perte d'information : c'est la marque de l'omnicanal."}, {"term": "Expérience client (CX)", "definition": "Perception globale qu'a le client de la marque, basée sur toutes ses interactions avant, pendant et après l'achat."}, {"term": "Point de friction", "definition": "Obstacle, irritant ou frustration qui freine l'achat."}, {"term": "Point de satisfaction", "definition": "Instant agréable qui crée de la confiance et de l'attachement."}, {"term": "ROPO", "definition": "Research Online, Purchase Offline : on recherche en ligne puis on achète en magasin ou via un autre canal."}, {"term": "Silo", "definition": "Canal qui fonctionne de son côté, sans connexion avec les autres."}], "qcb": [{"q": "L'omnicanal, c'est avoir plusieurs canaux de vente (site, magasin, réseaux sociaux) qui fonctionnent en parallèle.", "answer": false, "explanation": "Des canaux en parallèle, c'est du multicanal. L'omnicanal suppose des canaux intégrés et fluides."}, {"q": "Plus une entreprise a de canaux, meilleure est sa stratégie omnicanale.", "answer": false, "explanation": "Quantité ≠ qualité : il faut de la cohérence et de l'intégration, pas des silos."}, {"q": "70 % des consommateurs commencent leur parcours d'achat en ligne, même s'ils achètent ensuite en magasin.", "answer": true, "explanation": "C'est le phénomène ROPO (Research Online, Purchase Offline)."}, {"q": "Le canal qui génère le plus de ventes directes est celui qu'il faut privilégier.", "answer": false, "explanation": "Chaque canal a son rôle : en privilégier un seul fait perdre des ventes indirectes ou futures."}, {"q": "L'expérience client est plus importante que le prix pour fidéliser un consommateur.", "answer": true, "explanation": "Souvent, mais pas tout le temps : le prix attire, l'expérience retient."}, {"q": "Le canal et le média désignent exactement la même chose.", "answer": false, "explanation": "Le canal est la voie (ex. digital) ; le média est le support concret (Instagram, newsletter)."}, {"q": "Le canal de distribution a pour rôle d'informer et de séduire la cible.", "answer": false, "explanation": "Ce sont les rôles du canal de communication. Le canal de distribution permet d'acheter et de recevoir le produit."}, {"q": "Le modèle AIDA ne prend pas en compte la fidélisation.", "answer": true, "explanation": "C'est l'une de ses deux limites, avec sa linéarité."}, {"q": "Dans See-Think-Do-Care, l'étape « Think » correspond au statut de prospect.", "answer": true, "explanation": "See = suspect, Think = prospect, Do = client, Care = ambassadeur."}, {"q": "Dans un parcours réel, un client peut revenir en arrière (abandon de panier puis nouvelle comparaison).", "answer": true, "explanation": "Les parcours sont non linéaires."}, {"q": "En cross-canal, le client n'a plus conscience de changer de canal.", "answer": false, "explanation": "C'est la définition de l'omnicanal. En cross-canal, il peut changer de canal de façon fluide."}, {"q": "L'expérience client inclut uniquement les moments positifs.", "answer": false, "explanation": "Elle inclut des moments de satisfaction et des points de friction : les deux comptent."}, {"q": "L'expérience client est mesurable (enquêtes, avis, taux de réachat).", "answer": true, "explanation": "Elle est mesurable, même si ce n'est pas évident."}, {"q": "Selon le cours, Amazon fidélise surtout grâce aux prix les plus bas du marché.", "answer": false, "explanation": "Amazon n'a pas forcément les prix les plus bas : il fidélise par une expérience ultra fluide (livraison rapide, retours faciles)."}, {"q": "Pouvoir acheter sur le site sans pouvoir retourner le produit en magasin est un exemple de multicanal.", "answer": true, "explanation": "C'est l'exemple du cours : les canaux ne sont pas connectés."}, {"q": "Le parcours d'achat s'arrête à l'acte d'achat.", "answer": false, "explanation": "Il va de la prise de conscience du besoin jusqu'à la fidélisation."}, {"q": "Événementiel et face-à-face sont des exemples de canaux de communication.", "answer": true, "explanation": "Avec le digital, le print et l'audiovisuel."}, {"q": "Les marketplaces sont un canal de communication.", "answer": false, "explanation": "Ce sont un canal de distribution (avec le magasin physique, l'e-commerce et les circuits hybrides)."}], "qcm": [{"q": "Quels sont les rôles d'un canal de communication ? (plusieurs réponses)", "options": ["Informer", "Séduire", "Convaincre", "Livrer le produit"], "answer": [0, 1, 2], "explanation": "Et créer de la relation. Livrer relève de la distribution."}, {"q": "Quels sont des exemples de canaux de distribution ? (plusieurs réponses)", "options": ["Magasin physique", "E-commerce", "Marketplaces", "Print"], "answer": [0, 1, 2], "explanation": "Le print est un canal de communication."}, {"q": "Dans le canal digital, lesquels sont des médias ? (plusieurs réponses)", "options": ["Instagram", "Site web", "Newsletter", "Le canal digital lui-même"], "answer": [0, 1, 2], "explanation": "Le canal est la voie ; les médias sont les supports concrets."}, {"q": "Selon le cours, l'omnicanal est :", "options": ["L'art de multiplier les canaux", "L'art de faire dialoguer communication et distribution pour une expérience fluide", "La vente exclusivement en ligne", "La publicité multi-supports"], "answer": [1], "explanation": "Formule clé de la séance 2."}, {"q": "Quelles sont les deux limites du modèle AIDA ? (plusieurs réponses)", "options": ["Il ne prend pas en compte la fidélisation et le rachat", "Il est linéaire", "Il est trop récent", "Il ignore l'attention"], "answer": [0, 1], "explanation": "Ces deux limites justifient des modèles comme See-Think-Do-Care."}, {"q": "Remettez dans l'ordre See-Think-Do-Care :", "options": ["Sensibilisation → Considération → Achat → Fidélisation", "Achat → Considération → Sensibilisation → Fidélisation", "Considération → Sensibilisation → Fidélisation → Achat", "Fidélisation → Achat → Considération → Sensibilisation"], "answer": [0], "explanation": "See, Think, Do, Care."}, {"q": "À quelle étape du modèle le client devient-il « ambassadeur » ?", "options": ["See", "Think", "Do", "Care"], "answer": [3], "explanation": "Care = fidélisation : feedbacks, témoignages, achat renouvelé."}, {"q": "Quelle phase de See-Think-Do-Care est décrite comme « inconsciente » et liée à la notoriété ?", "options": ["See", "Think", "Do", "Care"], "answer": [0], "explanation": "See = sensibilisation : se faire connaître."}, {"q": "Je scanne un QR code en magasin qui m'amène sur le site pour plus d'infos. C'est :", "options": ["Du multicanal", "Du cross-canal", "De l'omnicanal", "Du ROPO"], "answer": [1], "explanation": "Exemple du cours pour le cross-canal : les canaux se renforcent entre eux."}, {"q": "Je commence ma commande sur l'appli, la récupère en magasin et reçois une promo par email. C'est :", "options": ["Du multicanal", "Du cross-canal", "De l'omnicanal", "Du showrooming"], "answer": [2], "explanation": "Exemple du cours pour l'omnicanal : continuité totale."}, {"q": "Quels éléments doivent être synchronisés pour parler d'omnicanal ? (plusieurs réponses)", "options": ["Inventaire", "Paiement", "Fidélité", "Service après-vente"], "answer": [0, 1, 2, 3], "explanation": "Tous dans un seul écosystème."}, {"q": "Selon le cours, pourquoi les parcours sont-ils complexes ? (plusieurs réponses)", "options": ["Ils sont non linéaires", "Ils sont personnalisés", "Les clients passent d'un canal à l'autre", "Tous les clients suivent AIDA"], "answer": [0, 1, 2], "explanation": "Non linéaires, personnalisés et multicanaux."}, {"q": "Qu'est-ce qu'un point de friction ?", "options": ["Un instant agréable qui crée de l'attachement", "Un obstacle, irritant ou frustration qui freine l'achat", "Un canal de distribution", "Une promotion"], "answer": [1], "explanation": "Le supprimer améliore la fluidité."}, {"q": "Quelle phrase résume la relation prix / expérience ?", "options": ["Le prix retient, l'expérience attire", "Le prix attire (acquisition), l'expérience retient (fidélisation)", "Seul le prix compte", "Seule l'expérience compte, toujours"], "answer": [1], "explanation": "Avec la nuance « souvent, mais pas tout le temps »."}, {"q": "Quelles sources sont citées pour le chiffre « plus de 70 % choisissent une marque pour l'expérience » ?", "options": ["PwC et Salesforce", "Google et Meta", "INSEE et Eurostat", "McKinsey et BCG"], "answer": [0], "explanation": "Études PwC & Salesforce."}, {"q": "Que signifie ROPO ?", "options": ["Return Online, Pay Offline", "Research Online, Purchase Offline", "Retail Omnichannel Process Optimization", "Research Offline, Purchase Online"], "answer": [1], "explanation": "On cherche en ligne, on achète en magasin."}, {"q": "Un client lit les avis Google, compare les prix en ligne, puis achète en boutique pour avoir le produit tout de suite. Ce comportement illustre :", "options": ["Le multicanal", "Le ROPO", "Le showrooming", "AIDA"], "answer": [1], "explanation": "Recherche en ligne puis achat hors ligne."}, {"q": "Quelles marques le cours cite-t-il comme exemples de fidélisation par l'expérience ? (plusieurs réponses)", "options": ["Apple", "Amazon", "Shein", "Lidl"], "answer": [0, 1], "explanation": "Apple (boutique, écosystème) et Amazon (livraison, retours)."}], "open_questions": [{"question": "Distinguez canal de communication et canal de distribution. Expliquez en quoi l'omnicanal les relie.", "answer": "**Canal de communication** : voie par laquelle la marque transmet un message à sa cible pour informer, séduire, convaincre et créer de la relation (digital, print, événementiel, face-à-face, audiovisuel). Verbe clé : **faire connaître**.\n\n**Canal de distribution** : voie par laquelle le produit est mis à disposition du client final pour qu'il puisse l'acheter et le recevoir (magasin, e-commerce, marketplaces, circuits hybrides). Verbe clé : **mettre à disposition**.\n\n**Lien** : l'omnicanal est « l'art de faire dialoguer ces deux univers » pour une expérience client fluide. *Ex.* : une publicité Instagram (communication) renvoie vers un produit réservable en magasin (distribution), avec un stock visible en temps réel."}, {"question": "Présentez le modèle AIDA, ses limites et un modèle plus adapté.", "answer": "**AIDA** : Attention → Intérêt → Désir → Action.\n\n**Limites** : (1) il ignore la **fidélisation et le rachat** ; (2) il est **linéaire**, alors que les parcours réels sont non linéaires, personnalisés et multicanaux.\n\n**Modèle plus adapté : See-Think-Do-Care**. See (sensibilisation, suspect), Think (considération, prospect), Do (achat, client), Care (fidélisation, ambassadeur). Il intègre l'après-achat. On peut aussi représenter le parcours comme une **boucle** (s'informer, comparer, acheter, utiliser, résoudre un problème, racheter ou quitter)."}, {"question": "Comparez multicanal, cross-canal et omnicanal avec un exemple pour chacun.", "answer": "- **Multicanal** : plusieurs canaux non connectés. *Ex.* : j'achète sur le site mais je ne peux pas retourner en magasin.\n- **Cross-canal** : les canaux se renforcent, le client peut passer de l'un à l'autre. *Ex.* : un QR code en magasin renvoie vers la fiche produit du site.\n- **Omnicanal** : canaux intégrés, le client n'a plus conscience de changer de canal. Stocks, paiement, fidélité et SAV sont synchronisés. *Ex.* : commande sur l'appli, retrait en magasin, promo personnalisée par email.\n\nLa différence clé tient dans la **continuité de l'expérience**."}, {"question": "« Plus une entreprise a de canaux, meilleure est sa stratégie omnicanale. » Discutez.", "answer": "**Faux.** Quantité de canaux ≠ qualité de la stratégie.\n\n- Des canaux nombreux mais **en silos** créent des ruptures (information différente, retours impossibles) et donc des **frictions**.\n- L'omnicanal repose sur la **cohérence** et l'**intégration** : les canaux se complètent et communiquent.\n- Le client ne veut pas plus de canaux, il veut un **parcours fluide, simple et sans friction**.\n\nConclusion : mieux vaut peu de canaux bien intégrés que beaucoup de canaux déconnectés."}, {"question": "Qu'est-ce que l'expérience client ? Pourquoi est-elle souvent plus déterminante que le prix ?", "answer": "**CX** : perception globale du client sur la marque, construite par toutes ses interactions avant, pendant et après l'achat. Elle comprend des moments de satisfaction et des points de friction.\n\n**Pourquoi elle prime souvent** : la guerre des prix est sans fin (un concurrent peut toujours faire moins cher), alors qu'une bonne expérience touche l'**affect** et crée de l'**émotion**, donc de la fidélité. Plus de 70 % des consommateurs choisissent une marque pour l'expérience (PwC, Salesforce). Exemples : **Apple** et **Amazon**.\n\n**Nuance** : « souvent, mais pas tout le temps ». Le prix reste décisif pour l'**acquisition** et pour certains produits ou cibles."}, {"question": "Expliquez le phénomène ROPO et ses conséquences pour une enseigne.", "answer": "**ROPO** (Research Online, Purchase Offline) : le client se renseigne en ligne (avis, prix, comparateurs) puis achète en magasin, par exemple pour avoir le produit immédiatement. Environ **70 %** des consommateurs commencent leur parcours en ligne.\n\n**Conséquences** : (1) le digital influence presque toutes les ventes, même physiques ; il faut des fiches produits, des avis et un stock visible en ligne ; (2) il ne faut pas juger un canal sur ses seules ventes directes ; (3) il faut relier les données en ligne et en magasin (programme de fidélité, e-réservation)."}], "exercises": [{"title": "Étude de cas — Diagnostic Hurpeau Mousist (Livrable A)", "statement": "**Hurpeau Mousist** est un fabricant d'**escaliers sur mesure**. En tant que consultants, préparez le diagnostic de la situation client en 1 page.", "questions": ["Formulez l'enjeu du client en une phrase.", "Qui achète, qui prescrit, qui décide ?", "Listez des points de contact physiques et digitaux probables.", "Proposez 3 questions à poser au dirigeant."], "answer": "*Corrigé type : les hypothèses sont à vérifier auprès du dirigeant et par vos recherches.*\n\n1. **Enjeu** : générer davantage de demandes de devis qualifiées et rendre le parcours (de l'inspiration à la pose) fluide entre le digital et le physique.\n2. **Cible** : **acheteurs** = particuliers qui construisent ou rénovent ; **prescripteurs** = architectes, architectes d'intérieur, constructeurs, menuisiers, artisans du bâtiment ; **décideurs** = souvent le couple propriétaire (budget), parfois le maître d'œuvre.\n3. **Points de contact** : site web et formulaire de devis, fiche Google et avis, Instagram et Pinterest (inspiration), Houzz, salons de l'habitat, showroom ou atelier, visite technique et prise de mesures, devis, pose, SAV et entretien, bouche-à-oreille.\n4. **Questions** : d'où viennent vos demandes de devis aujourd'hui ? Quel est votre taux de transformation devis → commande, et pourquoi perdez-vous des projets ? Combien de temps s'écoule entre le premier contact et la pose, et où sont les frictions (délais, prix, visualisation du rendu) ?"}, {"title": "Exercice — Classer les canaux", "statement": "Classez : affichage métro, marketplace Amazon, salon professionnel, newsletter, boutique, conseiller par téléphone, spot TV, click & collect.", "questions": ["Canal de communication ou de distribution ?"], "answer": "**Communication** : affichage métro (print), salon professionnel (événementiel), newsletter (média du canal digital), spot TV (audiovisuel), conseiller par téléphone (face-à-face ou relation).\n**Distribution** : marketplace Amazon, boutique, click & collect (circuit hybride).\n\n*Nuance : la boutique et le conseiller peuvent jouer les deux rôles. C'est justement là que l'omnicanal fait dialoguer les deux univers.*"}], "resources": []}, {"id": "omni-03", "title": "Séance 3 — Points de contact, mapping & moments de vérité", "subtitle": "Classe inversée : étapes du parcours, cartographie, moments de vérité, automatisation", "date": "14/10/2026", "status": "vu", "sources": ["03 - 2026.10.14 - Cours Stratégie Omnicanale Classe inversée.pdf"], "objectives": ["Connaître les 6 étapes classiques du parcours d'achat.", "Définir un point de contact (touchpoint) et un moment de vérité, et savoir les distinguer.", "Savoir construire une cartographie (mapping) du parcours client.", "Comprendre le rôle de l'automatisation dans l'expérience omnicanale."], "summary": [{"title": "1. Les 6 étapes classiques du parcours d'achat", "body": "| Étape | Ce que fait le client | Exemple : baskets |\n|---|---|---|\n| **1. Prise de conscience** | Prend conscience d'un besoin ou découvre une marque | Voit une pub de baskets sur Instagram |\n| **2. Considération** | Cherche des infos, compare, lit des avis, demande conseil | Regarde des tests sur YouTube, des comparateurs |\n| **3. Décision / Achat** | Choisit une option et passe à l'acte | Commande en ligne ou achète en magasin |\n| **4. Expérience / Utilisation** | Vit l'expérience d'utilisation | Teste ses baskets en courant |\n| **5. Fidélisation** | Satisfait, revient acheter ou s'abonne | Rachète la marque, rejoint le programme de fidélité |\n| **6. Recommandation** | Devient ambassadeur | Poste un avis sur Trustpilot, recommande à un ami |\n\nLes points de contact correspondants : pub Insta ➔ YouTube et comparateurs ➔ magasin (échanges humains) ➔ newsletter (astuces), mail promo ➔ programme de fidélité ➔ mail d'incitation à laisser un avis ou récompense en échange d'un avis."}, {"title": "2. Le point de contact (touchpoint)", "body": "**Définition** : **toute interaction** entre un client et une marque au cours de son parcours d'achat.\n\n| Moment | Exemples |\n|---|---|\n| **Avant l'achat** | Pub, réseaux sociaux, site web, bouche-à-oreille |\n| **Pendant l'achat** | Vendeur en magasin, site e-commerce, appli mobile |\n| **Après l'achat** | Service client, newsletters, programme de fidélité |\n\n**Objectifs du travail sur les points de contact** :\n1. **Identifier** tous les points de contact clés\n2. **Comprendre / analyser** leur rôle dans l'expérience client\n3. **Optimiser** chaque interaction pour **réduire les frictions** et **renforcer la satisfaction**"}, {"title": "3. La cartographie du parcours (mapping)", "body": "**Définition** : une **représentation visuelle** de toutes les étapes qu'un client traverse **avant, pendant et après** l'achat d'un produit ou service.\n\n**Pourquoi cartographier ?**\n- Identifier les **blocages** qui font perdre des clients\n- Repérer les **moments clés** qui créent satisfaction et fidélité\n- Mettre en place des **actions concrètes** ➔ améliorer l'expérience et **augmenter les conversions**\n\n**Lignes d'une cartographie** (modèle Different Factory) : étape du parcours · objectifs clients · points de contact (canal) · attentes · **douleurs (pains)** · émotions. D'autres formats existent : experience map, ou « pains et gains » (exemple d'un prêt bancaire)."}, {"title": "4. Trame générale de consolidation (exemple à connaître)", "body": "| Étape | Points de contact | Actions | Émotions | Satisfaction | Friction | Opportunités |\n|---|---|---|---|---|---|---|\n| **Prise de conscience (See)** | Réseaux sociaux, bouche-à-oreille, pub | Découvre un besoin, une pub, une reco | Curiosité, intérêt, doute | Contenu attractif et clair, reco crédible | Pub intrusive, mauvais ciblage | Contenu attractif, visibilité accrue |\n| **Considération (Think)** | Avis clients, site, comparateurs, YouTube | Compare, cherche des avis | Hésitation, recherche de confiance | Fiche produit complète, avis clients | Photos de mauvaise qualité, avis négatifs non traités | Preuves sociales, contenu comparatif |\n| **Achat (Do)** | E-commerce, magasin, appli | Commande, va en magasin | Excitation, peur de se tromper | Checkout simple, preuves de sécurité (avis, badges) | Création de compte obligatoire, temps de chargement | Simplifier, rassurer avec SAV et garantie |\n| **Fidélisation (Care)** | SAV, newsletters, fidélité, réseaux | Utilise, partage son expérience | Satisfaction, frustration, fierté | Bon service client, offre personnalisée, fidélité | Communication générique, retours compliqués | Suivi personnalisé, offres exclusives |\n\n**Pour aller plus loin**, chaque opportunité est ensuite analysée selon : son **coût**, sa **faisabilité**, son **alignement avec les valeurs et la marque**, et sa **cohérence avec la stratégie omnicanale**. ➔ La cartographie est un **outil vivant**, à affiner avec les données clients (expérience terrain)."}, {"title": "5. Moments de vérité vs points de contact", "body": "- **Point de contact** : **toute** interaction client ↔ marque.\n- **Moment de vérité** : un point de contact **décisif**, qui **influence fortement** la perception du client et sa décision. C'est le moment où le client dit « **Oui, je fais confiance à cette marque** » ou « **Non, je pars ailleurs** ».\n\n> **Tous les moments de vérité sont des points de contact, MAIS tous les points de contact ne sont pas des moments de vérité.**\n\nLes moments de vérité sont les **points critiques qui peuvent faire basculer l'expérience** en positif ou en négatif.\n\n*Complément (souvent attendu en culture marketing) : **ZMOT** (Zero Moment of Truth, Google : la recherche en ligne avant l'achat), **FMOT** (First Moment of Truth, P&G : face au produit en rayon), **SMOT** (Second Moment of Truth : l'expérience d'usage).*"}, {"title": "6. Identifier les moments de vérité : la méthode en 4 étapes", "body": "1. **Lister les points de contact existants** : cartographier tous les moments d'interaction (pub → site → ajout au panier → paiement → livraison → SAV).\n2. **Observer et collecter des données** : chercher où ça bloque et où ça enchante (feedback clients, avis, enquêtes ; taux d'abandon de panier, clics, réclamations ; tests utilisateurs).\n3. **Évaluer l'impact de chaque point de contact** : « Ça enchante ? » Est-ce que ça augmente vraiment la confiance ou la satisfaction ? « Ça bloque ? » Est-ce que ça détruit la relation immédiatement ?\n4. **Prioriser les moments critiques** avec une grille simple :\n   - **Haute importance** = moment de vérité ➔ à maîtriser absolument\n   - **Importance moyenne** ➔ points à améliorer\n   - **Faible importance** ➔ points secondaires\n   (et recommencer au besoin)"}, {"title": "7. À retenir : émotion et observation", "body": "- L'**affect** joue énormément sur l'impact (ou non) de chaque moment de vérité, d'où l'importance du **travail sur la marque** (branding ou personal branding). ➔ **ÉMOTION**\n- Il faut **observer** le comportement des consommateurs pour savoir ce qui est un moment de vérité ou non, car **cela varie d'une personne à l'autre**. ➔ **OBSERVATION**\n- Il faut **s'adapter** : le contexte peut changer très vite."}, {"title": "8. Et l'automatisation ?", "body": "| Objectif | Exemples |\n|---|---|\n| **Gagner en réactivité** | Automatiser les mails, le suivi de commande, la FAQ |\n| **Personnaliser à grande échelle** | Mails ou messages adaptés au comportement du client |\n| **Réduire la friction** | Paiement en 1 clic, relance de panier abandonné |"}], "key_points": ["Six étapes : prise de conscience, considération, décision/achat, expérience/utilisation, fidélisation, recommandation.", "Point de contact = toute interaction client ↔ marque (avant, pendant, après l'achat).", "Objectifs : identifier, comprendre/analyser, optimiser (réduire les frictions, renforcer la satisfaction).", "Mapping = représentation visuelle des étapes avant, pendant et après l'achat.", "Pourquoi cartographier : repérer les blocages, les moments clés, puis agir pour augmenter les conversions.", "Lignes d'une carte : étapes, objectifs, points de contact, attentes, douleurs, émotions (+ satisfactions, frictions, opportunités).", "Moment de vérité = point de contact décisif (« oui je fais confiance » / « non je pars »).", "Tous les moments de vérité sont des points de contact, pas l'inverse.", "Méthode : lister → observer et collecter → évaluer (enchante ou bloque ?) → prioriser (haute, moyenne, faible).", "Automatisation : réactivité, personnalisation à grande échelle, réduction de la friction."], "traps": ["Un point de contact n'est pas forcément un moment de vérité : seul un point de contact décisif l'est.", "Le parcours ne s'arrête pas à l'achat : utilisation, fidélisation et recommandation en font partie.", "La cartographie n'est pas figée : c'est un outil vivant à mettre à jour avec les données clients.", "Les moments de vérité varient selon les personnes et le contexte : il faut observer.", "Une opportunité d'amélioration doit être évaluée (coût, faisabilité, alignement avec la marque, cohérence omnicanale) avant d'être lancée."], "glossary": [{"term": "Point de contact / touchpoint", "definition": "Toute interaction entre un client et une marque au cours de son parcours d'achat (avant, pendant, après)."}, {"term": "Moment de vérité", "definition": "Point de contact décisif qui influence fortement la perception du client et sa décision : « Oui, je fais confiance » ou « Non, je pars ailleurs »."}, {"term": "Cartographie / mapping", "definition": "Représentation visuelle de toutes les étapes qu'un client traverse avant, pendant et après l'achat."}, {"term": "Prise de conscience", "definition": "Première étape : le client prend conscience d'un besoin ou découvre une marque."}, {"term": "Considération", "definition": "Le client cherche des infos, compare, lit des avis, demande conseil."}, {"term": "Recommandation", "definition": "Dernière étape : le client devient ambassadeur et recommande la marque (avis, bouche-à-oreille)."}, {"term": "Douleurs (pains)", "definition": "Difficultés et frustrations vécues par le client à une étape du parcours."}, {"term": "Gains", "definition": "Bénéfices et satisfactions attendus ou vécus par le client."}, {"term": "Preuve sociale", "definition": "Éléments rassurants venant d'autres clients (avis, notes, témoignages) qui lèvent l'hésitation."}, {"term": "Taux d'abandon de panier", "definition": "Part des paniers créés mais non payés ; un indicateur clé pour repérer une friction."}, {"term": "Automatisation", "definition": "Usage d'outils pour gagner en réactivité, personnaliser à grande échelle et réduire la friction (relance panier, paiement 1 clic, FAQ)."}, {"term": "ZMOT (complément)", "definition": "Zero Moment of Truth (Google) : moment où le consommateur se renseigne en ligne avant l'achat."}], "qcb": [{"q": "Tous les points de contact sont des moments de vérité.", "answer": false, "explanation": "Tous les moments de vérité sont des points de contact, mais pas l'inverse."}, {"q": "Tous les moments de vérité sont des points de contact.", "answer": true, "explanation": "Un moment de vérité est un point de contact décisif."}, {"q": "Le parcours d'achat classique compte 6 étapes, de la prise de conscience à la recommandation.", "answer": true, "explanation": "Prise de conscience, considération, décision/achat, expérience/utilisation, fidélisation, recommandation."}, {"q": "La cartographie du parcours ne concerne que les étapes avant l'achat.", "answer": false, "explanation": "Elle couvre l'avant, le pendant et l'après-achat."}, {"q": "Un service client et une newsletter sont des points de contact après l'achat.", "answer": true, "explanation": "Tout comme le programme de fidélité."}, {"q": "L'un des objectifs de la cartographie est d'augmenter les conversions.", "answer": true, "explanation": "En repérant les blocages et les moments clés, on met en place des actions concrètes."}, {"q": "La cartographie est un document figé, réalisé une fois pour toutes.", "answer": false, "explanation": "C'est un outil vivant, à affiner avec les données clients."}, {"q": "L'obligation de créer un compte pour commander est un exemple de point de friction à l'étape d'achat.", "answer": true, "explanation": "Exemple de la trame de consolidation, avec le temps de chargement."}, {"q": "Les moments de vérité sont identiques pour tous les consommateurs.", "answer": false, "explanation": "Ils peuvent varier d'une personne à l'autre : il faut observer."}, {"q": "L'affect et le travail sur la marque influencent l'impact des moments de vérité.", "answer": true, "explanation": "D'où l'importance du branding."}, {"q": "Le taux d'abandon de panier est une donnée utile pour repérer des moments de vérité.", "answer": true, "explanation": "Il fait partie de l'analyse des données (avec les clics et les réclamations)."}, {"q": "La relance de panier abandonné est un exemple d'automatisation qui réduit la friction.", "answer": true, "explanation": "Tout comme le paiement en 1 clic."}, {"q": "Dans la grille de priorisation, un point d'importance faible est un moment de vérité.", "answer": false, "explanation": "Haute importance = moment de vérité ; faible = point secondaire."}, {"q": "Poster un avis sur Trustpilot correspond à l'étape de recommandation.", "answer": true, "explanation": "Le client devient ambassadeur."}, {"q": "Avant de lancer une opportunité d'amélioration, l'entreprise analyse notamment son coût et sa faisabilité.", "answer": true, "explanation": "Ainsi que l'alignement avec les valeurs de la marque et la cohérence omnicanale."}], "qcm": [{"q": "Quelle est la bonne chronologie du parcours d'achat ?", "options": ["Considération → Prise de conscience → Achat → Recommandation → Fidélisation → Utilisation", "Prise de conscience → Considération → Décision/Achat → Expérience/Utilisation → Fidélisation → Recommandation", "Achat → Prise de conscience → Considération → Fidélisation → Utilisation → Recommandation", "Prise de conscience → Achat → Considération → Recommandation → Utilisation → Fidélisation"], "answer": [1], "explanation": "Les 6 étapes dans l'ordre."}, {"q": "Le client regarde des tests YouTube et consulte des comparateurs. À quelle étape est-il ?", "options": ["Prise de conscience", "Considération", "Fidélisation", "Recommandation"], "answer": [1], "explanation": "Il cherche des informations et compare."}, {"q": "Quels sont des points de contact pendant l'achat ? (plusieurs réponses)", "options": ["Vendeur en magasin", "Site e-commerce", "Appli mobile", "Bouche-à-oreille"], "answer": [0, 1, 2], "explanation": "Le bouche-à-oreille intervient avant l'achat."}, {"q": "Quels sont les trois objectifs du travail sur les points de contact ?", "options": ["Identifier, comprendre/analyser, optimiser", "Créer, vendre, livrer", "Attirer, convertir, facturer", "Voir, penser, faire"], "answer": [0], "explanation": "Optimiser = réduire les frictions et renforcer la satisfaction."}, {"q": "Pourquoi cartographier un parcours client ? (plusieurs réponses)", "options": ["Identifier les blocages qui font perdre des clients", "Repérer les moments clés de satisfaction et de fidélité", "Mettre en place des actions concrètes", "Supprimer tous les canaux digitaux"], "answer": [0, 1, 2], "explanation": "Pour améliorer l'expérience et augmenter les conversions."}, {"q": "Quelles lignes trouve-t-on dans la cartographie de Different Factory ? (plusieurs réponses)", "options": ["Objectifs clients", "Points de contact (canal)", "Attentes, douleurs, émotions", "Cours de bourse de l'entreprise"], "answer": [0, 1, 2], "explanation": "Étape, objectifs, points de contact, attentes, douleurs, émotions."}, {"q": "Un moment de vérité est :", "options": ["N'importe quelle interaction client-marque", "Un point de contact décisif qui fait basculer la perception et la décision", "Une campagne publicitaire", "Le moment du paiement uniquement"], "answer": [1], "explanation": "Le client dit « oui, je fais confiance » ou « non, je pars ailleurs »."}, {"q": "Quelles sont les 4 étapes pour identifier les moments de vérité ?", "options": ["Lister → Observer et collecter → Évaluer l'impact → Prioriser", "Prioriser → Lister → Vendre → Mesurer", "Observer → Supprimer → Automatiser → Vendre", "Évaluer → Lister → Publier → Fidéliser"], "answer": [0], "explanation": "Lister les points de contact, collecter des données, évaluer (enchante ou bloque ?), prioriser."}, {"q": "Quelles sources de données servent à observer les points de contact ? (plusieurs réponses)", "options": ["Feedback clients (avis, enquêtes)", "Taux d'abandon de panier, clics, réclamations", "Tests utilisateurs (observation directe)", "L'horoscope du client"], "answer": [0, 1, 2], "explanation": "Feedback, analyse de données et observation directe."}, {"q": "Dans la trame de consolidation, quelles frictions sont citées à l'étape « Considération » ? (plusieurs réponses)", "options": ["Photos de mauvaise qualité", "Avis négatifs non traités", "Pub intrusive", "Retours compliqués"], "answer": [0, 1], "explanation": "La pub intrusive relève de la prise de conscience ; les retours compliqués, de la fidélisation."}, {"q": "Quelle opportunité d'amélioration répond à l'hésitation de l'étape « Considération » ?", "options": ["Fournir des preuves sociales et un contenu comparatif", "Augmenter la pression publicitaire", "Supprimer la fiche produit", "Rendre la création de compte obligatoire"], "answer": [0], "explanation": "Rassurer avec des avis et des comparatifs."}, {"q": "Quelles émotions sont associées à l'étape d'achat (Do) ?", "options": ["Curiosité et doute", "Excitation et peur de se tromper", "Fierté uniquement", "Indifférence"], "answer": [1], "explanation": "D'où l'importance des preuves de sécurité et d'un checkout simple."}, {"q": "Selon quels critères une opportunité d'amélioration est-elle analysée ? (plusieurs réponses)", "options": ["Coût", "Faisabilité", "Alignement avec les valeurs et la marque", "Cohérence avec la stratégie omnicanale"], "answer": [0, 1, 2, 3], "explanation": "Tous ces critères figurent dans « Pour aller plus loin »."}, {"q": "Quels sont les apports de l'automatisation selon le cours ? (plusieurs réponses)", "options": ["Gagner en réactivité", "Personnaliser à grande échelle", "Réduire la friction", "Supprimer tout contact humain"], "answer": [0, 1, 2], "explanation": "Mails automatiques, messages adaptés au comportement, paiement en 1 clic, relance panier."}, {"q": "Quels mots-clés résument la slide « À retenir » sur les moments de vérité ? (plusieurs réponses)", "options": ["Émotion", "Observation", "Standardisation", "Prix"], "answer": [0, 1], "explanation": "L'affect (branding) et l'observation des comportements."}], "open_questions": [{"question": "Définissez point de contact et moment de vérité, puis expliquez leur relation.", "answer": "**Point de contact** : toute interaction entre un client et une marque au cours du parcours (pub, site, vendeur, SAV…).\n\n**Moment de vérité** : point de contact **décisif** qui influence fortement la perception et la décision. Le client y dit « oui, je fais confiance » ou « non, je pars ailleurs ».\n\n**Relation** : tous les moments de vérité sont des points de contact, mais tous les points de contact ne sont pas des moments de vérité. *Ex.* : recevoir une newsletter est un simple point de contact ; un problème de livraison mal géré par le SAV est un moment de vérité."}, {"question": "Qu'est-ce qu'une cartographie du parcours client ? À quoi sert-elle et comment la construire ?", "answer": "**Définition** : représentation visuelle de toutes les étapes qu'un client traverse avant, pendant et après l'achat.\n\n**Utilité** : identifier les blocages, repérer les moments clés, mettre en place des actions concrètes pour améliorer l'expérience et augmenter les conversions.\n\n**Construction** : en colonnes, les étapes (See/Think/Do/Care ou les 6 étapes) ; en lignes, les points de contact, les actions du client, les émotions, les points de satisfaction, les points de friction et les opportunités d'amélioration. Ensuite, chaque opportunité est évaluée (coût, faisabilité, alignement avec la marque, cohérence omnicanale). C'est un **outil vivant**."}, {"question": "Décrivez la méthode pour identifier les moments de vérité.", "answer": "1. **Lister** les points de contact (pub → site → panier → paiement → livraison → SAV).\n2. **Observer et collecter des données** : avis, enquêtes, taux d'abandon de panier, clics, réclamations, tests utilisateurs.\n3. **Évaluer l'impact** : ça enchante (plus de confiance) ou ça bloque (relation détruite) ?\n4. **Prioriser** : haute importance = moment de vérité à maîtriser absolument ; moyenne = à améliorer ; faible = secondaire. Recommencer au besoin.\n\nÀ garder en tête : l'**émotion** (branding) et l'**observation** (ça varie selon les personnes et le contexte)."}, {"question": "En quoi l'automatisation peut-elle améliorer une stratégie omnicanale ? Donnez des exemples et une limite.", "answer": "Trois apports : **réactivité** (mails automatiques, suivi de commande, FAQ) ; **personnalisation à grande échelle** (messages selon le comportement : produit consulté, anniversaire) ; **moins de friction** (paiement en 1 clic, relance de panier abandonné).\n\n*Limite (réflexion personnelle)* : une automatisation mal calibrée produit une communication générique ou trop insistante, ce qui crée une **nouvelle friction**. Aux moments de vérité sensibles (réclamation), le contact humain reste souvent préférable."}], "exercises": [{"title": "Étude de cas — Cartographier le parcours d'un client Hurpeau Mousist", "statement": "Un couple fait construire une maison et cherche un **escalier sur mesure**. Construisez une cartographie simplifiée (See / Think / Do / Care) et identifiez 2 moments de vérité.", "questions": ["Pour chaque étape : points de contact, émotions, friction, opportunité.", "Quels sont les moments de vérité ? Justifiez.", "Proposez une action d'automatisation."], "answer": "*Corrigé type (hypothèses).*\n\n| Étape | Points de contact | Émotions | Friction | Opportunité |\n|---|---|---|---|---|\n| **See** | Pinterest, Instagram, recommandation de l'architecte | Inspiration, curiosité | Marque peu visible | Contenus « avant/après », partenariats avec des architectes |\n| **Think** | Site, avis Google, showroom, visite technique | Doute sur le prix et le rendu | Pas de prix indicatif, délai de devis | Simulateur de budget, visualisation 3D, devis rapide |\n| **Do** | Devis, signature, acompte, pose | Excitation, peur de se tromper | Délais de pose flous | Suivi de chantier par SMS, planning clair |\n| **Care** | SAV, conseils d'entretien, avis | Fierté ou frustration | Pas de suivi après la pose | Mail J+30, demande d'avis, parrainage |\n\n**Moments de vérité** : (1) la **visite technique et le devis** : c'est là que le couple décide de faire confiance ou de comparer ailleurs ; (2) le **jour de la pose** : propreté, respect du délai, qualité perçue. Ils conditionnent avis et recommandation.\n\n**Automatisation** : envoi automatique du devis avec visualisation 3D sous 48 h, relance si pas de réponse sous 7 jours, mail de demande d'avis après la pose."}, {"title": "Exercice — Point de contact ou moment de vérité ?", "statement": "Classez : (a) recevoir la newsletter mensuelle ; (b) un colis arrivé abîmé et la réaction du SAV ; (c) voir une affiche dans le métro ; (d) l'étape de paiement qui plante au moment de valider.", "questions": ["Simple point de contact ou moment de vérité ? Justifiez."], "answer": "(a) **Point de contact** : interaction faible, rarement décisive.\n(b) **Moment de vérité** : la réaction du SAV fait basculer la relation, en confiance ou en départ.\n(c) **Point de contact** : sensibilisation (See).\n(d) **Moment de vérité** : une friction bloquante qui peut détruire la vente immédiatement.\n\nRappel : cela dépend du client et du contexte. Il faut observer."}], "resources": []}, {"id": "omni-04", "title": "Séance 4 — Tunnel de vente, KPI & ajustements", "subtitle": "Classe inversée à maîtriser pour le 03/11 : funnel, inbound marketing, TOFU/MOFU/BOFU, lead magnet, landing page, KPI omnicanaux, données", "date": "03/11/2026", "status": "vu", "sources": ["04 - 2026.11.03 - Cours Stratégie Omnicanale Classe inversée.pdf"], "objectives": ["Définir le funnel (tunnel) de vente et le relier à AIDA et See-Think-Do-Care.", "Comprendre l'inbound marketing et ses étapes (TOFU, MOFU, BOFU).", "Distinguer lead magnet et landing page.", "Connaître les KPI essentiels d'une stratégie omnicanale et le rôle des données."], "summary": [{"title": "1. Le funnel (tunnel) de vente", "body": "**Définition** : le **chemin que suit un prospect** depuis la **découverte** d'une marque jusqu'à l'**achat**, voire la **fidélisation**. C'est une représentation à la fois **marketing et commerciale**, fondée sur les modèles vus avant (**AIDA**, **See-Think-Do-Care**).\n\n> « Le funnel de vente, c'est la route qu'on construit pour que le client avance dessus. »\n\n**Synonymes** : entonnoir de conversion, funnel marketing.\n\n**Étapes du funnel marketing** : Découverte → Évaluation → Achat → Fidélisation.\n\n**L'entonnoir de conversion en 4 étapes** (version inbound) :\n1. **Attirer** l'internaute par le contenu (inconnu → visiteur)\n2. **Convertir** le visiteur en **lead qualifié** (visiteur → prospect)\n3. **Transformer** le prospect en **client**\n4. **Fidéliser** (client → **ambassadeur**)\n\n**Marketing & funnel** : prospect **froid** → prospect **chaud** → **lead** → **client** (+ fidélisation)."}, {"title": "2. L'inbound marketing", "body": "**Inbound = attirer naturellement les clients grâce à du contenu utile et pertinent** (plutôt que d'aller les chercher par de la publicité intrusive).\n\n| Étape | Phase du funnel | Statut | Moment du parcours | Outils |\n|---|---|---|---|---|\n| **Attirer** | **TOFU** (Top of the Funnel) | Inconnus → visiteurs | Prise de conscience | Blog, SEO / mots-clés, réseaux sociaux |\n| **Convertir** | **MOFU** (Middle of the Funnel) | Visiteurs → prospects | Considération du besoin | Call-to-action, formulaires, landing pages, contact |\n| **Vendre** | **BOFU** (Bottom of the Funnel) | Prospects → clients | Prise de décision | Marketing automatisé, workflows, CRM, **lead scoring** |\n| **Fidéliser** | (Care) | Clients → ambassadeurs | Évaluation post-achat | Smart content, workflows, newsletter |\n\n*Complément : l'inverse de l'inbound est l'**outbound** marketing, où la marque va chercher le client (publicité, prospection, démarchage).*"}, {"title": "3. Bon à savoir : lead magnet et landing page", "body": "| | **Lead magnet** = l'**appât** | **Landing page** = l'**outil de capture** |\n|---|---|---|\n| Définition | Contenu **gratuit et à forte valeur**, offert **en échange d'un contact** (ex. email) | Page web **unique et dédiée** à une offre ou une action précise |\n| Objectif | **Attirer** des prospects | **Convertir** (inscription, téléchargement, achat) |\n| Exemples / caractéristiques | Ebook, webinar, essai gratuit | **Sans distraction**, **call-to-action clair**, **formulaire simple** |"}, {"title": "4. Exemple de parcours complet", "body": "| Phase | Ce qui se passe |\n|---|---|\n| **TOFU** | Un prospect découvre un **article de blog** |\n| **MOFU** | Il clique sur un lien vers une **landing page** proposant un **ebook gratuit**. Il donne son mail et **devient lead** |\n| **BOFU** | L'entreprise envoie une **série de mails personnalisés**, puis propose une **démo gratuite** |\n| **CARE** | Après l'achat, elle envoie un **programme de fidélité** |"}, {"title": "5. Les KPI essentiels : attirer et faire acheter", "body": "| Famille | KPI | Note du cours |\n|---|---|---|\n| **Acquisition** (amener du trafic) | Trafic omnicanal total (web + magasin + app) · **CTR** (Click-Through Rate, taux de clic) des campagnes · **CAC** (coût d'acquisition client) · Reach et impressions (social, paid) | Le trafic **cross-canal** doit progresser, pas seulement un canal isolé |\n| **Conversion** (faire passer à l'achat) | **Taux de conversion** (web / magasin) · **Panier moyen** | La **cohérence omnicanale** augmente la conversion globale |\n| **Performance des canaux de distribution** | Part des ventes par canal (magasin, web, marketplace, app) · Poids d'un canal (ex. **click & collect**) · **Taux de retours** · **Disponibilité produit / rupture** | Le succès omnicanal dépend de la **fluidité logistique** |\n\n*Complément (formules utiles) : CTR = clics ÷ impressions × 100 · taux de conversion = commandes ÷ visites × 100 · panier moyen = CA ÷ nombre de commandes · CAC = dépenses d'acquisition ÷ nouveaux clients.*"}, {"title": "6. Les KPI essentiels : expérience et fidélisation", "body": "| Famille | KPI | Note du cours |\n|---|---|---|\n| **Expérience & engagement** | **NPS** (Net Promoter Score) · Temps d'attente magasin / hotline · Taux d'usage de l'app / espace client · **Taux d'abandon de panier** (web + app) | L'expérience client est un **prédicteur direct de fidélité** |\n| **Fidélisation** | **CLV** (Customer Lifetime Value, valeur vie client) · Fréquence d'achat · **Taux de réachat** · Nombre d'activations du programme de fidélité | Une bonne stratégie omnicanale **augmente la fréquence et la valeur par client** |\n\n*Complément : NPS = % de promoteurs (notes 9–10) − % de détracteurs (notes 0–6), sur la question « Recommanderiez-vous… ? ». Il va de −100 à +100.*"}, {"title": "7. Données ou pas données ?", "body": "- **Sans données** ➔ des **suppositions**.\n- **Avec données** ➔ la **compréhension réelle des comportements**.\n\nLes données permettent de :\n1. **Identifier les étapes clés** du parcours\n2. **Détecter les points de friction et les moments de satisfaction**\n3. **Mesurer l'efficacité des optimisations**"}], "key_points": ["Funnel = chemin du prospect, de la découverte à l'achat et à la fidélisation ; fondé sur AIDA et See-Think-Do-Care.", "Entonnoir en 4 étapes : attirer → convertir en lead → transformer en client → fidéliser.", "Prospect froid → prospect chaud → lead → client.", "Inbound = attirer naturellement par du contenu utile et pertinent.", "TOFU (attirer : blog, SEO, social) → MOFU (convertir : CTA, formulaires, landing pages) → BOFU (vendre : automation, CRM, lead scoring) → fidéliser.", "Lead magnet = l'appât (ebook, webinar, essai gratuit) ; landing page = l'outil de capture (sans distraction, CTA clair, formulaire simple).", "KPI d'acquisition : trafic omnicanal, CTR, CAC, reach et impressions.", "KPI de conversion : taux de conversion, panier moyen ; KPI de distribution : part des ventes par canal, poids du click & collect, taux de retours, ruptures.", "KPI d'expérience : NPS, temps d'attente, usage de l'app, abandon de panier ; KPI de fidélisation : CLV, fréquence, réachat, activations fidélité.", "Sans données = suppositions ; avec données = compréhension réelle (étapes clés, frictions et satisfactions, efficacité des optimisations)."], "traps": ["Lead magnet ≠ landing page : l'appât (le contenu offert) vs l'outil de capture (la page).", "MOFU = convertir (visiteur → lead) ; BOFU = vendre (prospect → client).", "Un visiteur devient lead quand il laisse ses coordonnées (ex. son email en échange d'un ebook).", "CTR = taux de clic, pas taux de conversion.", "CAC = coût pour acquérir un client ; CLV = valeur que rapporte un client sur toute sa relation avec la marque.", "En omnicanal, c'est le trafic cross-canal qui doit progresser, pas un canal isolé."], "glossary": [{"term": "Funnel / tunnel de vente", "definition": "Chemin du prospect de la découverte de la marque jusqu'à l'achat, voire la fidélisation. Aussi appelé entonnoir de conversion."}, {"term": "Inbound marketing", "definition": "Attirer naturellement les clients grâce à du contenu utile et pertinent."}, {"term": "TOFU", "definition": "Top of the Funnel : attirer des inconnus devenus visiteurs (blog, SEO, réseaux sociaux). Prise de conscience."}, {"term": "MOFU", "definition": "Middle of the Funnel : convertir les visiteurs en prospects (CTA, formulaires, landing pages). Considération."}, {"term": "BOFU", "definition": "Bottom of the Funnel : transformer les prospects en clients (marketing automatisé, workflows, CRM, lead scoring). Décision."}, {"term": "Lead", "definition": "Prospect qui a laissé ses coordonnées et manifesté un intérêt."}, {"term": "Lead magnet", "definition": "Contenu gratuit à forte valeur offert en échange d'un contact (ebook, webinar, essai gratuit). « L'appât »."}, {"term": "Landing page", "definition": "Page web unique dédiée à une offre précise, sans distraction, avec un call-to-action clair et un formulaire simple. « L'outil de capture »."}, {"term": "Call-to-action (CTA)", "definition": "Bouton ou message qui incite à une action précise (« Télécharger », « Réserver une démo »)."}, {"term": "Lead scoring", "definition": "Notation des leads selon leur maturité ou leur intérêt, pour prioriser l'action commerciale."}, {"term": "CTR", "definition": "Click-Through Rate : taux de clic d'une campagne."}, {"term": "CAC", "definition": "Coût d'acquisition client."}, {"term": "Panier moyen", "definition": "Montant moyen dépensé par commande."}, {"term": "NPS", "definition": "Net Promoter Score : mesure de la propension des clients à recommander la marque."}, {"term": "CLV", "definition": "Customer Lifetime Value : valeur vie client, ce que rapporte un client sur toute sa relation avec la marque."}, {"term": "Taux de réachat", "definition": "Part des clients qui achètent de nouveau."}], "qcb": [{"q": "Le funnel de vente s'appuie sur les modèles AIDA et See-Think-Do-Care.", "answer": true, "explanation": "C'est la représentation marketing et commerciale de ces modèles."}, {"q": "Le funnel s'arrête toujours au moment de l'achat.", "answer": false, "explanation": "Il va de la découverte à l'achat, voire jusqu'à la fidélisation."}, {"q": "L'inbound marketing consiste à attirer naturellement les clients via du contenu utile et pertinent.", "answer": true, "explanation": "Définition du cours."}, {"q": "TOFU signifie « Top of the Funnel » et correspond à l'étape « attirer ».", "answer": true, "explanation": "Blog, SEO et réseaux sociaux attirent des inconnus devenus visiteurs."}, {"q": "Le lead scoring est un outil de l'étape TOFU.", "answer": false, "explanation": "Il relève du BOFU (vendre), avec le CRM et le marketing automatisé."}, {"q": "Un lead magnet est une page web dédiée à une offre précise.", "answer": false, "explanation": "Ça, c'est la landing page. Le lead magnet est le contenu gratuit offert (l'appât)."}, {"q": "Une bonne landing page est sans distraction, avec un call-to-action clair et un formulaire simple.", "answer": true, "explanation": "Caractéristiques citées dans le cours."}, {"q": "Dans l'exemple du cours, le prospect devient lead lorsqu'il donne son email pour recevoir un ebook.", "answer": true, "explanation": "Étape MOFU."}, {"q": "Le CTR est le coût d'acquisition d'un client.", "answer": false, "explanation": "Le CTR est le taux de clic. Le coût d'acquisition est le CAC."}, {"q": "Le panier moyen est un KPI de conversion.", "answer": true, "explanation": "Avec le taux de conversion."}, {"q": "Le taux de retours est un KPI de performance des canaux de distribution.", "answer": true, "explanation": "Avec la part des ventes par canal, le poids du click & collect et les ruptures."}, {"q": "Le NPS est un KPI de fidélisation financière comme la CLV.", "answer": false, "explanation": "Le cours classe le NPS dans l'expérience et l'engagement ; la CLV dans la fidélisation."}, {"q": "Selon le cours, l'expérience client est un prédicteur direct de fidélité.", "answer": true, "explanation": "Note associée aux KPI d'expérience."}, {"q": "En omnicanal, il suffit qu'un seul canal voie son trafic progresser.", "answer": false, "explanation": "Le trafic cross-canal doit progresser, pas seulement un canal isolé."}, {"q": "Sans données, une entreprise ne peut faire que des suppositions sur ses clients.", "answer": true, "explanation": "Avec données, elle comprend réellement les comportements."}], "qcm": [{"q": "Quelles appellations désignent le funnel de vente ? (plusieurs réponses)", "options": ["Tunnel de vente", "Entonnoir de conversion", "Funnel marketing", "Silo commercial"], "answer": [0, 1, 2], "explanation": "Synonymes cités dans le cours."}, {"q": "Remettez dans l'ordre l'entonnoir de conversion en 4 étapes :", "options": ["Attirer → Convertir en lead → Transformer en client → Fidéliser", "Convertir → Attirer → Fidéliser → Transformer", "Fidéliser → Attirer → Convertir → Transformer", "Transformer → Convertir → Attirer → Fidéliser"], "answer": [0], "explanation": "Inconnu → visiteur → prospect → client → ambassadeur."}, {"q": "Quels outils correspondent au TOFU ? (plusieurs réponses)", "options": ["Blog", "SEO / mots-clés", "Réseaux sociaux", "Lead scoring"], "answer": [0, 1, 2], "explanation": "Le lead scoring relève du BOFU."}, {"q": "Quels outils correspondent au MOFU ? (plusieurs réponses)", "options": ["Call-to-action", "Formulaires", "Landing pages", "Newsletter de fidélisation"], "answer": [0, 1, 2], "explanation": "La newsletter relève de la fidélisation."}, {"q": "Quels outils correspondent au BOFU ? (plusieurs réponses)", "options": ["Marketing automatisé", "Workflows", "CRM", "SEO"], "answer": [0, 1, 2], "explanation": "Le SEO relève du TOFU."}, {"q": "À quel moment du parcours correspond le MOFU ?", "options": ["Prise de conscience", "Considération du besoin", "Prise de décision", "Évaluation post-achat"], "answer": [1], "explanation": "TOFU = prise de conscience ; MOFU = considération ; BOFU = décision."}, {"q": "Quels sont des exemples de lead magnet ? (plusieurs réponses)", "options": ["Ebook", "Webinar", "Essai gratuit", "Page de paiement"], "answer": [0, 1, 2], "explanation": "Contenus gratuits à forte valeur échangés contre un contact."}, {"q": "L'objectif d'une landing page est de :", "options": ["Attirer du trafic par le SEO", "Convertir (inscription, téléchargement, achat)", "Mesurer le NPS", "Gérer les retours produits"], "answer": [1], "explanation": "La landing page est l'outil de capture."}, {"q": "Dans l'exemple du cours, que fait l'entreprise en phase BOFU ?", "options": ["Publie un article de blog", "Envoie des mails personnalisés puis propose une démo gratuite", "Envoie un programme de fidélité", "Achète des espaces TV"], "answer": [1], "explanation": "Le blog relève du TOFU, la fidélité du Care."}, {"q": "Quels sont des KPI d'acquisition ? (plusieurs réponses)", "options": ["Trafic omnicanal total", "CTR des campagnes", "Coût d'acquisition client (CAC)", "Taux de réachat"], "answer": [0, 1, 2], "explanation": "Le réachat est un KPI de fidélisation."}, {"q": "Quels sont des KPI de performance des canaux de distribution ? (plusieurs réponses)", "options": ["Part des ventes par canal", "Poids du click & collect", "Disponibilité produit / rupture", "NPS"], "answer": [0, 1, 2], "explanation": "Le NPS mesure l'expérience."}, {"q": "Quels sont des KPI de fidélisation ? (plusieurs réponses)", "options": ["CLV", "Fréquence d'achat", "Nombre d'activations du programme fidélité", "Reach"], "answer": [0, 1, 2], "explanation": "Le reach est un KPI d'acquisition."}, {"q": "Une campagne obtient 50 000 impressions et 1 000 clics. Son CTR est de :", "options": ["0,5 %", "2 %", "5 %", "20 %"], "answer": [1], "explanation": "1 000 ÷ 50 000 × 100 = 2 %."}, {"q": "Un e-shop réalise 60 000 € de CA avec 1 200 commandes. Le panier moyen est de :", "options": ["20 €", "50 €", "72 €", "500 €"], "answer": [1], "explanation": "60 000 ÷ 1 200 = 50 €."}, {"q": "Que permettent les données, selon le cours ? (plusieurs réponses)", "options": ["Identifier les étapes clés du parcours", "Détecter frictions et moments de satisfaction", "Mesurer l'efficacité des optimisations", "Remplacer toute stratégie"], "answer": [0, 1, 2], "explanation": "Elles éclairent la stratégie, elles ne la remplacent pas."}, {"q": "Sur 100 répondants : 50 donnent 9–10, 30 donnent 7–8, 20 donnent 0–6. Quel est le NPS ?", "options": ["+30", "+50", "+80", "−20"], "answer": [0], "explanation": "*Complément* : NPS = 50 % − 20 % = +30 (les 7–8 sont passifs)."}], "open_questions": [{"question": "Qu'est-ce qu'un funnel de vente ? Présentez ses étapes et son lien avec les modèles de parcours.", "answer": "**Définition** : le chemin que suit un prospect depuis la découverte de la marque jusqu'à l'achat, voire la fidélisation. C'est une représentation marketing et commerciale, « la route qu'on construit pour que le client avance dessus ».\n\n**Étapes** : attirer (inconnu → visiteur), convertir en lead (visiteur → prospect), transformer en client, fidéliser (client → ambassadeur). Autrement dit : prospect froid → prospect chaud → lead → client.\n\n**Lien** : il traduit en actions **AIDA** (Attention → Action) et **See-Think-Do-Care** (TOFU ≈ See, MOFU ≈ Think, BOFU ≈ Do, fidélisation ≈ Care).\n\n**Exemple** : article de blog → landing page avec ebook → mails personnalisés et démo → programme de fidélité."}, {"question": "Distinguez lead magnet et landing page et montrez comment ils fonctionnent ensemble.", "answer": "**Lead magnet** (« l'appât ») : contenu gratuit et à forte valeur (ebook, webinar, essai) offert en échange d'un contact. Objectif : **attirer**.\n\n**Landing page** (« l'outil de capture ») : page unique dédiée à l'offre, sans distraction, avec un CTA clair et un formulaire simple. Objectif : **convertir**.\n\n**Ensemble** : la landing page présente le lead magnet ; le visiteur remplit le formulaire et devient **lead** (MOFU). On peut ensuite le nourrir par des mails automatisés (BOFU)."}, {"question": "Quels KPI suivriez-vous pour piloter une stratégie omnicanale ? Classez-les par famille.", "answer": "- **Acquisition** : trafic omnicanal total (web + magasin + app), CTR, CAC, reach et impressions. Le trafic **cross-canal** doit progresser.\n- **Conversion** : taux de conversion (web et magasin), panier moyen.\n- **Performance des canaux** : part des ventes par canal, poids du click & collect, taux de retours, ruptures. La **fluidité logistique** conditionne le succès.\n- **Expérience** : NPS, temps d'attente, usage de l'app, abandon de panier. L'expérience prédit la fidélité.\n- **Fidélisation** : CLV, fréquence d'achat, réachat, activations du programme de fidélité.\n\n**Conclusion** : choisir des KPI à chaque étape du funnel, et les lire ensemble plutôt que canal par canal."}, {"question": "« Sans données, des suppositions. » Expliquez cette affirmation.", "answer": "Sans données, l'entreprise décide sur des **intuitions**. Avec des données (analytics, CRM, avis, enquêtes, ventes par canal), elle **comprend réellement les comportements**.\n\nLes données servent à : (1) **identifier les étapes clés** du parcours ; (2) **détecter les frictions** (abandon de panier, retours) et **les moments de satisfaction** (NPS, avis) ; (3) **mesurer l'efficacité des optimisations** (avant/après une nouvelle landing page, par exemple).\n\nC'est ce qui permet d'**ajuster** la stratégie omnicanale en continu."}], "exercises": [{"title": "Cas — Construire le funnel inbound de Hurpeau Mousist", "statement": "Hurpeau Mousist, fabricant d'escaliers sur mesure, veut générer plus de demandes de devis grâce au digital.", "questions": ["Proposez une action TOFU, MOFU, BOFU et fidélisation.", "Quel lead magnet et quelle landing page proposez-vous ?", "Choisissez 5 KPI pour piloter ce funnel."], "answer": "*Corrigé type (hypothèses).*\n\n| Phase | Action |\n|---|---|\n| **TOFU** | Articles de blog SEO (« Quel escalier pour une petite surface ? »), Pinterest et Instagram avant/après |\n| **MOFU** | Landing page « Guide gratuit : bien choisir son escalier sur mesure » avec formulaire (nom, email, type de projet) |\n| **BOFU** | Séquence de mails automatisés (cas clients, matériaux, délais), puis proposition de **visite technique gratuite** ou de **simulation 3D** ; lead scoring selon le projet (construction ou rénovation, budget) |\n| **Fidélisation** | Mail de suivi après la pose, conseils d'entretien, demande d'avis Google, parrainage |\n\n**Lead magnet** : guide PDF ou simulateur de budget. **Landing page** : une seule offre, photos de réalisations, formulaire court, CTA « Recevoir mon guide ».\n\n**KPI** : trafic du blog et reach (acquisition) · taux de conversion de la landing page en leads · taux de transformation lead → devis → commande · CAC par canal · NPS ou note Google après la pose."}, {"title": "Exercice — Calculs de KPI", "statement": "Une enseigne omnicanale, sur un mois : 200 000 impressions publicitaires, 4 000 clics, 40 000 visites du site, 800 commandes en ligne, 64 000 € de CA en ligne, 10 000 € de dépenses publicitaires, 400 nouveaux clients.", "questions": ["Calculez le CTR.", "Calculez le taux de conversion du site.", "Calculez le panier moyen.", "Calculez le CAC."], "answer": "1. **CTR** = 4 000 ÷ 200 000 × 100 = **2 %**\n2. **Taux de conversion** = 800 ÷ 40 000 × 100 = **2 %**\n3. **Panier moyen** = 64 000 ÷ 800 = **80 €**\n4. **CAC** = 10 000 ÷ 400 = **25 € par nouveau client**\n\n*Lecture : comparer le CAC (25 €) à la valeur vie client (CLV). Si un client rapporte bien plus de 25 € sur la durée, l'acquisition est rentable.*"}], "resources": []}]}, {"id": "strategie-rh", "order": 5, "folder": "05. STRATEGIE DES RESSOUCES HUMAINE", "title": "Stratégie des ressources humaines", "short": "Stratégie RH", "teacher": "Sandrine Rath", "description": "Diagnostic RH au service d'un projet commercial : SWOT RH, cartographie des compétences, analyse des écarts, priorités et travail hybride.", "key_dates": [], "exam_info": "Critères d'évaluation des cas : **cohérence avec le projet commercial**, **exactitude des calculs**, **qualité des justifications**, **respect des contraintes**, **distinction entre faits et hypothèses**. Plusieurs propositions sont recevables si elles sont argumentées. À l'oral : présenter d'abord la priorité la plus urgente.", "courses": [{"id": "rh-01", "title": "Séance 1 — Cas NovaWear : diagnostic RH d'un projet commercial", "subtitle": "Enjeux, SWOT RH, cartographie des compétences, écarts et risques, priorités, travail hybride", "date": "", "status": "vu", "sources": ["CAS PRATIQUE SEANCE 1 COMMERCE MARKETING STRATEGIE RH.pdf"], "objectives": ["Relier un projet commercial à ses conséquences sur les activités et l'organisation d'une équipe.", "Construire un SWOT RH justifié par les faits.", "Établir une cartographie des compétences et calculer les écarts avec les cibles.", "Hiérarchiser des priorités RH et managériales, et repérer les risques du travail hybride.", "Distinguer les faits des hypothèses."], "summary": [{"title": "1. Le cas en bref", "body": "**NovaWear** (
