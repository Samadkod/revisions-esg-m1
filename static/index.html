Cross-canal"], "answer": [3], "explanation": "Les canaux se renforcent (QR code → site), mais sans synchronisation complète (fidélité, panier) : ce n'est pas encore de l'omnicanal.", "level": "difficile"}, {"q": "Mise en situation : une marque veut passer à l'omnicanal. Quelles actions sont prioritaires selon le cours ? (plusieurs réponses)", "options": ["Ouvrir le plus grand nombre possible de nouveaux canaux", "Synchroniser stock, paiement, fidélité et SAV", "Supprimer les points de friction entre canaux", "Donner la même information sur tous les canaux"], "answer": [1, 2, 3], "explanation": "Quantité de canaux ≠ qualité de la stratégie : omnicanal = cohérence + intégration.", "level": "difficile"}, {"q": "Mise en situation : un client met un avis 5 étoiles et recommande la marque à ses amis. Dans quelle étape et avec quel statut ?", "options": ["See, suspect", "Care, ambassadeur", "Think, prospect", "Do, client"], "answer": [1], "explanation": "Feedbacks, témoignages, recommandation = fidélisation (Care), client ambassadeur.", "level": "difficile"}], "open_questions": [{"question": "Distinguez canal de communication et canal de distribution. Expliquez en quoi l'omnicanal les relie.", "answer": "**Canal de communication** : voie par laquelle la marque transmet un message à sa cible pour informer, séduire, convaincre et créer de la relation (digital, print, événementiel, face-à-face, audiovisuel). Verbe clé : **faire connaître**.\n\n**Canal de distribution** : voie par laquelle le produit est mis à disposition du client final pour qu'il puisse l'acheter et le recevoir (magasin, e-commerce, marketplaces, circuits hybrides). Verbe clé : **mettre à disposition**.\n\n**Lien** : l'omnicanal est « l'art de faire dialoguer ces deux univers » pour une expérience client fluide. *Ex.* : une publicité Instagram (communication) renvoie vers un produit réservable en magasin (distribution), avec un stock visible en temps réel."}, {"question": "Présentez le modèle AIDA, ses limites et un modèle plus adapté.", "answer": "**AIDA** : Attention → Intérêt → Désir → Action.\n\n**Limites** : (1) il ignore la **fidélisation et le rachat** ; (2) il est **linéaire**, alors que les parcours réels sont non linéaires, personnalisés et multicanaux.\n\n**Modèle plus adapté : See-Think-Do-Care**. See (sensibilisation, suspect), Think (considération, prospect), Do (achat, client), Care (fidélisation, ambassadeur). Il intègre l'après-achat. On peut aussi représenter le parcours comme une **boucle** (s'informer, comparer, acheter, utiliser, résoudre un problème, racheter ou quitter)."}, {"question": "Comparez multicanal, cross-canal et omnicanal avec un exemple pour chacun.", "answer": "- **Multicanal** : plusieurs canaux non connectés. *Ex.* : j'achète sur le site mais je ne peux pas retourner en magasin.\n- **Cross-canal** : les canaux se renforcent, le client peut passer de l'un à l'autre. *Ex.* : un QR code en magasin renvoie vers la fiche produit du site.\n- **Omnicanal** : canaux intégrés, le client n'a plus conscience de changer de canal. Stocks, paiement, fidélité et SAV sont synchronisés. *Ex.* : commande sur l'appli, retrait en magasin, promo personnalisée par email.\n\nLa différence clé tient dans la **continuité de l'expérience**."}, {"question": "« Plus une entreprise a de canaux, meilleure est sa stratégie omnicanale. » Discutez.", "answer": "**Faux.** Quantité de canaux ≠ qualité de la stratégie.\n\n- Des canaux nombreux mais **en silos** créent des ruptures (information différente, retours impossibles) et donc des **frictions**.\n- L'omnicanal repose sur la **cohérence** et l'**intégration** : les canaux se complètent et communiquent.\n- Le client ne veut pas plus de canaux, il veut un **parcours fluide, simple et sans friction**.\n\nConclusion : mieux vaut peu de canaux bien intégrés que beaucoup de canaux déconnectés."}, {"question": "Qu'est-ce que l'expérience client ? Pourquoi est-elle souvent plus déterminante que le prix ?", "answer": "**CX** : perception globale du client sur la marque, construite par toutes ses interactions avant, pendant et après l'achat. Elle comprend des moments de satisfaction et des points de friction.\n\n**Pourquoi elle prime souvent** : la guerre des prix est sans fin (un concurrent peut toujours faire moins cher), alors qu'une bonne expérience touche l'**affect** et crée de l'**émotion**, donc de la fidélité. Plus de 70 % des consommateurs choisissent une marque pour l'expérience (PwC, Salesforce). Exemples : **Apple** et **Amazon**.\n\n**Nuance** : « souvent, mais pas tout le temps ». Le prix reste décisif pour l'**acquisition** et pour certains produits ou cibles."}, {"question": "Expliquez le phénomène ROPO et ses conséquences pour une enseigne.", "answer": "**ROPO** (Research Online, Purchase Offline) : le client se renseigne en ligne (avis, prix, comparateurs) puis achète en magasin, par exemple pour avoir le produit immédiatement. Environ **70 %** des consommateurs commencent leur parcours en ligne.\n\n**Conséquences** : (1) le digital influence presque toutes les ventes, même physiques ; il faut des fiches produits, des avis et un stock visible en ligne ; (2) il ne faut pas juger un canal sur ses seules ventes directes ; (3) il faut relier les données en ligne et en magasin (programme de fidélité, e-réservation)."}], "exercises": [{"title": "Étude de cas — Diagnostic Hurpeau Mousist (Livrable A)", "statement": "**Hurpeau Mousist** est un fabricant d'**escaliers sur mesure**. En tant que consultants, préparez le diagnostic de la situation client en 1 page.", "questions": ["Formulez l'enjeu du client en une phrase.", "Qui achète, qui prescrit, qui décide ?", "Listez des points de contact physiques et digitaux probables.", "Proposez 3 questions à poser au dirigeant."], "answer": "*Corrigé type : les hypothèses sont à vérifier auprès du dirigeant et par vos recherches.*\n\n1. **Enjeu** : générer davantage de demandes de devis qualifiées et rendre le parcours (de l'inspiration à la pose) fluide entre le digital et le physique.\n2. **Cible** : **acheteurs** = particuliers qui construisent ou rénovent ; **prescripteurs** = architectes, architectes d'intérieur, constructeurs, menuisiers, artisans du bâtiment ; **décideurs** = souvent le couple propriétaire (budget), parfois le maître d'œuvre.\n3. **Points de contact** : site web et formulaire de devis, fiche Google et avis, Instagram et Pinterest (inspiration), Houzz, salons de l'habitat, showroom ou atelier, visite technique et prise de mesures, devis, pose, SAV et entretien, bouche-à-oreille.\n4. **Questions** : d'où viennent vos demandes de devis aujourd'hui ? Quel est votre taux de transformation devis → commande, et pourquoi perdez-vous des projets ? Combien de temps s'écoule entre le premier contact et la pose, et où sont les frictions (délais, prix, visualisation du rendu) ?"}, {"title": "Exercice — Classer les canaux", "statement": "Classez : affichage métro, marketplace Amazon, salon professionnel, newsletter, boutique, conseiller par téléphone, spot TV, click & collect.", "questions": ["Canal de communication ou de distribution ?"], "answer": "**Communication** : affichage métro (print), salon professionnel (événementiel), newsletter (média du canal digital), spot TV (audiovisuel), conseiller par téléphone (face-à-face ou relation).\n**Distribution** : marketplace Amazon, boutique, click & collect (circuit hybride).\n\n*Nuance : la boutique et le conseiller peuvent jouer les deux rôles. C'est justement là que l'omnicanal fait dialoguer les deux univers.*"}], "resources": []}, {"id": "omni-03", "title": "Séance 3 — Points de contact, mapping & moments de vérité", "subtitle": "Classe inversée : étapes du parcours, cartographie, moments de vérité, automatisation", "date": "14/10/2026", "status": "vu", "sources": ["03 - 2026.10.14 - Cours Stratégie Omnicanale Classe inversée.pdf"], "objectives": ["Connaître les 6 étapes classiques du parcours d'achat.", "Définir un point de contact (touchpoint) et un moment de vérité, et savoir les distinguer.", "Savoir construire une cartographie (mapping) du parcours client.", "Comprendre le rôle de l'automatisation dans l'expérience omnicanale."], "summary": [{"title": "1. Les 6 étapes classiques du parcours d'achat", "body": "| Étape | Ce que fait le client | Exemple : baskets |\n|---|---|---|\n| **1. Prise de conscience** | Prend conscience d'un besoin ou découvre une marque | Voit une pub de baskets sur Instagram |\n| **2. Considération** | Cherche des infos, compare, lit des avis, demande conseil | Regarde des tests sur YouTube, des comparateurs |\n| **3. Décision / Achat** | Choisit une option et passe à l'acte | Commande en ligne ou achète en magasin |\n| **4. Expérience / Utilisation** | Vit l'expérience d'utilisation | Teste ses baskets en courant |\n| **5. Fidélisation** | Satisfait, revient acheter ou s'abonne | Rachète la marque, rejoint le programme de fidélité |\n| **6. Recommandation** | Devient ambassadeur | Poste un avis sur Trustpilot, recommande à un ami |\n\nLes points de contact correspondants : pub Insta ➔ YouTube et comparateurs ➔ magasin (échanges humains) ➔ newsletter (astuces), mail promo ➔ programme de fidélité ➔ mail d'incitation à laisser un avis ou récompense en échange d'un avis."}, {"title": "2. Le point de contact (touchpoint)", "body": "**Définition** : **toute interaction** entre un client et une marque au cours de son parcours d'achat.\n\n| Moment | Exemples |\n|---|---|\n| **Avant l'achat** | Pub, réseaux sociaux, site web, bouche-à-oreille |\n| **Pendant l'achat** | Vendeur en magasin, site e-commerce, appli mobile |\n| **Après l'achat** | Service client, newsletters, programme de fidélité |\n\n**Objectifs du travail sur les points de contact** :\n1. **Identifier** tous les points de contact clés\n2. **Comprendre / analyser** leur rôle dans l'expérience client\n3. **Optimiser** chaque interaction pour **réduire les frictions** et **renforcer la satisfaction**"}, {"title": "3. La cartographie du parcours (mapping)", "body": "**Définition** : une **représentation visuelle** de toutes les étapes qu'un client traverse **avant, pendant et après** l'achat d'un produit ou service.\n\n**Pourquoi cartographier ?**\n- Identifier les **blocages** qui font perdre des clients\n- Repérer les **moments clés** qui créent satisfaction et fidélité\n- Mettre en place des **actions concrètes** ➔ améliorer l'expérience et **augmenter les conversions**\n\n**Lignes d'une cartographie** (modèle Different Factory) : étape du parcours · objectifs clients · points de contact (canal) · attentes · **douleurs (pains)** · émotions. D'autres formats existent : experience map, ou « pains et gains » (exemple d'un prêt bancaire)."}, {"title": "4. Trame générale de consolidation (exemple à connaître)", "body": "| Étape | Points de contact | Actions | Émotions | Satisfaction | Friction | Opportunités |\n|---|---|---|---|---|---|---|\n| **Prise de conscience (See)** | Réseaux sociaux, bouche-à-oreille, pub | Découvre un besoin, une pub, une reco | Curiosité, intérêt, doute | Contenu attractif et clair, reco crédible | Pub intrusive, mauvais ciblage | Contenu attractif, visibilité accrue |\n| **Considération (Think)** | Avis clients, site, comparateurs, YouTube | Compare, cherche des avis | Hésitation, recherche de confiance | Fiche produit complète, avis clients | Photos de mauvaise qualité, avis négatifs non traités | Preuves sociales, contenu comparatif |\n| **Achat (Do)** | E-commerce, magasin, appli | Commande, va en magasin | Excitation, peur de se tromper | Checkout simple, preuves de sécurité (avis, badges) | Création de compte obligatoire, temps de chargement | Simplifier, rassurer avec SAV et garantie |\n| **Fidélisation (Care)** | SAV, newsletters, fidélité, réseaux | Utilise, partage son expérience | Satisfaction, frustration, fierté | Bon service client, offre personnalisée, fidélité | Communication générique, retours compliqués | Suivi personnalisé, offres exclusives |\n\n**Pour aller plus loin**, chaque opportunité est ensuite analysée selon : son **coût**, sa **faisabilité**, son **alignement avec les valeurs et la marque**, et sa **cohérence avec la stratégie omnicanale**. ➔ La cartographie est un **outil vivant**, à affiner avec les données clients (expérience terrain)."}, {"title": "5. Moments de vérité vs points de contact", "body": "- **Point de contact** : **toute** interaction client ↔ marque.\n- **Moment de vérité** : un point de contact **décisif**, qui **influence fortement** la perception du client et sa décision. C'est le moment où le client dit « **Oui, je fais confiance à cette marque** » ou « **Non, je pars ailleurs** ».\n\n> **Tous les moments de vérité sont des points de contact, MAIS tous les points de contact ne sont pas des moments de vérité.**\n\nLes moments de vérité sont les **points critiques qui peuvent faire basculer l'expérience** en positif ou en négatif.\n\n*Complément (souvent attendu en culture marketing) : **ZMOT** (Zero Moment of Truth, Google : la recherche en ligne avant l'achat), **FMOT** (First Moment of Truth, P&G : face au produit en rayon), **SMOT** (Second Moment of Truth : l'expérience d'usage).*"}, {"title": "6. Identifier les moments de vérité : la méthode en 4 étapes", "body": "1. **Lister les points de contact existants** : cartographier tous les moments d'interaction (pub → site → ajout au panier → paiement → livraison → SAV).\n2. **Observer et collecter des données** : chercher où ça bloque et où ça enchante (feedback clients, avis, enquêtes ; taux d'abandon de panier, clics, réclamations ; tests utilisateurs).\n3. **Évaluer l'impact de chaque point de contact** : « Ça enchante ? » Est-ce que ça augmente vraiment la confiance ou la satisfaction ? « Ça bloque ? » Est-ce que ça détruit la relation immédiatement ?\n4. **Prioriser les moments critiques** avec une grille simple :\n   - **Haute importance** = moment de vérité ➔ à maîtriser absolument\n   - **Importance moyenne** ➔ points à améliorer\n   - **Faible importance** ➔ points secondaires\n   (et recommencer au besoin)"}, {"title": "7. À retenir : émotion et observation", "body": "- L'**affect** joue énormément sur l'impact (ou non) de chaque moment de vérité, d'où l'importance du **travail sur la marque** (branding ou personal branding). ➔ **ÉMOTION**\n- Il faut **observer** le comportement des consommateurs pour savoir ce qui est un moment de vérité ou non, car **cela varie d'une personne à l'autre**. ➔ **OBSERVATION**\n- Il faut **s'adapter** : le contexte peut changer très vite."}, {"title": "8. Et l'automatisation ?", "body": "| Objectif | Exemples |\n|---|---|\n| **Gagner en réactivité** | Automatiser les mails, le suivi de commande, la FAQ |\n| **Personnaliser à grande échelle** | Mails ou messages adaptés au comportement du client |\n| **Réduire la friction** | Paiement en 1 clic, relance de panier abandonné |"}], "key_points": ["Six étapes : prise de conscience, considération, décision/achat, expérience/utilisation, fidélisation, recommandation.", "Point de contact = toute interaction client ↔ marque (avant, pendant, après l'achat).", "Objectifs : identifier, comprendre/analyser, optimiser (réduire les frictions, renforcer la satisfaction).", "Mapping = représentation visuelle des étapes avant, pendant et après l'achat.", "Pourquoi cartographier : repérer les blocages, les moments clés, puis agir pour augmenter les conversions.", "Lignes d'une carte : étapes, objectifs, points de contact, attentes, douleurs, émotions (+ satisfactions, frictions, opportunités).", "Moment de vérité = point de contact décisif (« oui je fais confiance » / « non je pars »).", "Tous les moments de vérité sont des points de contact, pas l'inverse.", "Méthode : lister → observer et collecter → évaluer (enchante ou bloque ?) → prioriser (haute, moyenne, faible).", "Automatisation : réactivité, personnalisation à grande échelle, réduction de la friction."], "traps": ["Un point de contact n'est pas forcément un moment de vérité : seul un point de contact décisif l'est.", "Le parcours ne s'arrête pas à l'achat : utilisation, fidélisation et recommandation en font partie.", "La cartographie n'est pas figée : c'est un outil vivant à mettre à jour avec les données clients.", "Les moments de vérité varient selon les personnes et le contexte : il faut observer.", "Une opportunité d'amélioration doit être évaluée (coût, faisabilité, alignement avec la marque, cohérence omnicanale) avant d'être lancée."], "glossary": [{"term": "Point de contact / touchpoint", "definition": "Toute interaction entre un client et une marque au cours de son parcours d'achat (avant, pendant, après)."}, {"term": "Moment de vérité", "definition": "Point de contact décisif qui influence fortement la perception du client et sa décision : « Oui, je fais confiance » ou « Non, je pars ailleurs »."}, {"term": "Cartographie / mapping", "definition": "Représentation visuelle de toutes les étapes qu'un client traverse avant, pendant et après l'achat."}, {"term": "Prise de conscience", "definition": "Première étape : le client prend conscience d'un besoin ou découvre une marque."}, {"term": "Considération", "definition": "Le client cherche des infos, compare, lit des avis, demande conseil."}, {"term": "Recommandation", "definition": "Dernière étape : le client devient ambassadeur et recommande la marque (avis, bouche-à-oreille)."}, {"term": "Douleurs (pains)", "definition": "Difficultés et frustrations vécues par le client à une étape du parcours."}, {"term": "Gains", "definition": "Bénéfices et satisfactions attendus ou vécus par le client."}, {"term": "Preuve sociale", "definition": "Éléments rassurants venant d'autres clients (avis, notes, témoignages) qui lèvent l'hésitation."}, {"term": "Taux d'abandon de panier", "definition": "Part des paniers créés mais non payés ; un indicateur clé pour repérer une friction."}, {"term": "Automatisation", "definition": "Usage d'outils pour gagner en réactivité, personnaliser à grande échelle et réduire la friction (relance panier, paiement 1 clic, FAQ)."}, {"term": "ZMOT (complément)", "definition": "Zero Moment of Truth (Google) : moment où le consommateur se renseigne en ligne avant l'achat."}], "qcb": [{"q": "Tous les points de contact sont des moments de vérité.", "answer": false, "explanation": "Tous les moments de vérité sont des points de contact, mais pas l'inverse."}, {"q": "Tous les moments de vérité sont des points de contact.", "answer": true, "explanation": "Un moment de vérité est un point de contact décisif."}, {"q": "Le parcours d'achat classique compte 6 étapes, de la prise de conscience à la recommandation.", "answer": true, "explanation": "Prise de conscience, considération, décision/achat, expérience/utilisation, fidélisation, recommandation."}, {"q": "La cartographie du parcours ne concerne que les étapes avant l'achat.", "answer": false, "explanation": "Elle couvre l'avant, le pendant et l'après-achat."}, {"q": "Un service client et une newsletter sont des points de contact après l'achat.", "answer": true, "explanation": "Tout comme le programme de fidélité."}, {"q": "L'un des objectifs de la cartographie est d'augmenter les conversions.", "answer": true, "explanation": "En repérant les blocages et les moments clés, on met en place des actions concrètes."}, {"q": "La cartographie est un document figé, réalisé une fois pour toutes.", "answer": false, "explanation": "C'est un outil vivant, à affiner avec les données clients."}, {"q": "L'obligation de créer un compte pour commander est un exemple de point de friction à l'étape d'achat.", "answer": true, "explanation": "Exemple de la trame de consolidation, avec le temps de chargement."}, {"q": "Les moments de vérité sont identiques pour tous les consommateurs.", "answer": false, "explanation": "Ils peuvent varier d'une personne à l'autre : il faut observer."}, {"q": "L'affect et le travail sur la marque influencent l'impact des moments de vérité.", "answer": true, "explanation": "D'où l'importance du branding."}, {"q": "Le taux d'abandon de panier est une donnée utile pour repérer des moments de vérité.", "answer": true, "explanation": "Il fait partie de l'analyse des données (avec les clics et les réclamations)."}, {"q": "La relance de panier abandonné est un exemple d'automatisation qui réduit la friction.", "answer": true, "explanation": "Tout comme le paiement en 1 clic."}, {"q": "Dans la grille de priorisation, un point d'importance faible est un moment de vérité.", "answer": false, "explanation": "Haute importance = moment de vérité ; faible = point secondaire."}, {"q": "Poster un avis sur Trustpilot correspond à l'étape de recommandation.", "answer": true, "explanation": "Le client devient ambassadeur."}, {"q": "Avant de lancer une opportunité d'amélioration, l'entreprise analyse notamment son coût et sa faisabilité.", "answer": true, "explanation": "Ainsi que l'alignement avec les valeurs de la marque et la cohérence omnicanale."}, {"q": "Tous les points de contact sont des moments de vérité.", "answer": false, "explanation": "C'est l'inverse : tous les moments de vérité sont des points de contact, mais seuls les points de contact décisifs sont des moments de vérité.", "level": "moyen"}, {"q": "La cartographie du parcours couvre l'avant, le pendant et l'après-achat.", "answer": true, "explanation": "C'est la définition du mapping.", "level": "moyen"}, {"q": "Une relance automatique de panier abandonné sert à réduire la friction.", "answer": true, "explanation": "Le cours la classe dans l'objectif « réduire la friction », avec le paiement en 1 clic.", "level": "moyen"}, {"q": "Une fois réalisée, la cartographie du parcours ne doit plus être modifiée.", "answer": false, "explanation": "C'est un outil vivant, à affiner avec les données clients.", "level": "moyen"}, {"q": "Un même point de contact peut être un moment de vérité pour un client et un point secondaire pour un autre.", "answer": true, "explanation": "Les moments de vérité varient selon les personnes et le contexte : d'où l'importance de l'observation.", "level": "difficile"}, {"q": "Dès qu'une opportunité d'amélioration est repérée sur la carte, il faut la lancer immédiatement.", "answer": false, "explanation": "Elle doit d'abord être analysée : coût, faisabilité, alignement avec la marque, cohérence omnicanale.", "level": "difficile"}], "qcm": [{"q": "Quelle est la bonne chronologie du parcours d'achat ?", "options": ["Considération → Prise de conscience → Achat → Recommandation → Fidélisation → Utilisation", "Prise de conscience → Considération → Décision/Achat → Expérience/Utilisation → Fidélisation → Recommandation", "Achat → Prise de conscience → Considération → Fidélisation → Utilisation → Recommandation", "Prise de conscience → Achat → Considération → Recommandation → Utilisation → Fidélisation"], "answer": [1], "explanation": "Les 6 étapes dans l'ordre."}, {"q": "Le client regarde des tests YouTube et consulte des comparateurs. À quelle étape est-il ?", "options": ["Prise de conscience", "Considération", "Fidélisation", "Recommandation"], "answer": [1], "explanation": "Il cherche des informations et compare."}, {"q": "Quels sont des points de contact pendant l'achat ? (plusieurs réponses)", "options": ["Vendeur en magasin", "Site e-commerce", "Appli mobile", "Bouche-à-oreille"], "answer": [0, 1, 2], "explanation": "Le bouche-à-oreille intervient avant l'achat."}, {"q": "Quels sont les trois objectifs du travail sur les points de contact ?", "options": ["Identifier, comprendre/analyser, optimiser", "Créer, vendre, livrer", "Attirer, convertir, facturer", "Voir, penser, faire"], "answer": [0], "explanation": "Optimiser = réduire les frictions et renforcer la satisfaction."}, {"q": "Pourquoi cartographier un parcours client ? (plusieurs réponses)", "options": ["Identifier les blocages qui font perdre des clients", "Repérer les moments clés de satisfaction et de fidélité", "Mettre en place des actions concrètes", "Supprimer tous les canaux digitaux"], "answer": [0, 1, 2], "explanation": "Pour améliorer l'expérience et augmenter les conversions."}, {"q": "Quelles lignes trouve-t-on dans la cartographie de Different Factory ? (plusieurs réponses)", "options": ["Objectifs clients", "Points de contact (canal)", "Attentes, douleurs, émotions", "Cours de bourse de l'entreprise"], "answer": [0, 1, 2], "explanation": "Étape, objectifs, points de contact, attentes, douleurs, émotions."}, {"q": "Un moment de vérité est :", "options": ["N'importe quelle interaction client-marque", "Un point de contact décisif qui fait basculer la perception et la décision", "Une campagne publicitaire", "Le moment du paiement uniquement"], "answer": [1], "explanation": "Le client dit « oui, je fais confiance » ou « non, je pars ailleurs »."}, {"q": "Quelles sont les 4 étapes pour identifier les moments de vérité ?", "options": ["Lister → Observer et collecter → Évaluer l'impact → Prioriser", "Prioriser → Lister → Vendre → Mesurer", "Observer → Supprimer → Automatiser → Vendre", "Évaluer → Lister → Publier → Fidéliser"], "answer": [0], "explanation": "Lister les points de contact, collecter des données, évaluer (enchante ou bloque ?), prioriser."}, {"q": "Quelles sources de données servent à observer les points de contact ? (plusieurs réponses)", "options": ["Feedback clients (avis, enquêtes)", "Taux d'abandon de panier, clics, réclamations", "Tests utilisateurs (observation directe)", "L'horoscope du client"], "answer": [0, 1, 2], "explanation": "Feedback, analyse de données et observation directe."}, {"q": "Dans la trame de consolidation, quelles frictions sont citées à l'étape « Considération » ? (plusieurs réponses)", "options": ["Photos de mauvaise qualité", "Avis négatifs non traités", "Pub intrusive", "Retours compliqués"], "answer": [0, 1], "explanation": "La pub intrusive relève de la prise de conscience ; les retours compliqués, de la fidélisation."}, {"q": "Quelle opportunité d'amélioration répond à l'hésitation de l'étape « Considération » ?", "options": ["Fournir des preuves sociales et un contenu comparatif", "Augmenter la pression publicitaire", "Supprimer la fiche produit", "Rendre la création de compte obligatoire"], "answer": [0], "explanation": "Rassurer avec des avis et des comparatifs."}, {"q": "Quelles émotions sont associées à l'étape d'achat (Do) ?", "options": ["Curiosité et doute", "Excitation et peur de se tromper", "Fierté uniquement", "Indifférence"], "answer": [1], "explanation": "D'où l'importance des preuves de sécurité et d'un checkout simple."}, {"q": "Selon quels critères une opportunité d'amélioration est-elle analysée ? (plusieurs réponses)", "options": ["Coût", "Faisabilité", "Alignement avec les valeurs et la marque", "Cohérence avec la stratégie omnicanale"], "answer": [0, 1, 2, 3], "explanation": "Tous ces critères figurent dans « Pour aller plus loin »."}, {"q": "Quels sont les apports de l'automatisation selon le cours ? (plusieurs réponses)", "options": ["Gagner en réactivité", "Personnaliser à grande échelle", "Réduire la friction", "Supprimer tout contact humain"], "answer": [0, 1, 2], "explanation": "Mails automatiques, messages adaptés au comportement, paiement en 1 clic, relance panier."}, {"q": "Quels mots-clés résument la slide « À retenir » sur les moments de vérité ? (plusieurs réponses)", "options": ["Émotion", "Observation", "Standardisation", "Prix"], "answer": [0, 1], "explanation": "L'affect (branding) et l'observation des comportements."}, {"q": "Le client poste un avis sur Trustpilot et recommande la marque à un ami. Quelle étape ?", "options": ["Expérience / utilisation", "Recommandation", "Considération", "Fidélisation"], "answer": [1], "explanation": "6e étape : il devient ambassadeur.", "level": "moyen"}, {"q": "Quels sont des points de contact APRÈS l'achat ? (plusieurs réponses)", "options": ["Publicité sur les réseaux sociaux", "Service client", "Programme de fidélité", "Newsletters"], "answer": [1, 2, 3], "explanation": "La publicité est un point de contact avant l'achat.", "level": "moyen"}, {"q": "Dans la méthode en 4 étapes, que fait-on juste APRÈS avoir listé les points de contact ?", "options": ["Lancer l'automatisation", "Observer et collecter des données", "Prioriser les moments critiques", "Évaluer l'impact"], "answer": [1], "explanation": "Lister → observer et collecter → évaluer → prioriser.", "level": "moyen"}, {"q": "Quelles frictions la trame associe-t-elle à l'étape d'achat (Do) ? (plusieurs réponses)", "options": ["Temps de chargement", "Création de compte obligatoire", "Photos de mauvaise qualité", "Pub intrusive"], "answer": [0, 1], "explanation": "Pub intrusive = See ; photos de mauvaise qualité = Think.", "level": "moyen"}, {"q": "Mise en situation : sur un e-shop, 70 % des paniers sont abandonnés à l'étape « créez votre compte ». Comment qualifier ce point de contact et que faire ?", "options": ["Point de contact avant l'achat : à confier à la pub", "Moment de vérité positif : à renforcer", "Moment de vérité à haute importance : proposer l'achat sans création de compte", "Point secondaire : à traiter plus tard"], "answer": [2], "explanation": "Il fait basculer la décision (« non, je pars »). C'est une friction citée dans la trame à l'étape d'achat.", "level": "difficile"}, {"q": "Mise en situation : un client hésite entre deux marques et lit des avis, dont plusieurs négatifs restés sans réponse. Quelles opportunités sont les plus pertinentes ? (plusieurs réponses)", "options": ["Renforcer les preuves sociales", "Proposer du contenu comparatif", "Augmenter la pression publicitaire intrusive", "Répondre aux avis négatifs"], "answer": [0, 1, 3], "explanation": "Étape Considération : hésitation, recherche de confiance. La pub intrusive est une friction de l'étape See.", "level": "difficile"}, {"q": "Mise en situation : une marque envoie la même newsletter générique à tous ses clients et ses retours produits sont compliqués. À quelle étape se trouvent ces frictions, et quelle opportunité ?", "options": ["Fidélisation (Care) : suivi personnalisé, offres exclusives", "Considération (Think) : preuves sociales", "Achat (Do) : badge de sécurité", "Prise de conscience (See) : visibilité accrue"], "answer": [0], "explanation": "Communication générique et retours compliqués sont les frictions de l'étape Care dans la trame.", "level": "difficile"}, {"q": "Mise en situation : un manager veut identifier ses moments de vérité. Quelles données sont utiles pour l'étape « observer et collecter » ? (plusieurs réponses)", "options": ["Réclamations et avis clients", "Taux d'abandon de panier", "Tests utilisateurs", "L'intuition du directeur uniquement"], "answer": [0, 1, 2], "explanation": "Feedback, enquêtes, données de clics et d'abandon, tests utilisateurs. L'intuition seule ne suffit pas.", "level": "difficile"}, {"q": "Mise en situation : une enseigne envoie automatiquement un email « votre commande est prête » avec un lien de suivi, puis un mail personnalisé selon les achats passés. Quels objectifs de l'automatisation sont visés ? (plusieurs réponses)", "options": ["Gagner en réactivité", "Augmenter le prix moyen sans rien changer à l'expérience", "Personnaliser à grande échelle", "Réduire la friction"], "answer": [0, 2, 3], "explanation": "Suivi de commande automatique = réactivité ; messages adaptés = personnalisation ; information au bon moment = moins de friction.", "level": "difficile"}], "open_questions": [{"question": "Définissez point de contact et moment de vérité, puis expliquez leur relation.", "answer": "**Point de contact** : toute interaction entre un client et une marque au cours du parcours (pub, site, vendeur, SAV…).\n\n**Moment de vérité** : point de contact **décisif** qui influence fortement la perception et la décision. Le client y dit « oui, je fais confiance » ou « non, je pars ailleurs ».\n\n**Relation** : tous les moments de vérité sont des points de contact, mais tous les points de contact ne sont pas des moments de vérité. *Ex.* : recevoir une newsletter est un simple point de contact ; un problème de livraison mal géré par le SAV est un moment de vérité."}, {"question": "Qu'est-ce qu'une cartographie du parcours client ? À quoi sert-elle et comment la construire ?", "answer": "**Définition** : représentation visuelle de toutes les étapes qu'un client traverse avant, pendant et après l'achat.\n\n**Utilité** : identifier les blocages, repérer les moments clés, mettre en place des actions concrètes pour améliorer l'expérience et augmenter les conversions.\n\n**Construction** : en colonnes, les étapes (See/Think/Do/Care ou les 6 étapes) ; en lignes, les points de contact, les actions du client, les émotions, les points de satisfaction, les points de friction et les opportunités d'amélioration. Ensuite, chaque opportunité est évaluée (coût, faisabilité, alignement avec la marque, cohérence omnicanale). C'est un **outil vivant**."}, {"question": "Décrivez la méthode pour identifier les moments de vérité.", "answer": "1. **Lister** les points de contact (pub → site → panier → paiement → livraison → SAV).\n2. **Observer et collecter des données** : avis, enquêtes, taux d'abandon de panier, clics, réclamations, tests utilisateurs.\n3. **Évaluer l'impact** : ça enchante (plus de confiance) ou ça bloque (relation détruite) ?\n4. **Prioriser** : haute importance = moment de vérité à maîtriser absolument ; moyenne = à améliorer ; faible = secondaire. Recommencer au besoin.\n\nÀ garder en tête : l'**émotion** (branding) et l'**observation** (ça varie selon les personnes et le contexte)."}, {"question": "En quoi l'automatisation peut-elle améliorer une stratégie omnicanale ? Donnez des exemples et une limite.", "answer": "Trois apports : **réactivité** (mails automatiques, suivi de commande, FAQ) ; **personnalisation à grande échelle** (messages selon le comportement : produit consulté, anniversaire) ; **moins de friction** (paiement en 1 clic, relance de panier abandonné).\n\n*Limite (réflexion personnelle)* : une automatisation mal calibrée produit une communication générique ou trop insistante, ce qui crée une **nouvelle friction**. Aux moments de vérité sensibles (réclamation), le contact humain reste souvent préférable."}], "exercises": [{"title": "Étude de cas — Cartographier le parcours d'un client Hurpeau Mousist", "statement": "Un couple fait construire une maison et cherche un **escalier sur mesure**. Construisez une cartographie simplifiée (See / Think / Do / Care) et identifiez 2 moments de vérité.", "questions": ["Pour chaque étape : points de contact, émotions, friction, opportunité.", "Quels sont les moments de vérité ? Justifiez.", "Proposez une action d'automatisation."], "answer": "*Corrigé type (hypothèses).*\n\n| Étape | Points de contact | Émotions | Friction | Opportunité |\n|---|---|---|---|---|\n| **See** | Pinterest, Instagram, recommandation de l'architecte | Inspiration, curiosité | Marque peu visible | Contenus « avant/après », partenariats avec des architectes |\n| **Think** | Site, avis Google, showroom, visite technique | Doute sur le prix et le rendu | Pas de prix indicatif, délai de devis | Simulateur de budget, visualisation 3D, devis rapide |\n| **Do** | Devis, signature, acompte, pose | Excitation, peur de se tromper | Délais de pose flous | Suivi de chantier par SMS, planning clair |\n| **Care** | SAV, conseils d'entretien, avis | Fierté ou frustration | Pas de suivi après la pose | Mail J+30, demande d'avis, parrainage |\n\n**Moments de vérité** : (1) la **visite technique et le devis** : c'est là que le couple décide de faire confiance ou de comparer ailleurs ; (2) le **jour de la pose** : propreté, respect du délai, qualité perçue. Ils conditionnent avis et recommandation.\n\n**Automatisation** : envoi automatique du devis avec visualisation 3D sous 48 h, relance si pas de réponse sous 7 jours, mail de demande d'avis après la pose."}, {"title": "Exercice — Point de contact ou moment de vérité ?", "statement": "Classez : (a) recevoir la newsletter mensuelle ; (b) un colis arrivé abîmé et la réaction du SAV ; (c) voir une affiche dans le métro ; (d) l'étape de paiement qui plante au moment de valider.", "questions": ["Simple point de contact ou moment de vérité ? Justifiez."], "answer": "(a) **Point de contact** : interaction faible, rarement décisive.\n(b) **Moment de vérité** : la réaction du SAV fait basculer la relation, en confiance ou en départ.\n(c) **Point de contact** : sensibilisation (See).\n(d) **Moment de vérité** : une friction bloquante qui peut détruire la vente immédiatement.\n\nRappel : cela dépend du client et du contexte. Il faut observer."}], "resources": []}, {"id": "omni-04", "title": "Séance 4 — Tunnel de vente, KPI & ajustements", "subtitle": "Classe inversée à maîtriser pour le 03/11 : funnel, inbound marketing, TOFU/MOFU/BOFU, lead magnet, landing page, KPI omnicanaux, données", "date": "03/11/2026", "status": "vu", "sources": ["04 - 2026.11.03 - Cours Stratégie Omnicanale Classe inversée.pdf"], "objectives": ["Définir le funnel (tunnel) de vente et le relier à AIDA et See-Think-Do-Care.", "Comprendre l'inbound marketing et ses étapes (TOFU, MOFU, BOFU).", "Distinguer lead magnet et landing page.", "Connaître les KPI essentiels d'une stratégie omnicanale et le rôle des données."], "summary": [{"title": "1. Le funnel (tunnel) de vente", "body": "**Définition** : le **chemin que suit un prospect** depuis la **découverte** d'une marque jusqu'à l'**achat**, voire la **fidélisation**. C'est une représentation à la fois **marketing et commerciale**, fondée sur les modèles vus avant (**AIDA**, **See-Think-Do-Care**).\n\n> « Le funnel de vente, c'est la route qu'on construit pour que le client avance dessus. »\n\n**Synonymes** : entonnoir de conversion, funnel marketing.\n\n**Étapes du funnel marketing** : Découverte → Évaluation → Achat → Fidélisation.\n\n**L'entonnoir de conversion en 4 étapes** (version inbound) :\n1. **Attirer** l'internaute par le contenu (inconnu → visiteur)\n2. **Convertir** le visiteur en **lead qualifié** (visiteur → prospect)\n3. **Transformer** le prospect en **client**\n4. **Fidéliser** (client → **ambassadeur**)\n\n**Marketing & funnel** : prospect **froid** → prospect **chaud** → **lead** → **client** (+ fidélisation)."}, {"title": "2. L'inbound marketing", "body": "**Inbound = attirer naturellement les clients grâce à du contenu utile et pertinent** (plutôt que d'aller les chercher par de la publicité intrusive).\n\n| Étape | Phase du funnel | Statut | Moment du parcours | Outils |\n|---|---|---|---|---|\n| **Attirer** | **TOFU** (Top of the Funnel) | Inconnus → visiteurs | Prise de conscience | Blog, SEO / mots-clés, réseaux sociaux |\n| **Convertir** | **MOFU** (Middle of the Funnel) | Visiteurs → prospects | Considération du besoin | Call-to-action, formulaires, landing pages, contact |\n| **Vendre** | **BOFU** (Bottom of the Funnel) | Prospects → clients | Prise de décision | Marketing automatisé, workflows, CRM, **lead scoring** |\n| **Fidéliser** | (Care) | Clients → ambassadeurs | Évaluation post-achat | Smart content, workflows, newsletter |\n\n*Complément : l'inverse de l'inbound est l'**outbound** marketing, où la marque va chercher le client (publicité, prospection, démarchage).*"}, {"title": "3. Bon à savoir : lead magnet et landing page", "body": "| | **Lead magnet** = l'**appât** | **Landing page** = l'**outil de capture** |\n|---|---|---|\n| Définition | Contenu **gratuit et à forte valeur**, offert **en échange d'un contact** (ex. email) | Page web **unique et dédiée** à une offre ou une action précise |\n| Objectif | **Attirer** des prospects | **Convertir** (inscription, téléchargement, achat) |\n| Exemples / caractéristiques | Ebook, webinar, essai gratuit | **Sans distraction**, **call-to-action clair**, **formulaire simple** |"}, {"title": "4. Exemple de parcours complet", "body": "| Phase | Ce qui se passe |\n|---|---|\n| **TOFU** | Un prospect découvre un **article de blog** |\n| **MOFU** | Il clique sur un lien vers une **landing page** proposant un **ebook gratuit**. Il donne son mail et **devient lead** |\n| **BOFU** | L'entreprise envoie une **série de mails personnalisés**, puis propose une **démo gratuite** |\n| **CARE** | Après l'achat, elle envoie un **programme de fidélité** |"}, {"title": "5. Les KPI essentiels : attirer et faire acheter", "body": "| Famille | KPI | Note du cours |\n|---|---|---|\n| **Acquisition** (amener du trafic) | Trafic omnicanal total (web + magasin + app) · **CTR** (Click-Through Rate, taux de clic) des campagnes · **CAC** (coût d'acquisition client) · Reach et impressions (social, paid) | Le trafic **cross-canal** doit progresser, pas seulement un canal isolé |\n| **Conversion** (faire passer à l'achat) | **Taux de conversion** (web / magasin) · **Panier moyen** | La **cohérence omnicanale** augmente la conversion globale |\n| **Performance des canaux de distribution** | Part des ventes par canal (magasin, web, marketplace, app) · Poids d'un canal (ex. **click & collect**) · **Taux de retours** · **Disponibilité produit / rupture** | Le succès omnicanal dépend de la **fluidité logistique** |\n\n*Complément (formules utiles) : CTR = clics ÷ impressions × 100 · taux de conversion = commandes ÷ visites × 100 · panier moyen = CA ÷ nombre de commandes · CAC = dépenses d'acquisition ÷ nouveaux clients.*"}, {"title": "6. Les KPI essentiels : expérience et fidélisation", "body": "| Famille | KPI | Note du cours |\n|---|---|---|\n| **Expérience & engagement** | **NPS** (Net Promoter Score) · Temps d'attente magasin / hotline · Taux d'usage de l'app / espace client · **Taux d'abandon de panier** (web + app) | L'expérience client est un **prédicteur direct de fidélité** |\n| **Fidélisation** | **CLV** (Customer Lifetime Value, valeur vie client) · Fréquence d'achat · **Taux de réachat** · Nombre d'activations du programme de fidélité | Une bonne stratégie omnicanale **augmente la fréquence et la valeur par client** |\n\n*Complément : NPS = % de promoteurs (notes 9–10) − % de détracteurs (notes 0–6), sur la question « Recommanderiez-vous… ? ». Il va de −100 à +100.*"}, {"title": "7. Données ou pas données ?", "body": "- **Sans données** ➔ des **suppositions**.\n- **Avec données** ➔ la **compréhension réelle des comportements**.\n\nLes données permettent de :\n1. **Identifier les étapes clés** du parcours\n2. **Détecter les points de friction et les moments de satisfaction**\n3. **Mesurer l'efficacité des optimisations**"}], "key_points": ["Funnel = chemin du prospect, de la découverte à l'achat et à la fidélisation ; fondé sur AIDA et See-Think-Do-Care.", "Entonnoir en 4 étapes : attirer → convertir en lead → transformer en client → fidéliser.", "Prospect froid → prospect chaud → lead → client.", "Inbound = attirer naturellement par du contenu utile et pertinent.", "TOFU (attirer : blog, SEO, social) → MOFU (convertir : CTA, formulaires, landing pages) → BOFU (vendre : automation, CRM, lead scoring) → fidéliser.", "Lead magnet = l'appât (ebook, webinar, essai gratuit) ; landing page = l'outil de capture (sans distraction, CTA clair, formulaire simple).", "KPI d'acquisition : trafic omnicanal, CTR, CAC, reach et impressions.", "KPI de conversion : taux de conversion, panier moyen ; KPI de distribution : part des ventes par canal, poids du click & collect, taux de retours, ruptures.", "KPI d'expérience : NPS, temps d'attente, usage de l'app, abandon de panier ; KPI de fidélisation : CLV, fréquence, réachat, activations fidélité.", "Sans données = suppositions ; avec données = compréhension réelle (étapes clés, frictions et satisfactions, efficacité des optimisations)."], "traps": ["Lead magnet ≠ landing page : l'appât (le contenu offert) vs l'outil de capture (la page).", "MOFU = convertir (visiteur → lead) ; BOFU = vendre (prospect → client).", "Un visiteur devient lead quand il laisse ses coordonnées (ex. son email en échange d'un ebook).", "CTR = taux de clic, pas taux de conversion.", "CAC = coût pour acquérir un client ; CLV = valeur que rapporte un client sur toute sa relation avec la marque.", "En omnicanal, c'est le trafic cross-canal qui doit progresser, pas un canal isolé."], "glossary": [{"term": "Funnel / tunnel de vente", "definition": "Chemin du prospect de la découverte de la marque jusqu'à l'achat, voire la fidélisation. Aussi appelé entonnoir de conversion."}, {"term": "Inbound marketing", "definition": "Attirer naturellement les clients grâce à du contenu utile et pertinent."}, {"term": "TOFU", "definition": "Top of the Funnel : attirer des inconnus devenus visiteurs (blog, SEO, réseaux sociaux). Prise de conscience."}, {"term": "MOFU", "definition": "Middle of the Funnel : convertir les visiteurs en prospects (CTA, formulaires, landing pages). Considération."}, {"term": "BOFU", "definition": "Bottom of the Funnel : transformer les prospects en clients (marketing automatisé, workflows, CRM, lead scoring). Décision."}, {"term": "Lead", "definition": "Prospect qui a laissé ses coordonnées et manifesté un intérêt."}, {"term": "Lead magnet", "definition": "Contenu gratuit à forte valeur offert en échange d'un contact (ebook, webinar, essai gratuit). « L'appât »."}, {"term": "Landing page", "definition": "Page web unique dédiée à une offre précise, sans distraction, avec un call-to-action clair et un formulaire simple. « L'outil de capture »."}, {"term": "Call-to-action (CTA)", "definition": "Bouton ou message qui incite à une action précise (« Télécharger », « Réserver une démo »)."}, {"term": "Lead scoring", "definition": "Notation des leads selon leur maturité ou leur intérêt, pour prioriser l'action commerciale."}, {"term": "CTR", "definition": "Click-Through Rate : taux de clic d'une campagne."}, {"term": "CAC", "definition": "Coût d'acquisition client."}, {"term": "Panier moyen", "definition": "Montant moyen dépensé par commande."}, {"term": "NPS", "definition": "Net Promoter Score : mesure de la propension des clients à recommander la marque."}, {"term": "CLV", "definition": "Customer Lifetime Value : valeur vie client, ce que rapporte un client sur toute sa relation avec la marque."}, {"term": "Taux de réachat", "definition": "Part des clients qui achètent de nouveau."}], "qcb": [{"q": "Le funnel de vente s'appuie sur les modèles AIDA et See-Think-Do-Care.", "answer": true, "explanation": "C'est la représentation marketing et commerciale de ces modèles."}, {"q": "Le funnel s'arrête toujours au moment de l'achat.", "answer": false, "explanation": "Il va de la découverte à l'achat, voire jusqu'à la fidélisation."}, {"q": "L'inbound marketing consiste à attirer naturellement les clients via du contenu utile et pertinent.", "answer": true, "explanation": "Définition du cours."}, {"q": "TOFU signifie « Top of the Funnel » et correspond à l'étape « attirer ».", "answer": true, "explanation": "Blog, SEO et réseaux sociaux attirent des inconnus devenus visiteurs."}, {"q": "Le lead scoring est un outil de l'étape TOFU.", "answer": false, "explanation": "Il relève du BOFU (vendre), avec le CRM et le marketing automatisé."}, {"q": "Un lead magnet est une page web dédiée à une offre précise.", "answer": false, "explanation": "Ça, c'est la landing page. Le lead magnet est le contenu gratuit offert (l'appât)."}, {"q": "Une bonne landing page est sans distraction, avec un call-to-action clair et un formulaire simple.", "answer": true, "explanation": "Caractéristiques citées dans le cours."}, {"q": "Dans l'exemple du cours, le prospect devient lead lorsqu'il donne son email pour recevoir un ebook.", "answer": true, "explanation": "Étape MOFU."}, {"q": "Le CTR est le coût d'acquisition d'un client.", "answer": false, "explanation": "Le CTR est le taux de clic. Le coût d'acquisition est le CAC."}, {"q": "Le panier moyen est un KPI de conversion.", "answer": true, "explanation": "Avec le taux de conversion."}, {"q": "Le taux de retours est un KPI de performance des canaux de distribution.", "answer": true, "explanation": "Avec la part des ventes par canal, le poids du click & collect et les ruptures."}, {"q": "Le NPS est un KPI de fidélisation financière comme la CLV.", "answer": false, "explanation": "Le cours classe le NPS dans l'expérience et l'engagement ; la CLV dans la fidélisation."}, {"q": "Selon le cours, l'expérience client est un prédicteur direct de fidélité.", "answer": true, "explanation": "Note associée aux KPI d'expérience."}, {"q": "En omnicanal, il suffit qu'un seul canal voie son trafic progresser.", "answer": false, "explanation": "Le trafic cross-canal doit progresser, pas seulement un canal isolé."}, {"q": "Sans données, une entreprise ne peut faire que des suppositions sur ses clients.", "answer": true, "explanation": "Avec données, elle comprend réellement les comportements."}, {"q": "Le CTR mesure la part des visiteurs qui passent commande.", "answer": false, "explanation": "CTR = taux de clic (clics ÷ impressions). La part des visiteurs qui commandent, c'est le taux de conversion.", "level": "moyen"}, {"q": "Un visiteur devient lead quand il laisse ses coordonnées, par exemple son email en échange d'un ebook.", "answer": true, "explanation": "C'est le passage MOFU : visiteur → prospect qualifié.", "level": "moyen"}, {"q": "L'inbound marketing consiste à aller chercher le client par de la publicité et de la prospection.", "answer": false, "explanation": "Ça, c'est l'outbound. L'inbound attire naturellement par du contenu utile.", "level": "moyen"}, {"q": "La CLV mesure ce que rapporte un client sur toute sa relation avec la marque.", "answer": true, "explanation": "Customer Lifetime Value. À ne pas confondre avec le CAC (coût d'acquisition).", "level": "moyen"}, {"q": "Si le CAC d'une marque est supérieur à la CLV de ses clients, chaque nouveau client lui fait perdre de l'argent sur la durée.", "answer": true, "explanation": "Acquérir un client coûte plus que ce qu'il rapporte sur toute la relation.", "level": "difficile"}, {"q": "Un NPS de +20 signifie que 20 % des répondants recommandent la marque.", "answer": false, "explanation": "NPS = % promoteurs − % détracteurs. +20 peut venir de 50 % de promoteurs et 30 % de détracteurs.", "level": "difficile"}], "qcm": [{"q": "Quelles appellations désignent le funnel de vente ? (plusieurs réponses)", "options": ["Tunnel de vente", "Entonnoir de conversion", "Funnel marketing", "Silo commercial"], "answer": [0, 1, 2], "explanation": "Synonymes cités dans le cours."}, {"q": "Remettez dans l'ordre l'entonnoir de conversion en 4 étapes :", "options": ["Attirer → Convertir en lead → Transformer en client → Fidéliser", "Convertir → Attirer → Fidéliser → Transformer", "Fidéliser → Attirer → Convertir → Transformer", "Transformer → Convertir → Attirer → Fidéliser"], "answer": [0], "explanation": "Inconnu → visiteur → prospect → client → ambassadeur."}, {"q": "Quels outils correspondent au TOFU ? (plusieurs réponses)", "options": ["Blog", "SEO / mots-clés", "Réseaux sociaux", "Lead scoring"], "answer": [0, 1, 2], "explanation": "Le lead scoring relève du BOFU."}, {"q": "Quels outils correspondent au MOFU ? (plusieurs réponses)", "options": ["Call-to-action", "Formulaires", "Landing pages", "Newsletter de fidélisation"], "answer": [0, 1, 2], "explanation": "La newsletter relève de la fidélisation."}, {"q": "Quels outils correspondent au BOFU ? (plusieurs réponses)", "options": ["Marketing automatisé", "Workflows", "CRM", "SEO"], "answer": [0, 1, 2], "explanation": "Le SEO relève du TOFU."}, {"q": "À quel moment du parcours correspond le MOFU ?", "options": ["Prise de conscience", "Considération du besoin", "Prise de décision", "Évaluation post-achat"], "answer": [1], "explanation": "TOFU = prise de conscience ; MOFU = considération ; BOFU = décision."}, {"q": "Quels sont des exemples de lead magnet ? (plusieurs réponses)", "options": ["Ebook", "Webinar", "Essai gratuit", "Page de paiement"], "answer": [0, 1, 2], "explanation": "Contenus gratuits à forte valeur échangés contre un contact."}, {"q": "L'objectif d'une landing page est de :", "options": ["Attirer du trafic par le SEO", "Convertir (inscription, téléchargement, achat)", "Mesurer le NPS", "Gérer les retours produits"], "answer": [1], "explanation": "La landing page est l'outil de capture."}, {"q": "Dans l'exemple du cours, que fait l'entreprise en phase BOFU ?", "options": ["Publie un article de blog", "Envoie des mails personnalisés puis propose une démo gratuite", "Envoie un programme de fidélité", "Achète des espaces TV"], "answer": [1], "explanation": "Le blog relève du TOFU, la fidélité du Care."}, {"q": "Quels sont des KPI d'acquisition ? (plusieurs réponses)", "options": ["Trafic omnicanal total", "CTR des campagnes", "Coût d'acquisition client (CAC)", "Taux de réachat"], "answer": [0, 1, 2], "explanation": "Le réachat est un KPI de fidélisation."}, {"q": "Quels sont des KPI de performance des canaux de distribution ? (plusieurs réponses)", "options": ["Part des ventes par canal", "Poids du click & collect", "Disponibilité produit / rupture", "NPS"], "answer": [0, 1, 2], "explanation": "Le NPS mesure l'expérience."}, {"q": "Quels sont des KPI de fidélisation ? (plusieurs réponses)", "options": ["CLV", "Fréquence d'achat", "Nombre d'activations du programme fidélité", "Reach"], "answer": [0, 1, 2], "explanation": "Le reach est un KPI d'acquisition."}, {"q": "Une campagne obtient 50 000 impressions et 1 000 clics. Son CTR est de :", "options": ["0,5 %", "2 %", "5 %", "20 %"], "answer": [1], "explanation": "1 000 ÷ 50 000 × 100 = 2 %."}, {"q": "Un e-shop réalise 60 000 € de CA avec 1 200 commandes. Le panier moyen est de :", "options": ["20 €", "50 €", "72 €", "500 €"], "answer": [1], "explanation": "60 000 ÷ 1 200 = 50 €."}, {"q": "Que permettent les données, selon le cours ? (plusieurs réponses)", "options": ["Identifier les étapes clés du parcours", "Détecter frictions et moments de satisfaction", "Mesurer l'efficacité des optimisations", "Remplacer toute stratégie"], "answer": [0, 1, 2], "explanation": "Elles éclairent la stratégie, elles ne la remplacent pas."}, {"q": "Sur 100 répondants : 50 donnent 9–10, 30 donnent 7–8, 20 donnent 0–6. Quel est le NPS ?", "options": ["+30", "+50", "+80", "−20"], "answer": [0], "explanation": "*Complément* : NPS = 50 % − 20 % = +30 (les 7–8 sont passifs)."}, {"q": "Une campagne coûte 12 000 € et apporte 300 nouveaux clients. Le CAC est de :", "options": ["40 €", "3,6 €", "400 €", "25 €"], "answer": [0], "explanation": "12 000 ÷ 300 = 40 €.", "level": "moyen"}, {"q": "Un site reçoit 20 000 visites et enregistre 500 commandes. Le taux de conversion est de :", "options": ["4 %", "2,5 %", "25 %", "0,25 %"], "answer": [1], "explanation": "500 ÷ 20 000 × 100 = 2,5 %.", "level": "moyen"}, {"q": "Quels KPI relèvent de l'expérience et de l'engagement ? (plusieurs réponses)", "options": ["Taux d'abandon de panier", "Part des ventes par canal", "NPS", "Temps d'attente en magasin ou à la hotline"], "answer": [0, 2, 3], "explanation": "La part des ventes par canal relève de la performance des canaux de distribution.", "level": "moyen"}, {"q": "Associez : un ebook offert contre un email est _____ ; la page dédiée avec un formulaire simple est _____.", "options": ["une landing page / un lead magnet", "un workflow / un lead scoring", "un lead magnet / une landing page", "un CTA / un CRM"], "answer": [2], "explanation": "Lead magnet = l'appât ; landing page = l'outil de capture.", "level": "moyen"}, {"q": "Mise en situation : sur 200 répondants, 90 donnent 9–10, 60 donnent 7–8 et 50 donnent 0–6. Quel est le NPS ?", "options": ["+45", "+20", "+75", "−20"], "answer": [1], "explanation": "Promoteurs 45 % − détracteurs 25 % = +20. Les passifs (7–8) ne comptent pas.", "level": "difficile"}, {"q": "Mise en situation : un internaute lit un article de blog, télécharge un guide gratuit, reçoit une série de mails, puis demande une démo. Associez les phases dans l'ordre :", "options": ["TOFU → MOFU → BOFU → BOFU", "MOFU → TOFU → BOFU → Care", "TOFU → BOFU → MOFU → Care", "TOFU → MOFU → Care → BOFU"], "answer": [0], "explanation": "Blog = TOFU ; guide contre email = MOFU ; mails personnalisés et démo = BOFU, comme dans l'exemple du cours.", "level": "difficile"}, {"q": "Mise en situation : le trafic du site augmente de 30 %, mais le trafic magasin et l'usage de l'appli baissent. Que dit le cours ? (plusieurs réponses)", "options": ["Une hausse isolée sur un canal ne suffit pas", "Il faut regarder le trafic omnicanal total", "C'est forcément un succès puisque le site progresse", "En omnicanal, c'est le trafic cross-canal qui doit progresser"], "answer": [0, 1, 3], "explanation": "Le cours précise que le trafic cross-canal doit progresser, pas seulement un canal isolé.", "level": "difficile"}, {"q": "Mise en situation : une enseigne a un bon taux de conversion mais beaucoup de ruptures de stock en click & collect et un taux de retours élevé. Quelle famille de KPI pointe le problème ?", "options": ["Performance des canaux de distribution (fluidité logistique)", "Acquisition", "Notoriété", "Inbound marketing"], "answer": [0], "explanation": "Taux de retours et disponibilité produit sont des KPI de distribution : le succès omnicanal dépend de la fluidité logistique.", "level": "difficile"}, {"q": "Mise en situation : une start-up B2B veut trier ses leads pour que les commerciaux appellent d'abord les plus chauds. Quels outils de quelle phase ? (plusieurs réponses)", "options": ["Phase BOFU", "Lead scoring", "CRM", "Blog et SEO (phase TOFU)"], "answer": [0, 1, 2], "explanation": "Trier les leads pour la vente = BOFU : marketing automatisé, CRM, lead scoring.", "level": "difficile"}], "open_questions": [{"question": "Qu'est-ce qu'un funnel de vente ? Présentez ses étapes et son lien avec les modèles de parcours.", "answer": "**Définition** : le chemin que suit un prospect depuis la découverte de la marque jusqu'à l'achat, voire la fidélisation. C'est une représentation marketing et commerciale, « la route qu'on construit pour que le client avance dessus ».\n\n**Étapes** : attirer (inconnu → visiteur), convertir en lead (visiteur → prospect), transformer en client, fidéliser (client → ambassadeur). Autrement dit : prospect froid → prospect chaud → lead → client.\n\n**Lien** : il traduit en actions **AIDA** (Attention → Action) et **See-Think-Do-Care** (TOFU ≈ See, MOFU ≈ Think, BOFU ≈ Do, fidélisation ≈ Care).\n\n**Exemple** : article de blog → landing page avec ebook → mails personnalisés et démo → programme de fidélité."}, {"question": "Distinguez lead magnet et landing page et montrez comment ils fonctionnent ensemble.", "answer": "**Lead magnet** (« l'appât ») : contenu gratuit et à forte valeur (ebook, webinar, essai) offert en échange d'un contact. Objectif : **attirer**.\n\n**Landing page** (« l'outil de capture ») : page unique dédiée à l'offre, sans distraction, avec un CTA clair et un formulaire simple. Objectif : **convertir**.\n\n**Ensemble** : la landing page présente le lead magnet ; le visiteur remplit le formulaire et devient **lead** (MOFU). On peut ensuite le nourrir par des mails automatisés (BOFU)."}, {"question": "Quels KPI suivriez-vous pour piloter une stratégie omnicanale ? Classez-les par famille.", "answer": "- **Acquisition** : trafic omnicanal total (web + magasin + app), CTR, CAC, reach et impressions. Le trafic **cross-canal** doit progresser.\n- **Conversion** : taux de conversion (web et magasin), panier moyen.\n- **Performance des canaux** : part des ventes par canal, poids du click & collect, taux de retours, ruptures. La **fluidité logistique** conditionne le succès.\n- **Expérience** : NPS, temps d'attente, usage de l'app, abandon de panier. L'expérience prédit la fidélité.\n- **Fidélisation** : CLV, fréquence d'achat, réachat, activations du programme de fidélité.\n\n**Conclusion** : choisir des KPI à chaque étape du funnel, et les lire ensemble plutôt que canal par canal."}, {"question": "« Sans données, des suppositions. » Expliquez cette affirmation.", "answer": "Sans données, l'entreprise décide sur des **intuitions**. Avec des données (analytics, CRM, avis, enquêtes, ventes par canal), elle **comprend réellement les comportements**.\n\nLes données servent à : (1) **identifier les étapes clés** du parcours ; (2) **détecter les frictions** (abandon de panier, retours) et **les moments de satisfaction** (NPS, avis) ; (3) **mesurer l'efficacité des optimisations** (avant/après une nouvelle landing page, par exemple).\n\nC'est ce qui permet d'**ajuster** la stratégie omnicanale en continu."}], "exercises": [{"title": "Cas — Construire le funnel inbound de Hurpeau Mousist", "statement": "Hurpeau Mousist, fabricant d'escaliers sur mesure, veut générer plus de demandes de devis grâce au digital.", "questions": ["Proposez une action TOFU, MOFU, BOFU et fidélisation.", "Quel lead magnet et quelle landing page proposez-vous ?", "Choisissez 5 KPI pour piloter ce funnel."], "answer": "*Corrigé type (hypothèses).*\n\n| Phase | Action |\n|---|---|\n| **TOFU** | Articles de blog SEO (« Quel escalier pour une petite surface ? »), Pinterest et Instagram avant/après |\n| **MOFU** | Landing page « Guide gratuit : bien choisir son escalier sur mesure » avec formulaire (nom, email, type de projet) |\n| **BOFU** | Séquence de mails automatisés (cas clients, matériaux, délais), puis proposition de **visite technique gratuite** ou de **simulation 3D** ; lead scoring selon le projet (construction ou rénovation, budget) |\n| **Fidélisation** | Mail de suivi après la pose, conseils d'entretien, demande d'avis Google, parrainage |\n\n**Lead magnet** : guide PDF ou simulateur de budget. **Landing page** : une seule offre, photos de réalisations, formulaire court, CTA « Recevoir mon guide ».\n\n**KPI** : trafic du blog et reach (acquisition) · taux de conversion de la landing page en leads · taux de transformation lead → devis → commande · CAC par canal · NPS ou note Google après la pose."}, {"title": "Exercice — Calculs de KPI", "statement": "Une enseigne omnicanale, sur un mois : 200 000 impressions publicitaires, 4 000 clics, 40 000 visites du site, 800 commandes en ligne, 64 000 € de CA en ligne, 10 000 € de dépenses publicitaires, 400 nouveaux clients.", "questions": ["Calculez le CTR.", "Calculez le taux de conversion du site.", "Calculez le panier moyen.", "Calculez le CAC."], "answer": "1. **CTR** = 4 000 ÷ 200 000 × 100 = **2 %**\n2. **Taux de conversion** = 800 ÷ 40 000 × 100 = **2 %**\n3. **Panier moyen** = 64 000 ÷ 800 = **80 €**\n4. **CAC** = 10 000 ÷ 400 = **25 € par nouveau client**\n\n*Lecture : comparer le CAC (25 €) à la valeur vie client (CLV). Si un client rapporte bien plus de 25 € sur la durée, l'acquisition est rentable.*"}], "resources": []}]}, {"id": "strategie-rh", "order": 5, "folder": "05. STRATEGIE DES RESSOUCES HUMAINE", "title": "Stratégie des ressources humaines", "short": "Stratégie RH", "teacher": "Sandrine Rath", "description": "Diagnostic RH au service d'un projet commercial : SWOT RH, cartographie des compétences, analyse des écarts, priorités et travail hybride.", "key_dates": [], "exam_info": "Critères d'évaluation des cas : **cohérence avec le projet commercial**, **exactitude des calculs**, **qualité des justifications**, **respect des contraintes**, **distinction entre faits et hypothèses**. Plusieurs propositions sont recevables si elles sont argumentées. À l'oral : présenter d'abord la priorité la plus urgente.", "courses": [{"id": "rh-01", "title": "Séance 1 — Cas NovaWear : diagnostic RH d'un projet commercial", "subtitle": "Enjeux, SWOT RH, cartographie des compétences, écarts et risques, priorités, travail hybride", "date": "", "status": "vu", "sources": ["CAS PRATIQUE SEANCE 1 COMMERCE MARKETING STRATEGIE RH.pdf"], "objectives": ["Relier un projet commercial à ses conséquences sur les activités et l'organisation d'une équipe.", "Construire un SWOT RH justifié par les faits.", "Établir une cartographie des compétences et calculer les écarts avec les cibles.", "Hiérarchiser des priorités RH et managériales, et repérer les risques du travail hybride.", "Distinguer les faits des hypothèses."], "summary": [{"title": "1. Le cas en bref", "body": "**NovaWear** (entreprise fictive), marque de **prêt-à-porter vendue en ligne**, veut **personnaliser ses campagnes et ses relances** pour **augmenter de 20 % le chiffre d'affaires réalisé avec les clients existants**, **en 6 mois**.\n\n**Contrainte majeure** : **aucun recrutement** n'est autorisé.\n\n| Collaborateur | Fonction |\n|---|---|\n| Amina | Responsable commerciale |\n| Hugo | Commercial |\n| Léa | Conseillère relation client |\n| Karim | Chargé de marketing |\n| Elsa | Créatrice de contenus |\n| Noé | Analyste des données clients |\n\n**Faits à prendre en compte** :\n- **Noé** sera **absent 6 semaines** à partir du **2e mois**.\n- **2 jours de télétravail** par semaine ; **certaines validations restent bloquées**.\n- Les décisions orales sont **peu tracées** ; des **dossiers CRM sont incomplets**.\n- **Léa** demande un **accompagnement** sur le nouvel outil.\n- Un **partenaire extérieur** peut intervenir **sous 6 semaines**. Les **concurrents recrutent des analystes**."}, {"title": "2. Les données de compétences", "body": "**Trois domaines** : **CRM** (fiabiliser et exploiter les dossiers clients) · **Données** (lire et analyser les résultats clients) · **Coordination** (suivre les engagements, partager les décisions).\n\n**Échelle de maîtrise** : **0** = ne réalise pas encore · **1** = réalise avec accompagnement · **2** = réalise **en autonomie** · **3** = maîtrise les situations complexes et **transmet**.\n\n| | CRM | Données | Coordination |\n|---|---|---|---|\n| Amina | 2 | 1 | **3** |\n| Hugo | 1 | 0 | 2 |\n| Léa | 1 | 1 | 1 |\n| Karim | **3** | 1 | 2 |\n| Elsa | 0 | 1 | 1 |\n| Noé | 1 | **3** | 1 |\n\n**Cibles à 6 mois** (autonome = niveau ≥ 2 ; les niveaux 3 comptent parmi les autonomes) :\n- **CRM** : 4 autonomes dont 1 de niveau 3\n- **Données** : 2 autonomes dont 1 de niveau 3\n- **Coordination** : 4 autonomes dont 1 de niveau 3"}, {"title": "3. Calcul des écarts (le cœur du cas)", "body": "| Compétence | Autonomes aujourd'hui (≥ 2) | Dont niveau 3 | Cible | **Écart** |\n|---|---|---|---|---|\n| **CRM** | 2 (Amina 2, Karim 3) | 1 (Karim) | 4 dont 1 N3 | **−2 autonomes** (N3 : OK) |\n| **Données** | 1 (Noé 3) | 1 (Noé) | 2 dont 1 N3 | **−1 autonome** |\n| **Coordination** | 3 (Amina 3, Hugo 2, Karim 2) | 1 (Amina) | 4 dont 1 N3 | **−1 autonome** (N3 : OK) |\n\n**Pendant l'absence de Noé (6 semaines dès le 2e mois)** : en Données, on tombe à **0 autonome et 0 niveau 3**, soit un **écart de −2 et la perte de la seule expertise**. C'est le **risque le plus critique** : la donnée client est indispensable pour **personnaliser** les campagnes.\n\n**Candidats naturels à la montée en compétence** (niveau 1 → 2) :\n- **CRM** : Hugo, Léa ou Noé (niveau 1), tutorés par **Karim** (niveau 3, peut transmettre). Elsa part de 0.\n- **Données** : Amina, Léa, Karim ou Elsa (niveau 1). Hugo part de 0.\n- **Coordination** : Léa, Elsa ou Noé (niveau 1), avec **Amina** (niveau 3) comme référente."}, {"title": "4. Méthode : les 6 questions du cas", "body": "1. **Reformuler les enjeux** : présenter le projet commercial et ses **conséquences** sur les activités (plus d'exploitation du CRM, plus d'analyse de données, plus de coordination des campagnes) et sur l'organisation.\n2. **SWOT RH** : **forces / faiblesses = interne** ; **opportunités / menaces = externe**. Chaque élément est **justifié par un fait**.\n3. **Cartographie des compétences** : représenter les ressources (tableau, radar, matrice) et identifier **3 compétences critiques** justifiées.\n4. **Écarts et risques** : comparer l'existant aux cibles, **montrer les calculs**, tenir compte des **échéances** (absence de Noé, partenaire sous 6 semaines) et des **contraintes** (pas de recrutement).\n5. **Deux priorités hiérarchisées** : pour chacune, le **risque traité**, les **faits déterminants**, une **première orientation** (pas de plan de formation détaillé).\n6. **Travail hybride** : **2 risques** + un **premier repère** de prévention ; signaler les **informations à vérifier** ; **distinguer hypothèses et faits**.\n\n*Complément : ce type de diagnostic relève de la **GPEC** (gestion prévisionnelle des emplois et des compétences), aujourd'hui appelée **GEPP** (gestion des emplois et des parcours professionnels).*"}, {"title": "5. Corrigé type — SWOT RH", "body": "| | **Positif** | **Négatif** |\n|---|---|---|\n| **Interne** | **Forces** : un expert CRM capable de transmettre (Karim, N3) ; une experte en coordination (Amina, N3) ; un expert données (Noé, N3) ; équipe complète couvrant commerce, marketing, contenu, relation client et données ; Léa **demandeuse** d'accompagnement (motivation) | **Faiblesses** : **dépendance à une seule personne** pour les données (Noé) ; **CRM incomplet** ; **décisions orales peu tracées** ; validations bloquées à distance ; Elsa à 0 en CRM, Hugo à 0 en données ; faible niveau global en données |\n| **Externe** | **Opportunités** : **partenaire extérieur disponible sous 6 semaines** ; nouvel outil (potentiel d'automatisation et de personnalisation) ; base de clients existants à valoriser | **Menaces** : **les concurrents recrutent des analystes** (marché tendu, risque d'attraction de Noé) ; délai court (6 mois) |\n\n⚠️ **« Aucun recrutement »** est une **contrainte de la direction** (interne). On peut la citer comme contrainte plutôt que comme menace externe : c'est un point de rigueur apprécié."}, {"title": "6. Corrigé type — deux priorités hiérarchisées", "body": "**Priorité 1 (la plus urgente) : sécuriser la compétence Données**\n- **Risque traité** : arrêt de l'analyse pendant l'absence de Noé, donc impossibilité de personnaliser campagnes et relances au moment où le projet doit monter en charge.\n- **Faits déterminants** : un seul autonome (Noé, N3) ; absence de 6 semaines dès le 2e mois ; cible de 2 autonomes ; concurrents qui recrutent des analystes ; pas de recrutement possible.\n- **Orientation** : **transfert de compétences** de Noé vers un collaborateur de niveau 1 (ex. Karim ou Amina) **dès le 1er mois** ; **documentation** des analyses et tableaux de bord ; recours au **partenaire extérieur** (disponible sous 6 semaines, donc à solliciter **immédiatement** pour couvrir l'absence) ; réflexion sur la **fidélisation** de Noé.\n\n**Priorité 2 : fiabiliser le CRM et faire monter 2 personnes en autonomie**\n- **Risque traité** : campagnes mal ciblées à cause de dossiers incomplets ; objectif +20 % compromis.\n- **Faits déterminants** : dossiers CRM incomplets ; 2 autonomes sur 4 visés ; Léa demande un accompagnement ; Karim (N3) peut transmettre.\n- **Orientation** : **tutorat** de Karim pour Hugo et Léa (niveau 1 → 2) ; règles de saisie communes ; temps dédié à la fiabilisation des fiches.\n\n*La coordination (écart −1) peut être traitée en lien avec le travail hybride : rituels, traçabilité des décisions.*"}, {"title": "7. Corrigé type — travail hybride", "body": "| Risque | Faits | Premier repère |\n|---|---|---|\n| **Blocage des validations** et ralentissement des campagnes | « Certaines validations restent bloquées » à distance | **Circuit de validation clair** : qui valide quoi, dans quel délai, délégation en cas d'absence |\n| **Perte d'information** et décisions non tracées | Décisions orales peu tracées, CRM incomplet | **Traçabilité** : compte rendu court et décisions consignées dans un outil partagé ou le CRM |\n| *(autre)* Isolement et apprentissage difficile à distance | Léa demande un accompagnement | Placer les temps de formation et de tutorat les **jours sur site** |\n\n**Informations à vérifier** : quels jours sont travaillés à distance ? Qui est concerné ? Quelles validations bloquent ? Le partenaire peut-il couvrir l'analyse de données ? Noé peut-il préparer son absence ?\n\n**Faits vs hypothèses** : « Noé absent 6 semaines » est un **fait** ; « les concurrents pourraient débaucher Noé » est une **hypothèse**."}], "key_points": ["Projet : +20 % de CA auprès des clients existants en 6 mois, par la personnalisation des campagnes et des relances, sans recrutement.", "Échelle : 0 (ne fait pas), 1 (avec accompagnement), 2 (autonome), 3 (complexe et transmet). Autonome = niveau ≥ 2.", "Écarts : CRM −2 autonomes ; Données −1 (−2 et plus aucun expert pendant l'absence de Noé) ; Coordination −1.", "Le risque le plus critique : la dépendance à Noé en Données, dont l'absence tombe dès le 2e mois.", "Ressources internes pour transmettre : Karim (CRM 3), Amina (Coordination 3), Noé (Données 3).", "SWOT RH : forces/faiblesses = interne ; opportunités/menaces = externe ; chaque élément justifié par un fait.", "Priorité 1 : sécuriser les Données (transfert, documentation, partenaire à solliciter tout de suite). Priorité 2 : fiabiliser le CRM (tutorat de Karim).", "Hybride : validations bloquées et décisions non tracées → circuit de validation et traçabilité.", "Toujours distinguer les faits de l'énoncé et vos hypothèses.", "Critères : cohérence avec le projet, exactitude des calculs, justification, respect des contraintes, faits vs hypothèses."], "traps": ["Les niveaux 3 sont inclus dans le nombre d'autonomes : ne les comptez pas deux fois.", "Un niveau 1 n'est pas autonome : seuls les niveaux 2 et 3 comptent.", "Oublier l'absence de Noé dans le calcul des risques : l'écart en Données passe de −1 à −2 pendant 6 semaines.", "Proposer un recrutement : c'est explicitement interdit par la direction.", "Le partenaire n'est disponible que sous 6 semaines et l'absence commence au 2e mois : il faut le solliciter immédiatement.", "Les tableaux de l'énoncé ne sont pas des tableaux de réponse : construisez vos propres représentations.", "Le plan de formation détaillé n'est pas demandé : une première orientation suffit."], "glossary": [{"term": "Diagnostic RH", "definition": "Analyse de la capacité des ressources humaines (compétences, organisation, risques) à réaliser un projet de l'entreprise."}, {"term": "SWOT RH", "definition": "Forces et faiblesses (internes) et opportunités et menaces (externes) appliquées aux ressources humaines."}, {"term": "Cartographie des compétences", "definition": "Représentation des compétences disponibles par personne et par domaine, comparée aux besoins."}, {"term": "Échelle de maîtrise", "definition": "Graduation des niveaux de compétence ; ici de 0 (ne réalise pas) à 3 (maîtrise les situations complexes et transmet)."}, {"term": "Autonomie (dans le cas)", "definition": "Niveau 2 ou plus : la personne réalise l'activité sans accompagnement."}, {"term": "Analyse des écarts", "definition": "Comparaison entre les compétences actuelles et les compétences cibles, pour mesurer ce qui manque."}, {"term": "Compétence critique", "definition": "Compétence indispensable à la réussite du projet, dont l'absence le met en danger."}, {"term": "Dépendance à une personne clé", "definition": "Situation où une compétence repose sur un seul collaborateur : risque élevé en cas d'absence ou de départ."}, {"term": "Transfert de compétences", "definition": "Transmission des savoir-faire d'un expert vers d'autres collaborateurs (tutorat, binôme, documentation)."}, {"term": "Tutorat", "definition": "Accompagnement d'un collaborateur par un pair expérimenté pour le faire monter en compétence."}, {"term": "CRM", "definition": "Customer Relationship Management : outil de gestion de la relation client qui centralise informations et échanges avec clients et prospects."}, {"term": "Travail hybride", "definition": "Organisation qui alterne travail sur site et à distance."}, {"term": "Traçabilité des décisions", "definition": "Fait de consigner les décisions prises pour pouvoir les retrouver et les suivre."}, {"term": "GPEC / GEPP (complément)", "definition": "Gestion prévisionnelle des emplois et des compétences, aujourd'hui gestion des emplois et des parcours professionnels : anticiper les besoins en compétences."}], "qcb": [{"q": "Le projet de NovaWear vise +20 % de chiffre d'affaires auprès de nouveaux clients.", "answer": false, "explanation": "Il vise +20 % auprès des clients existants, grâce à des campagnes et relances personnalisées."}, {"q": "La direction autorise un recrutement si nécessaire.", "answer": false, "explanation": "Aucun recrutement supplémentaire n'est autorisé : c'est la contrainte clé."}, {"q": "Un collaborateur de niveau 1 est considéré comme autonome.", "answer": false, "explanation": "Le niveau 1 réalise l'activité avec accompagnement. L'autonomie commence au niveau 2."}, {"q": "Les personnes de niveau 3 sont incluses dans le nombre total d'autonomes demandé.", "answer": true, "explanation": "Elles ne s'ajoutent pas en plus."}, {"q": "En CRM, l'équipe compte aujourd'hui 2 personnes autonomes.", "answer": true, "explanation": "Amina (2) et Karim (3)."}, {"q": "En CRM, la cible de niveau 3 est déjà atteinte.", "answer": true, "explanation": "Karim est au niveau 3 ; il manque 2 autonomes."}, {"q": "En Données, l'écart est de −1 autonome en temps normal.", "answer": true, "explanation": "Seul Noé est autonome ; la cible est de 2."}, {"q": "Pendant l'absence de Noé, l'équipe garde une personne de niveau 3 en Données.", "answer": false, "explanation": "Noé est le seul niveau 3 (et le seul autonome) : il ne reste aucun autonome."}, {"q": "En Coordination, l'équipe compte 3 autonomes pour une cible de 4.", "answer": true, "explanation": "Amina (3), Hugo (2), Karim (2) : écart −1."}, {"q": "Dans un SWOT RH, la proposition d'accompagnement du partenaire extérieur est une opportunité.", "answer": true, "explanation": "C'est un élément externe et favorable."}, {"q": "Le fait que les concurrents recrutent des analystes est une force de NovaWear.", "answer": false, "explanation": "C'est une menace externe : le marché des analystes est tendu."}, {"q": "Les décisions orales peu tracées constituent une faiblesse interne.", "answer": true, "explanation": "Elles fragilisent la coordination et le CRM."}, {"q": "Le cas demande un plan de formation détaillé.", "answer": false, "explanation": "Seule une première orientation est demandée à ce stade."}, {"q": "À l'oral, il faut présenter d'abord la priorité la plus urgente.", "answer": true, "explanation": "Consigne de restitution."}, {"q": "« Les concurrents pourraient débaucher Noé » est un fait de l'énoncé.", "answer": false, "explanation": "C'est une hypothèse. Le fait est seulement que les concurrents recrutent des analystes."}, {"q": "En Coordination, NovaWear compte aujourd'hui 3 collaborateurs autonomes.", "answer": true, "explanation": "Amina (3), Hugo (2) et Karim (2). Cible : 4, donc écart −1.", "level": "moyen"}, {"q": "Léa, qui est au niveau 1 dans les trois compétences, compte comme autonome en CRM.", "answer": false, "explanation": "Niveau 1 = réalise avec accompagnement. Seuls les niveaux 2 et 3 sont autonomes.", "level": "moyen"}, {"q": "Dans le SWOT RH, la disponibilité d'un partenaire extérieur sous 6 semaines est une opportunité.", "answer": true, "explanation": "Élément externe et positif.", "level": "moyen"}, {"q": "« Les concurrents pourraient débaucher Noé » est un fait de l'énoncé.", "answer": false, "explanation": "C'est une hypothèse. Le fait est : « les concurrents recrutent des analystes ».", "level": "moyen"}, {"q": "Si Karim passe au niveau 2 en Données, la cible Données est atteinte, même pendant l'absence de Noé.", "answer": false, "explanation": "Avec Karim à 2, la cible (2 autonomes dont 1 N3) est atteinte hors absence. Mais pendant l'absence de Noé il ne reste qu'1 autonome et aucun niveau 3 : l'écart persiste.", "level": "difficile"}, {"q": "Proposer de solliciter le partenaire extérieur au 3e mois est trop tardif pour couvrir l'absence de Noé.", "answer": true, "explanation": "Délai de 6 semaines + absence dès le 2e m
